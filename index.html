<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>병원 DB</title>

<meta name="theme-color" content="#F5821F">
<link rel="manifest" href="manifest.json">

<!-- 홈 화면 아이콘 -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- 전체화면(주소창 숨김) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="병원 DB">

<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    background: #F5821F;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app {
    display: block;
    border: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;   /* 주소창이 접혔다 펴져도 꽉 차게 */
  }
  /* 앱이 안 뜰 때만 나타나는 안내 */
  #fallback {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none;
    background: #1F1B17; color: #fff;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Noto Sans KR", "Malgun Gothic", sans-serif;
    text-align: center;
  }
  #fallback a { color: #FFC489; font-weight: 700; }
</style>
</head>
<body>

<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbzblnGALj9dZqDHq6tNTlDsU4FWF9SPN2Kwtg5oe3zwGAbYQhQygUPcIoILhScGZisa/exec"
  allow="geolocation *; clipboard-write *"
  title="병원 DB"></iframe>

<div id="fallback">
  화면이 뜨지 않으면
  <a href="https://script.google.com/macros/s/AKfycbzblnGALj9dZqDHq6tNTlDsU4FWF9SPN2Kwtg5oe3zwGAbYQhQygUPcIoILhScGZisa/exec"
     target="_blank" rel="noopener">여기를 눌러 바로 열기</a>
</div>

<script>
  /* 8초 안에 앱이 안 뜨면 바로가기 안내를 띄운다.
     (아이폰에서 쿠키 차단으로 막히는 경우 대비) */
  var timer = setTimeout(function () {
    document.getElementById('fallback').style.display = 'block';
  }, 8000);

  document.getElementById('app').addEventListener('load', function () {
    clearTimeout(timer);
  });
</script>

</body>
</html>
