<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>병원 DB</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5821F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="병원 DB">
<style>
  :root {
    --orange:      #F5821F;
    --orange-dk:   #E06A0A;
    --orange-tint: #FFF2E5;

    --ink:      #1F1B17;
    --ink-mid:  #6B6259;
    --ink-dim:  #9A918A;
    --paper:    #F7F3EF;
    --surface:  #FFFFFF;
    --rule:     #EBE4DD;

    --go:      #1B7A43;
    --go-bg:   #E6F3EA;
    --stop:    #B3261E;
    --stop-bg: #FBEAE8;
    --wait:    #4A5B6E;
    --wait-bg: #EBEFF3;

    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 4px 14px rgba(120,70,20,.06);
    --tabh:   62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    padding-bottom: calc(var(--tabh) + 84px);
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--orange-dk); outline-offset: 2px; }

  /* ---------- 상단 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--orange); color: #fff;
    padding: 14px 16px 16px;
    border-radius: 0 0 20px 20px;
  }
  header h1 {
    margin: 0 0 11px;
    font-size: 18px; font-weight: 700; letter-spacing: -.02em;
  }
  #search {
    width: 100%; height: 46px;
    padding: 0 15px; border: none; border-radius: 12px;
    font-size: 16px; font-family: inherit; color: var(--ink);
    background: #fff;
  }
  #search::placeholder { color: var(--ink-dim); }

  .wrap { padding: 16px 14px 0; }

  /* ---------- 하단 탭 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 6px;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs button {
    flex: 1; height: 44px;
    background: none; color: var(--ink-mid); border-radius: 22px;
    font-size: 14px; font-weight: 500; padding: 0;
  }
  #tabs button.on {
    color: var(--orange-dk); font-weight: 700;
    background: var(--orange-tint);
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  .tabcnt {
    display: none; margin-left: 5px; font-size: 11px; font-weight: 700;
    background: var(--wait); color: #fff; border-radius: 9px; padding: 1px 6px;
    vertical-align: 1px;
  }
  .tabcnt.show { display: inline-block; }

  /* ---------- 레코드 카드 ---------- */
  .rec {
    background: var(--surface);
    border-left: 5px solid #E3DCD5;
    border-radius: 13px;
    box-shadow: var(--shadow);
    padding: 11px 13px 10px;
    margin-bottom: 8px;
  }
  /* 당일발급이 되는 것이 보통이므로 초록 표시는 두지 않는다.
     불가능한 곳만 눈에 띄게 한다. */
  .rec.r-no   { border-left-color: var(--stop); }
  .rec.r-hold { border-left-color: var(--wait); }

  .rec h2 {
    margin: 0;
    font-size: 16.5px; font-weight: 700; letter-spacing: -.02em;
  }
  .addr {
    color: var(--ink-mid); font-size: 12.5px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 당일발급 표시: 불가능하거나 확인 안 된 경우에만 나온다 */
  .tag {
    display: inline-block; margin-top: 6px;
    font-size: 12.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 8px;
  }
  .tag.no  { background: var(--stop-bg); color: var(--stop); }
  .tag.unk { background: #F2EEEA; color: var(--ink-mid); font-weight: 600; }

  /* 병원DB 카드: 수정 버튼을 이름 옆에 두어 아래 한 줄을 없앤다 */
  .dbhead { display: flex; align-items: center; gap: 8px; }
  .dbhead h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dbhead .edit {
    flex: 0 0 auto; min-height: 32px; padding: 0 14px; border-radius: 16px;
    background: transparent; box-shadow: inset 0 0 0 1px #DDD5CE;
    color: var(--ink-mid); font-size: 12.5px; font-weight: 600;
  }

  /* 나머지 정보는 한 줄로 이어 붙인다 */
  .meta { margin-top: 5px; font-size: 12.5px; line-height: 1.8; color: var(--ink); }
  .meta > span { white-space: nowrap; }   /* 항목 이름과 값이 갈라지지 않게 */
  .meta i { font-style: normal; color: var(--ink-dim); margin-right: 4px; }
  .meta .chk { color: var(--ink-dim); }
  .meta .chk.old { color: var(--stop); font-weight: 700; }
  .meta b { font-weight: 600; }
  .meta b.no  { color: var(--stop); font-weight: 700; }
  .meta b.yes { color: var(--go);   font-weight: 700; }
  .meta .sep { color: #DCD5CE; margin: 0 6px; }

  .memo {
    margin-top: 8px; padding: 7px 10px;
    background: var(--orange-tint); border-radius: 9px;
    font-size: 12.5px; white-space: pre-wrap; color: #6B4519;
  }

  .foot { display: flex; gap: 7px; margin-top: 9px; }
  .foot button { flex: 1; min-height: 40px; padding: 0 10px; border-radius: 10px; }
  .foot.split { justify-content: space-between; align-items: center; }
  .foot.split button { flex: 0 0 auto; min-height: 34px; padding: 0 16px; }

  .checked { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .checked.old { color: var(--stop); font-weight: 600; }

  .missing { color: var(--stop); font-size: 13px; font-weight: 600; margin-top: 5px; }

  /* ---------- 방문 순서 ---------- */
  .ordhead { display: flex; align-items: flex-start; gap: 9px; }
  .ordhead h2 { flex: 1; min-width: 0; margin: 0; }
  .ordnum {
    flex: 0 0 auto; width: 25px; height: 25px; line-height: 25px; text-align: center;
    border-radius: 13px; background: var(--orange); color: #fff;
    font-size: 13px; font-weight: 700; margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .ordbtns { flex: 0 0 auto; display: flex; gap: 5px; }
  .ordbtns button {
    width: 36px; height: 36px; padding: 0; border-radius: 10px;
    background: #F4F0EC; color: var(--ink-mid); font-size: 14px; line-height: 1;
  }
  .ordbtns button[disabled] { opacity: .3; }

  /* ---------- 길찾기 버튼 ---------- */
  .route {
    display: block; width: 100%; margin-top: 9px; min-height: 44px;
    background: var(--orange-tint); color: var(--orange-dk);
    box-shadow: inset 0 0 0 1.5px var(--orange);
    font-size: 14px; font-weight: 700; border-radius: 11px;
  }

  /* ---------- 완료 처리된 방문 ---------- */
  /* 카드 모양은 그대로 두고, 회색으로 흐리게만 처리한다 */
  .rec.done {
    background: #F4F1ED;
    border-left-color: #DFD8D1;
    box-shadow: none;
    opacity: .58;
  }
  .rec.done h2 {
    color: var(--ink-mid);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .donehead { display: flex; align-items: flex-start; gap: 10px; }
  .donehead h2 { flex: 1; min-width: 0; }
  .donehead .undo {
    flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 17px;
    background: transparent; box-shadow: inset 0 0 0 1px #D6CEC7;
    color: var(--ink-mid); font-size: 13px; font-weight: 600;
  }

  /* ---------- 날짜 구분 ---------- */
  .dayhead {
    display: flex; align-items: center; gap: 9px;
    margin: 24px 4px 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  }
  .dayhead:first-child { margin-top: 2px; }
  .dayhead .cnt { font-weight: 500; color: var(--ink-mid); font-size: 12.5px; }
  .dayhead.today { color: var(--orange-dk); }
  .dayhead .mapbtn {
    margin-left: auto; min-height: 34px; padding: 0 16px; border-radius: 17px;
    background: var(--surface); box-shadow: var(--shadow);
    color: var(--ink); font-size: 13px; font-weight: 600;
  }

  /* 보류 재방문일 */
  .holddate {
    font-size: 14px; font-weight: 700; color: var(--wait);
    background: var(--wait-bg); display: inline-block;
    padding: 6px 12px; border-radius: 10px; margin-bottom: 11px;
    font-variant-numeric: tabular-nums;
  }
  .holddate.tbd { color: var(--stop); background: var(--stop-bg); }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: none; border-radius: 11px;
    padding: 10px 16px; background: var(--orange); color: #fff;
    cursor: pointer;
  }
  button.ghost { background: #EFEBE7; color: var(--ink); }
  button.hold  { background: var(--wait-bg); color: var(--wait); }
  button.small { font-size: 13.5px; }
  button:active { opacity: .68; }

  #fab {
    position: fixed; right: 18px;
    bottom: calc(var(--tabh) + 22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 29px;
    font-size: 30px; font-weight: 300; line-height: 1; padding: 0;
    background: var(--orange);
    box-shadow: 0 6px 18px rgba(200,110,20,.42);
    z-index: 41;
  }

  /* ---------- 시트 ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--surface);
    z-index: 50; overflow-y: auto; display: none;
    padding: 18px 16px 112px;
    animation: rise .16s ease-out;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

  .sheet h2 { margin: 2px 0 20px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }

  label { display: block; margin-bottom: 17px; }
  label span.lbl {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-mid); margin-bottom: 7px;
  }
  input[type=text], input[type=time], input[type=date], textarea {
    width: 100%; padding: 12px 13px; font-size: 16px;
    border: 1.5px solid var(--rule); border-radius: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus, textarea:focus { border-color: var(--orange); outline: none; }
  input[type=time], input[type=date] { font-variant-numeric: tabular-nums; }
  textarea { min-height: 94px; resize: vertical; line-height: 1.5; }
  #pickSearch { margin-bottom: 4px; }

  .seg { display: flex; gap: 7px; }
  .seg button {
    flex: 1; min-height: 48px; padding: 0 4px; border-radius: 12px;
    background: #F4F0EC; color: var(--ink-mid);
    font-size: 14px; font-weight: 500;
  }
  .seg button.sel { background: var(--orange); color: #fff; font-weight: 700; }

  .lunchbox, .datebox { display: flex; gap: 7px; align-items: center; }
  .lunchbox input[type=time], .datebox input[type=date] { flex: 1; min-width: 0; }
  .lunchbox .dash { color: var(--ink-dim); }
  .lunchbox button, .datebox button {
    flex: 0 0 68px; min-height: 48px; padding: 0; border-radius: 12px;
    background: #F4F0EC; color: var(--ink-mid); font-size: 13.5px; font-weight: 500;
  }
  .lunchbox button.sel, .datebox button.sel { background: var(--orange); color: #fff; font-weight: 700; }

  .actions {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--rule);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 9px; z-index: 60;
  }
  .actions button { flex: 1; min-height: 50px; font-size: 15px; font-weight: 700; border-radius: 13px; }
  .actions button.del { flex: 0 0 66px; background: var(--stop-bg); color: var(--stop); }

  /* ---------- 병원 선택 ---------- */
  .picklist { margin-top: 10px; }
  .pickitem {
    padding: 15px 6px; border-bottom: 1px solid #F2EDE8;
    font-size: 16px; cursor: pointer;
  }
  .pickitem:active { background: #FAF7F4; }
  .pickitem small { display: block; color: var(--ink-mid); font-size: 12.5px; margin-top: 3px; }

  /* ---------- 지도 ---------- */
  #mapSheet { padding: 0; }
  #mapTop {
    position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 61;
    background: var(--orange); color: #fff; display: flex; align-items: center;
    padding: 0 14px; gap: 10px;
  }
  #mapTop span { font-size: 16px; font-weight: 700; }
  #mapTop button { margin-left: auto; background: rgba(255,255,255,.25); color: #fff; min-height: 36px; }
  #map { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; }
  .pin {
    background: var(--orange); color: #fff; border-radius: 50%;
    width: 28px; height: 28px; line-height: 28px; text-align: center;
    font-size: 13px; font-weight: 700; border: 2px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
  }
  #mapWarn {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 61;
    background: rgba(179,38,30,.94); color: #fff; padding: 11px 13px;
    border-radius: 12px; font-size: 13px; display: none;
  }

  /* ---------- 조사자 확인 ---------- */
  #login .who { margin: -8px 0 22px; font-size: 13.5px; color: var(--ink-mid); }
  #l_msg { min-height: 22px; font-size: 13.5px; font-weight: 600; color: var(--stop); }
  #l_msg.busy { color: var(--ink-mid); }

  /* ---------- 빈 화면 · 토스트 ---------- */
  .empty {
    text-align: center; color: var(--ink-mid);
    padding: 64px 24px; font-size: 14.5px; line-height: 1.7;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabh) + 88px);
    transform: translateX(-50%);
    background: rgba(31,27,23,.93); color: #fff;
    padding: 11px 19px; border-radius: 22px;
    font-size: 13.5px; display: none; z-index: 100;
    max-width: 88vw; text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">방문일정</h1>
  <input id="search" type="text" placeholder="병원명 검색" oninput="render()">
</header>

<div class="wrap" id="list"><div class="empty">불러오는 중…</div></div>

<button id="fab" onclick="onFab()">+</button>

<div id="tabs">
  <button id="tab_visit" class="on" onclick="switchTab('visit')">방문일정</button>
  <button id="tab_hold" onclick="switchTab('hold')">보류<span id="holdCnt" class="tabcnt"></span></button>
  <button id="tab_db" onclick="switchTab('db')">병원DB</button>
</div>

<!-- 지도 -->
<div id="mapSheet" class="sheet">
  <div id="mapTop">
    <span id="mapTitle">지도</span>
    <button class="small" onclick="closeMap()">닫기</button>
  </div>
  <div id="map"></div>
  <div id="mapWarn"></div>
</div>

<!-- 병원 정보 입력 -->
<div id="form" class="sheet">
  <h2 id="formTitle">병원 추가</h2>
  <label><span class="lbl">병원명 *</span><input type="text" id="f_name"></label>
  <label><span class="lbl">주소</span><input type="text" id="f_addr"></label>
  <label><span class="lbl">당일발급</span><div class="seg" id="seg_sameday"></div></label>
  <label><span class="lbl">사전신청</span><div class="seg" id="seg_prereq"></div></label>
  <label><span class="lbl">서류 발급 소요시간</span><input type="text" id="f_wait" placeholder="예: 10분 내외"></label>
  <label><span class="lbl">진료시작</span><input type="time" id="f_open"></label>
  <label>
    <span class="lbl">점심시간</span>
    <div class="lunchbox">
      <input type="time" id="f_lunch_s" onchange="onLunchTime()">
      <span class="dash">–</span>
      <input type="time" id="f_lunch_e" onchange="onLunchTime()">
      <button type="button" id="lunchNone" onclick="toggleLunchNone()">없음</button>
    </div>
  </label>
  <label><span class="lbl">주차</span><div class="seg" id="seg_parking"></div></label>
  <label><span class="lbl">비고</span><textarea id="f_memo" placeholder="자유롭게 입력"></textarea></label>
  <div class="actions">
    <button class="ghost" onclick="closeSheet('form')">취소</button>
    <button onclick="saveHospital_()">저장</button>
    <button class="del" id="delBtn" onclick="delHospital_()" style="display:none">삭제</button>
  </div>
</div>

<!-- 병원 선택 -->
<div id="picker" class="sheet">
  <h2>병원 선택</h2>
  <input type="text" id="pickSearch" placeholder="검색" oninput="renderPicker()">
  <div class="picklist" id="pickList"></div>
  <div class="actions"><button class="ghost" onclick="closeSheet('picker')">닫기</button></div>
</div>

<!-- 방문 등록/수정 -->
<div id="visitForm" class="sheet">
  <h2 id="visitTitle">방문 등록</h2>
  <label><span class="lbl">병원</span><input type="text" id="v_name" readonly style="background:#F7F4F1"></label>
  <label>
    <span class="lbl">방문일자</span>
    <div class="datebox">
      <input type="date" id="v_date" onchange="onVisitDate()">
      <button type="button" id="dateTbd" onclick="toggleTbd()">미정</button>
    </div>
  </label>
  <label><span class="lbl">메모</span><textarea id="v_memo" placeholder="특이사항"></textarea></label>
  <div class="actions">
    <button class="ghost" onclick="closeSheet('visitForm')">취소</button>
    <button onclick="saveVisit_()">저장</button>
    <button class="del" id="vDelBtn" onclick="delVisit_()" style="display:none">삭제</button>
  </div>
</div>

<!-- 조사자 확인 -->
<div id="login" class="sheet">
  <h2>조사자 확인</h2>
  <p class="who">발급받은 코드를 입력하세요. 한 번만 입력하면 이 기기에 기억됩니다.</p>
  <label><span class="lbl">코드</span>
    <input type="text" id="l_code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="코드 입력">
  </label>
  <div id="l_msg"></div>
  <div class="actions"><button onclick="doLogin()">확인</button></div>
</div>

<div id="toast"></div>

<script>
var TAB = 'visit';
var DB = [], VISITS = [];
var editId = null, vEditId = null, vHid = '';
var lunchNone = false, dateTbd = false;
var seg = { sameday: '', prereq: '', parking: '' };
var vStatus = '예정';
var MAP = null, MARKERS = [];

var SEG_OPTS = {
  sameday: ['가능', '불가능'],
  prereq:  ['유선', '팩스', '인터넷', '불가능'],
  parking: ['가능', '인근']
};
var SEG_LABEL = { sameday: '당일발급', prereq: '사전신청', parking: '주차' };

/* 방문일정 탭은 오늘 기준 이 일수 전까지만 보여준다 */
var VISIT_DAYS_BACK = 3;
/* 네이버 지도: 목적지 1 + 경유지 5 = 한 번에 최대 6곳 (실측 확인됨) */
var NAV_MAX_STOPS = 6;

/* ---------- 공통 ---------- */
var toastTimer = null;
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, ms || 2200);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function closeSheet(id) { document.getElementById(id).style.display = 'none'; }
function openSheet(id) { document.getElementById(id).style.display = 'block'; window.scrollTo(0, 0); }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function dayLabel(ds) {
  if (!ds) return '미정';
  var d = new Date(ds + 'T00:00:00');
  var w = ['일','월','화','수','목','금','토'][d.getDay()];
  var base = ds.slice(5).replace('-', '.') + ' (' + w + ')';
  var t = todayStr();
  if (ds === t) return base + ' 오늘';
  if ((d - new Date(t + 'T00:00:00')) === 86400000) return base + ' 내일';
  return base;
}
function withinWindow(ds) {
  if (!ds) return true;
  var t = new Date(ds + 'T00:00:00').getTime();
  if (isNaN(t)) return true;
  var today = new Date(todayStr() + 'T00:00:00').getTime();
  return t >= today - VISIT_DAYS_BACK * 86400000;
}

/* ---------- 서버 통신 (JSONP) ---------- */
var API = 'https://script.google.com/macros/s/AKfycbzblnGALj9dZqDHq6tNTlDsU4FWF9SPN2Kwtg5oe3zwGAbYQhQygUPcIoILhScGZisa/exec';
var CODE = '', ME = '', _seq = 0;
try { CODE = localStorage.getItem('hdb_code') || ''; } catch (e) { CODE = ''; }

function jsonp(params, ok, fail) {
  var cb = '__cb' + (++_seq) + '_' + Date.now();
  var url = API + '?cb=' + cb + '&code=' + encodeURIComponent(CODE);
  for (var k in params) url += '&' + k + '=' + encodeURIComponent(params[k]);

  var sc = document.createElement('script'), done = false;
  var timer = setTimeout(function () {
    finish(null, { message: '응답이 없습니다. 통신 상태를 확인하세요.' });
  }, 25000);

  function finish(res, err) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    if (err) { fail(err); return; }
    if (res && res.ok) ok(res);
    else if (res && res.err === 'AUTH') authFail();
    else fail({ message: (res && res.err) || '알 수 없는 오류' });
  }

  window[cb] = function (res) { finish(res, null); };
  sc.onerror = function () { finish(null, { message: '서버에 연결하지 못했습니다.' }); };
  sc.src = url;
  document.head.appendChild(sc);
}

/* 서버 호출을 한 곳에 모아둔다 */
function srv() {
  var ok = function () {};
  var fail = function (e) { toast('실패: ' + e.message, 5200); };
  var r = {};
  r.then = function (f) { ok = f; return r; };
  r.err  = function (f) { fail = f; return r; };
  r.all         = function ()       { jsonp({fn:'all'}, function (s) { ok(s); }, fail); return r; };
  r.saveHosp    = function (d)      { jsonp({fn:'saveHospital', data:JSON.stringify(d)}, function (s) { ok(s.res); }, fail); return r; };
  r.delHosp     = function (id)     { jsonp({fn:'delHospital', id:id}, function () { ok(); }, fail); return r; };
  r.saveVisit   = function (d)      { jsonp({fn:'saveVisit', data:JSON.stringify(d)}, function (s) { ok(s.id); }, fail); return r; };
  r.setStatus   = function (id, st) { jsonp({fn:'setStatus', id:id, status:st}, function () { ok(); }, fail); return r; };
  r.delVisit    = function (id)     { jsonp({fn:'delVisit', id:id}, function () { ok(); }, fail); return r; };
  r.reorder     = function (ids)    { jsonp({fn:'reorder', ids:ids.join(',')}, function () { ok(); }, fail); return r; };
  return r;
}

/* ---------- 로드 · 캐시 ---------- */
/* 마지막으로 받은 목록을 기기에 저장해 둔다.
   다음에 열면 그걸 즉시 보여주고, 새 자료는 뒤에서 받아 바꿔 끼운다. */
function cacheRead() {
  try { var s = localStorage.getItem('hdb_cache'); return s ? JSON.parse(s) : null; }
  catch (e) { return null; }
}
function cacheWrite() {
  try { localStorage.setItem('hdb_cache', JSON.stringify({ hospitals: DB, visits: VISITS })); }
  catch (e) {}
}

/* quiet = true 면 화면을 비우지 않고 조용히 갱신한다 */
function loadAll(quiet) {
  if (!quiet) document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
  srv().then(function (d) {
        ME = d.name || ME;
        DB = d.hospitals; VISITS = d.visits;
        cacheWrite(); render();
      })
       .err(function (e) { if (quiet) toast('갱신 실패: ' + e.message, 4200); else fail(e); })
       .all();
}
function fail(e) {
  document.getElementById('list').innerHTML =
    '<div class="empty">불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
}

/* 방문 건에 붙은 병원 고유번호로 찾는다. 없으면 이름으로 */
function findHospital(v) {
  var hid = (v && v.hid) || '';
  var name = (v && v.name) || v;
  var i;
  if (hid) { for (i = 0; i < DB.length; i++) if (DB[i].id === hid) return DB[i]; }
  for (i = 0; i < DB.length; i++) if (DB[i].name === name) return DB[i];
  return null;
}

/* ---------- 지도 ---------- */
function openDayMap(ds) {
  var items = visitsOf('visit').filter(function (v) {
    return v.date === ds && v.status !== '완료';
  });
  var pts = [], missing = [];

  items.forEach(function (v) {
    var h = findHospital(v);
    if (h && h.lat && h.lng) pts.push({ name: v.name, lat: h.lat, lng: h.lng });
    else missing.push(v.name);
  });

  if (!pts.length) { toast('남은 방문지 중 좌표가 있는 병원이 없습니다.'); return; }

  document.getElementById('mapTitle').textContent = dayLabel(ds) + ' · ' + pts.length + '곳';
  openSheet('mapSheet');

  var warn = document.getElementById('mapWarn');
  if (missing.length) {
    warn.textContent = '좌표 없음: ' + missing.join(', ');
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }

  setTimeout(function () { drawMap(pts); }, 60);
}

function drawMap(pts) {
  if (typeof L === 'undefined') { toast('지도를 불러오지 못했습니다 (통신 확인)', 4200); return; }
  if (!MAP) {
    MAP = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(MAP);
  }
  MARKERS.forEach(function (m) { MAP.removeLayer(m); });
  MARKERS = [];

  var bounds = [];
  pts.forEach(function (p, i) {
    var icon = L.divIcon({
      className: '',
      html: '<div class="pin">' + (i + 1) + '</div>',
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    var m = L.marker([p.lat, p.lng], { icon: icon }).addTo(MAP).bindPopup(p.name);
    MARKERS.push(m);
    bounds.push([p.lat, p.lng]);
  });

  MAP.invalidateSize();
  if (bounds.length === 1) MAP.setView(bounds[0], 14);
  else MAP.fitBounds(bounds, { padding: [40, 40] });
}

function closeMap() { closeSheet('mapSheet'); }

/* ---------- 렌더 ---------- */
function render() {

/* 당일발급이 되는 것이 보통이므로, 되는 경우에는 아무 표시도 하지 않는다.
   불가능한 곳만 빨갛게 드러낸다. */
function recCls(h, extra) {
  var c = 'rec';
  if (h && h.sameday === '불가능') c += ' r-no';
  return extra ? (c + ' ' + extra) : c;
}

function isOld(d) {
  if (!d) return false;
  var t = new Date(d).getTime();
  if (isNaN(t)) return false;
  return (Date.now() - t) > 1000 * 60 * 60 * 24 * 180;
}

/* 당일발급 표시: 가능하면 아무것도 안 띄운다 */
function samedayTag(h) {
  if (h.sameday === '불가능') return '<div class="tag no">당일발급 불가</div>';
  if (h.sameday !== '가능')   return '<div class="tag unk">당일발급 미확인</div>';
  return '';
}

/* 나머지 항목은 한 줄로 이어 붙여 카드를 낮춘다 */
function metaLine(h, withChecked) {
  var out = [];
  /* hl 이 참이면 '되는 경우'를 초록으로 강조한다 (사전신청은 되는 곳이 드물어서) */
  function add(k, v, hl) {
    if (!v) return;
    var cls = '';
    if (v === '불가능') cls = ' class="no"';
    else if (hl) cls = ' class="yes"';
    out.push('<span><i>' + k + '</i><b' + cls + '>' + esc(v) + '</b></span>');
  }
  add('사전신청', h.prereq, true);
  add('주차', h.parking);
  add('발급', h.wait);
  add('진료', h.open);
  add('점심', h.lunch);
  if (withChecked) {
    out.push('<span class="chk' + (isOld(h.checked) ? ' old' : '') + '">' +
             (h.checked ? '확인 ' + esc(h.checked) : '확인일 없음') + '</span>');
  }
  if (!out.length) return '';
  return '<div class="meta">' + out.join('<span class="sep">·</span>') + '</div>';
}

function infoBlock(h) {
  if (!h) return '<div class="missing">병원DB에 없는 병원입니다</div>';
  return (h.addr ? '<div class="addr">' + esc(h.addr) + '</div>' : '') +
         samedayTag(h) + metaLine(h);
}

/* 완료된 방문: 카드는 그대로, 회색으로 흐리게 + 날짜 그룹 안 맨 아래로 */
function doneCard(v) {
  var h = findHospital(v);
  return '<div class="' + recCls(h, 'done') + '">' +
    '<div class="donehead">' +
      '<h2>' + esc(v.name) + '</h2>' +
      '<button class="undo" onclick="undoVisit(\'' + v.id + '\')">되돌리기</button>' +
    '</div>' +
    infoBlock(h) +
    (v.memo ? '<div class="memo">' + esc(v.memo) + '</div>' : '') +
  '</div>';
}

function renderVisits() {
  var q = document.getElementById('search').value.trim();
  var pool = visitsOf('visit');
  var all = pool.filter(function (v) { return withinWindow(v.date); });
  var hidden = pool.length - all.length;
  var list = all.filter(function (v) { return !q || v.name.indexOf(q) > -1; });
  var el = document.getElementById('list');

  if (!list.length) {
    var msg;
    if (all.length) msg = '검색 결과가 없습니다.';
    else if (hidden) msg = '표시할 일정이 없습니다.<br>' + VISIT_DAYS_BACK +
                           '일 이전 일정 ' + hidden + '건은 숨겨져 있습니다.';
    else msg = '예정된 방문이 없습니다.<br>+ 를 눌러 병원을 고르세요.';
    el.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }

  var order = [], seen = {};
  list.forEach(function (v) {
    var k = v.date || '';
    if (!seen[k]) { seen[k] = { date: v.date, todo: [], done: [] }; order.push(seen[k]); }
    (v.status === '완료' ? seen[k].done : seen[k].todo).push(v);
  });

  var html = '';
  order.forEach(function (g) {
    var isToday = (g.date === todayStr());
    var cnt = g.todo.length + '곳 남음';
    if (g.done.length) cnt += ' · ' + g.done.length + '곳 완료';

    html += '<div class="dayhead' + (isToday ? ' today' : '') + '">' +
            dayLabel(g.date) + ' <span class="cnt">' + cnt + '</span>' +
            '<button class="mapbtn" onclick="openDayMap(\'' + g.date + '\')">지도</button></div>';

    g.todo.sort(function (a, b) {
      var x = a.order || 9999, y = b.order || 9999;
      if (x !== y) return x - y;
      return a.name.localeCompare(b.name, 'ko');
    });

    g.todo.forEach(function (v, idx) {
      var h = findHospital(v);
      var first = (idx === 0), lastOne = (idx === g.todo.length - 1);
      html += '<div class="' + recCls(h) + '">' +
        '<div class="ordhead">' +
          '<span class="ordnum">' + (idx + 1) + '</span>' +
          '<h2>' + esc(v.name) + '</h2>' +
          '<div class="ordbtns">' +
            '<button onclick="moveVisit(\'' + v.id + '\',-1)"' + (first ? ' disabled' : '') + '>▲</button>' +
            '<button onclick="moveVisit(\'' + v.id + '\',1)"' + (lastOne ? ' disabled' : '') + '>▼</button>' +
          '</div>' +
        '</div>' +
        infoBlock(h) +
        (v.memo ? '<div class="memo">' + esc(v.memo) + '</div>' : '') +
        (idx < NAV_MAX_STOPS ? '<button class="route" onclick="routeTo(\'' + v.id + '\')">🚩 여기까지 길찾기</button>' : '') +
        '<div class="foot">' +
          '<button class="small" onclick="doneVisit(\'' + v.id + '\')">완료</button>' +
          '<button class="hold small" onclick="holdVisit(\'' + v.id + '\')">보류</button>' +
          '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
        '</div></div>';
    });

    g.done.forEach(function (v) { html += doneCard(v); });
  });

  el.innerHTML = html;
}

/* ---------- 보류 탭 ---------- */

function renderDB() {

    return !q || h.name.indexOf(q) > -1 || h.addr.indexOf(q) > -1;
  });

/* ---------- seg ---------- */
function buildSeg(key) {
  var box = document.getElementById('seg_' + key);
  box.innerHTML = SEG_OPTS[key].map(function (o) {
    return '<button type="button" onclick="pick(\'' + key + '\',\'' + o + '\')">' + o + '</button>';
  }).join('');
  paintSeg(key);
}
function pick(key, val) {
  seg[key] = (seg[key] === val) ? '' : val;
  paintSeg(key);
}
function paintSeg(key) {
  var box = document.getElementById('seg_' + key);
  Array.prototype.forEach.call(box.children, function (b) {
    b.className = (b.textContent === seg[key]) ? 'sel' : '';
  });
}

/* ---------- 점심시간 ---------- */
function toggleLunchNone() {
  lunchNone = !lunchNone;
  if (lunchNone) {
    document.getElementById('f_lunch_s').value = '';
    document.getElementById('f_lunch_e').value = '';
  }
  paintLunch();
}
function onLunchTime() {
  if (document.getElementById('f_lunch_s').value || document.getElementById('f_lunch_e').value) {
    lunchNone = false; paintLunch();
  }
}
function paintLunch() { document.getElementById('lunchNone').className = lunchNone ? 'sel' : ''; }
function lunchValue() {
  if (lunchNone) return '없음';
  var s = document.getElementById('f_lunch_s').value;
  var e = document.getElementById('f_lunch_e').value;
  if (s && e) return s + '-' + e;
  if (s) return s + '-';
  if (e) return '-' + e;
  return '';
}
function setLunch(v) {
  var s = document.getElementById('f_lunch_s'), e = document.getElementById('f_lunch_e');
  s.value = ''; e.value = ''; lunchNone = false;
  if (v === '없음') lunchNone = true;
  else if (v && v.indexOf('-') > -1) {
    var p = v.split('-');
    s.value = normTime_(p[0]); e.value = normTime_(p[1]);
  }
  paintLunch();
}
function normTime_(v) {
  if (!v) return '';
  var p = String(v).trim().split(':');
  if (p.length < 2) return '';
  return ('0' + p[0].trim()).slice(-2) + ':' + ('0' + p[1].trim()).slice(-2);
}

/* ---------- 병원 폼 ---------- */
function openForm(id) {
  editId = id || null;
  var h = id ? DB.filter(function (x) { return x.id === id; })[0] : null;

  document.getElementById('formTitle').textContent = h ? '병원 수정' : '병원 추가';
  document.getElementById('f_name').value = h ? h.name : '';
  document.getElementById('f_addr').value = h ? h.addr : '';
  document.getElementById('f_memo').value = h ? h.memo : '';
  document.getElementById('f_wait').value = h ? h.wait : '';
  document.getElementById('f_open').value = h ? normTime_(h.open) : '';

  seg.sameday = h ? h.sameday : '';
  seg.prereq  = h ? h.prereq : '';
  seg.parking = h ? h.parking : '';
  buildSeg('sameday'); buildSeg('prereq'); buildSeg('parking');
  setLunch(h ? h.lunch : '');

  document.getElementById('delBtn').style.display = h ? 'block' : 'none';
  openSheet('form');
}

/* 저장은 기다리지 않는다. 창을 바로 닫고 서버에는 뒤에서 보낸다. */
function saveHospital_() {
  var name = document.getElementById('f_name').value.trim();
  if (!name) { toast('병원명을 입력하세요'); return; }

  var payload = {
    id: editId, name: name,
    addr: document.getElementById('f_addr').value.trim(),
    sameday: seg.sameday, prereq: seg.prereq,
    wait: document.getElementById('f_wait').value.trim(),
    open: document.getElementById('f_open').value,
    lunch: lunchValue(), parking: seg.parking,
    memo: document.getElementById('f_memo').value.trim()
  };

  closeSheet('form');
  toast('저장 중…');
  srv().then(function (res) {
      if (res && res.warn) toast('저장됨 · ' + res.warn, 5200);
      else toast('저장됨');
      loadAll(true);
    })
    .err(function (e) { toast('저장 실패 · ' + e.message, 5600); loadAll(true); })
    .saveHosp(payload);
}

function delHospital_() {
  if (!editId) return;
  if (!confirm('삭제할까요?')) return;
  var id = editId;
  closeSheet('form');
  DB = DB.filter(function (x) { return x.id !== id; });
  cacheWrite(); render();
  toast('삭제됨');
  srv().then(function () { loadAll(true); })
       .err(function (e) { toast('삭제 실패 · ' + e.message, 5600); loadAll(true); })
       .delHosp(id);
}

/* ---------- 병원 선택 ---------- */
function openPicker() {
  document.getElementById('pickSearch').value = '';
  renderPicker(); openSheet('picker');
}
function renderPicker() {
  var q = document.getElementById('pickSearch').value.trim();
  var list = DB.filter(function (h) {
    return !q || h.name.indexOf(q) > -1 || h.addr.indexOf(q) > -1;
  });
  var el = document.getElementById('pickList');
  if (!list.length) { el.innerHTML = '<div class="empty">병원DB 탭에서 먼저 등록하세요.</div>'; return; }
  el.innerHTML = list.map(function (h) {
    return '<div class="pickitem" onclick="chooseHospital(\'' + h.id + '\')">' +
      esc(h.name) + '<small>' + esc(h.addr) + '</small></div>';
  }).join('');
}
function chooseHospital(hid) { closeSheet('picker'); openVisitForm(null, hid); }

/* ---------- 방문 폼 ---------- */
function toggleTbd() {
  dateTbd = !dateTbd;
  if (dateTbd) document.getElementById('v_date').value = '';
  paintTbd();
}
function onVisitDate() {
  if (document.getElementById('v_date').value) { dateTbd = false; paintTbd(); }
}
function paintTbd() { document.getElementById('dateTbd').className = dateTbd ? 'sel' : ''; }

function openVisitForm(id, presetHid) {
  if (id && pending_(id)) return;
  vEditId = id || null;
  var v = id ? VISITS.filter(function (x) { return x.id === id; })[0] : null;
  var preset = presetHid ? DB.filter(function (x) { return x.id === presetHid; })[0] : null;
  vHid = v ? (v.hid || '') : (preset ? preset.id : '');

  document.getElementById('visitTitle').textContent = v ? '방문 수정' : '방문 등록';
  document.getElementById('v_name').value = v ? v.name : (preset ? preset.name : '');
  document.getElementById('v_memo').value = v ? v.memo : '';

  /* 새로 등록할 때는 오늘 날짜를 기본으로 넣어 둔다 */
  var d = v ? v.date : todayStr();
  document.getElementById('v_date').value = d;
  dateTbd = (v && !d) ? true : false;
  paintTbd();

  /* 상태는 화면에서 고르지 않는다. 새로 등록하면 '예정',
     수정할 때는 원래 상태를 그대로 둔다. 완료/보류는 카드의 버튼으로 바꾼다. */
  vStatus = v ? v.status : '예정';

  document.getElementById('vDelBtn').style.display = v ? 'block' : 'none';
  openSheet('visitForm');
}

/* 같은 날짜 그룹의 맨 뒤 순번 */
function nextOrder(date) {
  var n = 0;
  VISITS.forEach(function (x) {
    if ((x.date || '') === (date || '') && x.status !== '완료' && (x.order || 0) > n) n = x.order;
  });
  return n + 1;
}

/* 아직 서버에 저장되지 않은 카드인지 확인한다.
   저장이 끝나기 전에 완료·보류·순서변경을 누르면 엉뚱한 곳에 저장되므로 막는다. */
function pending_(id) {
  if (String(id).indexOf('tmp_') === 0) {
    toast('저장 중입니다. 잠시 후 다시 눌러 주세요.', 3000);
    return true;
  }
  return false;
}

/* 저장을 기다리지 않는다. 목록에 먼저 반영하고 서버에는 뒤에서 보낸다.
   실패하면 원래대로 되돌린다. */
function saveVisit_() {
  var name = document.getElementById('v_name').value.trim();
  if (!name) { toast('병원을 선택하세요'); return; }

  var date = dateTbd ? '' : document.getElementById('v_date').value;
  var memo = document.getElementById('v_memo').value.trim();

  var editing = !!vEditId;
  var rec = null, before = null;

  if (editing) {
    rec = VISITS.filter(function (x) { return x.id === vEditId; })[0];
    if (!rec) { toast('대상을 찾지 못했습니다. 새로고침합니다.'); loadAll(true); return; }
    before = { hid: rec.hid, name: rec.name, date: rec.date, memo: rec.memo, order: rec.order };
    if ((rec.date || '') !== date) rec.order = nextOrder(date);
    rec.hid = vHid; rec.name = name; rec.date = date; rec.memo = memo;
  } else {
    rec = {
      id: 'tmp_' + Date.now(), hid: vHid, name: name,
      date: date, status: vStatus, memo: memo, order: nextOrder(date)
    };
    VISITS.push(rec);
  }

  var payload = {
    id: editing ? vEditId : null, hid: vHid, name: name,
    date: date, status: rec.status, memo: memo
  };

  closeSheet('visitForm');
  cacheWrite(); render();
  toast(editing ? '수정됨' : '등록됨');

  srv().then(function (newId) {
        if (!editing && newId) { rec.id = newId; cacheWrite(); render(); }
        loadAll(true);
      })
      .err(function (e) {
        if (editing) {
          rec.hid = before.hid; rec.name = before.name;
          rec.date = before.date; rec.memo = before.memo; rec.order = before.order;
        } else {
          VISITS = VISITS.filter(function (x) { return x.id !== rec.id; });
        }
        cacheWrite(); render();
        toast('저장 실패 · 되돌렸습니다: ' + e.message, 5600);
      })
      .saveVisit(payload);
}

/* 상태 변경: 화면을 먼저 바꾸고 서버에는 뒤에서 알린다 */
function setStatusOptimistic(id, next, okMsg) {
  if (pending_(id)) return;
  var v = null;
  for (var i = 0; i < VISITS.length; i++) {
    if (VISITS[i].id === id) { v = VISITS[i]; break; }
  }
  if (!v) return;

  var prev = v.status;
  v.status = next;
  cacheWrite(); render();

  srv().then(function () { toast(okMsg); })
       .err(function (e) {
         v.status = prev; cacheWrite(); render();
         toast('실패 · 되돌렸습니다: ' + e.message, 5200);
       })
       .setStatus(id, next);
}

/* 같은 날짜 안에서 방문 순서를 한 칸 옮긴다 */
function moveVisit(id, dir) {
  if (pending_(id)) return;
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var group = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  group.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var i = group.indexOf(v), j = i + dir;
  if (i < 0 || j < 0 || j >= group.length) return;

  group[i] = group[j];
  group[j] = v;
  group.forEach(function (x, k) { x.order = k + 1; });
  cacheWrite(); render();

  var ids = group.map(function (x) { return x.id; });
  if (ids.join(',').indexOf('tmp_') > -1) return;   /* 저장 중인 카드가 섞여 있으면 보류 */
  srv().err(function (e) { toast('순서 저장 실패 · 새로고침합니다: ' + e.message, 5200); loadAll(true); })
       .reorder(ids);
}

function holdVisit(id) { setStatusOptimistic(id, '보류', '보류로 이동'); }
function doneVisit(id) { setStatusOptimistic(id, '완료', '완료 처리됨'); }
function undoVisit(id) { setStatusOptimistic(id, '예정', '예정으로 되돌림'); }

function resumeVisit(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (v && !v.date) {
    toast('재방문일을 먼저 지정하세요');
    openVisitForm(id);
    return;
  }
  setStatusOptimistic(id, '예정', '방문일정으로 복귀');
}

function delVisit_() {
  if (!vEditId || pending_(vEditId)) return;
  if (!confirm('이 방문 일정을 삭제할까요?')) return;
  var id = vEditId;
  closeSheet('visitForm');
  VISITS = VISITS.filter(function (x) { return x.id !== id; });
  cacheWrite(); render();
  toast('삭제됨');
  srv().then(function () { loadAll(true); })
       .err(function (e) { toast('삭제 실패 · ' + e.message, 5600); loadAll(true); })
       .delVisit(id);
}

/* ---------- 길찾기 ---------- */
/* 1번부터 이 병원까지를 네이버 지도 자동차 길찾기로 넘긴다.
   출발지는 비워 두면 네이버가 현재 위치를 잡는다. */
function routeTo(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var day = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  day.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var stops = [], missing = [];
  for (var i = 0; i < day.length; i++) {
    var h = findHospital(day[i]);
    if (h && h.lat && h.lng) stops.push({ name: day[i].name, lat: h.lat, lng: h.lng });
    else missing.push(day[i].name);
    if (day[i].id === id) break;
  }

  if (!stops.length) { toast('좌표가 있는 병원이 없습니다.', 4200); return; }
  if (stops.length > NAV_MAX_STOPS) {
    toast('한 번에 최대 ' + NAV_MAX_STOPS + '곳까지만 보낼 수 있습니다.', 5200);
    return;
  }
  if (missing.length) toast('좌표 없어 제외: ' + missing.join(', '), 5200);

  var d = stops[stops.length - 1];
  var u = 'nmap://route/car?dlat=' + d.lat + '&dlng=' + d.lng +
          '&dname=' + encodeURIComponent(d.name);
  for (var k = 0; k < stops.length - 1; k++) {
    var n = k + 1;
    u += '&v' + n + 'lat=' + stops[k].lat +
         '&v' + n + 'lng=' + stops[k].lng +
         '&v' + n + 'name=' + encodeURIComponent(stops[k].name);
  }
  u += '&appname=phurom0103-coder.github.io';

  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ---------- 시작 ----------
   기기에 남아 있는 목록을 먼저 그려서 기다림 없이 띄우고,
   새 자료는 뒤에서 받아 바꿔 끼운다. */
(function () {
  if (!CODE) { showLogin(); return; }
  var c = cacheRead();
  if (c && c.hospitals && c.hospitals.length) {
    DB = c.hospitals; VISITS = c.visits || [];
    render();
    loadAll(true);
  } else {
    loadAll();
  }
})();
</script>
