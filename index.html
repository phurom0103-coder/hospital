<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>병원 DB</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5821F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="병원 DB">
<style>
  :root {
    --orange:      #F5821F;
    --orange-dk:   #E06A0A;
    --orange-tint: #FFF2E5;

    --ink:      #1F1B17;
    --ink-mid:  #6B6259;
    --ink-dim:  #9A918A;
    --paper:    #F7F3EF;
    --surface:  #FFFFFF;
    --rule:     #EBE4DD;

    --go:      #1B7A43;
    --go-bg:   #E6F3EA;
    --stop:    #B3261E;
    --stop-bg: #FBEAE8;
    --wait:    #4A5B6E;
    --wait-bg: #EBEFF3;

    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 4px 14px rgba(120,70,20,.06);
    --tabh:   62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    padding-bottom: calc(var(--tabh) + 84px);
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--orange-dk); outline-offset: 2px; }

  /* ---------- 상단 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--orange); color: #fff;
    padding: 14px 16px 16px;
    border-radius: 0 0 20px 20px;
  }
  header h1 {
    margin: 0 0 11px;
    font-size: 18px; font-weight: 700; letter-spacing: -.02em;
  }
  header h1 .num {
    font-size: 13.5px; font-weight: 600; margin-left: 8px;
    opacity: .85; font-variant-numeric: tabular-nums;
  }
  #search {
    width: 100%; height: 46px;
    padding: 0 15px; border: none; border-radius: 12px;
    font-size: 16px; font-family: inherit; color: var(--ink);
    background: #fff;
  }
  #search::placeholder { color: var(--ink-dim); }

  .wrap { padding: 16px 14px 0; }

  /* ---------- 하단 탭 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 4px;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs button {
    flex: 1; height: 44px; min-width: 0;
    background: none; color: var(--ink-mid); border-radius: 22px;
    font-size: 14px; font-weight: 500; padding: 0;
  }
  #tabs button.on {
    color: var(--orange-dk); font-weight: 700;
    background: var(--orange-tint);
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  .tabcnt {
    display: none; margin-left: 5px; font-size: 11px; font-weight: 700;
    background: var(--wait); color: #fff; border-radius: 9px; padding: 1px 6px;
    vertical-align: 1px;
  }
  .tabcnt.show { display: inline-block; }

  /* ---------- 레코드 카드 ---------- */
  .rec {
    background: var(--surface);
    border-left: 5px solid #E3DCD5;
    border-radius: 13px;
    box-shadow: var(--shadow);
    padding: 11px 13px 10px;
    margin-bottom: 8px;
  }
  /* 당일발급이 되는 것이 보통이므로 초록 표시는 두지 않는다.
     불가능한 곳만 눈에 띄게 한다. */
  .rec.r-no   { border-left-color: var(--stop); }
  .rec.r-hold { border-left-color: var(--wait); }

  .rec h2 {
    margin: 0;
    font-size: 16.5px; font-weight: 700; letter-spacing: -.02em;
  }
  .addr {
    color: var(--ink-mid); font-size: 12.5px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 당일발급 표시: 불가능하거나 확인 안 된 경우에만 나온다 */
  .tag {
    display: inline-block; margin-top: 6px;
    font-size: 12.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 8px;
  }
  .tag.no  { background: var(--stop-bg); color: var(--stop); }
  .tag.unk { background: #F2EEEA; color: var(--ink-mid); font-weight: 600; }

  /* 병원DB 카드: 수정 버튼을 이름 옆에 두어 아래 한 줄을 없앤다 */
  .dbhead { display: flex; align-items: center; gap: 7px; }
  .dbhead h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 사전신청은 판단에 바로 쓰이므로 수정 버튼 왼쪽에 붙여 둔다 */
  .dbhead .pre {
    flex: 0 0 auto; font-size: 12px; font-weight: 700;
    padding: 4px 9px; border-radius: 8px; white-space: nowrap;
    background: var(--go-bg); color: var(--go);
  }
  .dbhead .pre.no { background: var(--stop-bg); color: var(--stop); }
  .dbhead .edit {
    flex: 0 0 auto; min-height: 32px; padding: 0 14px; border-radius: 16px;
    background: transparent; box-shadow: inset 0 0 0 1px #DDD5CE;
    color: var(--ink-mid); font-size: 12.5px; font-weight: 600;
  }

  /* 나머지 정보는 한 줄로 이어 붙인다 */
  .meta { margin-top: 5px; font-size: 12.5px; line-height: 1.8; color: var(--ink); }
  .meta > span { white-space: nowrap; }   /* 항목 이름과 값이 갈라지지 않게 */
  .meta i { font-style: normal; color: var(--ink-dim); margin-right: 4px; }
  .meta .chk { color: var(--ink-dim); }
  .meta .chk.old { color: var(--stop); font-weight: 700; }
  .meta b { font-weight: 600; }
  .meta b.no  { color: var(--stop); font-weight: 700; }
  .meta b.yes { color: var(--go);   font-weight: 700; }
  .meta b.wait { color: var(--wait); font-weight: 700; }
  .meta .sep { color: #DCD5CE; margin: 0 6px; }
  /* 병원DB: 지역 구분줄 */
  .rhead {
    margin: 17px 3px 7px; font-size: 13px; font-weight: 800;
    color: var(--ink-mid); letter-spacing: -0.2px;
  }
  .rhead:first-child { margin-top: 3px; }
  .rhead .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); margin-left: 5px; }


  .memo {
    margin-top: 8px; padding: 7px 10px;
    background: var(--orange-tint); border-radius: 9px;
    font-size: 12.5px; white-space: pre-wrap; color: #6B4519;
  }

  .foot { display: flex; gap: 7px; margin-top: 9px; }
  .foot button { flex: 1; min-height: 40px; padding: 0 10px; border-radius: 10px; }
  .foot.split { justify-content: space-between; align-items: center; }
  .foot.split button { flex: 0 0 auto; min-height: 34px; padding: 0 16px; }

  .checked { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .checked.old { color: var(--stop); font-weight: 600; }

  .ver {
    text-align: center; font-size: 11.5px; color: #9A8F86;
    padding: 16px 0 6px; cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .missing { color: var(--stop); font-size: 13px; font-weight: 600; margin-top: 5px; }

  /* ---------- 방문 순서 ---------- */
  .ordhead { display: flex; align-items: flex-start; gap: 9px; }
  .ordhead h2 { flex: 1; min-width: 0; margin: 0; }
  .ordnum {
    flex: 0 0 auto; width: 25px; height: 25px; line-height: 25px; text-align: center;
    border-radius: 13px; background: var(--orange); color: #fff;
    font-size: 13px; font-weight: 700; margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .ordbtns { flex: 0 0 auto; display: flex; gap: 5px; }
  .ordbtns button {
    width: 36px; height: 36px; padding: 0; border-radius: 10px;
    background: #F4F0EC; color: var(--ink-mid); font-size: 14px; line-height: 1;
  }
  .ordbtns button[disabled] { opacity: .3; }

  /* ---------- 길찾기 버튼 ---------- */
  .route {
    display: block; width: 100%; margin-top: 9px; min-height: 44px;
    background: var(--orange-tint); color: var(--orange-dk);
    box-shadow: inset 0 0 0 1.5px var(--orange);
    font-size: 14px; font-weight: 700; border-radius: 11px;
  }

  /* ---------- 완료 처리된 방문 ---------- */
  /* 카드 모양은 그대로 두고, 회색으로 흐리게만 처리한다 */
  .rec.done {
    background: #F4F1ED;
    border-left-color: #DFD8D1;
    box-shadow: none;
    opacity: .58;
  }
  .rec.done h2 {
    color: var(--ink-mid);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .donehead { display: flex; align-items: flex-start; gap: 10px; }
  .donehead h2 { flex: 1; min-width: 0; }
  .donehead .undo {
    flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 17px;
    background: transparent; box-shadow: inset 0 0 0 1px #D6CEC7;
    color: var(--ink-mid); font-size: 13px; font-weight: 600;
  }

  /* ---------- 날짜 구분 ---------- */
  .dayhead {
    display: flex; align-items: center; gap: 9px;
    margin: 24px 4px 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  }
  .dayhead:first-child { margin-top: 2px; }
  .dayhead .cnt { font-weight: 500; color: var(--ink-mid); font-size: 12.5px; }
  .dayhead.today { color: var(--orange-dk); }
  .dayhead .mapbtn {
    margin-left: auto; min-height: 34px; padding: 0 16px; border-radius: 17px;
    background: var(--surface); box-shadow: var(--shadow);
    color: var(--ink); font-size: 13px; font-weight: 600;
  }

  /* 보류 재방문일 */
  .holddate {
    font-size: 14px; font-weight: 700; color: var(--wait);
    background: var(--wait-bg); display: inline-block;
    padding: 6px 12px; border-radius: 10px; margin-bottom: 11px;
    font-variant-numeric: tabular-nums;
  }
  .holddate.tbd { color: var(--stop); background: var(--stop-bg); }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: none; border-radius: 11px;
    padding: 10px 16px; background: var(--orange); color: #fff;
    cursor: pointer;
  }
  button.ghost { background: #EFEBE7; color: var(--ink); }
  button.hold  { background: var(--wait-bg); color: var(--wait); }
  button.small { font-size: 13.5px; }
  button:active { opacity: .68; }

  #fab {
    position: fixed; right: 18px;
    bottom: calc(var(--tabh) + 22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 29px;
    font-size: 30px; font-weight: 300; line-height: 1; padding: 0;
    background: var(--orange);
    box-shadow: 0 6px 18px rgba(200,110,20,.42);
    z-index: 41;
  }

  /* ---------- 시트 ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--surface);
    z-index: 50; overflow-y: auto; display: none;
    padding: 18px 16px 112px;
    animation: rise .16s ease-out;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

  .sheet h2 { margin: 2px 0 20px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }

  label { display: block; margin-bottom: 17px; }
  label span.lbl {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-mid); margin-bottom: 7px;
  }
  input[type=text], input[type=time], input[type=date], textarea {
    width: 100%; padding: 12px 13px; font-size: 16px;
    border: 1.5px solid var(--rule); border-radius: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus, textarea:focus { border-color: var(--orange); outline: none; }
  input[type=time], input[type=date] { font-variant-numeric: tabular-nums; }
  textarea { min-height: 94px; resize: vertical; line-height: 1.5; }
  #pickSearch { margin-bottom: 4px; }

  .seg { display: flex; gap: 7px; }
  .seg button {
    flex: 1; min-height: 48px; padding: 0 4px; border-radius: 12px;
    background: #F4F0EC; color: var(--ink-mid);
    font-size: 14px; font-weight: 500;
  }
  .seg button.sel { background: var(--orange); color: #fff; font-weight: 700; }
  .seg.wrap { flex-wrap: wrap; }
  .seg.wrap button { flex: 1 1 29%; min-width: 92px; }

  .lunchbox, .datebox { display: flex; gap: 7px; align-items: center; }
  .lunchbox input[type=time], .datebox input[type=date] { flex: 1; min-width: 0; }
  .lunchbox .dash { color: var(--ink-dim); }
  .lunchbox button, .datebox button {
    flex: 0 0 68px; min-height: 48px; padding: 0; border-radius: 12px;
    background: #F4F0EC; color: var(--ink-mid); font-size: 13.5px; font-weight: 500;
  }
  .lunchbox button.sel, .datebox button.sel { background: var(--orange); color: #fff; font-weight: 700; }

  .actions {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--rule);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 9px; z-index: 60;
  }
  .actions button { flex: 1; min-height: 50px; font-size: 15px; font-weight: 700; border-radius: 13px; }
  .actions button.del { flex: 0 0 66px; background: var(--stop-bg); color: var(--stop); }

  .chkrow {
    display: flex; align-items: center; gap: 9px; min-height: 46px;
    padding: 0 13px; border-radius: 11px; background: #F4F0EC;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .chkrow .box {
    flex: 0 0 auto; width: 22px; height: 22px; line-height: 22px; text-align: center;
    border-radius: 6px; background: #fff; box-shadow: inset 0 0 0 1.5px #D8D0C9;
    color: transparent; font-size: 14px; font-weight: 700;
  }
  .chkrow .txt { font-size: 13.5px; color: var(--ink-mid); }
  .chkrow.on { background: var(--go-bg); }
  .chkrow.on .box { background: var(--go); box-shadow: none; color: #fff; }
  .chkrow.on .txt { color: var(--go); font-weight: 600; }

  /* ---------- 병원 선택 ---------- */
  .picklist { margin-top: 10px; }
  .pickitem {
    padding: 15px 6px; border-bottom: 1px solid #F2EDE8;
    font-size: 16px; cursor: pointer;
  }
  .pickitem:active { background: #FAF7F4; }
  .pickitem small { display: block; color: var(--ink-mid); font-size: 12.5px; margin-top: 3px; }

  /* ---------- 동선 ---------- */
  .planbar {
    background: var(--surface); border-radius: 13px; box-shadow: var(--shadow);
    padding: 11px; margin-bottom: 10px;
  }
  .locline { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .locline .tag {
    flex: 0 0 auto; width: 30px; font-size: 12px; font-weight: 700; color: var(--ink-dim);
  }
  .locline button.sub {
    flex: 1; min-height: 40px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
    padding: 0 6px; background: #F4F0EC; color: var(--ink-mid);
  }
  .locline button.sub.on {
    background: var(--orange-tint); color: var(--orange-dk);
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  .locnow { font-size: 12px; color: var(--ink-mid); margin: 8px 0 10px; }
  .locnow b { color: var(--ink); font-weight: 600; }
  #addrBox, #endBox { display: none; margin-bottom: 6px; }
  #addrBox .arow, #endBox .arow { display: flex; gap: 6px; align-items: center; }
  #addrBox input, #endBox input {
    flex: 1 1 auto; min-width: 0;
    width: 100%; height: 42px; padding: 0 13px; border-radius: 10px;
    border: none; box-shadow: inset 0 0 0 1.5px var(--rule); font-size: 15px;
    font-family: inherit; color: var(--ink); background: #fff; }
  #addrBox .find, #endBox .find {
    flex: 0 0 auto; height: 42px; padding: 0 17px; border-radius: 10px;
    border: none; background: var(--orange); color: #fff;
    font-size: 14px; font-weight: 700; font-family: inherit; }
  .locnow .found { color: var(--ink-mid); font-weight: 400; }
  .calcbtn {
    display: block; width: 100%; min-height: 46px; border-radius: 11px;
    font-size: 14.5px; font-weight: 700;
  }

  /* 최단거리 / 최단시간 견주기 */
  .modebox { display: flex; gap: 8px; margin-bottom: 10px; }
  .modebtn {
    flex: 1; min-height: 58px; border-radius: 12px; padding: 8px 6px;
    background: var(--surface); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .modebtn .nm { font-size: 13px; font-weight: 700; color: var(--ink-mid); }
  .modebtn .val { font-size: 11.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .modebtn.on { background: var(--orange-tint); box-shadow: inset 0 0 0 2px var(--orange); }
  .modebtn.on .nm { color: var(--orange-dk); }
  .modebtn.on .val { color: var(--orange-dk); }

  /* 계산된 순서로 보여줄 때의 카드 */
  .rec.planrec .ordhead { align-items: center; gap: 8px; }
  .rec.planrec h2 { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .kd { flex: 0 0 auto; font-size: 11.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 7px; background: #F0ECE8; color: var(--ink-mid); }
  .kd.get  { background: var(--go-bg);   color: var(--go); }
  .kd.put  { background: var(--wait-bg); color: var(--wait); }
  .kd.both { background: var(--orange-tint); color: var(--orange-dk); }
  .kd.warn { background: var(--stop-bg); color: var(--stop); }

  /* 왜 이렇게 도는지 한 줄 설명 */
  .whyline {
    margin-top: 9px; font-size: 12.5px; color: var(--wait); font-weight: 600;
    background: var(--wait-bg); border-radius: 9px; padding: 7px 10px;
  }
  .whyline.stay { color: var(--ink-mid); background: #F2EEEA; }
  .whyline.warn { color: var(--stop); background: var(--stop-bg); }

  /* 출발 전에 해둘 일 */
  .prebox {
    background: var(--go-bg); color: var(--go); border-radius: 12px;
    padding: 11px 13px; margin-bottom: 10px; font-size: 12.5px; line-height: 1.6;
  }
  .prebox b { font-size: 13px; }
  .route.wide { margin-top: 2px; margin-bottom: 4px; }
  /* 동선 카드의 길찾기 · 먼저 가기 줄 */
  .navrow { display: flex; gap: 7px; margin-top: 9px; }
  .navrow .route { flex: 1; margin-top: 0; min-height: 40px; font-size: 13.5px; padding: 0 6px; }
  .navrow .pinbtn {
    flex: 0 0 auto; min-height: 40px; padding: 0 13px; border-radius: 11px;
    background: #F4F0EC; color: var(--ink-mid); font-size: 13.5px; font-weight: 700;
  }
  .navrow .pinbtn.on { background: var(--orange); color: #fff; }
  .pinbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--orange-tint); border-radius: 11px;
    padding: 9px 11px; margin-bottom: 9px;
    font-size: 12.5px; font-weight: 600; color: var(--orange-dk);
  }
  .pinbar .who { flex: 1; min-width: 0; line-height: 1.5; }
  .pinbar button {
    flex: 0 0 auto; min-height: 32px; padding: 0 12px; border-radius: 9px;
    background: #fff; color: var(--ink-mid); font-size: 12.5px; font-weight: 700;
    box-shadow: inset 0 0 0 1.5px var(--rule);
  }
  .ordhead .pinmark { color: var(--orange); font-size: 13px; margin-left: 2px; }

  /* 주유 · 충전 */
  #gasfab {
    position: fixed; right: 22px;
    bottom: calc(var(--tabh) + 90px + env(safe-area-inset-bottom));
    width: 50px; height: 50px; border-radius: 25px;
    font-size: 22px; line-height: 1; padding: 0;
    background: var(--surface); color: var(--ink);
    box-shadow: 0 4px 14px rgba(0,0,0,.16), inset 0 0 0 1.5px var(--rule);
    z-index: 41;
  }
  .gasitem {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border-radius: 13px;
    padding: 12px 13px; margin-bottom: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .gasitem .no {
    flex: 0 0 auto; width: 22px; text-align: center;
    font-size: 13px; font-weight: 800; color: var(--ink-dim);
  }
  .gasitem .who { flex: 1; min-width: 0; }
  .gasitem .who b { display: block; font-size: 15px; font-weight: 700; line-height: 1.35; }
  .gasitem .who small { font-size: 12px; color: var(--ink-dim); }
  .gasitem .pr {
    flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums;

<script>
var TAB = 'visit';
try {
  var _t0 = localStorage.getItem('hdb_tab');
  if (_t0 === 'visit' || _t0 === 'hold' || _t0 === 'db') TAB = _t0;
} catch (e) {}
var DB = [], VISITS = [];
var editId = null, vEditId = null, vHid = '';
var lunchNone = false, dateTbd = false;
var stayWait = false;   /* 접수 후 그 자리에서 대기 */
var rawOpen = '', rawLunch = '';   /* 시각칸이 못 읽은 원래 글자 */
var seg = { sameday: '', prereq: '', parking: '', wait: '' };
var rawWait = '';   /* 버튼에 없는 옛 글자를 지켜 준다 */
var vStatus = '예정';
var subDone = false;   /* 접수 완료 체크 */
var MAP = null, MARKERS = [];

var SEG_OPTS = {
  sameday: ['가능', '불가능'],
  prereq:  ['유선', '팩스', '인터넷', '불가능'],
  parking: ['가능', '인근'],
  wait:    ['10분 내외', '30분 내외', '1시간 내외', '1시간 초과', '우편·등기']
};
var SEG_LABEL = { sameday: '당일발급', prereq: '사전신청', parking: '주차', wait: '발급소요' };

/* 점심시간 빠른 고르기. 오후 시각만 넣어 두어 오전으로 잘못 잡히는 일을 막는다. */
var LUNCH_QUICK = ['12:00-13:00', '12:30-13:30', '13:00-14:00'];

/* 방문일정 탭은 오늘 기준 이 일수 전까지만 보여준다 */
var APP_VER = 'v30';   /* 화면 맨 아래에 표시된다 */
var VISIT_DAYS_BACK = 3;
/* 네이버 지도: 목적지 1 + 경유지 5 = 한 번에 최대 6곳 (실측 확인됨) */
var NAV_MAX_STOPS = 6;

/* ---------- 공통 ---------- */
var toastTimer = null;
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';   /* white-space: pre-line 로 줄바꿈 표시 */
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, ms || 2200);
}
/* 검색은 대문자·소문자를 가리지 않는다 */
function lc_(s) { return String(s == null ? '' : s).toLowerCase(); }
function hit_(hay, q) { return lc_(hay).indexOf(q) > -1; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* ---------- 창 열고 닫기 · 뒤로가기 ----------
   창이 열릴 때 뒤로가기 한 칸을 만들어 둔다.
   그래야 휴대폰에서 뒤로 밀었을 때 앱이 꺼지지 않고 창만 닫힌다. */
var SHEETS_BACK = ['visitForm', 'picker', 'form', 'gasSheet', 'mapSheet'];
var SHEET_DEPTH = 0, SKIP_POP = 0, EXIT_ARMED = false;

function topSheet_() {
  for (var i = 0; i < SHEETS_BACK.length; i++) {
    var e = document.getElementById(SHEETS_BACK[i]);
    if (e && e.style.display === 'block') return SHEETS_BACK[i];
  }
  return null;
}
function pushGuard_() { try { history.pushState({ hdb: 1 }, ''); } catch (e) {} }

function closeSheet(id) {
  var el = document.getElementById(id);
  if (!el) return;
  var was = (el.style.display === 'block');
  el.style.display = 'none';
  if (was && SHEETS_BACK.indexOf(id) > -1 && SHEET_DEPTH > 0) {
    SHEET_DEPTH--; SKIP_POP++;
    try { history.back(); } catch (e) { SKIP_POP--; }
  }
}
function openSheet(id) {
  var el = document.getElementById(id);
  if (!el) return;
  if (el.style.display !== 'block' && SHEETS_BACK.indexOf(id) > -1) {
    SHEET_DEPTH++; pushGuard_();
  }
  el.style.display = 'block';
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', function () {
  if (SKIP_POP > 0) { SKIP_POP--; return; }
  var top = topSheet_();
  if (top) {                       /* 창이 열려 있으면 창만 닫는다 */
    document.getElementById(top).style.display = 'none';
    if (SHEET_DEPTH > 0) SHEET_DEPTH--;
    return;
  }
  if (EXIT_ARMED) {                /* 두 번째 뒤로 → 진짜로 나간다 */
    EXIT_ARMED = false;
    try { history.back(); } catch (e) {}
    return;
  }
  EXIT_ARMED = true;               /* 첫 번째 뒤로 → 안내만 */
  toast('한 번 더 누르면 종료됩니다', 2000);
  pushGuard_();
  setTimeout(function () { EXIT_ARMED = false; }, 2000);
});

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
/* 방문 등록은 보통 전날 저녁에 하므로 다음 날을 기본으로 둔다 */
function tomorrowStr() {
  var d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function dayLabel(ds) {
  if (!ds) return '미정';
  ds = esc(String(ds));
  var d = new Date(ds + 'T00:00:00');
  var w = ['일','월','화','수','목','금','토'][d.getDay()];
  var base = ds.slice(5).replace('-', '.') + ' (' + w + ')';
  var t = todayStr();
  if (ds === t) return base + ' 오늘';
  if ((d - new Date(t + 'T00:00:00')) === 86400000) return base + ' 내일';
  return base;
}
function withinWindow(ds) {
  if (!ds) return true;
  var t = new Date(ds + 'T00:00:00').getTime();
  if (isNaN(t)) return true;
  var today = new Date(todayStr() + 'T00:00:00').getTime();
  return t >= today - VISIT_DAYS_BACK * 86400000;
}

/* ---------- 서버 통신 (JSONP) ---------- */
var API = 'https://script.google.com/macros/s/AKfycbzblnGALj9dZqDHq6tNTlDsU4FWF9SPN2Kwtg5oe3zwGAbYQhQygUPcIoILhScGZisa/exec';
var CODE = '', ME = '', _seq = 0;
try { CODE = localStorage.getItem('hdb_code') || ''; } catch (e) { CODE = ''; }

function jsonp(params, ok, fail, waitMs) {
  var cb = '__cb' + (++_seq) + '_' + Date.now();
  var url = API + '?cb=' + cb + '&code=' + encodeURIComponent(CODE);
  for (var k in params) url += '&' + k + '=' + encodeURIComponent(params[k]);

  var sc = document.createElement('script'), done = false;
  var timer = setTimeout(function () {
    finish(null, { message: '응답이 없습니다. 통신 상태를 확인하세요.' });
  }, waitMs || 25000);

  function finish(res, err) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    if (err) { fail(err); return; }
    if (res && res.ok) ok(res);
    else if (res && res.err === 'AUTH') authFail();
    else fail({ message: (res && res.err) || '알 수 없는 오류' });
  }

  window[cb] = function (res) { finish(res, null); };
  sc.onerror = function () { finish(null, { message: '서버에 연결하지 못했습니다.' }); };
  sc.src = url;
  document.head.appendChild(sc);
}

/* 서버 호출을 한 곳에 모아둔다 */
function srv() {
  var ok = function () {};
  var fail = function (e) { toast('실패: ' + e.message, 5200); };
  var r = {};
  r.then = function (f) { ok = f; return r; };
  r.err  = function (f) { fail = f; return r; };
  r.all         = function ()       { jsonp({fn:'all'}, function (s) { ok(s); }, fail); return r; };
  r.saveHosp    = function (d)      { jsonp({fn:'saveHospital', data:JSON.stringify(d)}, function (s) { ok(s.res); }, fail); return r; };
  r.delHosp     = function (id)     { jsonp({fn:'delHospital', id:id}, function () { ok(); }, fail); return r; };
  r.saveVisit   = function (d)      { jsonp({fn:'saveVisit', data:JSON.stringify(d)}, function (s) { ok(s.id); }, fail); return r; };
  r.setStatus   = function (id, st) { jsonp({fn:'setStatus', id:id, status:st}, function () { ok(); }, fail); return r; };
  r.delVisit    = function (id)     { jsonp({fn:'delVisit', id:id}, function () { ok(); }, fail); return r; };
  r.reorder     = function (ids)    { jsonp({fn:'reorder', ids:ids.join(',')}, function () { ok(); }, fail); return r; };
  r.geo         = function (q)      { jsonp({fn:'geo', q:q}, function (s) { ok(s); }, fail); return r; };
  r.fuel        = function (pts, k) { jsonp({fn:'fuel', pts:pts, kind:k}, function (s) { ok(s.res); }, fail, 60000); return r; };
  /* 첫 계산은 구간을 수십 개 물어봐야 해서 오래 걸린다. 넉넉히 기다린다. */
  r.times       = function (pts, f, t) { jsonp({fn:'times', pts:pts, from:f||'', to:t||''}, function (s) { ok(s.res); }, fail, 90000); return r; };
  return r;
}

/* ---------- 조사자 확인 ---------- */
function showLogin(msg) {
  var m = document.getElementById('l_msg');
  m.className = ''; m.textContent = msg || '';
  document.getElementById('l_code').value = '';
  openSheet('login');
}
function authFail() {
  try { localStorage.removeItem('hdb_code'); } catch (e) {}
  CODE = '';
  showLogin('코드가 맞지 않습니다.');
}
/* 확인과 데이터 받기를 한 번에 처리한다 (왕복 2회 -> 1회) */
function doLogin() {
  var v = document.getElementById('l_code').value.trim();
  var m = document.getElementById('l_msg');
  if (!v) { m.className = ''; m.textContent = '코드를 입력하세요.'; return; }
  CODE = v;
  m.className = 'busy'; m.textContent = '확인 중…';
  srv().then(function (d) {
      ME = d.name; DB = d.hospitals; VISITS = d.visits;
      cacheWrite();
      try { localStorage.setItem('hdb_code', CODE); } catch (e) {}
      closeSheet('login');
      toast(ME + '님 확인되었습니다');
      render();
    })
    .err(function (e) { CODE = ''; m.className = ''; m.textContent = e.message; })
    .all();
}

/* ---------- 로드 · 캐시 ---------- */
/* 마지막으로 받은 목록을 기기에 저장해 둔다.
   다음에 열면 그걸 즉시 보여주고, 새 자료는 뒤에서 받아 바꿔 끼운다. */
function cacheRead() {
  try {
    var s = localStorage.getItem('hdb_cache');
    if (!s) return null;
    var c = JSON.parse(s);
    /* 모양이 이상하면 없는 셈 친다 (예전 형식이거나 저장 중 끊긴 경우) */
    if (!c || !(c.hospitals instanceof Array) || !(c.visits instanceof Array)) return null;
    return c;
  }
  catch (e) { return null; }
}
/* 화면에서 뭔가를 직접 바꿨다는 표시.
   뒤늦게 도착한 갱신 응답이 이 변경을 덮어쓰지 못하게 한다. */
var MUT_SEQ = 0, LOAD_SEQ = 0;
function touch_() { MUT_SEQ++; cacheWrite(); render(); }

function cacheWrite() {
  try { localStorage.setItem('hdb_cache', JSON.stringify({ hospitals: DB, visits: VISITS })); }
  catch (e) {}
}

/* quiet = true 면 화면을 비우지 않고 조용히 갱신한다 */
function loadAll(quiet) {
  var mutAt = MUT_SEQ, my = ++LOAD_SEQ;
  if (!quiet) document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
  srv().then(function (d) {
        /* 내가 그 사이에 뭔가 바꿨거나, 더 나중에 부른 갱신이 있으면
           이 응답은 낡은 것이다. 그대로 덮어쓰면 방금 지운 게 되살아난다. */
        if (my !== LOAD_SEQ || mutAt !== MUT_SEQ) return;
        ME = d.name || ME;
        DB = d.hospitals; VISITS = d.visits;
        cacheWrite(); render();
      })
       .err(function (e) { if (quiet) toast('갱신 실패: ' + e.message, 4200); else fail(e); })
       .all();
}
function fail(e) {
  document.getElementById('list').innerHTML =
    '<div class="empty">불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
}

/* 방문 건에 붙은 병원 고유번호로 찾는다. 없으면 이름으로 */
function findHospital(v) {
  var hid = (v && v.hid) || '';
  var name = (v && v.name) || v;
  var i;
  if (hid) { for (i = 0; i < DB.length; i++) if (DB[i].id === hid) return DB[i]; }
  for (i = 0; i < DB.length; i++) if (DB[i].name === name) return DB[i];
  return null;
}

/* ---------- 탭 ---------- */
var TAB_TITLE = { visit: '방문일정', hold: '보류 건', db: '병원 실무정보 DB' };

function paintTabs() {
  ['visit','hold','db'].forEach(function (k) {
    var e = document.getElementById('tab_' + k);
    if (e) e.className = (TAB === k) ? 'on' : '';
  });
}

function switchTab(t) {
  TAB = t;
  try { localStorage.setItem('hdb_tab', t); } catch (e) {}
  paintTabs();
  document.getElementById('search').value = '';
  render(); window.scrollTo(0, 0);
}

function onFab() {
  if (TAB === 'db') openForm();
  else openPicker();
}


function visitsOf(kind) {
  return VISITS.filter(function (v) {
    return kind === 'hold' ? (v.status === '보류') : (v.status !== '보류');
  });
}

function paintHoldCount() {
  var n = visitsOf('hold').length;
  var el = document.getElementById('holdCnt');
  el.textContent = n;
  el.className = n ? 'tabcnt show' : 'tabcnt';
}

/* ---------- 지도 ---------- */
function openDayMap(ds) {
  var items = visitsOf('visit').filter(function (v) {
    return v.date === ds && v.status !== '완료';
  });
  var pts = [], missing = [];

  items.forEach(function (v) {
    var h = findHospital(v);
    if (h && h.lat && h.lng) pts.push({ name: v.name, lat: h.lat, lng: h.lng });
    else missing.push(v.name);
  });

  if (!pts.length) { toast('남은 방문지 중 좌표가 있는 병원이 없습니다.'); return; }

  document.getElementById('mapTitle').textContent = dayLabel(ds) + ' · ' + pts.length + '곳';
  openSheet('mapSheet');

  var warn = document.getElementById('mapWarn');
  if (missing.length) {
    warn.textContent = '좌표 없음: ' + missing.join(', ');
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }

  setTimeout(function () { drawMap(pts); }, 60);
}

function drawMap(pts) {
  if (typeof L === 'undefined') { toast('지도를 불러오지 못했습니다 (통신 확인)', 4200); return; }
  if (!MAP) {
    MAP = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(MAP);
  }
  MARKERS.forEach(function (m) { MAP.removeLayer(m); });
  MARKERS = [];

  var bounds = [];
  pts.forEach(function (p, i) {
    var icon = L.divIcon({
      className: '',
      html: '<div class="pin">' + (i + 1) + '</div>',
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    var m = L.marker([p.lat, p.lng], { icon: icon }).addTo(MAP).bindPopup(p.name);
    MARKERS.push(m);
    bounds.push([p.lat, p.lng]);
  });

  MAP.invalidateSize();
  if (bounds.length === 1) MAP.setView(bounds[0], 14);
  else MAP.fitBounds(bounds, { padding: [40, 40] });
}

function closeMap() { closeSheet('mapSheet'); }

/* ---------- 렌더 ---------- */
/* 제목 옆에 등록 개수를 보여준다. 검색 중이면 '보이는 수 / 전체 수' */
function paintTitle(shown, total) {
  var el = document.getElementById('pageTitle');
  var txt = esc(TAB_TITLE[TAB]);
  if (total != null) {
    txt += '<span class="num">' +
           (shown != null && shown !== total ? shown + ' / ' + total : total) +
           '</span>';
  }
  el.innerHTML = txt;
}

function render() {
  paintHoldCount();
  if (TAB === 'db') renderDB();
  else if (TAB === 'hold') renderHold();
  else renderVisits();
}

/* 당일발급이 되는 것이 보통이므로, 되는 경우에는 아무 표시도 하지 않는다.
   불가능한 곳만 빨갛게 드러낸다. */
/* ---------- 지역 (#15 · #20) ----------
   주소 앞머리를 시/도 + 시·군·구 로 잘라 묶는다.
   표기가 '서울특별시'든 '서울'이든 같은 묶음으로 간다. */
var SIDO_MAP = {
  '서울특별시':'서울','서울시':'서울','서울':'서울',
  '부산광역시':'부산','부산시':'부산','부산':'부산',
  '대구광역시':'대구','대구시':'대구','대구':'대구',
  '인천광역시':'인천','인천시':'인천','인천':'인천',
  '광주광역시':'광주','광주시':'광주',
  '대전광역시':'대전','대전시':'대전','대전':'대전',
  '울산광역시':'울산','울산시':'울산','울산':'울산',
  '세종특별자치시':'세종','세종시':'세종','세종':'세종',
  '경기도':'경기','경기':'경기',
  '강원특별자치도':'강원','강원도':'강원','강원':'강원',
  '충청북도':'충북','충북':'충북','충청남도':'충남','충남':'충남',
  '전북특별자치도':'전북','전라북도':'전북','전북':'전북',
  '전라남도':'전남','전남':'전남',
  '경상북도':'경북','경북':'경북','경상남도':'경남','경남':'경남',
  '제주특별자치도':'제주','제주도':'제주','제주':'제주'
};
function regionOf(addr) {
  var t = String(addr || '').trim().split(/\s+/).filter(Boolean);
  if (!t.length) return { key: '\uffff', label: '주소 없음' };
  var sido = SIDO_MAP[t[0]] || t[0];
  var gu = t[1] || '';
  /* 고양시 일산동구 처럼 시 아래 구가 또 있으면 함께 묶는다 */
  if (/시$/.test(gu) && t[2] && /구$/.test(t[2])) gu += ' ' + t[2];
  var label = gu ? (sido + ' ' + gu) : sido;
  return { key: label, label: label };
}

function recCls(h, extra) {
  var c = 'rec';
  if (h && h.sameday === '불가능') c += ' r-no';
  return extra ? (c + ' ' + extra) : c;
}

function isOld(d) {
  if (!d) return false;
  var t = new Date(d).getTime();
  if (isNaN(t)) return false;
  return (Date.now() - t) > 1000 * 60 * 60 * 24 * 180;
}

/* 사전신청 배지: 되는 곳은 초록, 안 되는 곳은 빨강 */

/* 방문 메모에 '접수완료' 표시가 있는지 */
function isSubmitted(v) {
  return String((v && v.memo) || '').indexOf(DONE_MARK) > -1;
}
/* 화면에 보여줄 메모 (표시는 떼고) */
function plainMemo(v) {
  return String((v && v.memo) || '').split(DONE_MARK).join('').trim();
}

/* 주차 '인근'인 병원의 주차장 좌표가 등록돼 있는지 */
function hasParkPoint(h) { return !!(h && h.pLat && h.pLng); }

/* 당일발급 표시: 가능하면 아무것도 안 띄운다 */
/* 대부분이 '당일발급 가능'이라, 안 되는 곳만 알린다. */
function samedayTag(h) {
  if (h.sameday === '불가능') return '<div class="tag no">당일발급 불가</div>';
  return '';
}


/* 나머지 항목은 한 줄로 이어 붙여 카드를 낮춘다 */
/* #14 발급 소요: 10분대 초록 · 30분대 검정 · 1시간 이상 빨강 */
function waitCls_(v) {
  var t = String(v || '');
  if (!t) return '';
  if (/우편|등기/.test(t)) return '';
  var m = parseWait(t);
  if (m == null) return '';
  if (m <= 15) return ' class="yes"';
  if (m <= 45) return '';
  return ' class="no"';
}

function metaLine(h, opt) {
  opt = opt || {};
  var out = [];
  /* hl 이 참이면 '되는 경우'를 초록으로 강조한다 (사전신청은 되는 곳이 드물어서) */
  function add(k, v, hl) {
    if (!v) return;
    var cls = '';
    if (v === '불가능') cls = ' class="no"';
    else if (hl) cls = ' class="yes"';
    out.push('<span><i>' + k + '</i><b' + cls + '>' + esc(v) + '</b></span>');
  }
  /* 사전신청은 되는 곳이 드물다. 되는 곳만 초록으로 알리고 '불가능'은 적지 않는다. */
  if (h.prereq && h.prereq !== '불가능') add('사전신청', h.prereq, true);
  /* 주차가 '인근'인데 주차장 주소가 없으면 길찾기를 할 수 없으므로 미리 알린다 */
  if (h.parking === '인근' && !hasParkPoint(h)) {
    out.push('<span><i>주차</i><b class="no">인근 · 주소 없음</b></span>');
  } else {
    add('주차', h.parking);
  }
  /* '접수 후 대기'는 화면에 적지 않는다. 병원DB 입력 칸에서만 체크하고,
     동선 계산에서 최단시간에 반영하는 용도로만 쓴다. */
  if (h.wait) out.push('<span><i>발급</i><b' + waitCls_(h.wait) + '>' + esc(h.wait) + '</b></span>');
  add('진료', h.open);
  add('점심', h.lunch);
  if (opt.checked) {
    out.push('<span class="chk' + (isOld(h.checked) ? ' old' : '') + '">' +
             (h.checked ? '확인 ' + esc(h.checked) : '확인일 없음') + '</span>');
  }
  if (!out.length) return '';
  return '<div class="meta">' + out.join('<span class="sep">·</span>') + '</div>';
}

function infoBlock(h) {
  if (!h) return '<div class="missing">병원DB에 없는 병원입니다</div>';
  return (h.addr ? '<div class="addr">' + esc(h.addr) + '</div>' : '') +
         samedayTag(h) + metaLine(h);
}

/* 완료된 방문: 카드는 그대로, 회색으로 흐리게 + 날짜 그룹 안 맨 아래로 */
function doneCard(v) {
  var h = findHospital(v);
  return '<div class="' + recCls(h, 'done') + '">' +
    '<div class="donehead">' +
      '<h2>' + esc(v.name) + '</h2>' +
      '<button class="undo" onclick="undoVisit(\'' + v.id + '\')">되돌리기</button>' +
    '</div>' +
    infoBlock(h) +
    (v.memo ? '<div class="memo">' + esc(v.memo) + '</div>' : '') +
  '</div>';
}

function renderVisits() {
  paintTitle();
  var q = lc_(document.getElementById('search').value.trim());
  var pool = visitsOf('visit');
  var all = pool.filter(function (v) { return withinWindow(v.date); });
  var hidden = pool.length - all.length;
  var list = all.filter(function (v) { return !q || hit_(v.name, q); });
  var el = document.getElementById('list');

  if (!list.length) {
    var msg;
    if (all.length) msg = '검색 결과가 없습니다.';
    else if (hidden) msg = '표시할 일정이 없습니다.<br>' + VISIT_DAYS_BACK +
                           '일 이전 일정 ' + hidden + '건은 숨겨져 있습니다.';
    else msg = '예정된 방문이 없습니다.<br>+ 를 눌러 병원을 고르세요.';
    el.innerHTML = '<div class="empty">' + msg + '</div>';
    PLAN = null;
    return;
  }

  var order = [], seen = {};
  list.forEach(function (v) {
    var k = v.date || '';
    if (!seen[k]) { seen[k] = { date: v.date, todo: [], done: [] }; order.push(seen[k]); }
    (v.status === '완료' ? seen[k].done : seen[k].todo).push(v);
  });

  /* #18 늦은 날짜가 위로 온다. 앞날 → 오늘 → 지난 날 (오래될수록 더 아래).
     날짜 미정은 맨 뒤. */
  order.sort(function (a, b) {
    var x = a.date || '', y = b.date || '';
    if (!x && !y) return 0;
    if (!x) return 1;
    if (!y) return -1;
    if (x === y) return 0;
    return x > y ? -1 : 1;
  });

  /* 다시 그리기 전에 입력 중이던 출발 주소를 챙겨 둔다 */
  var ab = document.getElementById('addrBox'), keepAddr = '', keepOpen = false;
  if (ab) {
    keepOpen = (ab.style.display === 'block');
    var ai = document.getElementById('p_addr');
    if (ai) keepAddr = ai.value;
  }

  var html = '';
  order.forEach(function (g) {
    var isToday = (g.date === todayStr());
    var cnt = g.todo.length + '곳 남음';
    if (g.done.length) cnt += ' · ' + g.done.length + '곳 완료';

    html += '<div class="dayhead' + (isToday ? ' today' : '') + '">' +
            dayLabel(g.date) + ' <span class="cnt">' + cnt + '</span>' +
            '<button class="mapbtn" onclick="openDayMap(\'' + esc(String(g.date || '')).replace(/'/g, '') + '\')">지도</button></div>';

    /* 오늘·앞으로의 날짜에는 출발지·계산 줄을 붙이고,
       계산돼 있으면 그 날짜의 순서로 보여준다 */
    if (planDay_(g.date) && !q && g.todo.length) {
      html += planBar(g.date);
      if (planUsable(g.date)) {
        var body = planBody(g.date);
        if (body) {
          html += body;
          g.done.forEach(function (v) { html += doneCard(v); });
          return;
        }
      } else if (PLAN && PLAN.date === g.date && PLAN.err) {
        html += '<div class="planwarn">' + esc(PLAN.err) + '</div>';
      } else if (PLAN && PLAN.date === g.date) {
        html += '<div class="planwarn">방문 목록이 바뀌었습니다. 다시 계산해 주세요.</div>';
      }
    }

    g.todo.sort(function (a, b) {
      var x = a.order || 9999, y = b.order || 9999;
      if (x !== y) return x - y;
      return a.name.localeCompare(b.name, 'ko');
    });

    g.todo.forEach(function (v, idx) {
      var h = findHospital(v);
      var first = (idx === 0), lastOne = (idx === g.todo.length - 1);
      html += '<div class="' + recCls(h) + '">' +
        '<div class="ordhead">' +
          '<span class="ordnum">' + (idx + 1) + '</span>' +
          '<h2>' + esc(v.name) + '</h2>' +
          '<div class="ordbtns">' +
            '<button onclick="moveVisit(\'' + v.id + '\',-1)"' + (first ? ' disabled' : '') + '>▲</button>' +
            '<button onclick="moveVisit(\'' + v.id + '\',1)"' + (lastOne ? ' disabled' : '') + '>▼</button>' +
          '</div>' +
        '</div>' +
        infoBlock(h) +
        (v.memo ? '<div class="memo">' + esc(v.memo) + '</div>' : '') +
        '<div class="navrow">' +
          '<button class="route" onclick="routeOne(\'' + v.id + '\')">🚩 길찾기</button>' +
          (idx > 0 && idx < NAV_MAX_STOPS
             ? '<button class="route" onclick="routeTo(\'' + v.id + '\')">🚩 여기까지</button>' : '') +
        '</div>' +
        '<div class="foot">' +
          '<button class="small" onclick="doneVisit(\'' + v.id + '\')">완료</button>' +
          '<button class="hold small" onclick="holdVisit(\'' + v.id + '\')">보류</button>' +
          '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
        '</div></div>';
    });

    g.done.forEach(function (v) { html += doneCard(v); });
  });

  el.innerHTML = html;

  if (keepOpen || keepAddr) {
    var b2 = document.getElementById('addrBox');
    if (b2) b2.style.display = 'block';
    var i2 = document.getElementById('p_addr');
    if (i2) i2.value = keepAddr;
  }
}

/* ---------- 보류 탭 ---------- */
function renderHold() {
  paintTitle();
  var q = lc_(document.getElementById('search').value.trim());
  var all = visitsOf('hold');
  var list = all.filter(function (v) { return !q || hit_(v.name, q); });
  var el = document.getElementById('list');

  if (!list.length) {
    el.innerHTML = '<div class="empty">' +
      (all.length ? '검색 결과가 없습니다.' : '보류 중인 건이 없습니다.') + '</div>';
    return;
  }

  el.innerHTML = list.map(function (v) {
    var h = findHospital(v);
    var dateTxt = v.date ? dayLabel(v.date) + ' 재방문' : '재방문일 미정';
    return '<div class="' + recCls(h, 'r-hold') + '">' +
      '<h2>' + esc(v.name) + '</h2>' +
      '<div class="holddate' + (v.date ? '' : ' tbd') + '">' + dateTxt + '</div>' +
      infoBlock(h) +
      (v.memo ? '<div class="memo">' + esc(v.memo) + '</div>' : '') +
      '<div class="foot">' +
        '<button class="small" onclick="resumeVisit(\'' + v.id + '\')">일정 복귀</button>' +
        '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
      '</div></div>';
  }).join('');
}

function renderDB() {
  var q = lc_(document.getElementById('search').value.trim());
  var list = DB.filter(function (h) {
    return !q || hit_(h.name, q) || hit_(h.addr, q);
  });

  /* 지역(시·도 → 시·군·구)으로 묶고, 그 안에서는 병원 이름 가나다순.
     주소가 없는 병원은 맨 뒤로 보낸다. (#15 · #20) */
  list.forEach(function (h) { h._rg = regionOf(h.addr); });
  list.sort(function (a, b) {
    if (a._rg.key !== b._rg.key) return a._rg.key.localeCompare(b._rg.key, 'ko');
    return a.name.localeCompare(b.name, 'ko');
  });

  paintTitle(list.length, DB.length);
  var el = document.getElementById('list');

  if (!list.length) {
    el.innerHTML = '<div class="empty">' +
      (DB.length ? '검색 결과가 없습니다.'
                 : '등록된 병원이 없습니다.<br>+ 를 눌러 추가하세요.') + '</div>';
    return;
  }

  /* 같은 지역끼리 세어서 구분줄을 올린다 */
  var cntBy = {};
  list.forEach(function (h) { cntBy[h._rg.key] = (cntBy[h._rg.key] || 0) + 1; });

  var lastRg = null;
  el.innerHTML = list.map(function (h) {
    var head = '';
    if (h._rg.key !== lastRg) {
      lastRg = h._rg.key;
      head = '<div class="rhead">' + esc(h._rg.label) +
             '<span class="cnt">' + cntBy[h._rg.key] + '곳</span></div>';
    }
    return head + '<div class="' + recCls(h) + '">' +
      '<div class="dbhead">' +
        '<h2>' + esc(h.name) + '</h2>' +
        '<button class="edit" onclick="openForm(\'' + h.id + '\')">수정</button>' +
      '</div>' +
      (h.addr ? '<div class="addr">' + esc(h.addr) + '</div>' : '') +
      samedayTag(h) + metaLine(h, { checked: true, skipStay: true }) +
      (h.memo ? '<div class="memo">' + esc(h.memo) + '</div>' : '') +
    '</div>';
  }).join('') + '<div class="ver" id="verLine" onclick="verTap()" ' +
    'oncontextmenu="forceUpdate();return false">' + APP_VER + ' · ' + VER_STATE + '</div>';
}

/* ---------- 점심시간 ---------- */
function toggleLunchNone() {
  lunchNone = !lunchNone;
  if (lunchNone) {
    document.getElementById('f_lunch_s').value = '';
    document.getElementById('f_lunch_e').value = '';
  }
  paintLunch();
}
function onLunchTime() {
  fixAfternoon_();
  if (document.getElementById('f_lunch_s').value || document.getElementById('f_lunch_e').value) {
    lunchNone = false;
  }
  paintLunch();
}
function paintLunch() {
  document.getElementById('lunchNone').className = lunchNone ? 'sel' : '';
  var now = lunchNone ? '없음' : lunchValue();
  var box = document.getElementById('lunchQuick');
  if (box) Array.prototype.forEach.call(box.children, function (b) {
    b.className = (b.textContent === now) ? 'sel' : '';
  });
}

/* 점심시간은 거의 낮 12~2시다. 빠른 단추로 고르면 오전으로 잘못 잡힐 일이 없다. */
function buildLunchQuick() {
  var box = document.getElementById('lunchQuick');
  if (!box) return;
  box.innerHTML = LUNCH_QUICK.map(function (o) {
    return '<button type="button" onclick="pickLunch(\'' + o + '\')">' + o + '</button>';
  }).join('');
}
function pickLunch(v) {
  if (lunchValue() === v && !lunchNone) { setLunch(''); return; }
  lunchNone = false; setLunch(v);
}

/* 12시 이전으로 잡힌 점심은 오전이 아니라 오후일 가능성이 훨씬 크다.
   00~06시로 들어오면 오후로 바로잡고 알려 준다. (#9) */
function fixAfternoon_() {
  var s = document.getElementById('f_lunch_s'), e = document.getElementById('f_lunch_e');
  var moved = false;
  [s, e].forEach(function (el) {
    var m = String(el.value || '').match(/^(\d{2}):(\d{2})$/);
    if (!m) return;
    var hh = Number(m[1]);
    if (hh >= 1 && hh <= 6) { el.value = ('0' + (hh + 12)).slice(-2) + ':' + m[2]; moved = true; }
  });
  if (moved) toast('점심시간을 오후로 맞췄습니다', 3000);
}
function lunchValue() {
  if (lunchNone) return '없음';
  var s = document.getElementById('f_lunch_s').value;
  var e = document.getElementById('f_lunch_e').value;
  if (!s && !e && rawLunch) return rawLunch;   /* 못 읽은 원래 글자를 지운 채로 저장하지 않는다 */
  if (s && e) return s + '-' + e;
  if (s) return s + '-';
  if (e) return '-' + e;
  return '';
}
function setLunch(v) {
  var s = document.getElementById('f_lunch_s'), e = document.getElementById('f_lunch_e');
  s.value = ''; e.value = ''; lunchNone = false; rawLunch = '';
  var txt = String(v || '').trim();

  if (txt === '없음') { lunchNone = true; paintLunch(); return; }
  if (!txt) { paintLunch(); return; }

  var p = txt.split('-');
  if (p.length === 2) {
    s.value = normTime_(p[0]);
    e.value = normTime_(p[1]);
  }
  /* 두 칸 모두 제대로 못 읽었으면 원래 글자를 지켜준다 */
  if (!s.value && !e.value) rawLunch = txt;
  paintLunch();
}
/* 'HH:MM' 으로 확실히 읽히는 것만 통과시킨다.
   '09:00~18:00' 같은 글자를 억지로 시각으로 바꾸면 엉뚱한 값이 저장된다. */
function normTime_(v) {
  var m = String(v || '').trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return '';
  var hh = Number(m[1]), mm = Number(m[2]);
  if (hh > 23 || mm > 59) return '';
  return ('0' + hh).slice(-2) + ':' + ('0' + mm).slice(-2);
}

/* ---------- 병원 폼 ---------- */
function openForm(id) {
  editId = id || null;
  var h = id ? DB.filter(function (x) { return x.id === id; })[0] : null;

  document.getElementById('formTitle').textContent = h ? '병원 수정' : '병원 추가';
  document.getElementById('f_name').value = h ? h.name : '';
  document.getElementById('f_addr').value = h ? h.addr : '';
  document.getElementById('f_memo').value = h ? h.memo : '';

  /* 발급 소요시간은 이제 단추로 고른다.
     단추에 없는 옛 글자는 지워지지 않게 그대로 지켜 둔다. (#5) */
  var waitTxt = h ? String(h.wait || '') : '';
  var known = SEG_OPTS.wait.indexOf(waitTxt) > -1;
  seg.wait = known ? waitTxt : '';
  rawWait = (waitTxt && !known) ? waitTxt : '';
  /* 시트에 '9시', '09:00~18:00' 처럼 적혀 있으면 시각칸이 못 읽는다.
     그 글자를 기억해 두었다가, 사용자가 손대지 않으면 그대로 지켜준다. */
  var openTxt = h ? String(h.open || '') : '';
  var openOk = normTime_(openTxt);
  rawOpen = (openTxt && !openOk) ? openTxt : '';
  document.getElementById('f_open').value = openOk;
  document.getElementById('f_paddr').value = h ? (h.pAddr || '') : '';
  stayWait = h ? !!h.stay : false;
  paintStay();

  var lunchTxt = h ? String(h.lunch || '') : '';
  rawLunch = '';
  seg.sameday = h ? h.sameday : '';
  seg.prereq  = h ? h.prereq : '';
  seg.parking = h ? h.parking : '';
  buildSeg('sameday'); buildSeg('prereq'); buildSeg('parking'); buildSeg('wait');
  buildLunchQuick();
  paintParkAddr();
  setLunch(lunchTxt);

  var rn = document.getElementById('rawNote'), warn = [];
  if (rawOpen) warn.push('진료시작 “' + esc(rawOpen) + '”');
  if (rawLunch) warn.push('점심시간 “' + esc(rawLunch) + '”');
  if (rawWait) warn.push('발급소요 “' + esc(rawWait) + '”');
  if (warn.length) {
    rn.innerHTML = warn.join(' · ') + ' 는 화면 칸이 읽지 못한 값입니다.<br>' +
                   '그대로 두면 원래 값이 유지되고, 새로 고르면 바뀝니다.';
    rn.style.display = 'block';
  } else { rn.style.display = 'none'; }

  document.getElementById('delBtn').style.display = h ? 'block' : 'none';
  openSheet('form');
}

}
function onVisitDate() {

}

function openVisitForm(id, presetHid) {
