/* 같은 날짜 그룹의 맨 뒤 순번 */
function nextOrder(date) {
  var n = 0;
  VISITS.forEach(function (x) {
    if ((x.date || '') === (date || '') && x.status !== '완료' && (x.order || 0) > n) n = x.order;
  });
  return n + 1;
}

/* 아직 서버에 저장되지 않은 카드인지 확인한다.
   저장이 끝나기 전에 완료·보류·순서변경을 누르면 엉뚱한 곳에 저장되므로 막는다. */
function pending_(id) {
  if (String(id).indexOf('tmp_') === 0) {
    toast('저장 중입니다. 잠시 후 다시 눌러 주세요.', 3000);
    return true;
  }
  return false;
}

/* 저장을 기다리지 않는다. 목록에 먼저 반영하고 서버에는 뒤에서 보낸다.
   실패하면 원래대로 되돌린다. */
function toggleSub() { subDone = !subDone; paintSub(); }
function paintSub() {
  document.getElementById('v_sub').className = subDone ? 'chkrow on' : 'chkrow';
}

function saveVisit_() {
  var name = document.getElementById('v_name').value.trim();
  if (!name) { toast('병원을 선택하세요'); return; }

  var date = dateTbd ? '' : document.getElementById('v_date').value;
  var memo = document.getElementById('v_memo').value.trim();
  if (subDone) memo = (memo ? memo + ' ' : '') + DONE_MARK;

  var editing = !!vEditId;
  var rec = null, before = null;

  if (editing) {
    rec = VISITS.filter(function (x) { return x.id === vEditId; })[0];
    if (!rec) { toast('대상을 찾지 못했습니다. 새로고침합니다.'); loadAll(true); return; }
    before = { hid: rec.hid, name: rec.name, date: rec.date, memo: rec.memo, order: rec.order };
    if ((rec.date || '') !== date) rec.order = nextOrder(date);
    rec.hid = vHid; rec.name = name; rec.date = date; rec.memo = memo;
  } else {
    rec = {
      id: 'tmp_' + Date.now(), hid: vHid, name: name,
      date: date, status: vStatus, memo: memo, order: nextOrder(date)
    };
    VISITS.push(rec);
  }

  var payload = {
    id: editing ? vEditId : null, hid: vHid, name: name,
    date: date, status: rec.status, memo: memo
  };

  closeSheet('visitForm');
  touch_();
  toast(editing ? '수정됨' : '등록됨');

  srv().then(function (newId) {
        if (!editing && newId) { rec.id = newId; touch_(); }
        loadAll(true);
      })
      .err(function (e) {
        if (editing) {
          rec.hid = before.hid; rec.name = before.name;
          rec.date = before.date; rec.memo = before.memo; rec.order = before.order;
        } else {
          VISITS = VISITS.filter(function (x) { return x.id !== rec.id; });
        }
        touch_();
        toast('저장 실패 · 되돌렸습니다: ' + e.message, 5600);
        loadAll(true);
      })
      .saveVisit(payload);
}

/* 상태 변경: 화면을 먼저 바꾸고 서버에는 뒤에서 알린다 */
function setStatusOptimistic(id, next, okMsg) {
  if (pending_(id)) return;
  var v = null;
  for (var i = 0; i < VISITS.length; i++) {
    if (VISITS[i].id === id) { v = VISITS[i]; break; }
  }
  if (!v) return;

  var prev = v.status;
  v.status = next;
  touch_();

  srv().then(function () { toast(okMsg); })
       .err(function (e) {
         v.status = prev; touch_();
         toast('실패 · 되돌렸습니다: ' + e.message, 5200);
         loadAll(true);          /* 서버가 실제로는 바뀌었을 수도 있으니 다시 맞춘다 */
       })
       .setStatus(id, next);
}

/* 같은 날짜 안에서 방문 순서를 한 칸 옮긴다 */
function moveVisit(id, dir) {
  if (pending_(id)) return;
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var group = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  group.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var i = group.indexOf(v), j = i + dir;
  if (i < 0 || j < 0 || j >= group.length) return;

  group[i] = group[j];
  group[j] = v;
  group.forEach(function (x, k) { x.order = k + 1; });
  touch_();

  var ids = group.map(function (x) { return x.id; });
  if (ids.join(',').indexOf('tmp_') > -1) {
    /* 저장 중인 카드가 섞여 있으면 서버에 못 보낸다. 곧 새로고침되면서
       화면이 되돌아가므로, 조용히 넘어가지 말고 알려준다. */
    toast('저장 중인 일정이 있어 순서가 아직 반영되지 않습니다. 잠시 후 다시 눌러 주세요.', 5200);
    return;
  }
  srv().err(function (e) { toast('순서 저장 실패 · 새로고침합니다: ' + e.message, 5200); loadAll(true); })
       .reorder(ids);
}

function holdVisit(id) { setStatusOptimistic(id, '보류', '보류로 이동'); }

/* 접수만 하고 온 경우: 메모에 표시를 남기고 보류로 넘긴다.
   다음에 일정으로 되돌리면 수령 한 번만 잡힌다. */
function submitAndHold(id) {
  if (pending_(id)) return;
  var v = null;
  for (var i = 0; i < VISITS.length; i++) if (VISITS[i].id === id) { v = VISITS[i]; break; }
  if (!v) return;

  var before = { memo: v.memo, status: v.status };
  if (!isSubmitted(v)) v.memo = (v.memo ? v.memo + ' ' : '') + DONE_MARK;
  v.status = '보류';
  touch_();
  toast('접수함으로 표시하고 보류로 옮겼습니다', 3600);

  srv().then(function () { loadAll(true); })
       .err(function (e) {
         v.memo = before.memo; v.status = before.status; touch_();
         toast('실패 · 되돌렸습니다: ' + e.message, 5200);
         loadAll(true);
       })
       .saveVisit({ id: id, hid: v.hid, name: v.name, date: v.date,
                    status: '보류', memo: v.memo });
}
function doneVisit(id) { setStatusOptimistic(id, '완료', '완료 처리됨'); }
function undoVisit(id) { setStatusOptimistic(id, '예정', '예정으로 되돌림'); }

function resumeVisit(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (v && !v.date) {
    toast('재방문일을 먼저 지정하세요');
    openVisitForm(id);
    return;
  }
  setStatusOptimistic(id, '예정', '방문일정으로 복귀');
}

function delVisit_() {
  if (!vEditId || pending_(vEditId)) return;
  if (!confirm('이 방문 일정을 삭제할까요?')) return;
  var id = vEditId;
  closeSheet('visitForm');
  VISITS = VISITS.filter(function (x) { return x.id !== id; });
  touch_();
  toast('삭제됨');
  srv().then(function () { loadAll(true); })
       .err(function (e) { toast('삭제 실패 · ' + e.message, 5600); loadAll(true); })
       .delVisit(id);
}


/* ==================================================================
   동선 — 오늘 방문할 병원을 어떤 순서로 도는 게 빠른지 계산한다.

   병원마다 상태가 셋: 미방문 → 접수됨 → 완료
   사전신청이 되는 곳은 미리 신청해 두므로 한 번만 들르면 되고,
   안 되는 곳은 접수하고 서류가 나올 때까지 기다렸다 수령해야 한다.
   그 사이에 다른 병원을 도는 게 이득인지까지 같이 따진다.
   ================================================================== */

var STOP_MIN = 10;          /* 병원 한 번 들르면 쓰는 시간 */
var DEFAULT_WAIT = 30;      /* 발급소요를 안 적어 둔 병원의 가정값 */
/* 서류 발급이 가능한 마지막 시각. 이 시각을 넘기는 일정은 짜지 않는다. */
var DAY_END = 17 * 60 + 30;
/* 방문 메모에 이 말이 있으면 접수는 끝난 것으로 보고 수령만 잡는다 */
var DONE_MARK = '[접수완료]';
var PLAN_MAX = 12;          /* 서버가 한 번에 받아 주는 지점 수와 맞춘다 */
var PLAN_EXACT = 8;         /* 여기까지는 최적을 찾고, 넘으면 간단한 방법으로 */

var MYLOC = null;           /* 출발 {lat, lng, label} */
var MYEND = null;           /* 도착 {lat, lng, label, kind} */
var PLAN_MODE = 'time';     /* 'time' 빨리 끝내기 / 'dist' 적게 움직이기 */
/* 집·사무실 주소는 이 기기에만 저장한다 (시트에 올리지 않는다) */
var SPOT_KEY = { home: 'hdb_home', office: 'hdb_office' };
var SPOT_NAME = { home: '집', office: '사무실' };

function spotGet(kind) {
  try { var v = localStorage.getItem(SPOT_KEY[kind]); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function spotSet(kind, obj) {
  try { localStorage.setItem(SPOT_KEY[kind], JSON.stringify(obj)); } catch (e) {}
}
try { PLAN_MODE = localStorage.getItem('hdb_mode') || 'time'; } catch (e) {}
var PLAN = null;            /* 계산 결과 */
var PINS = { date: '', ids: [] };   /* '먼저 가기'로 못 박은 방문 id, 누른 차례대로 */

var PLAN_KEY = 'hdb_plan', PIN_KEY = 'hdb_pins', LOC_KEY = 'hdb_loc', END_KEY = 'hdb_end';

/* 짠 동선을 이 기기에 남겨 둔다. 앱을 껐다 켜도 그대로 보인다. (#4) */
function planSave() {
  try {
    if (PLAN && !PLAN.err) localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN));
    else localStorage.removeItem(PLAN_KEY);
    localStorage.setItem(PIN_KEY, JSON.stringify(PINS));
    if (MYLOC && MYLOC.kind === 'addr') localStorage.setItem(LOC_KEY, JSON.stringify(MYLOC));
    else localStorage.removeItem(LOC_KEY);
    if (MYEND) localStorage.setItem(END_KEY, JSON.stringify(MYEND));
    else localStorage.removeItem(END_KEY);
  } catch (e) {}
}

function planRestore() {
  var td = todayStr();
  try {
    var e = localStorage.getItem(END_KEY); if (e) MYEND = JSON.parse(e);
    /* 현재 위치는 시간이 지나면 틀리므로 주소로 넣은 것만 되살린다 */
    var l = localStorage.getItem(LOC_KEY); if (l) MYLOC = JSON.parse(l);
    var pn = localStorage.getItem(PIN_KEY);
    if (pn) { var o = JSON.parse(pn); if (o && o.date && o.date >= td) PINS = o; }
    var p = localStorage.getItem(PLAN_KEY);
    if (!p) return;
    var dd = JSON.parse(p);
    /* 지난 날짜 계획은 버린다. 어제 짠 길이 오늘 뜨면 더 헷갈린다. */
    if (!dd || !dd.date || dd.date < td) { localStorage.removeItem(PLAN_KEY); return; }
    PLAN = dd;
  } catch (e) {}
}

function pinList_(date) { return (PINS.date === date) ? (PINS.ids || []) : []; }
function pinAt_(date, id) { return pinList_(date).indexOf(id); }

/* 카드의 '먼저 가기'. 누르면 앞으로 오고, 다시 누르면 고정이 풀린다. */
function pinFirst(vid) {
  if (!PLAN || PLAN.err) return;
  var ids = pinList_(PLAN.date).slice();
  var at = ids.indexOf(vid);
  if (at > -1) ids.splice(at, 1);
  else ids.push(vid);
  repin_(ids);
}
function clearPins() {
  if (!PLAN || PLAN.err) return;
  repin_([]);
}

/* 고정한 순서에 맞춰 나머지를 다시 잡는다.
   이동시간 표를 그대로 다시 쓰므로 서버를 부르지 않는다. */
function repin_(ids) {
  if (!PLAN || PLAN.err || !PLAN.stops || !PLAN.T) return;
  var idx = {}, i;
  for (i = 0; i < PLAN.stops.length; i++) idx[PLAN.stops[i].id] = i;
  var pins = [];
  ids.forEach(function (id) { if (idx[id] != null) pins.push(idx[id]); });

  var rt = planWithCutoff(PLAN.stops, PLAN.T, PLAN.start, PLAN_EXACT, 'time', pins);
  var rd = planWithCutoff(PLAN.stops, PLAN.T, PLAN.start, PLAN_EXACT, 'dist', pins);
  if (!rt.ok && !rd.ok) {
    toast('그 순서로는 길을 못 찾았습니다.\n고정을 풀거나 다른 곳을 먼저 잡아 보세요.', 5600);
    return;
  }
  PINS = { date: PLAN.date, ids: ids };
  PLAN.modes = { time: rt.ok ? rt : null, dist: rd.ok ? rd : null };
  PLAN.pins = pins;
  planSave(); render();
  toast(ids.length ? '고정한 순서에 맞춰 다시 잡았습니다' : '처음부터 다시 잡았습니다', 3200);
}

/* "10분 내외" -> 10 / "1시간 내외" -> 60 / "1시간 30분" -> 90 */
function parseWait(txt) {
  var t = String(txt || '').replace(/\s/g, '');
  if (!t) return null;
  /* 우편·등기는 접수만 하고 나오면 된다 */
  if (/우편|등기/.test(t)) return 10;
  /* '1시간 초과'는 넉넉히 잡는다 */
  if (/초과|이상/.test(t)) {
    var hx = t.match(/(\d+)\s*시간/);
    return hx ? Number(hx[1]) * 60 + 30 : 90;
  }
  var h = t.match(/(\d+)\s*시간/), m = t.match(/(\d+)\s*분/);
  if (!h && !m) { var only = t.match(/^(\d+)$/); return only ? Number(only[1]) : null; }
  return (h ? Number(h[1]) * 60 : 0) + (m ? Number(m[1]) : 0);
}
function hm_(t) {
  var m = String(t || '').match(/(\d{1,2}):(\d{2})/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}
function hhmm_(v) {
  v = Math.round(v);
  var nx = (v >= 1440) ? '다음날 ' : '';
  return nx + ('0' + Math.floor(v / 60) % 24).slice(-2) + ':' + ('0' + (v % 60)).slice(-2);
}
function nowMin_() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

/* 진료시작 전이면 기다리고, 점심시간에 걸리면 끝날 때까지 기다린다 */
function usable_(t, s) {
  if (s.openMin != null && t < s.openMin) t = s.openMin;
  if (s.lunchS != null && s.lunchE != null && t >= s.lunchS && t < s.lunchE) t = s.lunchE;
  return t;
}

/* 이른 시각부터 꺼내는 작은 대기줄 */
function Heap_() { this.a = []; }
Heap_.prototype.push = function (x) {
  var a = this.a, i = a.push(x) - 1;
  while (i > 0) { var p = (i - 1) >> 1; if (a[p].k <= a[i].k) break; var v = a[p]; a[p] = a[i]; a[i] = v; i = p; }
};
Heap_.prototype.pop = function () {
  var a = this.a, top = a[0], last = a.pop();
  if (a.length) {
    a[0] = last;
    for (var i = 0; ;) {
      var l = 2 * i + 1, r = l + 1, m = i;
      if (l < a.length && a[l].k < a[m].k) m = l;
      if (r < a.length && a[r].k < a[m].k) m = r;
      if (m === i) break;
      var v = a[m]; a[m] = a[i]; a[i] = v; i = m;
    }
  }
  return top;
};

/**
 * 순서를 짠다.
 *  obj : 'time' 이면 끝나는 시각을, 'dist' 면 총 주행거리를 줄인다.
 * T 는 { from, fromKm, mat, dist, to, toKm } — 도착지가 없으면 to 는 없어도 된다.
 */
function planRoute(stops, T, start, obj, pins) {
  var n = stops.length;
  pins = pins || [];
  if (!n) return { ok: false, why: 'EMPTY' };
  if (!T || !T.mat || T.mat.length < n) return { ok: false, why: 'NO_ROUTE' };
  if (!T.from || T.from.length < n) T.from = new Array(n);
  for (var q0 = 0; q0 < n; q0++) if (!T.mat[q0] || T.mat[q0].length < n) return { ok: false, why: 'NO_ROUTE' };

  var byDist = (obj === 'dist');
  var D = T.dist || [];
  var fromKm = T.fromKm || [];
  var toMin = T.to || null, toKm = T.toKm || [];

  function km_(loc, j) {                      /* loc: 0=출발지, 1..n=병원 */
    if (loc === 0) return Number(fromKm[j]) || 0;
    if (loc - 1 === j) return 0;
    return (D[loc - 1] && Number(D[loc - 1][j])) || 0;
  }

  var need = [];
  for (var i = 0; i < n; i++) {
    var sp = stops[i];
    var pre = !!(sp.submitted || (sp.prereq && sp.prereq !== '불가능'));
    var today = (sp.sameday !== '불가능');
    need.push({
      twice: (!pre && today),
      once: pre ? '수령' : '접수',
      wait: (sp.waitMin == null ? DEFAULT_WAIT : sp.waitMin),
      stay: !!sp.stay          /* 대학병원 등: 자리를 뜨지 않고 기다렸다 받는다 */
    });
  }

  var P3 = [1];
  for (var k = 1; k <= n; k++) P3[k] = P3[k - 1] * 3;
  var GOAL = P3[n] - 1;

  var best = {}, h = new Heap_(), zero = [], code0 = 0;
  for (var z = 0; z < n; z++) {
    zero.push(0);
    if (stops[z].skip) code0 += 2 * P3[z];
  }
  if (code0 === GOAL) return { ok: true, end: start, km: 0, steps: [] };
  h.push({ k: 0, t: start, d: 0, loc: 0, code: code0, ready: zero, prev: null, step: null });

  var guard = 0;
  while (h.a.length) {
    if (++guard > 400000) return { ok: false, why: 'TOO_BIG' };
    var cur = h.pop();
    var key = cur.loc + ':' + cur.code;
    if (best[key] != null && best[key] <= cur.k) continue;
    best[key] = cur.k;

    if (cur.code === GOAL) {
      var steps = [], p = cur;
      while (p && p.step) { steps.unshift(p.step); p = p.prev; }
      return { ok: true, end: cur.t, km: Math.round(cur.d * 10) / 10, steps: steps };
    }

    /* '먼저 가기'로 못 박은 곳은 그 차례가 될 때까지 다른 곳을 못 간다.
       아직 한 번도 안 들른(0) 고정 병원 중 가장 앞선 것이 다음 차례다. */
    var nextPin = -1;
    for (var pi = 0; pi < pins.length; pi++) {
      if (Math.floor(cur.code / P3[pins[pi]]) % 3 === 0) { nextPin = pins[pi]; break; }
    }

    for (var j = 0; j < n; j++) {
      if (nextPin >= 0 && j !== nextPin) continue;
      var st = Math.floor(cur.code / P3[j]) % 3;
      if (st === 2) continue;

      var move = (cur.loc === 0) ? T.from[j] : T.mat[cur.loc - 1][j];
      if (cur.loc - 1 === j) move = 0;
      if (move == null) continue;

      var arrive = usable_(cur.t + move, stops[j]);
      var kind, ns, ready = cur.ready, done;

      if (st === 0) {
        if (need[j].twice && need[j].stay) {
          /* 접수하고 그 자리에서 기다렸다 받는다 — 한 번에 끝낸다 */
          var got = usable_(arrive + need[j].wait, stops[j]);
          kind = '접수+수령'; ns = 2;
          done = got + STOP_MIN;
        } else if (need[j].twice) {
          kind = '접수'; ns = 1;
          ready = cur.ready.slice();
          ready[j] = arrive + need[j].wait;
          done = arrive + STOP_MIN;
        } else {
          kind = need[j].once; ns = 2;
          done = arrive + STOP_MIN;
        }
      } else {
        arrive = usable_(Math.max(arrive, cur.ready[j]), stops[j]);
        kind = '수령'; ns = 2;
        done = arrive + STOP_MIN;
      }

      var nd = cur.d + km_(cur.loc, j);
      var code = cur.code + (ns - st) * P3[j];
      var nt = done;

      /* 마지막 한 곳까지 끝났으면 도착지까지 돌아가는 몫도 넣는다 */
      if (code === GOAL && toMin) {
        var back = toMin[j];
        if (back != null) { nt += back; nd += Number(toKm[j]) || 0; }
      }

      /* 무엇을 줄일지에 따라 견주는 값이 달라진다 */
      var metric = byDist ? (nd + nt / 100000) : nt;

      var nk = (j + 1) + ':' + code;
      if (best[nk] != null && best[nk] <= metric) continue;

      h.push({ k: metric, t: nt, d: nd, loc: j + 1, code: code, ready: ready, prev: cur,
               step: { i: j, name: stops[j].name, kind: kind, at: arrive,
                       move: move, wait: (kind === '접수+수령' ? need[j].wait : 0) } });
    }
  }
  return { ok: false, why: 'NO_ROUTE' };
}

/**
 * 17:30 마감을 지키도록 짠다.
 * 넘치는 병원부터 '오늘은 접수만' -> '오늘 못 감' 으로 한 단계씩 미루고 다시 짠다.
 * 반환: { ok, steps, end, half:[이름], out:[이름] }
 */
function planWithCutoff(stops, T, start, exact, obj, pins) {
  pins = pins || [];
  var work = stops.map(function (s) {
    return { name: s.name, id: s.id, lat: s.lat, lng: s.lng,
             sameday: s.sameday, prereq: s.prereq, waitMin: s.waitMin,
             openMin: s.openMin, lunchS: s.lunchS, lunchE: s.lunchE,
             submitted: s.submitted, stay: s.stay, skip: false };
  });
  var half = {}, out = {};

  for (var turn = 0; turn <= stops.length * 2 + 1; turn++) {
    var alive = 0;
    for (var a = 0; a < work.length; a++) if (!work[a].skip) alive++;

    var r = alive === 0 ? { ok: true, end: start, km: 0, steps: [] }
          : (alive <= exact ? planRoute(work, T, start, obj, pins) : planGreedy(work, T, start, pins));
    if (!r.ok && r.why === 'TOO_BIG') r = planGreedy(work, T, start, pins);

    if (!r.ok) {          /* 길을 못 찾으면 마지막 한 곳을 뺀다 */
      var last = -1;
      for (var q = 0; q < work.length; q++) if (!work[q].skip) last = q;
      if (last < 0) return { ok: false, why: 'NO_ROUTE' };
      work[last].skip = true; out[work[last].name] = 1;
      continue;
    }

    /* 마감을 넘는 마지막 단계를 찾는다 */
    var bad = -1;
    for (var k = 0; k < r.steps.length; k++) {
      if (r.steps[k].at + STOP_MIN > DAY_END) bad = k;
    }
    if (bad < 0) {
      return { ok: true, steps: r.steps, end: r.end, km: r.km || 0, rough: !!r.rough,
               half: Object.keys(half), out: Object.keys(out) };
    }

    var j = r.steps[bad].i, w = work[j];
    if (r.steps[bad].kind !== '접수' && !w.submitted &&
        w.sameday !== '불가능' && !half[w.name]) {
      w.sameday = '불가능';                 /* 오늘은 접수까지만 */
      half[w.name] = 1;
    } else {
      w.skip = true;                        /* 오늘은 못 간다 */
      out[w.name] = 1;
      delete half[w.name];
    }
  }
  return { ok: false, why: 'NO_ROUTE' };
}

/* 정밀 계산이 안 될 때 쓰는 간단한 방법: 가까운 곳부터 차례로.
   최적은 아니지만 순서를 아예 못 내놓는 것보다 낫다. */
function planGreedy(stops, T, start, pins) {
  pins = pins || [];
  var n = stops.length, st = [], ready = [], steps = [], t = start, loc = 0, i, km = 0;
  var D = T.dist || [], fromKm = T.fromKm || [], toKm = T.toKm || [];
  function km_(a, b) {
    if (a === 0) return Number(fromKm[b]) || 0;
    if (a - 1 === b) return 0;
    return (D[a - 1] && Number(D[a - 1][b])) || 0;
  }
  for (i = 0; i < n; i++) { st.push(stops[i].skip ? 2 : 0); ready.push(0); }

  for (var turn = 0; turn < n * 2 + 2; turn++) {
    var done = true;
    for (i = 0; i < n; i++) if (st[i] < 2) done = false;
    if (done) {
      if (T.to && loc > 0 && T.to[loc - 1] != null) {
        t += T.to[loc - 1]; km += Number(toKm[loc - 1]) || 0;
      }
      return { ok: true, end: t, km: Math.round(km * 10) / 10, steps: steps, rough: true };
    }

    var nextPin = -1;
    for (var pi = 0; pi < pins.length; pi++) {
      if (st[pins[pi]] === 0) { nextPin = pins[pi]; break; }
    }

    var pickJ = -1, pickAt = Infinity, pickKind = '';
    for (var j = 0; j < n; j++) {
      if (nextPin >= 0 && j !== nextPin) continue;
      if (st[j] === 2) continue;
      var mv = (loc === 0) ? T.from[j] : T.mat[loc - 1][j];
      if (loc - 1 === j) mv = 0;
      if (mv == null) continue;
      var at = usable_(t + mv, stops[j]), kd;
      var pre = !!(stops[j].submitted || (stops[j].prereq && stops[j].prereq !== '불가능'));
      var today = (stops[j].sameday !== '불가능');
      if (st[j] === 1) { at = usable_(Math.max(at, ready[j]), stops[j]); kd = '수령'; }
      else kd = pre ? '수령' : '접수';
      if (at < pickAt) { pickAt = at; pickJ = j; pickKind = kd; }
    }
    if (pickJ < 0) return { ok: false, why: 'NO_ROUTE' };

    var s2 = stops[pickJ], pre2 = !!(s2.submitted || (s2.prereq && s2.prereq !== '불가능'));
    var today2 = (s2.sameday !== '불가능');
    var mv2 = (loc === 0) ? T.from[pickJ] : T.mat[loc - 1][pickJ];
    if (loc - 1 === pickJ) mv2 = 0;
    var w2 = (s2.waitMin == null ? DEFAULT_WAIT : s2.waitMin);
    km += km_(loc, pickJ);

    if (st[pickJ] === 0 && !pre2 && today2 && s2.stay) {
      /* 그 자리에서 기다렸다 받는다 */
      st[pickJ] = 2;
      pickAt = usable_(pickAt + w2, s2);
      pickKind = '접수+수령';
    } else if (st[pickJ] === 0 && !pre2 && today2) {
      st[pickJ] = 1;
      ready[pickJ] = pickAt + w2;
    } else st[pickJ] = 2;

    steps.push({ i: pickJ, name: s2.name, kind: pickKind, at: pickAt, move: mv2,
                 wait: (pickKind === '접수+수령' ? w2 : 0) });
    t = pickAt + STOP_MIN;
    loc = pickJ + 1;
  }
  return { ok: false, why: 'NO_ROUTE' };
}


/* ---------- 동선 화면 ---------- */

/* 그 날 가야 할 곳 (완료·보류 제외) */
function stopsOf(date) {
  return visitsOf('visit').filter(function (v) {
    return (v.date || '') === date && v.status !== '완료';
  }).sort(cmpVisit_);
}
/* 오늘·앞으로의 날짜만 동선을 짤 수 있다 */
function planDay_(date) { return !!date && date >= todayStr(); }
function cmpVisit_(a, b) {
  var x = a.order || 9999, y = b.order || 9999;
  if (x !== y) return x - y;
  return a.name.localeCompare(b.name, 'ko');
}

/* 길 안내에 쓸 지점. 주차가 '인근'이면 주차장 좌표를 쓴다. */
function pointOf(h) {
  if (!h) return null;
  if (h.parking === '인근') return hasParkPoint(h) ? { lat: h.pLat, lng: h.pLng } : null;
  return (h.lat && h.lng) ? { lat: h.lat, lng: h.lng } : null;
}

/* 날짜 묶음 위에 붙는 출발지 + 계산 버튼 */
function planBar(date) {
  var mine = (PLAN && !PLAN.err && PLAN.date === date);
  var endKind = MYEND ? MYEND.kind : '';

  /* 지난번에 쓴 출발 주소를 미리 채워 둔다. 매일 같은 곳에서 나가면 칠 일이 없다. */
  var preAddr = (MYLOC && MYLOC.kind === 'addr') ? MYLOC.label : (lastAddrGet() || '');
  var openAddr = (!MYLOC && !!preAddr);

  return '<div class="planbar">' +
    '<div class="locline">' +
      '<span class="tag">출발</span>' +
      '<button class="sub' + (MYLOC && MYLOC.kind === 'gps' ? ' on' : '') +
        '" onclick="useGps()">📍 현재 위치</button>' +
      '<button class="sub' + (MYLOC && MYLOC.kind === 'addr' ? ' on' : '') +
        '" onclick="toggleAddr()">주소</button>' +
    '</div>' +
    '<div id="addrBox"' + (openAddr ? ' style="display:block"' : '') + '>' +
      '<div class="arow">' +
      '<input type="text" id="p_addr" placeholder="출발 주소 (예: 의정부시 신흥로 145)" ' +
             'enterkeyhint="search" value="' + esc(preAddr) + '" ' +
             'onkeydown="if(event.key===\'Enter\'){event.preventDefault();useAddr();}">' +
      '<button type="button" class="find" onclick="useAddr()">찾기</button>' +
      '</div></div>' +

    '<div class="locline">' +
      '<span class="tag">도착</span>' +
      '<button class="sub' + (endKind === 'home' ? ' on' : '') + '" onclick="useSpot(\'home\')">집</button>' +
      '<button class="sub' + (endKind === 'office' ? ' on' : '') + '" onclick="useSpot(\'office\')">사무실</button>' +
      '<button class="sub' + (endKind === 'custom' ? ' on' : '') + '" onclick="toggleEnd()">직접</button>' +
    '</div>' +
    '<div id="endBox">' +
      '<div class="arow">' +
      '<input type="text" id="p_end" placeholder="도착 주소" ' +
             'enterkeyhint="search" ' +
             'onkeydown="if(event.key===\'Enter\'){event.preventDefault();useEndAddr();}">' +
      '<button type="button" class="find" onclick="useEndAddr()">찾기</button>' +
      '</div></div>' +

    '<div class="locnow">' +
      (MYLOC ? '출발 <b>' + esc(MYLOC.label) + '</b>' +
               (MYLOC.found && MYLOC.found !== MYLOC.label
                  ? ' <span class="found">→ ' + esc(MYLOC.found) + '</span>' : '')
             : '출발지를 정하세요') +
      ' &nbsp;→&nbsp; ' +
      (MYEND ? '도착 <b>' + esc(MYEND.label) + '</b>' +
               (MYEND.found && MYEND.found !== MYEND.label
                  ? ' <span class="found">→ ' + esc(MYEND.found) + '</span>' : '')
             : '도착지를 정하세요') +
    '</div>' +
    '<button class="calcbtn" onclick="calcPlan(\'' + date + '\')">' +
      (mine ? '다시 계산' : '동선 계산') + '</button>' +
  '</div>';
}

/* 계산된 순서를 아직 쓸 수 있는지.
   완료된 곳이 빠지는 건 괜찮다. 계산할 때 없던 병원이 늘어난 경우만 다시 계산한다.
   (좌표가 없어 계산에서 빠진 병원도 '본' 것이므로 다시 계산할 이유가 아니다) */
function curPlan() {
  if (!PLAN || PLAN.err || !PLAN.modes) return null;
  return PLAN.modes[PLAN_MODE] || PLAN.modes.time || PLAN.modes.dist || null;
}

function planUsable(date) {
  if (!PLAN || PLAN.err || !curPlan()) return false;
  if (PLAN.date !== date) return false;
  var seen = PLAN.seen || {};
  var todo = stopsOf(date);
  if (!todo.length) return false;
  for (var i = 0; i < todo.length; i++) if (!seen[todo[i].id]) return false;
  return true;
}

/* 오늘 묶음을 계산된 순서로 그린다 */
/* 두 방식을 견주는 카드 */
function modeCard() {
  var A = PLAN.modes.dist, B = PLAN.modes.time;
  function line(m, key, label) {
    if (!m) return '';
    var cnt = 0, seen = {};
    m.steps.forEach(function (st) { if (!seen[st.i]) { seen[st.i] = 1; cnt++; } });
    var later = (m.out || []).length;
    return '<button class="modebtn' + (PLAN_MODE === key ? ' on' : '') +
      '" onclick="setMode(\'' + key + '\')">' +
      '<span class="nm">' + label + '</span>' +
      '<span class="val">' + (m.km ? m.km + 'km' : '-') +
        ' · ' + dur_(m.end - PLAN.start) +
        (later ? ' · ' + later + '곳 내일' : '') + '</span></button>';
  }
  if (!A && !B) return '';
  return '<div class="modebox">' + line(A, 'dist', '최단거리') + line(B, 'time', '최단시간') + '</div>';
}

function planBody(date) {
  var cur = curPlan();
  if (!cur) return '';
  var live = {};
  stopsOf(date).forEach(function (v) { live[v.id] = v; });

  /* 아직 안 끝난 단계만 남긴다 */
  var steps = cur.steps.filter(function (st) { return !!live[PLAN.stops[st.i].id]; });

  /* 제자리에서 기다렸다 받는 경우는 한 장으로 묶는다 */
  var rows = [];
  for (var k = 0; k < steps.length; k++) {
    var st = steps[k];
    if (k + 1 < steps.length && steps[k + 1].i === st.i) {
      rows.push({ i: st.i, kind: '접수+수령', wait: steps[k + 1].at - st.at, again: false });
      k++;
      continue;
    }
    var seenBefore = false;
    for (var q = 0; q < k; q++) if (steps[q].i === st.i) seenBefore = true;
    /* 대학병원처럼 계산에서 이미 한 번으로 묶인 경우는 대기시간이 단계에 실려 온다 */
    rows.push({ i: st.i, kind: st.kind, wait: st.wait || 0,
                again: seenBefore, next: null });
  }
  /* 접수만 하고 나중에 받는 경우, 몇 번째에 다시 오는지 */
  rows.forEach(function (r, idx) {
    if (r.kind !== '접수') return;
    for (var q = idx + 1; q < rows.length; q++) if (rows[q].i === r.i) { r.next = q + 1; break; }
  });

  var out = modeCard();

  /* 고정해 둔 곳이 있으면 맨 위에 알린다 */
  var pn = pinList_(date);
  if (pn.length) {
    var nm = pn.map(function (id) {
      var vv = live[id];
      if (vv) return vv.name;
      var st0 = null;
      PLAN.stops.forEach(function (x) { if (x.id === id) st0 = x; });
      return st0 ? st0.name : '?';
    });
    out += '<div class="pinbar"><span class="who">📌 먼저 가기 · ' +
           esc(nm.join(' → ')) + '</span>' +
           '<button onclick="clearPins()">처음부터 다시</button></div>';
  }

  /* 출발 전에 사전신청해 둘 곳 */
  var pre = [];
  rows.forEach(function (r) {
    var stop = PLAN.stops[r.i], h = findHospital(live[stop.id]);
    if (!stop.submitted && h && h.prereq && h.prereq !== '불가능') {
      pre.push(stop.name + '(' + h.prereq + ')');
    }
  });
  if (pre.length) {
    out += '<div class="prebox"><b>출발 전 사전신청</b><br>' + esc(pre.join(' · ')) + '</div>';
  }

  if (!rows.length && !(cur.out && cur.out.length)) return '';

  var half = {}; (cur.half || []).forEach(function (n) { half[n] = 1; });

  rows.forEach(function (r, idx) {
    var stop = PLAN.stops[r.i], v = live[stop.id], h = findHospital(v);
    var cls = r.kind === '수령' ? 'get' : (r.kind === '접수' ? 'put' : 'both');

    out += '<div class="' + recCls(h, 'planrec') + '">' +
      '<div class="ordhead">' +
        '<span class="ordnum">' + (idx + 1) + '</span>' +
        '<h2>' + (r.again ? '↩ ' : '') + esc(v.name) +
          (pinAt_(date, v.id) > -1 ? '<span class="pinmark">📌</span>' : '') + '</h2>' +
        '<span class="kd ' + cls + '">' + r.kind + '</span>' +
      '</div>' +
      infoBlock(h);

    var memo = plainMemo(v);
    if (memo) out += '<div class="memo">' + esc(memo) + '</div>';

    /* 왜 이렇게 도는지 한 줄로 설명 */
    if (r.kind === '수령' && stop.submitted) {
      out += '<div class="whyline">지난번 접수해 둠 · 받기만 하면 됩니다</div>';
    } else if (r.kind === '수령' && !r.again && h && h.prereq && h.prereq !== '불가능') {
      out += '<div class="whyline">사전신청(' + esc(h.prereq) + ') 해두고 방문</div>';
    } else if (r.kind === '접수+수령') {
      out += '<div class="whyline stay">여기서 기다렸다 받습니다' +
             (r.wait > 0 ? ' · 약 ' + dur_(r.wait) : '') + '</div>';
    } else if (r.kind === '접수' && r.next) {
      out += '<div class="whyline">' + r.next + '번에서 다시 와 받습니다</div>';
    } else if (r.kind === '접수' && half[v.name]) {
      out += '<div class="whyline warn">오늘은 접수까지만 · 수령은 다음에</div>';
    }

    /* 오늘 받을 수 없는 곳은 '완료' 대신 '접수함' 을 준다.
       누르면 접수한 것으로 표시하고 보류로 넘긴다. 다음에 수령만 잡힌다. */
    /* 길찾기 두 가지 + 먼저 가기 (#1 · #2) */
    var pAt = pinAt_(date, v.id);
    out += '<div class="navrow">' +
      '<button class="route" onclick="routeOne(\'' + v.id + '\')">🚩 길찾기</button>' +
      (idx > 0 ? '<button class="route" onclick="routePlan(\'' + v.id + '\')">🚩 여기까지</button>' : '') +
      /* 다시 들르는 줄(↩)에는 붙이지 않는다. 고정은 '처음 가는 차례'를 정하는 것이라서. */
      (r.again ? '' :
        '<button class="pinbtn' + (pAt > -1 ? ' on' : '') + '" onclick="pinFirst(\'' + v.id + '\')">' +
          (pAt > -1 ? '📌 해제' : '📌 먼저') + '</button>') +
    '</div>';

    var halfOnly = (r.kind === '접수' && !r.next);
    out += '<div class="foot">' +
      (r.kind === '접수' && r.next ? ''
        : halfOnly
          ? '<button class="small" onclick="submitAndHold(\'' + v.id + '\')">접수함</button>'
          : '<button class="small" onclick="doneVisit(\'' + v.id + '\')">완료</button>') +
      '<button class="hold small" onclick="holdVisit(\'' + v.id + '\')">보류</button>' +
      '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
    '</div></div>';
  });

  if (rows.length) {
    out += '<div class="planend">총 ' + dur_(cur.end - PLAN.start) + ' 걸립니다</div>';
    out += '<button class="route wide" onclick="routePlan()">🚩 남은 곳 전체 길찾기</button>';
  }

  /* 오늘 못 가는 곳 */
  var outNames = {}; (cur.out || []).forEach(function (n) { outNames[n] = 1; });
  var inPlan = {};
  PLAN.stops.forEach(function (st) { inPlan[st.id] = 1; });

  var later = '';
  stopsOf(date).forEach(function (v) {
    var shown = rows.some(function (r) { return PLAN.stops[r.i].id === v.id; });
    if (shown) return;
    var h2 = findHospital(v);
    var why = outNames[v.name] ? '17:30 안에 못 감'
            : (!inPlan[v.id] ? '좌표 없음' : '');
    later += '<div class="' + recCls(h2) + '">' +
      '<div class="ordhead"><h2>' + esc(v.name) + '</h2>' +
        (why ? '<span class="kd warn">' + why + '</span>' : '') + '</div>' +
      infoBlock(h2) +
      (plainMemo(v) ? '<div class="memo">' + esc(plainMemo(v)) + '</div>' : '') +
      '<div class="foot">' +
        '<button class="small" onclick="doneVisit(\'' + v.id + '\')">완료</button>' +
        '<button class="hold small" onclick="holdVisit(\'' + v.id + '\')">보류</button>' +
        '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
      '</div></div>';
  });
  if (later) out += '<div class="planend">오늘 순서에 못 넣은 곳</div>' + later;

  var note = [];
  if (cur.half && cur.half.length) note.push('오늘은 접수까지만: ' + esc(cur.half.join(', ')));
  if (cur.out && cur.out.length) note.push(hhmm_(DAY_END) + ' 안에 못 가는 곳: ' + esc(cur.out.join(', ')));
  if (cur.rough) note.push('병원이 ' + PLAN_EXACT + '곳을 넘어 간단한 방법으로 잡았습니다.');
  if (PLAN.skipped.length) note.push('제외: ' + esc(PLAN.skipped.join(', ')));
  if (PLAN.guessed.length) note.push('발급소요 미입력이라 ' + DEFAULT_WAIT + '분으로 잡음: ' + esc(PLAN.guessed.join(', ')));
  if (PLAN.miss) note.push('이동시간을 못 구한 구간 ' + PLAN.miss + '개는 빼고 계산했습니다.');
  if (PLAN.saveErr) note.push('이동시간을 저장하지 못했습니다(' + esc(PLAN.saveErr) + ').');
  if (PLAN.at != null) note.push(hhmm_(PLAN.at) + ' 에 짠 순서입니다. 시간이 많이 지났으면 다시 계산하세요.');
  note.push('병원 체류는 ' + STOP_MIN + '분, 서류 발급 마감은 ' + hhmm_(DAY_END) + '로 잡았습니다.');
  out += '<div class="plannote">· ' + note.join('<br>· ') + '</div>';
  return out;
}

/* 분 -> "1시간 20분" */
function dur_(m) {
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m / 60), r = m % 60;
  if (h && r) return h + '시간 ' + r + '분';
  if (h) return h + '시간';
  return r + '분';
}

/* ---------- 출발 위치 ---------- */
function toggleAddr() {
  var b = document.getElementById('addrBox');
  b.style.display = (b.style.display === 'block') ? 'none' : 'block';
  if (b.style.display === 'block') document.getElementById('p_addr').focus();
}
function toggleEnd() {
  var b = document.getElementById('endBox');
  b.style.display = (b.style.display === 'block') ? 'none' : 'block';
  if (b.style.display === 'block') document.getElementById('p_end').focus();
}

/* 집·사무실. 저장된 게 없으면 물어보고 이 기기에 기억한다. */
function useSpot(kind) {
  var saved = spotGet(kind);
  if (saved && !(MYEND && MYEND.kind === kind)) {
    MYEND = { lat: saved.lat, lng: saved.lng, label: SPOT_NAME[kind], kind: kind };
    PLAN = null; planSave(); render();
    return;
  }
  var msg = saved ? (SPOT_NAME[kind] + ' 주소를 바꿀까요?\n지금: ' + saved.addr)
                  : (SPOT_NAME[kind] + ' 주소를 입력하세요');
  var q = prompt(msg, saved ? saved.addr : '');
  if (q == null) return;
  q = q.trim();
  if (!q) return;

  toast('주소 찾는 중…');
  srv().then(function (r) {
      spotSet(kind, { addr: q, lat: r.lat, lng: r.lng });
      MYEND = { lat: r.lat, lng: r.lng, label: SPOT_NAME[kind], kind: kind };
      PLAN = null; planSave(); render();
      toast(SPOT_NAME[kind] + ' 주소를 저장했습니다', 3600);
    })
    .err(function (e) { toast(e.message, 5200); })
    .geo(q);
}

function useEndAddr() {
  var q = document.getElementById('p_end').value.trim();
  if (!q) { toast('도착 주소를 입력하세요'); return; }
  toast('주소 찾는 중…');
  srv().then(function (r) {
      MYEND = { lat: r.lat, lng: r.lng, label: q, found: r.addr || '', kind: 'custom' };
      PLAN = null; planSave(); render(); toast('도착지 · ' + (r.addr || q), 4200);
    })
    .err(function (e) { toast(e.message, 5200); })
    .geo(q);
}

/* 무엇을 줄일지 고른다 */
function setMode(m) {
  PLAN_MODE = m;
  try { localStorage.setItem('hdb_mode', m); } catch (e) {}
  render();
}

function useGps() {
  if (!navigator.geolocation) { toast('이 기기에서는 현재 위치를 쓸 수 없습니다.', 4200); return; }
  toast('현재 위치 확인 중…');
  navigator.geolocation.getCurrentPosition(function (p) {
    MYLOC = { lat: p.coords.latitude, lng: p.coords.longitude, label: '현재 위치', kind: 'gps' };
    PLAN = null; planSave(); render(); toast('현재 위치를 잡았습니다. 이제 동선 계산을 누르세요.', 4000);
  }, function (e) {
    toast('위치를 못 잡았습니다 · ' + (e.code === 1 ? '위치 권한을 허용해 주세요' : e.message), 5600);
  }, { enableHighAccuracy: true, timeout: 12000 });
}

function lastAddrGet() {
  try { return localStorage.getItem('hdb_lastaddr') || ''; } catch (e) { return ''; }
}

/* next 를 주면 주소를 찾은 뒤 이어서 그 일을 한다 (동선 계산에서 쓴다) */
function useAddr(next) {
  var box = document.getElementById('p_addr');
  var q = box ? box.value.trim() : '';
  if (!q) {
    toast('출발 주소를 입력한 뒤 찾기 를 눌러 주세요', 4200);
    var b = document.getElementById('addrBox');
    if (b) { b.style.display = 'block'; if (box) box.focus(); }
    return;
  }
  toast('주소 찾는 중…');
  srv().then(function (r) {
      MYLOC = { lat: r.lat, lng: r.lng, label: q, found: r.addr || '', kind: 'addr' };
      try { localStorage.setItem('hdb_lastaddr', q); } catch (e) {}
      PLAN = null; planSave(); render();
      if (typeof next === 'function') { next(); return; }
      toast('출발지 · ' + (r.addr || q) + '\n맞으면 동선 계산을 누르세요.', 5200);
    })
    .err(function (e) { toast('출발 주소를 못 찾았습니다 · ' + e.message +
                              '\n시·군까지 넣어 보세요 (예: 의정부시 신흥로 145)', 6000); })
    .geo(q);
}

/* ---------- 계산 ---------- */
function calcPlan(date) {
  date = date || todayStr();
  if (!MYLOC) {
    /* 주소를 쳐 놓고 찾기를 안 눌렀으면, 여기서 대신 찾아 주고 이어서 계산한다 */
    var ai = document.getElementById('p_addr');
    var typed = ai ? ai.value.trim() : '';
    if (typed) { useAddr(function () { calcPlan(date); }); return; }
    toast('출발지를 먼저 정하세요.\n📍현재 위치 를 누르거나, 주소를 넣고 찾기 를 누르세요.', 5600);
    return;
  }
  if (!MYEND) { toast('도착지를 정하세요 (집 · 사무실 · 직접)', 4600); return; }

  var list = stopsOf(date);
  if (!list.length) { toast('그 날 갈 병원이 없습니다.', 4000); return; }

  var stops = [], skipped = [], guessed = [], pts = [];

  for (var i = 0; i < list.length; i++) {
    var h = findHospital(list[i]);
    var pt = pointOf(h);
    if (!pt) {
      skipped.push(list[i].name +
        (h && h.parking === '인근' ? ' (주차장 주소 없음)' : ' (좌표 없음)'));
      continue;
    }
    var w = parseWait(h.wait);
    if (w == null && (!h.prereq || h.prereq === '불가능') && h.sameday !== '불가능') {
      guessed.push(list[i].name);
    }
    /* 점심시간은 적어 둔 곳만 반영한다. 비어 있으면 쉬지 않는 것으로 본다. */
    var lu = String(h.lunch || '').trim();
    if (lu === '없음') lu = '';

    pts.push(pt);
    stops.push({
      name: list[i].name, id: list[i].id, lat: pt.lat, lng: pt.lng,
      submitted: isSubmitted(list[i]),
      /* 병원DB에서 '접수 후 기다렸다 수령'으로 표시해 둔 곳 */
      stay: !!h.stay,
      sameday: h.sameday, prereq: h.prereq, waitMin: w,
      openMin: hm_(h.open),
      lunchS: hm_(lu.split('-')[0]),
      lunchE: hm_(lu.split('-')[1])
    });
  }

  if (!stops.length) {
    PLAN = { date: date, err: '순서를 짤 수 있는 병원이 없습니다.\n' + skipped.join('\n') };
    render(); return;
  }
  if (stops.length > PLAN_MAX) {
    PLAN = { date: date, err: '한 번에 ' + PLAN_MAX + '곳까지만 계산할 수 있습니다. (지금 ' + stops.length + '곳)' };
    render(); return;
  }

  toast('실제 이동시간 확인 중… 처음 계산은 조금 걸립니다', 20000);

  var ptStr = pts.map(function (p) { return p.lat + ',' + p.lng; }).join(';');
  srv().then(function (T) {
      /* 오늘이면 지금 시각부터, 앞날이면 아침 9시부터로 잡는다 */
      var start = (date === todayStr()) ? nowMin_() : 9 * 60;
      /* 한 번 받아온 표로 두 가지를 다 계산한다. 서버는 더 부르지 않는다. */
      /* 고정해 둔 곳이 아직 그 날 목록에 있으면 그 순서를 지킨다 (#1) */
      var idx0 = {}, pins = [];
      stops.forEach(function (sp, si) { idx0[sp.id] = si; });
      pinList_(date).forEach(function (id) { if (idx0[id] != null) pins.push(idx0[id]); });

      var rt = planWithCutoff(stops, T, start, PLAN_EXACT, 'time', pins);
      var rd = planWithCutoff(stops, T, start, PLAN_EXACT, 'dist', pins);
      var r = rt.ok ? rt : rd;
      if (!r.ok) {
        PLAN = { date: date, err: (start >= DAY_END)
          ? ('서류 발급 마감(' + hhmm_(DAY_END) + ')이 지났습니다.\n내일 일정으로 옮기세요.')
          : '이동시간을 구하지 못해 순서를 짜지 못했습니다.\n잠시 후 다시 시도해 주세요.' };
      } else {
        var seen = {};
        list.forEach(function (v) { seen[v.id] = 1; });
        PLAN = { date: date, start: start, stops: stops, seen: seen,
                 modes: { time: rt.ok ? rt : null, dist: rd.ok ? rd : null },
                 skipped: skipped, guessed: guessed, pins: pins,
                 /* 표를 들고 있으면 순서를 바꿔도 서버를 다시 안 불러도 된다 */
                 T: { from: T.from, fromKm: T.fromKm, mat: T.mat,
                      dist: T.dist, to: T.to, toKm: T.toKm },
                 at: nowMin_(),
                 miss: T.miss || 0, saveErr: T.saveErr || '' };
      }
      toast(r.ok ? '동선을 짰습니다' : '계산 실패', 3000);
      planSave(); render();
    })
    .err(function (e) { toast('이동시간을 받지 못했습니다 · ' + e.message, 6000); })
    .times(ptStr, MYLOC.lat + ',' + MYLOC.lng, MYEND.lat + ',' + MYEND.lng);
}

/* 계산된 순서를 네이버 지도로 넘긴다 (같은 병원 두 번은 한 번만) */
function routePlan(untilId) {
  var cur = curPlan();
  if (!cur) return;

  /* 이미 완료·보류한 병원은 빼고 보낸다 */
  var live = {};
  stopsOf(PLAN.date).forEach(function (v) { live[v.id] = 1; });

  var seen = {}, list = [], dropped = 0;
  for (var i = 0; i < cur.steps.length; i++) {
    var st = cur.steps[i], stop = PLAN.stops[st.i];
    if (seen[st.i] || !live[stop.id]) continue;
    seen[st.i] = 1;
    if (list.length >= NAV_MAX_STOPS) { dropped++; continue; }
    list.push(stop);
    if (untilId && stop.id === untilId) { dropped = 0; break; }
  }
  if (!list.length) { toast('남은 병원이 없습니다.', 3500); return; }

  var d = list[list.length - 1];
  var u = 'nmap://route/car?dlat=' + d.lat + '&dlng=' + d.lng +
          '&dname=' + encodeURIComponent(d.name);
  for (var k = 0; k < list.length - 1; k++) {
    var n = k + 1;
    u += '&v' + n + 'lat=' + list[k].lat + '&v' + n + 'lng=' + list[k].lng +
         '&v' + n + 'name=' + encodeURIComponent(list[k].name);
  }
  u += '&appname=phurom0103-coder.github.io';

  if (dropped) {
    toast(NAV_MAX_STOPS + '곳까지만 지도로 보냅니다. ' + dropped + '곳은 빠졌습니다.', 5200);
  }
  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---------- 주유소 · LPG충전소 (오피넷) ---------- */
var FUEL_KINDS = [['lpg', 'LPG'], ['gas', '휘발유'], ['diesel', '경유']];
var FUEL_KIND = 'lpg';
var GAS_MODE = 'route';      /* route = 동선 따라 · near = 내 주변 */
var GAS = null, GAS_PTS = null, GAS_NAMES = [], GAS_AT = null, GAS_BUSY = false;

try { var _fk = localStorage.getItem('hdb_fuel'); if (_fk) FUEL_KIND = _fk; } catch (e) {}

/* 짜 놓은 동선을 [출발지, 병원, 병원, ..., 도착지] 로 편다.
   아직 안 짰으면 그 날 등록한 순서대로라도 쓴다. */
function gasRoutePts() {
  var pts = [], names = [];
  var date = (PLAN && !PLAN.err) ? PLAN.date : todayStr();
  var cur = curPlan();

  if (MYLOC) { pts.push({ lat: MYLOC.lat, lng: MYLOC.lng }); names.push('출발'); }

  var live = {};
  stopsOf(date).forEach(function (v) { live[v.id] = v; });

  if (cur && PLAN && !PLAN.err) {
    var seen = {};
    cur.steps.forEach(function (s2) {
      var sp = PLAN.stops[s2.i];
      if (seen[s2.i] || !live[sp.id]) return;
      seen[s2.i] = 1;
      pts.push({ lat: sp.lat, lng: sp.lng }); names.push(sp.name);
    });
  } else {
    stopsOf(date).forEach(function (v) {
      var pt = pointOf(findHospital(v));
      if (pt) { pts.push(pt); names.push(v.name); }
    });
  }

  if (MYEND) { pts.push({ lat: MYEND.lat, lng: MYEND.lng }); names.push('도착'); }
  return { pts: pts, names: names };
}

function openGas() {
  var r = gasRoutePts();
  /* 갈 곳이 없으면 '내 주변'으로 연다 */
  if (r.pts.length < 2) GAS_MODE = 'near';
  buildGasSeg();
  document.getElementById('gasList').innerHTML = '';
  GAS = null;
  openSheet('gasSheet');
  loadGas();
}

function buildGasSeg() {
  var m = document.getElementById('seg_gasmode');
  m.innerHTML =
    '<button type="button" class="' + (GAS_MODE === 'route' ? 'sel' : '') +
      '" onclick="pickGasMode(\'route\')">동선 따라</button>' +
    '<button type="button" class="' + (GAS_MODE === 'near' ? 'sel' : '') +
      '" onclick="pickGasMode(\'near\')">내 주변</button>';
  document.getElementById('gasTitle').textContent =
    (GAS_MODE === 'route') ? '동선 위의 주유·충전' : '주변 주유·충전';
  var box = document.getElementById('seg_fuel');
  box.innerHTML = FUEL_KINDS.map(function (o) {
    return '<button type="button" class="' + (FUEL_KIND === o[0] ? 'sel' : '') +
           '" onclick="pickFuel(\'' + o[0] + '\')">' + o[1] + '</button>';
  }).join('');
}

function pickGasMode(m) {
  if (GAS_MODE === m) return;
  GAS_MODE = m; GAS = null;
  buildGasSeg();
  document.getElementById('gasList').innerHTML = '';
  loadGas();
}
function pickFuel(k) {
  if (FUEL_KIND === k) return;
  FUEL_KIND = k; GAS = null;
  try { localStorage.setItem('hdb_fuel', k); } catch (e) {}
  buildGasSeg();
  document.getElementById('gasList').innerHTML = '';
  loadGas();
}

function gasNote(t) { document.getElementById('gasNote').innerHTML = t; }

function loadGas(force) {
  if (GAS_BUSY) return;

  if (GAS_MODE === 'route') {
    var r = gasRoutePts();
    if (r.pts.length < 2) {
      gasNote('동선이 없습니다. 방문일정에서 출발지·도착지를 정하고 <b>동선 계산</b>을 누른 뒤 다시 열어 주세요.');
      return;
    }
    GAS_NAMES = r.names;
    fetchGas(r.pts);
    return;
  }

  GAS_NAMES = ['내 자리'];
  if (!force && GAS_AT && (Date.now() - GAS_AT.t) < 120000) { fetchGas([GAS_AT]); return; }
  if (!navigator.geolocation) { gasNote('이 기기에서는 현재 위치를 쓸 수 없습니다.'); return; }
  gasNote('현재 위치를 잡는 중…');
  navigator.geolocation.getCurrentPosition(function (p) {
    GAS_AT = { lat: p.coords.latitude, lng: p.coords.longitude, t: Date.now() };
    fetchGas([GAS_AT]);
  }, function (e) {
    gasNote('위치를 못 잡았습니다 · ' +
      (e.code === 1 ? '위치 권한을 허용해 주세요' : esc(e.message)));
  }, { enableHighAccuracy: true, timeout: 12000 });
}

function fetchGas(pts) {
  GAS_BUSY = true;
  GAS_PTS = pts;
  gasNote('가격을 받아오는 중…' + (pts.length > 1 ? ' 동선이 길면 조금 걸립니다.' : ''));
  var str = pts.map(function (p) { return p.lat + ',' + p.lng; }).join(';');
  srv().then(function (res) {
      GAS_BUSY = false; GAS = res; renderGas();
    })
    .err(function (e) {
      GAS_BUSY = false;
      gasNote('<span style="color:#B3261E">' + esc(e.message) + '</span>');
    })
    .fuel(str, FUEL_KIND);
}

/* 몇 번째 구간 옆인지를 사람 말로 */
function segLabel_(i) {
  var a = GAS_NAMES[i], b = GAS_NAMES[i + 1];
  if (!a) return '';
  if (!b) return a + ' 근처';
  return a + ' → ' + b;
}

function renderGas() {
  var el = document.getElementById('gasList');
  if (!GAS || !GAS.list || !GAS.list.length) {
    gasNote('둘레에서 찾지 못했습니다.');
    el.innerHTML = ''; return;
  }
  var low = GAS.list[0].price;
  var head = esc(GAS.label) + ' · 싼 순';
  if (GAS_MODE === 'route') {
    head += ' · 동선 ' + GAS_NAMES.length + '곳을 훑음 · 경로에서 4km 안';
    if (!curPlan()) head += '<br>동선 계산 전이라 <b>등록한 순서</b>로 훑었습니다.';
  } else {
    head += ' · 둘레 ' + Math.round(GAS.radius / 1000) + 'km';
  }
  head += ' · ' + esc(GAS.at) + ' 기준';
  if (GAS.fresh === 0) head += ' (담아 둔 값)';
  gasNote(head);

  el.innerHTML = GAS.list.map(function (o, i) {
    var where = (GAS_MODE === 'route')
      ? segLabel_(o.seg) + (o.off > 0.15 ? ' · 옆으로 ' + o.off + 'km' : ' · 길가')
      : (o.off >= 1 ? o.off + 'km' : Math.round(o.off * 1000) + 'm');
    return '<div class="gasitem' + (o.price === low ? ' cheap' : '') + '">' +
      '<span class="no">' + (i + 1) + '</span>' +
      '<span class="who"><b>' + esc(o.name) + '</b>' +
        '<small>' + esc(o.brand) + ' · ' + esc(where) + '</small></span>' +
      '<span class="pr"><b>' + (o.price ? o.price.toLocaleString() : '-') + '</b>' +
        '<small>원</small></span>' +
      (o.lat && o.lng ? '<button onclick="gasRoute(' + i + ')">길찾기</button>' : '') +
    '</div>';
  }).join('');
}

function gasRoute(i) {
  var o = GAS && GAS.list && GAS.list[i];
  if (!o || !o.lat || !o.lng) return;
  openNaver_('nmap://route/car?dlat=' + o.lat + '&dlng=' + o.lng +
             '&dname=' + encodeURIComponent(o.name) +
             '&appname=phurom0103-coder.github.io');
}

/* ---------- 길찾기 ---------- */

/* 이 병원 한 곳만 안내한다. 중간에 들르는 곳 없이 곧장 간다. (#2) */
function routeOne(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  var h = findHospital(v);
  var pt = pointOf(h);
  if (!pt) {
    toast(h && h.parking === '인근'
      ? '주차장 주소가 없어 길찾기를 할 수 없습니다 · ' + v.name +
        '\n병원DB에서 주차장 주소를 먼저 입력하세요.'
      : '이 병원은 좌표가 없어 길찾기를 할 수 없습니다 · ' + v.name, 6000);
    return;
  }
  var nm = v.name + (h.parking === '인근' ? ' 주차장' : '');
  openNaver_('nmap://route/car?dlat=' + pt.lat + '&dlng=' + pt.lng +
             '&dname=' + encodeURIComponent(nm) +
             '&appname=phurom0103-coder.github.io');
}

function openNaver_(u) {
  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* 1번부터 이 병원까지를 네이버 지도 자동차 길찾기로 넘긴다.
   출발지는 비워 두면 네이버가 현재 위치를 잡는다. */
function routeTo(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var day = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  day.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var stops = [], missing = [], noPark = [];
  for (var i = 0; i < day.length; i++) {
    var h = findHospital(day[i]);
    var nm = day[i].name;

    if (h && h.parking === '인근') {
      /* 주차장이 따로 있는 병원은 병원 건물이 아니라 주차장으로 안내해야 한다.
         주차장 주소가 없으면 엉뚱한 곳으로 보내게 되므로 길찾기를 하지 않는다. */
      if (hasParkPoint(h)) stops.push({ name: nm + ' 주차장', lat: h.pLat, lng: h.pLng });
      else noPark.push(nm);
    } else if (h && h.lat && h.lng) {
      stops.push({ name: nm, lat: h.lat, lng: h.lng });
    } else {
      missing.push(nm);
      /* 지금 누른 병원 자체에 좌표가 없으면, 그 앞 병원이 목적지가 되어
         전혀 다른 곳으로 안내된다. 그럴 바에는 안내하지 않는다. */
      if (day[i].id === id) {
        toast('이 병원은 좌표가 없어 길찾기를 할 수 없습니다 · ' + nm, 5200);
        return;
      }
    }
    if (day[i].id === id) break;
  }

  if (noPark.length) {
    toast('주차장 주소가 없어 길찾기를 할 수 없습니다 · ' + noPark.join(', ') +
          '\n병원DB에서 주차장 주소를 먼저 입력하세요.', 6500);
    return;
  }
  if (!stops.length) { toast('좌표가 있는 병원이 없습니다.', 4200); return; }
  if (stops.length > NAV_MAX_STOPS) {
    toast('한 번에 최대 ' + NAV_MAX_STOPS + '곳까지만 보낼 수 있습니다.', 5200);
    return;
  }
  if (missing.length) toast('좌표 없어 제외: ' + missing.join(', '), 5200);

  var d = stops[stops.length - 1];
  var u = 'nmap://route/car?dlat=' + d.lat + '&dlng=' + d.lng +
          '&dname=' + encodeURIComponent(d.name);
  for (var k = 0; k < stops.length - 1; k++) {
    var n = k + 1;
    u += '&v' + n + 'lat=' + stops[k].lat +
         '&v' + n + 'lng=' + stops[k].lng +
         '&v' + n + 'name=' + encodeURIComponent(stops[k].name);
  }
  u += '&appname=phurom0103-coder.github.io';

  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ---------- 새 판 확인 ----------
   아이콘으로 띄운 앱은 예전 파일을 계속 붙들고 있어서 고쳐도 안 바뀐다.
   그래서 앱이 켜질 때 원본을 한 번 들여다보고, 판 번호가 다르면 알려준다. */
var NEW_VER = '';
var VER_STATE = '확인 전';
var verBusy = false;

/* 표시는 다시 그리기를 기다리지 않고 그 자리에서 바꾼다.
   (예전에는 render 를 거쳐서, 확인이 끝나지 않으면 아무 변화가 없었다) */
function verDone(txt) {
  VER_STATE = txt;
  verBusy = false;
  var el = document.getElementById('verLine');
  if (el) el.textContent = APP_VER + ' · ' + txt;
}
function verBusyNow() {
  VER_STATE = '확인 중…';
  verBusy = true;
  var el = document.getElementById('verLine');
  if (el) el.textContent = APP_VER + ' · 확인 중…';
}

/* 앱 파일이 놓인 자리 (물음표 뒤에 붙은 것은 떼어낸다) */
function appBase_() { return location.origin + location.pathname; }

function checkVersion(auto) {
  if (!window.fetch) { verDone('확인 불가 (옛 브라우저)'); return; }
  verBusyNow();

  var done = false;
  var timer = setTimeout(function () {
    if (done) return;
    done = true;
    verDone('확인 못 함 · 시간 초과');
  }, 9000);

  function finish(txt) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    verDone(txt);
  }

  /* 물음표를 붙여 매번 새 주소로 만들고, 담아 둔 것을 쓰지 말라고 못을 박는다 */
  var url = appBase_() + '?upd=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('응답 ' + r.status);
      return r.text();
    })
    .then(function (t) {
      var m = t.match(/APP_VER = '(v[0-9]+)'/);
      if (!m) { finish('확인 못 함 · 판 번호 없음'); return; }

      /* 여기까지 왔으면 새 판으로 잘 바뀐 것이다. 시도 기록을 지운다. */
      if (m[1] === APP_VER) {
        try { localStorage.removeItem(UPD_KEY); } catch (e) {}
        finish('최신 · 깃허브도 ' + m[1]);
        return;
      }

      var mine = Number(APP_VER.slice(1)), there = Number(m[1].slice(1));
      if (!(there > mine)) { finish('최신 · 깃허브는 ' + m[1]); return; }

      NEW_VER = m[1];
      finish(NEW_VER + ' 나옴');
      if (auto) { autoUpdate_(NEW_VER); return; }
      showUpdBar_();
    })
    .catch(function (e) {
      finish('확인 못 함 · ' + String((e && e.message) || e).slice(0, 24));
    });
}

function showUpdBar_(stuck) {
  var ut = document.getElementById('updTxt');
  if (ut) {
    ut.textContent = stuck
      ? ('새 버전(' + NEW_VER + ')으로 안 바뀝니다. 눌러 주세요.')
      : ('새 버전이 나왔습니다 (' + APP_VER + ' \u2192 ' + NEW_VER + ')');
  }
  var ub = document.getElementById('upd');
  if (ub) ub.className = 'on';
}

/* ---------- 켤 때 스스로 새 판 받기 ----------
   같은 판으로 두 번 시도해도 안 바뀌면 더 하지 않고 단추를 띄운다.
   (돌고 도는 것을 막는다) */
var UPD_KEY = 'hdb_upd';

function autoUpdate_(ver) {
  /* 무언가 입력하는 중이면 건드리지 않는다 */
  if (typeof topSheet_ === 'function' && topSheet_()) { showUpdBar_(); return; }

  var now = Date.now(), st = null;
  try { st = JSON.parse(localStorage.getItem(UPD_KEY) || 'null'); } catch (e) {}
  var same = st && st.ver === ver && (now - st.t) < 180000;
  if (same && st.n >= 2) { showUpdBar_(true); return; }

  try {
    localStorage.setItem(UPD_KEY, JSON.stringify({ ver: ver, t: now, n: same ? st.n + 1 : 1 }));
  } catch (e) {}

  toast('새 버전 ' + ver + ' 을 받는 중…', 2500);
  setTimeout(function () { goVersion_(ver); }, 700);
}

function goVersion_(ver) {
  location.replace(appBase_() + '?v=' + ver + '&t=' + Date.now());
}

/* 판 번호를 누르면: 새 버전이 있으면 바로 받아오고, 아니면 다시 확인한다 */
function verTap() {
  if (NEW_VER) { doUpdate(); return; }
  if (verBusy) return;
  checkVersion(false);
}

/* 판 번호를 길게 누르면 무조건 새로 받아온다 (확인이 안 될 때의 탈출구) */
function forceUpdate() {
  if (!confirm('앱 파일을 다시 받아올까요?')) return;
  try { localStorage.removeItem(UPD_KEY); } catch (e) {}
  doUpdate();
}

function doUpdate() {
  var ub = document.getElementById('upd');
  if (ub) ub.className = '';
  /* 주소를 살짝 바꿔야 휴대폰이 예전 파일을 버리고 새로 받아온다. */
  goVersion_(NEW_VER || 't');
}

/* ---------- 시작 ----------
   기기에 남아 있는 목록을 먼저 그려서 기다림 없이 띄우고,
   새 자료는 뒤에서 받아 바꿔 끼운다. */
(function () {
  paintTabs();      /* 새로고침해도 보던 탭 그대로 */
  planRestore();    /* 앱을 껐다 켜도 짜 둔 동선 그대로 (#4) */
  pushGuard_();     /* 뒤로가기 한 칸을 미리 만들어 둔다 */
  /* 켜자마자 새 판이 있는지 보고, 있으면 스스로 받아 온다 */
  setTimeout(function () { checkVersion(true); }, 1200);
  if (!CODE) { showLogin(); return; }
  var c = cacheRead();
  if (c && c.hospitals && c.hospitals.length) {
    DB = c.hospitals; VISITS = c.visits || [];
    render();
    loadAll(true);
  } else {
    loadAll();
  }
})();
</script>
