<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>병원 DB</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5821F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="병원 DB">
<style>
  :root {
    --orange:      #F5821F;
    --orange-dk:   #E06A0A;
    --orange-tint: #FFF2E5;

    --ink:      #1F1B17;
    --ink-mid:  #6B6259;
    --ink-dim:  #9A918A;
    --paper:    #F7F3EF;
    --surface:  #FFFFFF;
    --rule:     #EBE4DD;

    --go:      #1B7A43;
    --go-bg:   #E6F3EA;
    --stop:    #B3261E;
    --stop-bg: #FBEAE8;
    --wait:    #4A5B6E;
    --wait-bg: #EBEFF3;

    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 4px 14px rgba(120,70,20,.06);
    --tabh:   62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    padding-bottom: calc(var(--tabh) + 84px);
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--orange-dk); outline-offset: 2px; }

  /* ---------- 상단 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--orange); color: #fff;
    padding: 14px 16px 16px;
    border-radius: 0 0 20px 20px;
  }
  header h1 {
    margin: 0 0 11px;
    font-size: 18px; font-weight: 700; letter-spacing: -.02em;
  }
  header h1 .num {
    font-size: 13.5px; font-weight: 600; margin-left: 8px;
    opacity: .85; font-variant-numeric: tabular-nums;
  }
  #search {
    width: 100%; height: 46px;
    padding: 0 15px; border: none; border-radius: 12px;
    font-size: 16px; font-family: inherit; color: var(--ink);
    background: #fff;
  }
  #search::placeholder { color: var(--ink-dim); }

  .wrap { padding: 16px 14px 0; }

  /* ---------- 하단 탭 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 4px;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs button {
    flex: 1; height: 44px; min-width: 0;
    background: none; color: var(--ink-mid); border-radius: 22px;
    font-size: 13.5px; font-weight: 500; padding: 0;
  }
  #tabs button.on {
    color: var(--orange-dk); font-weight: 700;
    background: var(--orange-tint);
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  .tabcnt {
    display: none; margin-left: 5px; font-size: 11px; font-weight: 700;
    background: var(--wait); color: #fff; border-radius: 9px; padding: 1px 6px;
    vertical-align: 1px;
  }
  .tabcnt.show { display: inline-block; }

  /* ---------- 레코드 카드 ---------- */
  .rec {
    background: var(--surface);
    border-left: 5px solid #E3DCD5;
    border-radius: 13px;
    box-shadow: var(--shadow);
    padding: 11px 13px 10px;
    margin-bottom: 8px;
  }
  /* 당일발급이 되는 것이 보통이므로 초록 표시는 두지 않는다.
     불가능한 곳만 눈에 띄게 한다. */
  .rec.r-no   { border-left-color: var(--stop); }
  .rec.r-hold { border-left-color: var(--wait); }

  .rec h2 {
    margin: 0;
    font-size: 16.5px; font-weight: 700; letter-spacing: -.02em;
  }
  .addr {
    color: var(--ink-mid); font-size: 12.5px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 당일발급 표시: 불가능하거나 확인 안 된 경우에만 나온다 */
  .tag {
    display: inline-block; margin-top: 6px;
    font-size: 12.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 8px;
  }
  .tag.no  { background: var(--stop-bg); color: var(--stop); }
  .tag.unk { background: #F2EEEA; color: var(--ink-mid); font-weight: 600; }

  /* 병원DB 카드: 수정 버튼을 이름 옆에 두어 아래 한 줄을 없앤다 */
  .dbhead { display: flex; align-items: center; gap: 7px; }
  .dbhead h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 사전신청은 판단에 바로 쓰이므로 수정 버튼 왼쪽에 붙여 둔다 */
  .dbhead .pre {
    flex: 0 0 auto; font-size: 12px; font-weight: 700;
    padding: 4px 9px; border-radius: 8px; white-space: nowrap;
    background: var(--go-bg); color: var(--go);
  }
  .dbhead .pre.no { background: var(--stop-bg); color: var(--stop); }
  .dbhead .edit {
    flex: 0 0 auto; min-height: 32px; padding: 0 14px; border-radius: 16px;
    background: transparent; box-shadow: inset 0 0 0 1px #DDD5CE;
    color: var(--ink-mid); font-size: 12.5px; font-weight: 600;
  }

  /* 나머지 정보는 한 줄로 이어 붙인다 */
  .meta { margin-top: 5px; font-size: 12.5px; line-height: 1.8; color: var(--ink); }
  .meta > span { white-space: nowrap; }   /* 항목 이름과 값이 갈라지지 않게 */
  .meta i { font-style: normal; color: var(--ink-dim); margin-right: 4px; }
  .meta .chk { color: var(--ink-dim); }
  .meta .chk.old { color: var(--stop); font-weight: 700; }
  .meta b { font-weight: 600; }
  .meta b.no  { color: var(--stop); font-weight: 700; }
  .meta b.yes { color: var(--go);   font-weight: 700; }
  .meta .sep { color: #DCD5CE; margin: 0 6px; }

  .memo {
    margin-top: 8px; padding: 7px 10px;
    background: var(--orange-tint); border-radius: 9px;
    font-size: 12.5px; white-space: pre-wrap; color: #6B4519;
  }

  .foot { display: flex; gap: 7px; margin-top: 9px; }
  .foot button { flex: 1; min-height: 40px; padding: 0 10px; border-radius: 10px; }
  .foot.split { justify-content: space-between; align-items: center; }
  .foot.split button { flex: 0 0 auto; min-height: 34px; padding: 0 16px; }

  .checked { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .checked.old { color: var(--stop); font-weight: 600; }

  .missing { color: var(--stop); font-size: 13px; font-weight: 600; margin-top: 5px; }

  /* ---------- 방문 순서 ---------- */
  .ordhead { display: flex; align-items: flex-start; gap: 9px; }
  .ordhead h2 { flex: 1; min-width: 0; margin: 0; }
  .ordnum {
    flex: 0 0 auto; width: 25px; height: 25px; line-height: 25px; text-align: center;
    border-radius: 13px; background: var(--orange); color: #fff;
    font-size: 13px; font-weight: 700; margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .ordbtns { flex: 0 0 auto; display: flex; gap: 5px; }
  .ordbtns button {
    width: 36px; height: 36px; padding: 0; border-radius: 10px;
    background: #F4F0EC; color: var(--ink-mid); font-size: 14px; line-height: 1;
  }
  .ordbtns button[disabled] { opacity: .3; }

  /* ---------- 길찾기 버튼 ---------- */
  .route {
    display: block; width: 100%; margin-top: 9px; min-height: 44px;
    background: var(--orange-tint); color: var(--orange-dk);
    box-shadow: inset 0 0 0 1.5px var(--orange);
    font-size: 14px; font-weight: 700; border-radius: 11px;
  }

  /* ---------- 완료 처리된 방문 ---------- */
  /* 카드 모양은 그대로 두고, 회색으로 흐리게만 처리한다 */
  .rec.done {
    background: #F4F1ED;
    border-left-color: #DFD8D1;
    box-shadow: none;
    opacity: .58;
  }
  .rec.done h2 {
    color: var(--ink-mid);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .donehead { display: flex; align-items: flex-start; gap: 10px; }
  .donehead h2 { flex: 1; min-width: 0; }
  .donehead .undo {
    flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 17px;
    background: transparent; box-shadow: inset 0 0 0 1px #D6CEC7;
    color: var(--ink-mid); font-size: 13px; font-weight: 600;
  }

  /* ---------- 날짜 구분 ---------- */
  .dayhead {
    display: flex; align-items: center; gap: 9px;
    margin: 24px 4px 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  }
  .dayhead:first-child { margin-top: 2px; }
  .dayhead .cnt { font-weight: 500; color: var(--ink-mid); font-size: 12.5px; }
  .dayhead.today { color: var(--orange-dk); }
  .dayhead .mapbtn {
    margin-left: auto; min-height: 34px; padding: 0 16px; border-radius: 17px;
    background: var(--surface); box-shadow: var(--shadow);
    color: var(--ink); font-size: 13px; font-weight: 600;
  }

  /* 보류 재방문일 */
  .holddate {
    font-size: 14px; font-weight: 700; color: var(--wait);
    background: var(--wait-bg); display: inline-block;
    padding: 6px 12px; border-radius: 10px; margin-bottom: 11px;
    font-variant-numeric: tabular-nums;
  }
  .holddate.tbd { color: var(--stop); background: var(--stop-bg); }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: none; border-radius: 11px;
    padding: 10px 16px; background: var(--orange); color: #fff;
    cursor: pointer;
  }
  button.ghost { background: #EFEBE7; color: var(--ink); }
  button.hold  { background: var(--wait-bg); color: var(--wait); }
  button.small { font-size: 13.5px; }
  button:active { opacity: .68; }

  #fab {
    position: fixed; right: 18px;
    bottom: calc(var(--tabh) + 22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 29px;
    font-size: 30px; font-weight: 300; line-height: 1; padding: 0;
    background: var(--orange);
    box-shadow: 0 6px 18px rgba(200,110,20,.42);
    z-index: 41;
  }

  /* ---------- 시트 ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--surface);
    z-index: 50; overflow-y: auto; display: none;
    padding: 18px 16px 112px;
    animation: rise .16s ease-out;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

  .sheet h2 { margin: 2px 0 20px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }

  label { display: block; margin-bottom: 17px; }
  label span.lbl {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-mid); margin-bottom: 7px;
  }
  input[type=text], input[type=time], input[type=date], textarea {
    width: 100%; padding: 12px 13px; font-size: 16px;
    border: 1.5px solid var(--rule); border-radius: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus, textarea:focus { border-color: var(--orange); outline: none; }
  input[type=time], input[type=date] { font-variant-numeric: tabular-nums; }
  textarea { min-height: 94px; resize: vertical; line-height: 1.5; }
  #pickSearch { margin-bottom: 4px; }

  .seg { display: flex; gap: 7px; }
  .seg button {
    flex: 1; min-height: 48px; padding: 0 4px; border-radius: 12px;
    background: #F4F0EC; color: var(--ink-mid);
    font-size: 14px; font-weight: 500;
  }
  .seg button.sel { background: var(--orange); color: #fff; font-weight: 700; }

  .lunchbox, .datebox { display: flex; gap: 7px; align-items: center; }
  .lunchbox input[type=time], .datebox input[type=date] { flex: 1; min-width: 0; }
  .lunchbox .dash { color: var(--ink-dim); }
  .lunchbox button, .datebox button {
    flex: 0 0 68px; min-height: 48px; padding: 0; border-radius: 12px;
    background: #F4F0EC; color: var(--ink-mid); font-size: 13.5px; font-weight: 500;
  }
  .lunchbox button.sel, .datebox button.sel { background: var(--orange); color: #fff; font-weight: 700; }

  .actions {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--rule);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 9px; z-index: 60;
  }
  .actions button { flex: 1; min-height: 50px; font-size: 15px; font-weight: 700; border-radius: 13px; }
  .actions button.del { flex: 0 0 66px; background: var(--stop-bg); color: var(--stop); }

  /* ---------- 병원 선택 ---------- */
  .picklist { margin-top: 10px; }
  .pickitem {
    padding: 15px 6px; border-bottom: 1px solid #F2EDE8;
    font-size: 16px; cursor: pointer;
  }
  .pickitem:active { background: #FAF7F4; }
  .pickitem small { display: block; color: var(--ink-mid); font-size: 12.5px; margin-top: 3px; }

  /* ---------- 동선 ---------- */
  .panel {
    background: var(--surface); border-radius: 13px; box-shadow: var(--shadow);
    padding: 13px; margin-bottom: 10px;
  }
  .locrow { display: flex; gap: 7px; }
  .locrow button {
    flex: 1; min-height: 44px; border-radius: 11px; font-size: 13.5px; font-weight: 600;
  }
  .locrow button.sub {
    background: #F4F0EC; color: var(--ink);
  }
  .locnow { font-size: 12.5px; color: var(--ink-mid); margin-top: 9px; }
  .locnow b { color: var(--ink); font-weight: 600; }
  #addrBox { display: none; margin-top: 9px; }
  #addrBox input { width: 100%; height: 44px; padding: 0 13px; border-radius: 11px;
    border: none; box-shadow: inset 0 0 0 1.5px var(--rule); font-size: 15px;
    font-family: inherit; color: var(--ink); background: #fff; }

  .calcbtn { display: block; width: 100%; min-height: 50px; border-radius: 13px;
    font-size: 15px; font-weight: 700; margin-bottom: 12px; }

  /* 지금 할 일 */
  .nextcard {
    background: var(--orange); color: #fff; border-radius: 13px;
    padding: 14px 15px; margin-bottom: 10px;
  }
  .nextcard .lbl { font-size: 12px; opacity: .9; font-weight: 600; }
  .nextcard .nm { font-size: 19px; font-weight: 700; margin: 3px 0 5px; letter-spacing: -.02em; }
  .nextcard .sub { font-size: 13px; opacity: .95; font-variant-numeric: tabular-nums; }

  /* 순서 목록 */
  .plansteps { background: var(--surface); border-radius: 13px; box-shadow: var(--shadow);
    padding: 4px 13px; margin-bottom: 10px; }
  .pstep { display: flex; align-items: center; gap: 10px; padding: 11px 0;
    border-bottom: 1px solid var(--rule); font-size: 14px; }
  .pstep:last-child { border-bottom: none; }
  .pstep .t { flex: 0 0 auto; width: 42px; font-size: 13px; color: var(--ink-mid);
    font-variant-numeric: tabular-nums; }
  .pstep .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 600; }
  .pstep .kd { flex: 0 0 auto; font-size: 11.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 7px; background: #F0ECE8; color: var(--ink-mid); }
  .pstep .kd.get { background: var(--go-bg); color: var(--go); }
  .pstep .kd.put { background: var(--wait-bg); color: var(--wait); }
  .pstep.again .nm { color: var(--wait); }
  .planend { font-size: 13.5px; font-weight: 700; text-align: center;
    padding: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .plannote { font-size: 12px; color: var(--ink-dim); line-height: 1.6; padding: 0 4px 14px; }
  .planwarn { background: var(--stop-bg); color: var(--stop); font-size: 12.5px;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-weight: 600; line-height: 1.55; }

  /* ---------- 지도 ---------- */
  #mapSheet { padding: 0; }
  #mapTop {
    position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 61;
    background: var(--orange); color: #fff; display: flex; align-items: center;
    padding: 0 14px; gap: 10px;
  }
  #mapTop span { font-size: 16px; font-weight: 700; }
  #mapTop button { margin-left: auto; background: rgba(255,255,255,.25); color: #fff; min-height: 36px; }
  #map { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; }
  .pin {
    background: var(--orange); color: #fff; border-radius: 50%;
    width: 28px; height: 28px; line-height: 28px; text-align: center;
    font-size: 13px; font-weight: 700; border: 2px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
  }
  #mapWarn {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 61;
    background: rgba(179,38,30,.94); color: #fff; padding: 11px 13px;
    border-radius: 12px; font-size: 13px; display: none;
  }

  /* ---------- 조사자 확인 ---------- */
  #login .who { margin: -8px 0 22px; font-size: 13.5px; color: var(--ink-mid); }
  #l_msg { min-height: 22px; font-size: 13.5px; font-weight: 600; color: var(--stop); }
  #l_msg.busy { color: var(--ink-mid); }

  /* ---------- 빈 화면 · 토스트 ---------- */
  .empty {
    text-align: center; color: var(--ink-mid);
    padding: 64px 24px; font-size: 14.5px; line-height: 1.7;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabh) + 88px);
    transform: translateX(-50%);
    background: rgba(31,27,23,.93); color: #fff;
    padding: 11px 19px; border-radius: 22px;
    font-size: 13.5px; display: none; z-index: 100;
    max-width: 88vw; text-align: center; white-space: pre-line; line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">방문일정</h1>
  <input id="search" type="text" placeholder="병원명 검색" oninput="render()">
</header>

<div class="wrap" id="list"><div class="empty">불러오는 중…</div></div>

<button id="fab" onclick="onFab()">+</button>

<div id="tabs">
  <button id="tab_plan" onclick="switchTab('plan')">동선</button>
  <button id="tab_visit" class="on" onclick="switchTab('visit')">방문일정</button>
  <button id="tab_hold" onclick="switchTab('hold')">보류<span id="holdCnt" class="tabcnt"></span></button>
  <button id="tab_db" onclick="switchTab('db')">병원DB</button>
</div>

<!-- 지도 -->
<div id="mapSheet" class="sheet">
  <div id="mapTop">
    <span id="mapTitle">지도</span>
    <button class="small" onclick="closeMap()">닫기</button>
  </div>
  <div id="map"></div>
  <div id="mapWarn"></div>
</div>

<!-- 병원 정보 입력 -->
<div id="form" class="sheet">
  <h2 id="formTitle">병원 추가</h2>
  <label><span class="lbl">병원명 *</span><input type="text" id="f_name"></label>
  <label><span class="lbl">주소</span><input type="text" id="f_addr"></label>
  <label><span class="lbl">당일발급</span><div class="seg" id="seg_sameday"></div></label>
  <label><span class="lbl">사전신청</span><div class="seg" id="seg_prereq"></div></label>
  <label><span class="lbl">서류 발급 소요시간</span><input type="text" id="f_wait" placeholder="예: 10분 내외"></label>
  <label><span class="lbl">진료시작</span><input type="time" id="f_open"></label>
  <div id="rawNote" style="display:none;font-size:12.5px;color:#B3261E;margin:-4px 0 12px;line-height:1.5"></div>
  <label>
    <span class="lbl">점심시간</span>
    <div class="lunchbox">
      <input type="time" id="f_lunch_s" onchange="onLunchTime()">
      <span class="dash">–</span>
      <input type="time" id="f_lunch_e" onchange="onLunchTime()">
      <button type="button" id="lunchNone" onclick="toggleLunchNone()">없음</button>
    </div>
  </label>
  <label><span class="lbl">주차</span><div class="seg" id="seg_parking"></div></label>
  <label id="paddrRow"><span class="lbl">주차장 주소</span>
    <input type="text" id="f_paddr" placeholder="차를 실제로 대는 곳의 주소">
  </label>
  <label><span class="lbl">비고</span><textarea id="f_memo" placeholder="자유롭게 입력"></textarea></label>
  <div class="actions">
    <button class="ghost" onclick="closeSheet('form')">취소</button>
    <button onclick="saveHospital_()">저장</button>
    <button class="del" id="delBtn" onclick="delHospital_()" style="display:none">삭제</button>
  </div>
</div>

<div id="picker" class="sheet">

<!-- 조사자 확인 -->
<div id="login" class="sheet">
  <h2>조사자 확인</h2>
  <p class="who">발급받은 코드를 입력하세요. 한 번만 입력하면 이 기기에 기억됩니다.</p>
  <label><span class="lbl">코드</span>
    <input type="text" id="l_code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="코드 입력">
  </label>
  <div id="l_msg"></div>
  <div class="actions"><button onclick="doLogin()">확인</button></div>
</div>

<div id="toast"></div>

<script>
var TAB = 'visit';
var DB = [], VISITS = [];
var editId = null, vEditId = null, vHid = '';
var lunchNone = false, dateTbd = false;
var rawOpen = '', rawLunch = '';   /* 시각칸이 못 읽은 원래 글자 */
var seg = { sameday: '', prereq: '', parking: '' };
var vStatus = '예정';
var MAP = null, MARKERS = [];

var SEG_OPTS = {
  sameday: ['가능', '불가능'],
  prereq:  ['유선', '팩스', '인터넷', '불가능'],
  parking: ['가능', '인근']
};
var SEG_LABEL = { sameday: '당일발급', prereq: '사전신청', parking: '주차' };

/* 방문일정 탭은 오늘 기준 이 일수 전까지만 보여준다 */
var VISIT_DAYS_BACK = 3;
/* 네이버 지도: 목적지 1 + 경유지 5 = 한 번에 최대 6곳 (실측 확인됨) */
var NAV_MAX_STOPS = 6;

/* ---------- 공통 ---------- */
var toastTimer = null;
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';   /* white-space: pre-line 로 줄바꿈 표시 */
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, ms || 2200);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function closeSheet(id) { document.getElementById(id).style.display = 'none'; }
function openSheet(id) { document.getElementById(id).style.display = 'block'; window.scrollTo(0, 0); }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function dayLabel(ds) {
  if (!ds) return '미정';
  ds = esc(String(ds));
  var d = new Date(ds + 'T00:00:00');
  var w = ['일','월','화','수','목','금','토'][d.getDay()];
  var base = ds.slice(5).replace('-', '.') + ' (' + w + ')';
  var t = todayStr();
  if (ds === t) return base + ' 오늘';
  if ((d - new Date(t + 'T00:00:00')) === 86400000) return base + ' 내일';
  return base;
}
function withinWindow(ds) {
  if (!ds) return true;
  var t = new Date(ds + 'T00:00:00').getTime();
  if (isNaN(t)) return true;
  var today = new Date(todayStr() + 'T00:00:00').getTime();
  return t >= today - VISIT_DAYS_BACK * 86400000;
}

/* ---------- 서버 통신 (JSONP) ---------- */
var API = 'https://script.google.com/macros/s/AKfycbzblnGALj9dZqDHq6tNTlDsU4FWF9SPN2Kwtg5oe3zwGAbYQhQygUPcIoILhScGZisa/exec';
var CODE = '', ME = '', _seq = 0;
try { CODE = localStorage.getItem('hdb_code') || ''; } catch (e) { CODE = ''; }

function jsonp(params, ok, fail, waitMs) {
  var cb = '__cb' + (++_seq) + '_' + Date.now();
  var url = API + '?cb=' + cb + '&code=' + encodeURIComponent(CODE);
  for (var k in params) url += '&' + k + '=' + encodeURIComponent(params[k]);

  var sc = document.createElement('script'), done = false;
  var timer = setTimeout(function () {
    finish(null, { message: '응답이 없습니다. 통신 상태를 확인하세요.' });
  }, waitMs || 25000);

  function finish(res, err) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    if (err) { fail(err); return; }
    if (res && res.ok) ok(res);
    else if (res && res.err === 'AUTH') authFail();
    else fail({ message: (res && res.err) || '알 수 없는 오류' });
  }

  window[cb] = function (res) { finish(res, null); };
  sc.onerror = function () { finish(null, { message: '서버에 연결하지 못했습니다.' }); };
  sc.src = url;
  document.head.appendChild(sc);
}

/* 서버 호출을 한 곳에 모아둔다 */
function srv() {
  var ok = function () {};
  var fail = function (e) { toast('실패: ' + e.message, 5200); };
  var r = {};
  r.then = function (f) { ok = f; return r; };
  r.err  = function (f) { fail = f; return r; };
  r.all         = function ()       { jsonp({fn:'all'}, function (s) { ok(s); }, fail); return r; };
  r.saveHosp    = function (d)      { jsonp({fn:'saveHospital', data:JSON.stringify(d)}, function (s) { ok(s.res); }, fail); return r; };
  r.delHosp     = function (id)     { jsonp({fn:'delHospital', id:id}, function () { ok(); }, fail); return r; };
  r.saveVisit   = function (d)      { jsonp({fn:'saveVisit', data:JSON.stringify(d)}, function (s) { ok(s.id); }, fail); return r; };
  r.setStatus   = function (id, st) { jsonp({fn:'setStatus', id:id, status:st}, function () { ok(); }, fail); return r; };
  r.delVisit    = function (id)     { jsonp({fn:'delVisit', id:id}, function () { ok(); }, fail); return r; };
  r.reorder     = function (ids)    { jsonp({fn:'reorder', ids:ids.join(',')}, function () { ok(); }, fail); return r; };
  r.geo         = function (q)      { jsonp({fn:'geo', q:q}, function (s) { ok(s); }, fail); return r; };
  /* 첫 계산은 구간을 수십 개 물어봐야 해서 오래 걸린다. 넉넉히 기다린다. */
  r.times       = function (pts, f) { jsonp({fn:'times', pts:pts, from:f||''}, function (s) { ok(s.res); }, fail, 90000); return r; };
  return r;
}

/* ---------- 조사자 확인 ---------- */
function showLogin(msg) {
  var m = document.getElementById('l_msg');
  m.className = ''; m.textContent = msg || '';
  document.getElementById('l_code').value = '';
  openSheet('login');
}
function authFail() {
  try { localStorage.removeItem('hdb_code'); } catch (e) {}
  CODE = '';
  showLogin('코드가 맞지 않습니다.');
}
/* 확인과 데이터 받기를 한 번에 처리한다 (왕복 2회 -> 1회) */
function doLogin() {
  var v = document.getElementById('l_code').value.trim();
  var m = document.getElementById('l_msg');
  if (!v) { m.className = ''; m.textContent = '코드를 입력하세요.'; return; }
  CODE = v;
  m.className = 'busy'; m.textContent = '확인 중…';
  srv().then(function (d) {
      ME = d.name; DB = d.hospitals; VISITS = d.visits;
      cacheWrite();
      try { localStorage.setItem('hdb_code', CODE); } catch (e) {}
      closeSheet('login');
      toast(ME + '님 확인되었습니다');
      render();
    })
    .err(function (e) { CODE = ''; m.className = ''; m.textContent = e.message; })
    .all();
}

/* ---------- 로드 · 캐시 ---------- */
/* 마지막으로 받은 목록을 기기에 저장해 둔다.
   다음에 열면 그걸 즉시 보여주고, 새 자료는 뒤에서 받아 바꿔 끼운다. */
function cacheRead() {
  try {
    var s = localStorage.getItem('hdb_cache');
    if (!s) return null;
    var c = JSON.parse(s);
    /* 모양이 이상하면 없는 셈 친다 (예전 형식이거나 저장 중 끊긴 경우) */
    if (!c || !(c.hospitals instanceof Array) || !(c.visits instanceof Array)) return null;
    return c;
  }
  catch (e) { return null; }
}
function cacheWrite() {
  try { localStorage.setItem('hdb_cache', JSON.stringify({ hospitals: DB, visits: VISITS })); }
  catch (e) {}
}

/* quiet = true 면 화면을 비우지 않고 조용히 갱신한다 */
function loadAll(quiet) {
  if (!quiet) document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
  srv().then(function (d) {
        ME = d.name || ME;
        DB = d.hospitals; VISITS = d.visits;
        cacheWrite(); render();
      })
       .err(function (e) { if (quiet) toast('갱신 실패: ' + e.message, 4200); else fail(e); })
       .all();
}
function fail(e) {
  document.getElementById('list').innerHTML =
    '<div class="empty">불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
}

/* 방문 건에 붙은 병원 고유번호로 찾는다. 없으면 이름으로 */
function findHospital(v) {
  var hid = (v && v.hid) || '';
  var name = (v && v.name) || v;
  var i;
  if (hid) { for (i = 0; i < DB.length; i++) if (DB[i].id === hid) return DB[i]; }
  for (i = 0; i < DB.length; i++) if (DB[i].name === name) return DB[i];
  return null;
}

/* ---------- 탭 ---------- */
var TAB_TITLE = { plan: '오늘 동선', visit: '방문일정', hold: '보류 건', db: '병원 실무정보 DB' };

function switchTab(t) {
  TAB = t;
  ['plan','visit','hold','db'].forEach(function (k) {
    document.getElementById('tab_' + k).className = (t === k) ? 'on' : '';
  });
  document.getElementById('search').value = '';
  paintChrome();
  render(); window.scrollTo(0, 0);
}

function onFab() {
  if (TAB === 'db') openForm();
  else openPicker();
}

/* 동선 탭에는 검색도 추가 버튼도 필요 없다 */
function paintChrome() {
  var plan = (TAB === 'plan');
  document.getElementById('fab').style.display = plan ? 'none' : 'block';
  document.getElementById('search').style.display = plan ? 'none' : 'block';
}

function visitsOf(kind) {
  return VISITS.filter(function (v) {
    return kind === 'hold' ? (v.status === '보류') : (v.status !== '보류');
  });
}

function paintHoldCount() {
  var n = visitsOf('hold').length;
  var el = document.getElementById('holdCnt');
  el.textContent = n;
  el.className = n ? 'tabcnt show' : 'tabcnt';
}

/* ---------- 지도 ---------- */
function openDayMap(ds) {
  var items = visitsOf('visit').filter(function (v) {
    return v.date === ds && v.status !== '완료';
  });
  var pts = [], missing = [];

  items.forEach(function (v) {
    var h = findHospital(v);
    if (h && h.lat && h.lng) pts.push({ name: v.name, lat: h.lat, lng: h.lng });
    else missing.push(v.name);
  });

  if (!pts.length) { toast('남은 방문지 중 좌표가 있는 병원이 없습니다.'); return; }

  document.getElementById('mapTitle').textContent = dayLabel(ds) + ' · ' + pts.length + '곳';
  openSheet('mapSheet');

  var warn = document.getElementById('mapWarn');
  if (missing.length) {
    warn.textContent = '좌표 없음: ' + missing.join(', ');
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }

  setTimeout(function () { drawMap(pts); }, 60);
}

function drawMap(pts) {
  if (typeof L === 'undefined') { toast('지도를 불러오지 못했습니다 (통신 확인)', 4200); return; }
  if (!MAP) {
    MAP = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(MAP);
  }
  MARKERS.forEach(function (m) { MAP.removeLayer(m); });
  MARKERS = [];

  var bounds = [];
  pts.forEach(function (p, i) {
    var icon = L.divIcon({
      className: '',
      html: '<div class="pin">' + (i + 1) + '</div>',
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    var m = L.marker([p.lat, p.lng], { icon: icon }).addTo(MAP).bindPopup(p.name);
    MARKERS.push(m);
    bounds.push([p.lat, p.lng]);
  });

  MAP.invalidateSize();
  if (bounds.length === 1) MAP.setView(bounds[0], 14);
  else MAP.fitBounds(bounds, { padding: [40, 40] });
}

function closeMap() { closeSheet('mapSheet'); }

/* ---------- 렌더 ---------- */
/* 제목 옆에 등록 개수를 보여준다. 검색 중이면 '보이는 수 / 전체 수' */
function paintTitle(shown, total) {
  var el = document.getElementById('pageTitle');
  var txt = esc(TAB_TITLE[TAB]);
  if (total != null) {
    txt += '<span class="num">' +
           (shown != null && shown !== total ? shown + ' / ' + total : total) +
           '</span>';
  }
  el.innerHTML = txt;
}

function render() {
  paintHoldCount();
  if (TAB === 'db') renderDB();
  else if (TAB === 'hold') renderHold();
  else if (TAB === 'plan') renderPlan();
  else renderVisits();
}

/* 당일발급이 되는 것이 보통이므로, 되는 경우에는 아무 표시도 하지 않는다.
   불가능한 곳만 빨갛게 드러낸다. */
function recCls(h, extra) {
  var c = 'rec';
  if (h && h.sameday === '불가능') c += ' r-no';
  return extra ? (c + ' ' + extra) : c;
}

function isOld(d) {
  if (!d) return false;
  var t = new Date(d).getTime();
  if (isNaN(t)) return false;
  return (Date.now() - t) > 1000 * 60 * 60 * 24 * 180;
}

/* 사전신청 배지: 되는 곳은 초록, 안 되는 곳은 빨강 */
function preTag(h) {
  if (!h.prereq) return '';
  var no = (h.prereq === '불가능');
  return '<span class="pre' + (no ? ' no' : '') + '">' +
         (no ? '사전신청 불가' : '사전신청 ' + esc(h.prereq)) + '</span>';
}

/* 주차 '인근'인 병원의 주차장 좌표가 등록돼 있는지 */
function hasParkPoint(h) { return !!(h && h.pLat && h.pLng); }

/* 당일발급 표시: 가능하면 아무것도 안 띄운다 */
function samedayTag(h) {
  if (h.sameday === '불가능') return '<div class="tag no">당일발급 불가</div>';
  if (h.sameday !== '가능')   return '<div class="tag unk">당일발급 미확인</div>';
  return '';
}

/* 나머지 항목은 한 줄로 이어 붙여 카드를 낮춘다 */
function metaLine(h, opt) {
  opt = opt || {};
  var out = [];
  /* hl 이 참이면 '되는 경우'를 초록으로 강조한다 (사전신청은 되는 곳이 드물어서) */
  function add(k, v, hl) {
    if (!v) return;
    var cls = '';
    if (v === '불가능') cls = ' class="no"';
    else if (hl) cls = ' class="yes"';
    out.push('<span><i>' + k + '</i><b' + cls + '>' + esc(v) + '</b></span>');
  }
  if (!opt.skipPrereq) add('사전신청', h.prereq, true);
  /* 주차가 '인근'인데 주차장 주소가 없으면 길찾기를 할 수 없으므로 미리 알린다 */
  if (h.parking === '인근' && !hasParkPoint(h)) {
    out.push('<span><i>주차</i><b class="no">인근 · 주소 없음</b></span>');
  } else {
    add('주차', h.parking);
  }
  add('발급', h.wait);
  add('진료', h.open);
  add('점심', h.lunch);
  if (opt.checked) {
    out.push('<span class="chk' + (isOld(h.checked) ? ' old' : '') + '">' +
             (h.checked ? '확인 ' + esc(h.checked) : '확인일 없음') + '</span>');
  }
  if (!out.length) return '';
  return '<div class="meta">' + out.join('<span class="sep">·</span>') + '</div>';
}

function infoBlock(h) {
  if (!h) return '<div class="missing">병원DB에 없는 병원입니다</div>';
  return (h.addr ? '<div class="addr">' + esc(h.addr) + '</div>' : '') +
         samedayTag(h) + metaLine(h);
}

/* 완료된 방문: 카드는 그대로, 회색으로 흐리게 + 날짜 그룹 안 맨 아래로 */
function doneCard(v) {
  var h = findHospital(v);
  return '<div class="' + recCls(h, 'done') + '">' +
    '<div class="donehead">' +
      '<h2>' + esc(v.name) + '</h2>' +
      '<button class="undo" onclick="undoVisit(\'' + v.id + '\')">되돌리기</button>' +
    '</div>' +
    infoBlock(h) +
    (v.memo ? '<div class="memo">' + esc(v.memo) + '</div>' : '') +
  '</div>';
}

function renderVisits() {
  paintTitle();
  var q = document.getElementById('search').value.trim();
  var pool = visitsOf('visit');
  var all = pool.filter(function (v) { return withinWindow(v.date); });
  var hidden = pool.length - all.length;
  var list = all.filter(function (v) { return !q || v.name.indexOf(q) > -1; });
  var el = document.getElementById('list');

  if (!list.length) {
    var msg;
    if (all.length) msg = '검색 결과가 없습니다.';
    else if (hidden) msg = '표시할 일정이 없습니다.<br>' + VISIT_DAYS_BACK +
                           '일 이전 일정 ' + hidden + '건은 숨겨져 있습니다.';
    else msg = '예정된 방문이 없습니다.<br>+ 를 눌러 병원을 고르세요.';
    el.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }

  var order = [], seen = {};
  list.forEach(function (v) {
    var k = v.date || '';
    if (!seen[k]) { seen[k] = { date: v.date, todo: [], done: [] }; order.push(seen[k]); }
    (v.status === '완료' ? seen[k].done : seen[k].todo).push(v);
  });

  var html = '';
  order.forEach(function (g) {
    var isToday = (g.date === todayStr());
    var cnt = g.todo.length + '곳 남음';
    if (g.done.length) cnt += ' · ' + g.done.length + '곳 완료';

    html += '<div class="dayhead' + (isToday ? ' today' : '') + '">' +
            dayLabel(g.date) + ' <span class="cnt">' + cnt + '</span>' +
            '<button class="mapbtn" onclick="openDayMap(\'' + esc(String(g.date || '')).replace(/'/g, '') + '\')">지도</button></div>';

    g.todo.sort(function (a, b) {
      var x = a.order || 9999, y = b.order || 9999;
      if (x !== y) return x - y;
      return a.name.localeCompare(b.name, 'ko');
    });

    g.todo.forEach(function (v, idx) {
      var h = findHospital(v);
      var first = (idx === 0), lastOne = (idx === g.todo.length - 1);
      html += '<div class="' + recCls(h) + '">' +
        '<div class="ordhead">' +
          '<span class="ordnum">' + (idx + 1) + '</span>' +
          '<h2>' + esc(v.name) + '</h2>' +
          '<div class="ordbtns">' +
            '<button onclick="moveVisit(\'' + v.id + '\',-1)"' + (first ? ' disabled' : '') + '>▲</button>' +
            '<button onclick="moveVisit(\'' + v.id + '\',1)"' + (lastOne ? ' disabled' : '') + '>▼</button>' +
          '</div>' +
        '</div>' +

/* ---------- 점심시간 ---------- */
function toggleLunchNone() {
  lunchNone = !lunchNone;
  if (lunchNone) {
    document.getElementById('f_lunch_s').value = '';
    document.getElementById('f_lunch_e').value = '';
  }
  paintLunch();
}
function onLunchTime() {
  if (document.getElementById('f_lunch_s').value || document.getElementById('f_lunch_e').value) {
    lunchNone = false; paintLunch();
  }
}
function paintLunch() { document.getElementById('lunchNone').className = lunchNone ? 'sel' : ''; }
function lunchValue() {
  if (lunchNone) return '없음';
  var s = document.getElementById('f_lunch_s').value;
  var e = document.getElementById('f_lunch_e').value;
  if (!s && !e && rawLunch) return rawLunch;   /* 못 읽은 원래 글자를 지운 채로 저장하지 않는다 */
  if (s && e) return s + '-' + e;
  if (s) return s + '-';
  if (e) return '-' + e;
  return '';
}
function setLunch(v) {
  var s = document.getElementById('f_lunch_s'), e = document.getElementById('f_lunch_e');
  s.value = ''; e.value = ''; lunchNone = false; rawLunch = '';
  var txt = String(v || '').trim();

  if (txt === '없음') { lunchNone = true; paintLunch(); return; }
  if (!txt) { paintLunch(); return; }

  var p = txt.split('-');
  if (p.length === 2) {
    s.value = normTime_(p[0]);
    e.value = normTime_(p[1]);
  }
  /* 두 칸 모두 제대로 못 읽었으면 원래 글자를 지켜준다 */
  if (!s.value && !e.value) rawLunch = txt;
  paintLunch();
}
/* 'HH:MM' 으로 확실히 읽히는 것만 통과시킨다.
   '09:00~18:00' 같은 글자를 억지로 시각으로 바꾸면 엉뚱한 값이 저장된다. */
function normTime_(v) {
  var m = String(v || '').trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return '';
  var hh = Number(m[1]), mm = Number(m[2]);
  if (hh > 23 || mm > 59) return '';
  return ('0' + hh).slice(-2) + ':' + ('0' + mm).slice(-2);
}

     그 글자를 기억해 두었다가, 사용자가 손대지 않으면 그대로 지켜준다. */

/* 같은 날짜 그룹의 맨 뒤 순번 */
function nextOrder(date) {
  var n = 0;
  VISITS.forEach(function (x) {
    if ((x.date || '') === (date || '') && x.status !== '완료' && (x.order || 0) > n) n = x.order;
  });
  return n + 1;
}

/* 아직 서버에 저장되지 않은 카드인지 확인한다.
   저장이 끝나기 전에 완료·보류·순서변경을 누르면 엉뚱한 곳에 저장되므로 막는다. */
function pending_(id) {
  if (String(id).indexOf('tmp_') === 0) {
    toast('저장 중입니다. 잠시 후 다시 눌러 주세요.', 3000);
    return true;
  }
  return false;
}

/* 저장을 기다리지 않는다. 목록에 먼저 반영하고 서버에는 뒤에서 보낸다.
   실패하면 원래대로 되돌린다. */
function saveVisit_() {
  var name = document.getElementById('v_name').value.trim();
  if (!name) { toast('병원을 선택하세요'); return; }

  var date = dateTbd ? '' : document.getElementById('v_date').value;
  var memo = document.getElementById('v_memo').value.trim();

  var editing = !!vEditId;
  var rec = null, before = null;

  if (editing) {
    rec = VISITS.filter(function (x) { return x.id === vEditId; })[0];
    if (!rec) { toast('대상을 찾지 못했습니다. 새로고침합니다.'); loadAll(true); return; }
    before = { hid: rec.hid, name: rec.name, date: rec.date, memo: rec.memo, order: rec.order };
    if ((rec.date || '') !== date) rec.order = nextOrder(date);
    rec.hid = vHid; rec.name = name; rec.date = date; rec.memo = memo;
  } else {
    rec = {
      id: 'tmp_' + Date.now(), hid: vHid, name: name,
      date: date, status: vStatus, memo: memo, order: nextOrder(date)
    };
    VISITS.push(rec);
  }

  var payload = {
    id: editing ? vEditId : null, hid: vHid, name: name,
    date: date, status: rec.status, memo: memo
  };

  closeSheet('visitForm');
  cacheWrite(); render();
  toast(editing ? '수정됨' : '등록됨');

  srv().then(function (newId) {
        if (!editing && newId) { rec.id = newId; cacheWrite(); render(); }
        loadAll(true);
      })
      .err(function (e) {
        if (editing) {
          rec.hid = before.hid; rec.name = before.name;
          rec.date = before.date; rec.memo = before.memo; rec.order = before.order;
        } else {
          VISITS = VISITS.filter(function (x) { return x.id !== rec.id; });
        }
        cacheWrite(); render();
        toast('저장 실패 · 되돌렸습니다: ' + e.message, 5600);
        loadAll(true);
      })
      .saveVisit(payload);
}

/* 상태 변경: 화면을 먼저 바꾸고 서버에는 뒤에서 알린다 */
function setStatusOptimistic(id, next, okMsg) {
  if (pending_(id)) return;
  var v = null;
  for (var i = 0; i < VISITS.length; i++) {
    if (VISITS[i].id === id) { v = VISITS[i]; break; }
  }
  if (!v) return;

  var prev = v.status;
  v.status = next;
  cacheWrite(); render();

  srv().then(function () { toast(okMsg); })
       .err(function (e) {
         v.status = prev; cacheWrite(); render();
         toast('실패 · 되돌렸습니다: ' + e.message, 5200);
         loadAll(true);          /* 서버가 실제로는 바뀌었을 수도 있으니 다시 맞춘다 */
       })
       .setStatus(id, next);
}

/* 같은 날짜 안에서 방문 순서를 한 칸 옮긴다 */
function moveVisit(id, dir) {
  if (pending_(id)) return;
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var group = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  group.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var i = group.indexOf(v), j = i + dir;
  if (i < 0 || j < 0 || j >= group.length) return;

  group[i] = group[j];
  group[j] = v;
  group.forEach(function (x, k) { x.order = k + 1; });
  cacheWrite(); render();

  var ids = group.map(function (x) { return x.id; });
  if (ids.join(',').indexOf('tmp_') > -1) {
    /* 저장 중인 카드가 섞여 있으면 서버에 못 보낸다. 곧 새로고침되면서
       화면이 되돌아가므로, 조용히 넘어가지 말고 알려준다. */
    toast('저장 중인 일정이 있어 순서가 아직 반영되지 않습니다. 잠시 후 다시 눌러 주세요.', 5200);
    return;
  }
  srv().err(function (e) { toast('순서 저장 실패 · 새로고침합니다: ' + e.message, 5200); loadAll(true); })
       .reorder(ids);
}

function holdVisit(id) { setStatusOptimistic(id, '보류', '보류로 이동'); }
function doneVisit(id) { setStatusOptimistic(id, '완료', '완료 처리됨'); }
function undoVisit(id) { setStatusOptimistic(id, '예정', '예정으로 되돌림'); }

function resumeVisit(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (v && !v.date) {
    toast('재방문일을 먼저 지정하세요');

    return;
  }
  setStatusOptimistic(id, '예정', '방문일정으로 복귀');
}

function delVisit_() {
  if (!vEditId || pending_(vEditId)) return;
  if (!confirm('이 방문 일정을 삭제할까요?')) return;
  var id = vEditId;
  closeSheet('visitForm');

  toast('삭제됨');
  srv().then(function () { loadAll(true); })
       .err(function (e) { toast('삭제 실패 · ' + e.message, 5600); loadAll(true); })
       .delVisit(id);
}


/* ==================================================================
   동선 — 오늘 방문할 병원을 어떤 순서로 도는 게 빠른지 계산한다.

   병원마다 상태가 셋: 미방문 → 접수됨 → 완료
   사전신청이 되는 곳은 미리 신청해 두므로 한 번만 들르면 되고,
   안 되는 곳은 접수하고 서류가 나올 때까지 기다렸다 수령해야 한다.
   그 사이에 다른 병원을 도는 게 이득인지까지 같이 따진다.
   ================================================================== */

var STOP_MIN = 10;          /* 병원 한 번 들르면 쓰는 시간 */
var DEFAULT_WAIT = 30;      /* 발급소요를 안 적어 둔 병원의 가정값 */
var PLAN_MAX = 8;           /* 이보다 많으면 계산이 느려진다 */

var MYLOC = null;           /* {lat, lng, label} */
var PLAN = null;            /* 계산 결과 */

/* "10분 내외" -> 10 / "1시간 내외" -> 60 / "1시간 30분" -> 90 */
function parseWait(txt) {
  var t = String(txt || '').replace(/\s/g, '');
  if (!t) return null;
  var h = t.match(/(\d+)\s*시간/), m = t.match(/(\d+)\s*분/);
  if (!h && !m) { var only = t.match(/^(\d+)$/); return only ? Number(only[1]) : null; }
  return (h ? Number(h[1]) * 60 : 0) + (m ? Number(m[1]) : 0);
}
function hm_(t) {
  var m = String(t || '').match(/(\d{1,2}):(\d{2})/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}
function hhmm_(v) {
  v = Math.round(v);
  var nx = (v >= 1440) ? '다음날 ' : '';
  return nx + ('0' + Math.floor(v / 60) % 24).slice(-2) + ':' + ('0' + (v % 60)).slice(-2);
}
function nowMin_() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

/* 진료시작 전이면 기다리고, 점심시간에 걸리면 끝날 때까지 기다린다 */
function usable_(t, s) {
  if (s.openMin != null && t < s.openMin) t = s.openMin;
  if (s.lunchS != null && s.lunchE != null && t >= s.lunchS && t < s.lunchE) t = s.lunchE;
  return t;
}

/* 이른 시각부터 꺼내는 작은 대기줄 */
function Heap_() { this.a = []; }
Heap_.prototype.push = function (x) {
  var a = this.a, i = a.push(x) - 1;
  while (i > 0) { var p = (i - 1) >> 1; if (a[p].t <= a[i].t) break; var v = a[p]; a[p] = a[i]; a[i] = v; i = p; }
};
Heap_.prototype.pop = function () {
  var a = this.a, top = a[0], last = a.pop();
  if (a.length) {
    a[0] = last;
    for (var i = 0; ;) {
      var l = 2 * i + 1, r = l + 1, m = i;
      if (l < a.length && a[l].t < a[m].t) m = l;
      if (r < a.length && a[r].t < a[m].t) m = r;
      if (m === i) break;
      var v = a[m]; a[m] = a[i]; a[i] = v; i = m;
    }
  }
  return top;
};

function planRoute(stops, T, start) {
  var n = stops.length;
  if (!n) return { ok: false, why: 'EMPTY' };
  if (!T || !T.mat || T.mat.length < n) return { ok: false, why: 'NO_ROUTE' };
  if (!T.from || T.from.length < n) T = { from: new Array(n), mat: T.mat };
  for (var q = 0; q < n; q++) if (!T.mat[q] || T.mat[q].length < n) return { ok: false, why: 'NO_ROUTE' };

  var need = [];
  for (var i = 0; i < n; i++) {
    var s = stops[i];
    var pre = !!(s.prereq && s.prereq !== '불가능');   /* 미리 신청해 둘 수 있는가 */
    var today = (s.sameday !== '불가능');              /* 오늘 받을 수 있는가 */
    need.push({
      twice: (!pre && today),
      once: pre ? '수령' : '접수',
      wait: (s.waitMin == null ? DEFAULT_WAIT : s.waitMin)
    });
  }

  var P3 = [1];
  for (var k = 1; k <= n; k++) P3[k] = P3[k - 1] * 3;
  var GOAL = P3[n] - 1;

  var best = {}, h = new Heap_(), zero = [];
  for (var z = 0; z < n; z++) zero.push(0);
  h.push({ t: start, loc: 0, code: 0, ready: zero, prev: null, step: null });

  var guard = 0;
  while (h.a.length) {
    if (++guard > 400000) return { ok: false, why: 'TOO_BIG' };
    var cur = h.pop();
    var key = cur.loc + ':' + cur.code;
    if (best[key] != null && best[key] <= cur.t) continue;
    best[key] = cur.t;

    if (cur.code === GOAL) {
      var steps = [], p = cur;
      while (p && p.step) { steps.unshift(p.step); p = p.prev; }
      return { ok: true, end: cur.t, steps: steps };
    }

    for (var j = 0; j < n; j++) {
      var st = Math.floor(cur.code / P3[j]) % 3;
      if (st === 2) continue;

      var move = (cur.loc === 0) ? T.from[j] : T.mat[cur.loc - 1][j];
      if (cur.loc - 1 === j) move = 0;
      if (move == null) continue;

      var arrive = usable_(cur.t + move, stops[j]);
      var kind, ns, ready = cur.ready;

      if (st === 0) {
        if (need[j].twice) {
          kind = '접수'; ns = 1;
          ready = cur.ready.slice();
          ready[j] = arrive + need[j].wait;
        } else { kind = need[j].once; ns = 2; }
      } else {
        arrive = usable_(Math.max(arrive, cur.ready[j]), stops[j]);
        kind = '수령'; ns = 2;
      }

      var done = arrive + STOP_MIN;
      var code = cur.code + (ns - st) * P3[j];
      var nk = (j + 1) + ':' + code;
      if (best[nk] != null && best[nk] <= done) continue;

      h.push({ t: done, loc: j + 1, code: code, ready: ready, prev: cur,
               step: { i: j, name: stops[j].name, kind: kind, at: arrive, move: move } });
    }
  }
  return { ok: false, why: 'NO_ROUTE' };
}

/* 정밀 계산이 안 될 때 쓰는 간단한 방법: 가까운 곳부터 차례로.
   최적은 아니지만 순서를 아예 못 내놓는 것보다 낫다. */
function planGreedy(stops, T, start) {
  var n = stops.length, st = [], ready = [], steps = [], t = start, loc = 0, i;
  for (i = 0; i < n; i++) { st.push(0); ready.push(0); }

  for (var turn = 0; turn < n * 2 + 2; turn++) {
    var done = true;
    for (i = 0; i < n; i++) if (st[i] < 2) done = false;
    if (done) return { ok: true, end: t, steps: steps, rough: true };

    var pickJ = -1, pickAt = Infinity, pickKind = '';
    for (var j = 0; j < n; j++) {
      if (st[j] === 2) continue;
      var mv = (loc === 0) ? T.from[j] : T.mat[loc - 1][j];
      if (loc - 1 === j) mv = 0;
      if (mv == null) continue;
      var at = usable_(t + mv, stops[j]), kd;
      var pre = !!(stops[j].prereq && stops[j].prereq !== '불가능');
      var today = (stops[j].sameday !== '불가능');
      if (st[j] === 1) { at = usable_(Math.max(at, ready[j]), stops[j]); kd = '수령'; }
      else kd = pre ? '수령' : '접수';
      if (at < pickAt) { pickAt = at; pickJ = j; pickKind = kd; }
    }
    if (pickJ < 0) return { ok: false, why: 'NO_ROUTE' };

    var s2 = stops[pickJ], pre2 = !!(s2.prereq && s2.prereq !== '불가능');
    var today2 = (s2.sameday !== '불가능');
    var mv2 = (loc === 0) ? T.from[pickJ] : T.mat[loc - 1][pickJ];
    if (loc - 1 === pickJ) mv2 = 0;

    if (st[pickJ] === 0 && !pre2 && today2) {
      st[pickJ] = 1;
      ready[pickJ] = pickAt + (s2.waitMin == null ? DEFAULT_WAIT : s2.waitMin);
    } else st[pickJ] = 2;

    steps.push({ i: pickJ, name: s2.name, kind: pickKind, at: pickAt, move: mv2 });
    t = pickAt + STOP_MIN;
    loc = pickJ + 1;
  }
  return { ok: false, why: 'NO_ROUTE' };
}


/* ---------- 동선 화면 ---------- */

/* 오늘 가야 할 곳 (완료·보류 제외) */
function todayStops() {
  return visitsOf('visit').filter(function (v) {
    return v.date === todayStr() && v.status !== '완료';
  }).sort(cmpVisit_);
}
function cmpVisit_(a, b) {
  var x = a.order || 9999, y = b.order || 9999;
  if (x !== y) return x - y;
  return a.name.localeCompare(b.name, 'ko');
}

/* 길 안내에 쓸 지점. 주차가 '인근'이면 주차장 좌표를 쓴다. */
function pointOf(h) {
  if (!h) return null;
  if (h.parking === '인근') return hasParkPoint(h) ? { lat: h.pLat, lng: h.pLng } : null;
  return (h.lat && h.lng) ? { lat: h.lat, lng: h.lng } : null;
}

function renderPlan() {
  paintTitle();
  var el = document.getElementById('list');
  var list = todayStops();

  /* 다시 그리기 전에 입력 중이던 주소를 챙겨 둔다 */
  var keepAddr = '', keepOpen = false, ab = document.getElementById('addrBox');
  if (ab) {
    keepOpen = (ab.style.display === 'block');
    var ai = document.getElementById('p_addr');
    if (ai) keepAddr = ai.value;
  }

  var loc = '<div class="panel">' +
    '<div class="locrow">' +
      '<button onclick="useGps()">📍 현재 위치</button>' +
      '<button class="sub" onclick="toggleAddr()">주소로 입력</button>' +
    '</div>' +
    '<div id="addrBox">' +
      '<input type="text" id="p_addr" placeholder="출발 주소" ' +
             'onkeydown="if(event.key===\'Enter\')useAddr()">' +
    '</div>' +
    '<div class="locnow">' + (MYLOC
        ? '출발 <b>' + esc(MYLOC.label) + '</b>'
        : '출발 위치를 먼저 정하세요') + '</div>' +
  '</div>';

  var btn = '<button class="calcbtn" onclick="calcPlan()">' +
            (PLAN ? '동선 다시 계산' : '동선 계산') + '</button>';

  var restore = function () {
    if (!keepOpen && !keepAddr) return;
    var b = document.getElementById('addrBox');
    if (b) b.style.display = 'block';
    var i2 = document.getElementById('p_addr');
    if (i2) i2.value = keepAddr;
  };

  if (!list.length) {
    el.innerHTML = loc +
      '<div class="empty">오늘 갈 병원이 없습니다.<br>방문일정 탭에서 먼저 등록하세요.</div>';
    restore();
    return;
  }

  el.innerHTML = loc + btn + (PLAN ? planHtml() :
    '<div class="plannote">오늘 ' + list.length + '곳이 등록돼 있습니다. ' +
    '위 버튼을 누르면 실제 도로 사정을 반영해 순서를 짭니다.</div>');
  restore();
}

/* 계산할 때의 방문 목록과 지금 목록이 같은지 */
function planStale() {
  if (!PLAN || !PLAN.sig) return false;
  return PLAN.sig !== visitSig();
}
function visitSig() {
  return todayStops().map(function (v) { return v.id; }).join(',');
}

function planHtml() {
  if (PLAN.err) return '<div class="planwarn">' + esc(PLAN.err) + '</div>';

  var st = PLAN.steps, out = '';
  if (planStale()) {
    out += '<div class="planwarn">방문 목록이 바뀌었습니다. ' +
           '아래 내용은 예전 것이니 다시 계산해 주세요.</div>';
  }

  /* 지금 할 일 */
  var nx = st[0];
  out += '<div class="nextcard">' +
    '<div class="lbl">다음</div>' +
    '<div class="nm">' + esc(nx.name) + '</div>' +
    '<div class="sub">' + nx.kind + ' · 이동 ' + nx.move + '분 · 도착 ' + hhmm_(nx.at) + '</div>' +
  '</div>';

  /* 전체 순서 */
  var seen = {};
  out += '<div class="plansteps">';
  for (var i = 0; i < st.length; i++) {
    var s = st[i], again = !!seen[s.i];
    seen[s.i] = 1;
    var cls = s.kind === '수령' ? 'get' : 'put';
    out += '<div class="pstep' + (again ? ' again' : '') + '">' +
      '<span class="t">' + hhmm_(s.at) + '</span>' +
      '<span class="nm">' + (again ? '↩ ' : '') + esc(s.name) + '</span>' +
      '<span class="kd ' + cls + '">' + s.kind + '</span>' +
    '</div>';
  }
  out += '<div class="planend">예상 종료 ' + hhmm_(PLAN.end) + '</div></div>';

  out += '<button class="calcbtn" onclick="routePlan()">🚩 이 순서로 길찾기</button>';

  var note = [];
  if (PLAN.skipped.length) note.push('제외: ' + esc(PLAN.skipped.join(', ')));
  if (PLAN.guessed.length) note.push('발급소요 미입력이라 ' + DEFAULT_WAIT + '분으로 잡음: ' + esc(PLAN.guessed.join(', ')));
  if (PLAN.miss) note.push('이동시간을 못 구한 구간 ' + PLAN.miss + '개는 빼고 계산했습니다.');
  if (PLAN.saveErr) note.push('이동시간을 저장하지 못했습니다(' + esc(PLAN.saveErr) +
                              '). 다음에도 계산이 오래 걸립니다.');
  if (PLAN.rough) note.push('병원이 많아 간단한 방법으로 순서를 잡았습니다. 더 나은 순서가 있을 수 있습니다.');
  note.push('병원마다 머무는 시간은 ' + STOP_MIN + '분으로 잡았습니다. 실제 도로 사정 기준이라 다시 계산하면 순서가 바뀔 수 있습니다.');
  out += '<div class="plannote">· ' + note.join('<br>· ') + '</div>';
  return out;
}

/* ---------- 출발 위치 ---------- */
function toggleAddr() {
  var b = document.getElementById('addrBox');
  b.style.display = (b.style.display === 'block') ? 'none' : 'block';
  if (b.style.display === 'block') document.getElementById('p_addr').focus();
}

function useGps() {
  if (!navigator.geolocation) { toast('이 기기에서는 현재 위치를 쓸 수 없습니다.', 4200); return; }
  toast('현재 위치 확인 중…');
  navigator.geolocation.getCurrentPosition(function (p) {
    MYLOC = { lat: p.coords.latitude, lng: p.coords.longitude, label: '현재 위치' };
    PLAN = null; render(); toast('현재 위치를 잡았습니다');
  }, function (e) {
    toast('위치를 못 잡았습니다 · ' + (e.code === 1 ? '위치 권한을 허용해 주세요' : e.message), 5600);
  }, { enableHighAccuracy: true, timeout: 12000 });
}

function useAddr() {
  var q = document.getElementById('p_addr').value.trim();
  if (!q) { toast('주소를 입력하세요'); return; }
  toast('주소 찾는 중…');
  srv().then(function (r) {
      MYLOC = { lat: r.lat, lng: r.lng, label: q };
      PLAN = null; render(); toast('출발지를 정했습니다');
    })
    .err(function (e) { toast(e.message, 5200); })
    .geo(q);
}

/* ---------- 계산 ---------- */
function calcPlan() {
  if (!MYLOC) { toast('출발 위치를 먼저 정하세요', 4200); return; }

  var list = todayStops(), stops = [], skipped = [], guessed = [], pts = [];

  for (var i = 0; i < list.length; i++) {
    var h = findHospital(list[i]);
    var pt = pointOf(h);
    if (!pt) {
      skipped.push(list[i].name +
        (h && h.parking === '인근' ? ' (주차장 주소 없음)' : ' (좌표 없음)'));
      continue;
    }
    var w = parseWait(h.wait);
    if (w == null && (!h.prereq || h.prereq === '불가능') && h.sameday !== '불가능') {
      guessed.push(list[i].name);
    }
    pts.push(pt);
    stops.push({
      name: list[i].name, id: list[i].id, lat: pt.lat, lng: pt.lng,
      sameday: h.sameday, prereq: h.prereq, waitMin: w,
      openMin: hm_(h.open),
      lunchS: hm_(String(h.lunch || '').split('-')[0]),
      lunchE: hm_(String(h.lunch || '').split('-')[1])
    });
  }

  if (!stops.length) {
    PLAN = { err: '계산할 수 있는 병원이 없습니다.\n' + skipped.join('\n') };
    render(); return;
  }
  if (stops.length > PLAN_MAX) {
    PLAN = { err: '한 번에 ' + PLAN_MAX + '곳까지만 계산할 수 있습니다. (지금 ' + stops.length + '곳)' };
    render(); return;
  }

  toast('실제 이동시간 확인 중… 처음 계산은 조금 걸립니다', 20000);

  var ptStr = pts.map(function (p) { return p.lat + ',' + p.lng; }).join(';');
  srv().then(function (T) {
      var r = planRoute(stops, T, nowMin_());
      if (!r.ok && r.why === 'TOO_BIG') r = planGreedy(stops, T, nowMin_());
      if (!r.ok) {
        PLAN = { err: '이동시간을 구하지 못해 순서를 짜지 못했습니다.\n' +
                      '잠시 후 다시 시도해 주세요.' };
      } else {
        PLAN = { steps: r.steps, end: r.end, stops: stops, sig: visitSig(),
                 rough: !!r.rough, skipped: skipped, guessed: guessed,
                 miss: T.miss || 0, saveErr: T.saveErr || '' };
      }
      toast(r.ok ? '동선을 짰습니다' : '계산 실패', 3000);
      render();
    })
    .err(function (e) { toast('이동시간을 받지 못했습니다 · ' + e.message, 6000); })
    .times(ptStr, MYLOC.lat + ',' + MYLOC.lng);
}

/* 계산된 순서를 네이버 지도로 넘긴다 (같은 병원 두 번은 한 번만) */
function routePlan() {
  if (!PLAN || !PLAN.steps) return;
  var seen = {}, list = [];
  for (var i = 0; i < PLAN.steps.length && list.length < NAV_MAX_STOPS; i++) {
    var st = PLAN.steps[i];
    if (seen[st.i]) continue;
    seen[st.i] = 1;
    list.push(PLAN.stops[st.i]);
  }
  if (!list.length) return;

  var d = list[list.length - 1];
  var u = 'nmap://route/car?dlat=' + d.lat + '&dlng=' + d.lng +
          '&dname=' + encodeURIComponent(d.name);
  for (var k = 0; k < list.length - 1; k++) {
    var n = k + 1;
    u += '&v' + n + 'lat=' + list[k].lat + '&v' + n + 'lng=' + list[k].lng +
         '&v' + n + 'name=' + encodeURIComponent(list[k].name);
  }
  u += '&appname=phurom0103-coder.github.io';

  if (PLAN.steps.length > list.length) {
    toast('재방문과 ' + NAV_MAX_STOPS + '곳 초과분은 지도에 안 들어갑니다.', 5200);
  }
  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---------- 길찾기 ---------- */
/* 1번부터 이 병원까지를 네이버 지도 자동차 길찾기로 넘긴다.
   출발지는 비워 두면 네이버가 현재 위치를 잡는다. */
function routeTo(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var day = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  day.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var stops = [], missing = [], noPark = [];
  for (var i = 0; i < day.length; i++) {
    var h = findHospital(day[i]);
    var nm = day[i].name;

    if (h && h.parking === '인근') {
      /* 주차장이 따로 있는 병원은 병원 건물이 아니라 주차장으로 안내해야 한다.
         주차장 주소가 없으면 엉뚱한 곳으로 보내게 되므로 길찾기를 하지 않는다. */
      if (hasParkPoint(h)) stops.push({ name: nm + ' 주차장', lat: h.pLat, lng: h.pLng });
      else noPark.push(nm);
    } else if (h && h.lat && h.lng) {
      stops.push({ name: nm, lat: h.lat, lng: h.lng });
    } else {
      missing.push(nm);
      /* 지금 누른 병원 자체에 좌표가 없으면, 그 앞 병원이 목적지가 되어
         전혀 다른 곳으로 안내된다. 그럴 바에는 안내하지 않는다. */
      if (day[i].id === id) {
        toast('이 병원은 좌표가 없어 길찾기를 할 수 없습니다 · ' + nm, 5200);
        return;
      }
    }
    if (day[i].id === id) break;
  }

  if (noPark.length) {
    toast('주차장 주소가 없어 길찾기를 할 수 없습니다 · ' + noPark.join(', ') +
          '\n병원DB에서 주차장 주소를 먼저 입력하세요.', 6500);
    return;
  }
  if (!stops.length) { toast('좌표가 있는 병원이 없습니다.', 4200); return; }
  if (stops.length > NAV_MAX_STOPS) {
    toast('한 번에 최대 ' + NAV_MAX_STOPS + '곳까지만 보낼 수 있습니다.', 5200);
    return;
  }
  if (missing.length) toast('좌표 없어 제외: ' + missing.join(', '), 5200);

  var d = stops[stops.length - 1];
  var u = 'nmap://route/car?dlat=' + d.lat + '&dlng=' + d.lng +
          '&dname=' + encodeURIComponent(d.name);
  for (var k = 0; k < stops.length - 1; k++) {
    var n = k + 1;
    u += '&v' + n + 'lat=' + stops[k].lat +
         '&v' + n + 'lng=' + stops[k].lng +
         '&v' + n + 'name=' + encodeURIComponent(stops[k].name);
  }
  u += '&appname=phurom0103-coder.github.io';

  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

   기기에 남아 있는 목록을 먼저 그려서 기다림 없이 띄우고,
   새 자료는 뒤에서 받아 바꿔 끼운다. */
(function () {
  if (!CODE) { showLogin(); return; }
  var c = cacheRead();
  if (c && c.hospitals && c.hospitals.length) {
    DB = c.hospitals; VISITS = c.visits || [];
    render();
    loadAll(true);
  } else {
    loadAll();
  }
})();
