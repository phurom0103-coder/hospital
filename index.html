<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘병원</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘병원">
<style>
  :root {
    --head:        #16243D;   /* 헤더 남색 — 앱 아이콘과 같은 색 */
    --orange:      #2D5BD7;   /* 강조 파랑 (이름은 그대로 둡니다) */
    --orange-dk:   #1E48B4;
    --orange-tint: #E8EFFD;

    --ink:      #141C2B;
    --ink-mid:  #5A6880;
    --ink-dim:  #8B96AA;
    --paper:    #F2F5FA;
    --surface:  #FFFFFF;
    --rule:     #DFE5EF;

    --go:      #1B7A43;
    --go-bg:   #E6F3EA;
    --stop:    #B3261E;
    --stop-bg: #FBEAE8;
    --wait:    #4A5B6E;
    --wait-bg: #EBEFF3;

    --shadow: 0 1px 2px rgba(16,28,50,.05), 0 4px 14px rgba(16,28,50,.07);
    --tabh:   62px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
    padding-bottom: calc(var(--tabh) + 84px);
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--orange-dk); outline-offset: 2px; }

  /* ---------- 상단 ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--head); color: #fff;
    padding: 14px 16px 16px;
    border-radius: 0 0 20px 20px;
  }
  header h1 {
    margin: 0 0 11px;
    font-size: 18px; font-weight: 700; letter-spacing: -.02em;
  }
  header h1 .num {
    font-size: 13.5px; font-weight: 600; margin-left: 8px;
    opacity: .85; font-variant-numeric: tabular-nums;
  }
  #search {
    width: 100%; height: 46px;
    padding: 0 15px; border: none; border-radius: 12px;
    font-size: 16px; font-family: inherit; color: var(--ink);
    background: #fff;
  }
  #search::placeholder { color: var(--ink-dim); }

  /* 병원DB 위쪽 지역 단추 줄. 머리글 안에 있어 목록을 내려도 따라온다 */
  /* 가로로 밀면 가려진 지역이 안 보인다. 여러 줄로 깔고 세로로 넘긴다.
     너무 길어지면 화면을 다 먹으므로 네 줄쯤에서 끊고 그 안에서 굴린다. */
  .rbar {
    /* position 이 있어야 단추의 offsetTop 이 '이 줄 안에서의 높이'가 된다.
       없으면 헤더 기준으로 재어져 줄이 한 칸 밀린 채로 나온다. */
    position: relative;
    display: none; margin: 10px -16px 0; padding: 2px 16px 0;
    max-height: 154px; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    overscroll-behavior: contain;
  }
  .rbar::-webkit-scrollbar { display: none; }
  /* 접었을 때는 한 줄만. 고른 지역이 있으면 그 줄이 보이도록 끌어다 놓는다 */
  .rbar.fold { max-height: 36px; }
  /* 접었다 폈다 하는 손잡이 */
  .rtog {
    display: none; width: 100%; margin: 2px 0 0; padding: 3px 0 1px;
    border: none; background: none; color: rgba(255, 255, 255, .5);
    font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 2px;
  }
  .rtog.on { display: block; }
  .rbar.on { display: flex; flex-wrap: wrap; gap: 6px; }
  .rbar button {
    padding: 7px 12px;
    border: none; border-radius: 999px; font-family: inherit;
    font-size: 13px; font-weight: 700; letter-spacing: -0.2px;
    background: rgba(255, 255, 255, .16); color: #fff; white-space: nowrap;
  }
  .rbar button.on { background: #fff; color: var(--head); }
  .rbar .n {
    font-size: 11.5px; font-weight: 600; margin-left: 5px;
    opacity: .72; font-variant-numeric: tabular-nums;
  }
  /* 고른 단추에만 붙는다. 다시 누르면 풀린다는 뜻 */
  .rbar .x { font-size: 13px; font-weight: 700; margin-left: 6px; opacity: .45; }

  /* 못 보낸 저장이 있을 때만 보이는 줄 */
  .qbar {
    display: none; margin: 10px -16px -6px; padding: 9px 16px;
    background: rgba(255, 255, 255, .14); color: #fff;
    font-size: 13px; font-weight: 700; letter-spacing: -0.2px;
  }
  .qbar.on { display: block; }
  /* 서버(Code.gs)가 옛 판일 때. 고치기 전에는 안 사라지므로 눈에 띄게 둔다 */
  .qbar.srv { background: rgba(179, 38, 30, .92); }

  .wrap { padding: 16px 14px 0; }

  /* ---------- 하단 탭 ---------- */
  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; gap: 4px;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #tabs button {
    flex: 1; height: 44px; min-width: 0;
    background: none; color: var(--ink-mid); border-radius: 22px;
    font-size: 14px; font-weight: 500; padding: 0;
  }
  #tabs button.on {
    color: var(--orange-dk); font-weight: 700;
    background: var(--orange-tint);
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  .tabcnt {
    display: none; margin-left: 5px; font-size: 11px; font-weight: 700;
    background: var(--wait); color: #fff; border-radius: 9px; padding: 1px 6px;
    vertical-align: 1px;
  }
  .tabcnt.show { display: inline-block; }

  /* ---------- 레코드 카드 ---------- */
  .rec {
    background: var(--surface);
    border-left: 5px solid #D8E0EC;
    border-radius: 13px;
    box-shadow: var(--shadow);
    padding: 11px 13px 10px;
    margin-bottom: 8px;
  }
  /* 당일발급이 되는 것이 보통이므로 초록 표시는 두지 않는다.
     불가능한 곳만 눈에 띄게 한다. */
  .rec.r-no   { border-left-color: var(--stop); }
  .rec.r-hold { border-left-color: var(--wait); }

  .rec h2 {
    margin: 0;
    font-size: 16.5px; font-weight: 700; letter-spacing: -.02em;
  }
  .addr {
    color: var(--ink-mid); font-size: 12.5px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 당일발급 표시: 불가능하거나 확인 안 된 경우에만 나온다 */
  .tag {
    display: inline-block; margin-top: 6px;
    font-size: 12.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 8px;
  }
  .tag.no  { background: var(--stop-bg); color: var(--stop); }
  .tag.unk { background: #EDF1F8; color: var(--ink-mid); font-weight: 600; }

  /* 병원DB 카드: 수정 버튼을 이름 옆에 두어 아래 한 줄을 없앤다 */
  .dbhead { display: flex; align-items: center; gap: 7px; }
  .dbhead h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 사전신청은 판단에 바로 쓰이므로 수정 버튼 왼쪽에 붙여 둔다 */
  .dbhead .pre {
    flex: 0 0 auto; font-size: 12px; font-weight: 700;
    padding: 4px 9px; border-radius: 8px; white-space: nowrap;
    background: var(--go-bg); color: var(--go);
  }
  .dbhead .pre.no { background: var(--stop-bg); color: var(--stop); }
  .dbhead .edit {
    flex: 0 0 auto; min-height: 32px; padding: 0 14px; border-radius: 16px;
    background: transparent; box-shadow: inset 0 0 0 1px #D2DBE9;
    color: var(--ink-mid); font-size: 12.5px; font-weight: 600;
  }

  /* 나머지 정보는 한 줄로 이어 붙인다 */
  .meta { margin-top: 5px; font-size: 12.5px; line-height: 1.8; color: var(--ink); }
  .meta > span { white-space: nowrap; }   /* 항목 이름과 값이 갈라지지 않게 */
  .meta i { font-style: normal; color: var(--ink-dim); margin-right: 4px; }
  .meta .chk { color: var(--ink-dim); }
  .meta .chk.old { color: var(--stop); font-weight: 700; }
  .meta b { font-weight: 600; }
  .meta b.no  { color: var(--stop); font-weight: 700; }
  .meta b.yes { color: var(--go);   font-weight: 700; }
  .meta b.wait { color: var(--wait); font-weight: 700; }
  .meta .sep { color: #D1DAE8; margin: 0 6px; }
  /* 병원DB: 지역 구분줄 */
  .rhead {
    margin: 17px 3px 7px; font-size: 13px; font-weight: 800;
    color: var(--ink-mid); letter-spacing: -0.2px;
  }
  .rhead:first-child { margin-top: 3px; }
  .rhead .cnt { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); margin-left: 5px; }


  .memo {
    margin-top: 8px; padding: 7px 10px;
    background: var(--orange-tint); border-radius: 9px;
    font-size: 12.5px; white-space: pre-wrap; color: #2C3E63;
  }

  /* 병원DB 메모 — 방문 메모와 구별되게 조용한 바탕으로 */
  .memo.hm { background: var(--paper); color: var(--ink-mid); }
  .memo.hm .tag {
    display: inline-block; margin-right: 6px; padding: 1px 5px;
    border-radius: 5px; background: rgba(45, 91, 215, .12);
    color: var(--orange); font-size: 10.5px; font-weight: 800;
    vertical-align: 1px;
  }

  /* 기록 창의 '차 블루투스' 상태 줄 */
  .carline {
    margin-top: 10px; padding: 9px 11px;
    background: var(--paper); border-radius: 10px;
    font-size: 12.5px; line-height: 1.6; color: var(--ink-mid);
  }
  .carline b { color: var(--ink); }

  .foot { display: flex; gap: 7px; margin-top: 9px; }
  .foot button { flex: 1; min-height: 40px; padding: 0 10px; border-radius: 10px; }
  .foot.split { justify-content: space-between; align-items: center; }
  .foot.split button { flex: 0 0 auto; min-height: 34px; padding: 0 16px; }

  .checked { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .checked.old { color: var(--stop); font-weight: 600; }

  .ver {
    text-align: center; font-size: 12.5px; color: var(--ink-mid);
    padding: 15px 0 8px; cursor: pointer; -webkit-user-select: none; user-select: none;
    background: var(--surface); border-radius: 12px; margin-top: 6px;
    box-shadow: inset 0 0 0 1px var(--rule);
  }
  .ver b { display: block; font-size: 14px; font-weight: 700; color: var(--orange-dk); }
  .ver .vsub {
    display: block; margin-top: 3px; font-size: 11px; color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .missing { color: var(--stop); font-size: 13px; font-weight: 600; margin-top: 5px; }

  /* ---------- 방문 순서 ---------- */
  .ordhead { display: flex; align-items: flex-start; gap: 9px; }
  .ordhead h2 { flex: 1; min-width: 0; margin: 0; }
  /* 다시 와서 받는 카드 — 같은 병원이라 번호도 같다. 옅게 해서 구별한다 */
  .ordnum.again { background: var(--paper); color: var(--orange); }

  .ordnum {
    flex: 0 0 auto; width: 25px; height: 25px; line-height: 25px; text-align: center;
    border-radius: 13px; background: var(--orange); color: #fff;
    font-size: 13px; font-weight: 700; margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .ordbtns { flex: 0 0 auto; display: flex; gap: 5px; }
  .ordbtns button {
    width: 36px; height: 36px; padding: 0; border-radius: 10px;
    background: #EFF3F9; color: var(--ink-mid); font-size: 14px; line-height: 1;
  }
  .ordbtns button[disabled] { opacity: .3; }

  /* ---------- 길찾기 버튼 ---------- */
  .route {
    display: block; width: 100%; margin-top: 9px; min-height: 44px;
    background: var(--orange-tint); color: var(--orange-dk);
    box-shadow: inset 0 0 0 1.5px var(--orange);
    font-size: 14px; font-weight: 700; border-radius: 11px;
  }
  .route .ib { width: 100%; }

  /* ---------- 완료 처리된 방문 ---------- */
  /* 카드 모양은 그대로 두고, 회색으로 흐리게만 처리한다 */
  .rec.done {
    background: #F0F4FA;
    border-left-color: #D4DDEA;
    box-shadow: none;
    opacity: .58;
  }
  .rec.done h2 {
    color: var(--ink-mid);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .donehead { display: flex; align-items: flex-start; gap: 10px; }
  .donehead h2 { flex: 1; min-width: 0; }
  .donehead .undo {
    flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 17px;
    background: transparent; box-shadow: inset 0 0 0 1px #CAD4E4;
    color: var(--ink-mid); font-size: 13px; font-weight: 600;
  }

  /* ---------- 날짜 구분 ---------- */
  .dayhead {
    display: flex; align-items: center; gap: 9px;
    margin: 24px 4px 10px;
    font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  }
  .dayhead:first-child { margin-top: 2px; }
  .dayhead .cnt { font-weight: 500; color: var(--ink-mid); font-size: 12.5px; }
  .dayhead.today { color: var(--orange-dk); }
  .dayhead .mapbtn {
    margin-left: auto; min-height: 34px; padding: 0 16px; border-radius: 17px;
    background: var(--surface); box-shadow: var(--shadow);
    color: var(--ink); font-size: 13px; font-weight: 600;
  }

  /* 보류 재방문일 */
  .holddate {
    font-size: 14px; font-weight: 700; color: var(--wait);
    background: var(--wait-bg); display: inline-block;
    padding: 6px 12px; border-radius: 10px; margin-bottom: 11px;
    font-variant-numeric: tabular-nums;
  }
  .holddate.tbd { color: var(--stop); background: var(--stop-bg); }

  /* ---------- 버튼 ---------- */
  button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    border: none; border-radius: 11px;
    padding: 10px 16px; background: var(--orange); color: #fff;
    cursor: pointer;
  }
  button.ghost { background: #E9EFF7; color: var(--ink); }
  button.hold  { background: var(--wait-bg); color: var(--wait); }
  button.small { font-size: 13.5px; }
  button:active { opacity: .68; }
  /* 그림과 글씨가 들어간 단추는 둘을 가로로 나란히 가운데에 둔다 */
  button svg + span, button span + svg { vertical-align: middle; }
  .ib { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

  #fab {
    position: fixed; right: 18px;
    bottom: calc(var(--tabh) + 22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 29px;
    font-size: 30px; font-weight: 300; line-height: 1; padding: 0;
    background: var(--orange);
    box-shadow: 0 6px 18px rgba(45,91,215,.38);
    z-index: 41;
  }

  /* ---------- 시트 ---------- */
  .sheet {
    position: fixed; inset: 0; background: var(--surface);
    z-index: 50; overflow-y: auto; display: none;
    padding: 18px 16px 112px;
    animation: rise .16s ease-out;
  }
  @keyframes rise { from { transform: translateY(14px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

  .sheet h2 { margin: 2px 0 20px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }

  label { display: block; margin-bottom: 17px; }
  label span.lbl {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-mid); margin-bottom: 7px;
  }
  input[type=text], input[type=password], input[type=time], input[type=date], textarea {
    width: 100%; padding: 12px 13px; font-size: 16px;
    border: 1.5px solid var(--rule); border-radius: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus {
    border-color: var(--orange); outline: none;
  }
  input[type=time], input[type=date] { font-variant-numeric: tabular-nums; }
  textarea { min-height: 94px; resize: vertical; line-height: 1.5; }
  #pickSearch { margin-bottom: 4px; }

  .seg { display: flex; gap: 7px; }
  .seg button {
    flex: 1; min-height: 48px; padding: 0 4px; border-radius: 12px;
    background: #EFF3F9; color: var(--ink-mid);
    font-size: 14px; font-weight: 500;
  }
  .seg button.sel { background: var(--orange); color: #fff; font-weight: 700; }
  .seg.wrap { flex-wrap: wrap; }
  .seg.wrap button { flex: 1 1 29%; min-width: 92px; }

  /* 점심시간은 넷을 한 줄에 넣는다. 글자를 조금 줄이고 여백을 아낀다. */
  .seg.lunch { flex-wrap: nowrap; gap: 5px; }
  .seg.lunch button {
    flex: 1 1 0; min-width: 0; padding: 0 2px;
    font-size: 12.5px; letter-spacing: -.04em; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .seg.lunch button.none { flex: 0 0 auto; padding: 0 12px; letter-spacing: 0; }

  .lunchbox, .datebox { display: flex; gap: 7px; align-items: center; }
  .lunchbox input[type=time], .datebox input[type=date] { flex: 1; min-width: 0; }
  .lunchbox .dash { color: var(--ink-dim); }
  .lunchbox button { flex: 0 0 68px; }
  .datebox button { flex: 0 0 56px; }
  .lunchbox button, .datebox button {
    min-height: 48px; padding: 0; border-radius: 12px;
    background: #EFF3F9; color: var(--ink-mid); font-size: 13.5px; font-weight: 500;
  }
  .lunchbox button.sel, .datebox button.sel { background: var(--orange); color: #fff; font-weight: 700; }

  .actions {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--rule);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 9px; z-index: 60;
  }
  .actions button { flex: 1; min-height: 50px; font-size: 15px; font-weight: 700; border-radius: 13px; }
  .actions button.del { flex: 0 0 66px; background: var(--stop-bg); color: var(--stop); }

  .chkrow {
    display: flex; align-items: center; gap: 9px; min-height: 46px;
    padding: 0 13px; border-radius: 11px; background: #EFF3F9;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .chkrow .box {
    flex: 0 0 auto; width: 22px; height: 22px; line-height: 22px; text-align: center;
    border-radius: 6px; background: #fff; box-shadow: inset 0 0 0 1.5px #CCD6E6;
    color: transparent; font-size: 14px; font-weight: 700;
  }
  .chkrow .txt { font-size: 13.5px; color: var(--ink-mid); }
  .chkrow.on { background: var(--go-bg); }
  .chkrow.on .box { background: var(--go); box-shadow: none; color: #fff; }
  .chkrow.on .txt { color: var(--go); font-weight: 600; }

  /* ---------- 병원 선택 ---------- */
  .picklist { margin-top: 10px; }
  .pickitem {
    padding: 15px 6px; border-bottom: 1px solid #ECF1F7;
    font-size: 16px; cursor: pointer;
  }
  .pickitem:active { background: #F7F9FD; }
  .pickitem small { display: block; color: var(--ink-mid); font-size: 12.5px; margin-top: 3px; }
  #pickList .rhead { margin: 14px 2px 4px; }
  #pickList .rhead:first-child { margin-top: 4px; }

  /* ---------- 동선 ---------- */
  .planbar {
    background: var(--surface); border-radius: 13px; box-shadow: var(--shadow);
    padding: 11px; margin-bottom: 10px;
  }
  .locline { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .locline .tag {
    flex: 0 0 auto; width: 30px; font-size: 12px; font-weight: 700; color: var(--ink-dim);
  }
  .locline button.sub {
    flex: 1; min-height: 40px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
    padding: 0 6px; background: #EFF3F9; color: var(--ink-mid);
  }
  .locline button.sub.on {
    background: var(--orange-tint); color: var(--orange-dk);
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  .locnow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 2px 0;
    font-size: 12.5px; color: var(--ink-mid); margin: 9px 0 4px;
  }
  .locnow b { color: var(--ink); font-weight: 700; }
  .locnow .via {
    background: var(--orange-tint); color: var(--orange-dk);
    border-radius: 7px; padding: 1px 7px; font-weight: 600;
  }
  .locnow .need { color: var(--ink-dim); font-weight: 600; }
  .locnow .ar { color: var(--ink-dim); margin: 0 7px; }
  /* 이름이 가리키는 실제 주소. 화살표를 쓰지 않는다 */
  .locwhere {
    font-size: 11.5px; line-height: 1.6; color: var(--ink-dim);
    margin: 0 0 10px;
  }
  .locwhere .k { color: var(--ink-mid); font-weight: 700; margin-right: 3px; }
  #addrHint { font-size: 12.5px; color: var(--ink-mid); line-height: 1.6; margin: -8px 0 10px; }
  .arow { display: flex; gap: 6px; align-items: center; }
  .arow input { flex: 1 1 auto; min-width: 0; }
  .arow .find {
    flex: 0 0 auto; min-height: 48px; padding: 0 15px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: var(--orange); color: #fff;
    font-size: 15px; font-weight: 700; font-family: inherit;
  }
  /* 눌러서 검색하는 칸. 잠긴 칸처럼 흐리게 두지 않고, 누를 수 있게 보이도록 한다 */
  .arow input[readonly] { background: var(--surface); color: var(--ink); cursor: pointer; }
  .arow input[readonly]::placeholder { color: var(--ink-dim); }
  #addrBox2 {
    /* 높이를 안 정하면 iframe 기본값(150px)으로 쪼그라들어
       찾은 주소가 두어 개씩만 보인다. 화면을 꽉 채우게 한다. */
    height: calc(100vh - 255px);
    height: calc(100dvh - 255px);
    min-height: 290px;
    border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--rule);
  }
  #addrBox2 > div, #addrBox2 iframe { width: 100% !important; height: 100% !important; }
  .pcwait {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; height: 100%; padding: 24px;
    text-align: center; font-size: 14px; line-height: 1.7; color: var(--ink-mid);
  }
  .pcwait button { margin-top: 4px; }
  /* 어떤 지도를 쓰고 있는지 알려 주는 줄 */
  .mapnote {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; line-height: 1.5; color: var(--ink-mid);
    margin: 0 2px 10px;
  }
  .mapnote:empty { display: none; }
  .mapnote span { flex: 1; word-break: break-word; }
  .mapnote b { color: var(--ink); font-weight: 700; }
  #mapDiagBtn { margin-left: auto; }
  #mapTop button + button { margin-left: 8px; }
  #mapDiag {
    display: none; position: absolute; top: 56px; left: 0; right: 0; bottom: 0;
    z-index: 62; background: #fff; overflow: auto; padding: 18px 16px 20px;
  }
  #mapDiag.on { display: block; }
  #mapDiag h3 { font-size: 17px; margin: 0 0 14px; color: var(--ink); }
  #mapDiag .dg {
    display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule);
    font-size: 13.5px; line-height: 1.5;
  }
  #mapDiag .dg b { flex: 0 0 118px; color: var(--ink-mid); font-weight: 600; }
  #mapDiag .dg span { flex: 1; color: var(--ink); font-weight: 600; word-break: break-all; }
  #mapDiag .dghelp { font-size: 12.5px; color: var(--ink-dim); line-height: 1.6; margin: 14px 0 0; }
  #mapDiag .row { display: flex; gap: 8px; margin-top: 18px; }
  #mapDiag .row button { flex: 1; }
  .mapnote button {
    flex: none; min-height: 30px; padding: 0 11px; border-radius: 9px;
    background: var(--orange-tint); color: var(--orange-dk);
    font-size: 12px; font-weight: 700; font-family: inherit;
  }
  .mapnote.top {
    position: absolute; top: 64px; left: 12px; right: 12px; z-index: 61;
    margin: 0; padding: 8px 10px; border-radius: 11px;
    background: rgba(255,255,255,.95); box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .mapnote.top:empty { display: none; }
  /* 네이버 지도 말풍선 */
  .niw { padding: 9px 12px; font-size: 13px; line-height: 1.6; color: #141C2B; }
  .niw a { color: var(--orange-dk); font-weight: 700; }
  .locnow .rough {
    display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 8px;
    background: var(--stop-bg); color: var(--stop); font-size: 11px; font-weight: 700;
  }
  .calcbtn {
    display: block; width: 100%; min-height: 46px; border-radius: 11px;
    font-size: 14.5px; font-weight: 700;
  }

  /* 최단거리 / 최단시간 견주기 */
  .modebox { display: flex; gap: 8px; margin-bottom: 10px; }
  .modebtn {
    flex: 1; min-height: 58px; border-radius: 12px; padding: 8px 6px;
    background: var(--surface); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .modebtn .nm { font-size: 13px; font-weight: 700; color: var(--ink-mid); }
  .modebtn .val { font-size: 11.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .modebtn.on { background: var(--orange-tint); box-shadow: inset 0 0 0 2px var(--orange); }
  .modebtn.on .nm { color: var(--orange-dk); }
  .modebtn.on .val { color: var(--orange-dk); }

  /* 계산된 순서로 보여줄 때의 카드 */
  .rec.planrec .ordhead { align-items: center; gap: 8px; }
  .rec.planrec h2 { flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .kd { flex: 0 0 auto; font-size: 11.5px; font-weight: 700;
    padding: 3px 8px; border-radius: 7px; background: #EBF0F7; color: var(--ink-mid); }
  .kd.get  { background: var(--go-bg);   color: var(--go); }
  .kd.put  { background: var(--wait-bg); color: var(--wait); }
  .kd.both { background: var(--orange-tint); color: var(--orange-dk); }
  .kd.warn { background: var(--stop-bg); color: var(--stop); }

  /* 왜 이렇게 도는지 한 줄 설명 */
  .whyline {
    margin-top: 9px; font-size: 12.5px; color: var(--wait); font-weight: 600;
    background: var(--wait-bg); border-radius: 9px; padding: 7px 10px;
  }
  .whyline.stay { color: var(--ink-mid); background: #EDF1F8; }
  .whyline.warn { color: var(--stop); background: var(--stop-bg); }

  /* 실제로 걸린 시간 한 줄 */
  .tlog {
    margin-top: 9px; font-size: 12.5px; color: var(--ink-mid);
    background: #EEF2F7; border-radius: 9px; padding: 7px 10px; line-height: 1.5;
  }
  .tlog b { color: var(--ink); font-weight: 700; }
  .tlog.mix { color: var(--stop); background: var(--stop-bg); }
  .trow {
    display: flex; align-items: center; gap: 8px; padding: 9px 2px;
    border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .trow .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .tv { color: var(--ink-mid); font-variant-numeric: tabular-nums; }
  .trow.off { opacity: .45; }
  .trow button { font-size: 12px; padding: 5px 9px; }
  .thint { font-size: 12.5px; color: var(--ink-dim); line-height: 1.6; margin-bottom: 8px; }
  .notebtn {
    display: inline-block; margin-left: 4px; font-size: 12px; padding: 3px 9px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    color: var(--brand); font-weight: 700;
  }

  /* 앱이 직접 묻는 창.
     아이폰 홈 화면 앱에서는 브라우저 물음창이 안 뜨므로 우리가 만든다. */
  /* 자바스크립트가 멈추면 여기 뜬다. 안 뜨면 아무 자리도 안 차지한다.
     ask(120) 보다 위에 둔다 — 물음창이 떠 있을 때 난 오류도 보여야 한다. */
  #errbar {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 130;
    background: #B3261E; color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    font-size: 12.5px; font-weight: 700; line-height: 1.55;
    white-space: pre-wrap; word-break: break-all;
  }
  #errbar.on { display: block; }

  .askwrap {
    display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    z-index: 120; background: rgba(18, 22, 30, .46);
    align-items: center; justify-content: center; padding: 22px;
  }
  .askwrap.on { display: flex; }
  .askbox {
    background: #fff; border-radius: 16px; padding: 20px 18px 16px;
    width: 100%; max-width: 340px; box-shadow: 0 18px 50px rgba(0, 0, 0, .3);
  }
  #askMsg { font-size: 14.5px; line-height: 1.65; white-space: pre-line; }
  #askIn { width: 100%; margin-top: 13px; }
  #askIn.off { display: none; }
  .askbtns { display: flex; gap: 8px; margin-top: 16px; }
  .askbtns button { flex: 1; }

  /* 출발 전에 해둘 일 */
  .prebox {
    background: var(--go-bg); color: var(--go); border-radius: 12px;
    padding: 11px 13px; margin-bottom: 10px; font-size: 12.5px; line-height: 1.6;
  }
  .prebox b { font-size: 13px; }
  .route.wide { margin-top: 2px; margin-bottom: 4px; }
  /* 동선 카드의 길찾기 · 먼저 가기 줄 */
  .navrow { display: flex; gap: 7px; margin-top: 9px; }
  .navrow .route { flex: 1; margin-top: 0; min-height: 40px; font-size: 13.5px; padding: 0 6px; }
  .navrow .pinbtn {
    flex: 0 0 auto; min-height: 40px; padding: 0 13px; border-radius: 11px;
    background: #EFF3F9; color: var(--ink-mid); font-size: 13.5px; font-weight: 700;
  }
  .navrow .pinbtn.on { background: var(--orange); color: #fff; }
  .pinbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: var(--orange-tint); border-radius: 11px;
    padding: 9px 11px; margin-bottom: 9px;
    font-size: 12.5px; font-weight: 600; color: var(--orange-dk);
  }
  .pinbar .who { flex: 1; min-width: 0; line-height: 1.5; }
  .pinbar button {
    flex: 0 0 auto; min-height: 32px; padding: 0 12px; border-radius: 9px;
    background: #fff; color: var(--ink-mid); font-size: 12.5px; font-weight: 700;
    box-shadow: inset 0 0 0 1.5px var(--rule);
  }
  .ordhead .pinmark {
    color: var(--orange); margin-left: 3px;
    display: inline-flex; vertical-align: -2px;
  }
  /* 글줄 안에 들어간 그림은 글자 높이에 맞춰 내린다
     (.who 를 flex 로 만들면 긴 이름이 줄바꿈될 때 모양이 깨진다) */
  .pinbar .who svg { vertical-align: -2px; margin-right: 3px; }

  /* 주유 · 충전 */
  #gasfab {
    position: fixed; right: 20px;
    bottom: calc(var(--tabh) + 88px + env(safe-area-inset-bottom));
    width: 54px; height: 54px; border-radius: 27px; padding: 0;
    display: flex; flex-direction: column; gap: 1px;
    align-items: center; justify-content: center;
    background: var(--surface); color: var(--orange);
    box-shadow: 0 4px 14px rgba(16,28,50,.18), inset 0 0 0 1.5px var(--rule);
    z-index: 41;
  }
  #gasfab .gaslbl {
    font-size: 8.5px; font-weight: 700; letter-spacing: -.02em;
    line-height: 1; color: var(--orange);
  }
  .gasitem {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border-radius: 13px;
    padding: 12px 13px; margin-bottom: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .gasitem .no {
    flex: 0 0 auto; width: 22px; text-align: center;
    font-size: 13px; font-weight: 800; color: var(--ink-dim);
  }
  .gasitem .who { flex: 1; min-width: 0; }
  .gasitem .who b { display: block; font-size: 15px; font-weight: 700; line-height: 1.35; }
  .gasitem .who small { font-size: 12px; color: var(--ink-dim); }
  .gasitem .pr {
    flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums;
  }
  .gasitem .pr b { display: block; font-size: 16px; font-weight: 800; }
  .gasitem .pr small { font-size: 11.5px; color: var(--ink-dim); }
  .gasitem.cheap .pr b { color: var(--go); }
  .gasitem button {
    flex: 0 0 auto; min-height: 38px; padding: 0 12px; border-radius: 10px;
    background: var(--orange-tint); color: var(--orange-dk); font-size: 13px; font-weight: 700;
    box-shadow: inset 0 0 0 1.5px var(--orange);
  }
  #gasNote { font-size: 12px; color: var(--ink-dim); line-height: 1.6; padding: 4px 2px 10px; }
  /* 어떤 동선을 기준으로 찾았는지 */
  #gasWay {
    font-size: 11.5px; color: var(--ink-dim); line-height: 1.65;
    padding: 9px 11px; margin-bottom: 9px; border-radius: 10px;
    background: #F4F7FB; word-break: keep-all;
  }
  #gasWay b { color: var(--ink-mid); font-weight: 600; }
  #gasWay .arrow { color: #BCC7DB; margin: 0 3px; }
  #gasMap {
    height: 230px; border-radius: 13px; margin-bottom: 10px;
    background: #E8EEF6; display: none; overflow: hidden;
  }
  #gasMap.on { display: block; }
  .gpin {
    background: var(--orange); color: #fff; border-radius: 50%;
    width: 24px; height: 24px; line-height: 24px; text-align: center;
    font-size: 12px; font-weight: 700; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .gpin.end { background: var(--wait); }
  .gtag {
    background: #fff; color: var(--ink); border-radius: 9px;
    padding: 2px 7px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.3), inset 0 0 0 1.5px var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .gtag.best { box-shadow: 0 1px 5px rgba(0,0,0,.3), inset 0 0 0 2px var(--go); color: var(--go); }
  .gasitem.pick { box-shadow: 0 0 0 2px var(--orange); }
  .planend .brk {
    display: block; margin-top: 3px; font-size: 12px; font-weight: 500;
    color: var(--ink-mid); letter-spacing: -.01em;
  }
  .planend .brk b { color: var(--go); font-weight: 700; }
  .planend .brk i { font-style: normal; color: var(--ink-dim); }
  .planend { font-size: 13.5px; font-weight: 700; text-align: center;
    padding: 6px 0 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .plannote { font-size: 12px; color: var(--ink-dim); line-height: 1.6; padding: 0 4px 14px; }
  .plannote b { color: var(--orange-dk); font-weight: 700; }
  .planwarn { background: var(--stop-bg); color: var(--stop); font-size: 12.5px;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-weight: 600; line-height: 1.55; }

  /* ---------- 지도 ---------- */
  #mapSheet { padding: 0; }
  #mapTop {
    position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 61;
    background: var(--orange); color: #fff; display: flex; align-items: center;
    padding: 0 14px; gap: 10px;
  }
  #mapTop span { font-size: 16px; font-weight: 700; }
  #mapTop button { margin-left: auto; background: rgba(255,255,255,.25); color: #fff; min-height: 36px; }
  /* 바깥 그릇이 자리와 크기를 맡는다. 네이버가 안쪽 그릇의 position 을
     relative 로 바꿔 버려도 높이가 무너지지 않게 하기 위함이다.
     (이것 때문에 지도 그림이 다 받아져 있는데도 화면이 하얬다) */
  /* z-index 를 매겨 두어야 지도 속 층수(400·800 …)가 바깥으로 새어 나오지
     않는다. 안 매기면 지도가 안내 줄·경고 줄을 덮어 버린다. */
  #mapWrap { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; z-index: 1; }
  #map { width: 100%; height: 100%; }
  .pin {
    background: var(--orange); color: #fff; border-radius: 50%;
    width: 28px; height: 28px; line-height: 28px; text-align: center;
    font-size: 13px; font-weight: 700; border: 2px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
  }
  /* 내 자리. 병원 핀과 한눈에 구별되게 색을 달리한다 */
  .pin.me {
    background: #14243D; font-size: 12px;
    box-shadow: 0 0 0 3px rgba(20,36,61,.22), 0 1px 5px rgba(0,0,0,.4);
  }
  #mapWarn {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 61;
    background: rgba(179,38,30,.94); color: #fff; padding: 11px 13px;
    border-radius: 12px; font-size: 13px; display: none;
  }

  /* ---------- 조사자 확인 ---------- */
  #login .who { margin: -8px 0 22px; font-size: 13.5px; color: var(--ink-mid); }
  /* '보기' 를 칸 안 오른쪽에 얹는다. 그래야 비밀번호 칸이 이름 칸과 너비가 같다 */
  /* 방문 창의 병원 칸 — 오른쪽에 'DB 수정' 단추를 얹는다 */
  .hrow { position: relative; }
  .hrow input { padding-right: 104px; }
  /* 바탕색은 방문일정의 + 단추와 같은 파랑, 크기는 '완료' 단추와 같게
     (기본 단추 모양 그대로 두고 자리만 잡아 준다) */
  .hrow #v_edith {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    font-size: 13.5px;
  }
  /* 방문 창 위에 겹쳐 뜨는 창. 방문 창을 닫지 않으므로 적던 메모가 안 날아간다 */
  .sheet.over { z-index: 60; }

  /* 창구에서 들은 말을 그대로 적는 칸 */
  .qrow { position: relative; }
  .qrow input { padding-right: 86px; }
  .qrow #f_quick::placeholder { font-size: 13px; }
  .qrow button {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    font-size: 13.5px;
  }
  .qnote {
    display: none; margin: -4px 0 12px; padding: 10px 12px;
    background: var(--paper); border-radius: 10px;
    font-size: 13px; font-weight: 600; color: var(--ink-mid); line-height: 1.7;
  }
  .qnote.on { display: block; }
  .qnote b { color: var(--ink); }
  .qnote .no { color: var(--stop); }

  .pwrow { position: relative; }
  .pwrow input { padding-right: 66px; }
  .pwrow #l_eye {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    min-height: 34px; padding: 0 12px; border-radius: 9px;
    background: var(--paper); color: var(--ink-mid);
    font-size: 13px; font-weight: 700; font-family: inherit;
  }
  #l_msg { min-height: 22px; font-size: 13.5px; font-weight: 600; color: var(--stop);
           line-height: 1.6; white-space: pre-line; }
  #l_msg.busy { color: var(--ink-mid); }
  #l_msg.good { color: var(--go); }
  /* 로그인 화면에서 바로 서버를 짚어 볼 수 있게 */
  #l_help { display: flex; gap: 8px; margin-top: 10px; }
  #l_help button {
    flex: 1; min-width: 0; min-height: 42px; border-radius: 11px;
    background: var(--paper); color: var(--ink-mid);
    font-size: 13px; font-weight: 600; font-family: inherit;
    padding: 0 4px; white-space: nowrap;
  }

  /* ---------- 빈 화면 · 토스트 ---------- */
  .empty {
    text-align: center; color: var(--ink-mid);
    padding: 64px 24px; font-size: 14.5px; line-height: 1.7;
  }
  /* 새 판이 올라왔을 때 뜨는 알림 */
  #upd {
    display: none; position: fixed; z-index: 60;
    left: 10px; right: 10px; bottom: calc(var(--tabh) + 14px);
    background: var(--ink); color: #fff;
    border-radius: 13px; padding: 12px 12px 12px 16px;
    align-items: center; gap: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.28);
    font-size: 13.5px; font-weight: 600;
  }
  #upd.on { display: flex; }

<script>
var TAB = 'visit';
try {

} catch (e) {}
var DB = [], VISITS = [];
var editId = null, vEditId = null, vHid = '';
var dateTbd = false;
var stayWait = false;   /* 접수 후 그 자리에서 대기 */
var rawOpen = '', rawLunch = '';   /* 시각칸이 못 읽은 원래 글자 */
var seg = { sameday: '', prereq: '', parking: '', wait: '' };
var rawWait = '';   /* 버튼에 없는 옛 글자를 지켜 준다 */
var vStatus = '예정';
var subDone = false;   /* 접수 완료 체크 */
var MAP = null, MARKERS = [];

var SEG_OPTS = {
  /* 대부분 되는 곳이라 '안 되는 곳'만 눌러 표시한다. 안 누르면 '가능'으로 저장된다. */

  /* 되는 방법만 고른다. 아무것도 안 누르면 사전신청이 안 되는 곳이다. */
  prereq:  ['유선', '팩스', '인터넷'],
  parking: ['가능', '인근'],
  wait:    ['10분 내외', '30분 내외', '1시간 내외']
};
var SEG_LABEL = { sameday: '당일발급', prereq: '사전신청', parking: '주차', wait: '발급소요' };

/* 점심시간 빠른 고르기. 오후 시각만 넣어 두어 오전으로 잘못 잡히는 일을 막는다. */
var LUNCH_QUICK = ['12:00-13:00', '12:30-13:30', '13:00-14:00'];
/* '없음' 은 '확인해 보니 점심에 안 쉰다'는 뜻. 아무것도 안 누른 것(아직 모름)과 구별된다. */
var LUNCH_NONE = '없음';
var LUNCH_OPTS = LUNCH_QUICK.concat([LUNCH_NONE]);

/* ---------- 단추에 들어가는 작은 그림 ----------
   이모지는 휴대폰이 제 색으로 그려 버려서 앱 색과 안 맞는다.
   그래서 같은 굵기·같은 색의 선 그림으로 직접 그려 쓴다.
   ico_(모양, 크기) 로 부른다. 색은 단추 글자색을 그대로 따라간다. */
function ico_(d, s) {
  return '<svg viewBox="0 0 24 24" width="' + (s || 17) + '" height="' + (s || 17) + '"' +
         ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
         ' stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto">' + d + '</svg>';
}
var D_PIN    = '<path d="M12 21.4s7-5.6 7-10.6a7 7 0 1 0-14 0c0 5 7 10.6 7 10.6z"/>' +
               '<circle cx="12" cy="10.6" r="2.6"/>';
var D_SEARCH = '<circle cx="10.6" cy="10.6" r="6.6"/><path d="M15.4 15.4 20.8 20.8"/>';
var D_NAVI   = '<path d="M20.6 3.8 3.9 10.4c-.8.3-.8 1.4 0 1.7l6.6 2.5c.3.1.5.3.6.6' +
               'l2.5 6.6c.3.8 1.4.8 1.7 0L20.6 3.8z"/>';
var D_FLAG   = '<path d="M5.5 21V3.4"/><path d="M5.5 4.3h11.8l-2.5 4 2.5 4H5.5"/>';
/* 압정 — '먼저 가기'로 고정해 둔 곳 */
var D_PUSH   = '<path d="M12 16.6V22"/>' +
               '<path d="M8.4 2.6h7.2l-.8 6.2 3 3.1c.5.5.1 1.4-.6 1.4H6.8'
               + 'c-.7 0-1.1-.9-.6-1.4l3-3.1-.8-6.2z"/>';

/* 방문일정 탭은 오늘 기준 이 일수 전까지만 보여준다 */
var APP_VER = 'v108';   /* 화면 맨 아래에 표시된다 */
var VISIT_DAYS_BACK = 3;
/* 네이버 지도: 목적지 1 + 경유지 5 = 한 번에 최대 6곳 (실측 확인됨) */
var NAV_MAX_STOPS = 6;

/* ---------- 공통 ---------- */
var toastTimer = null;
function toast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';   /* white-space: pre-line 로 줄바꿈 표시 */
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, ms || 2200);
}
/* 검색은 대문자·소문자를 가리지 않는다 */
function lc_(s) { return String(s == null ? '' : s).toLowerCase(); }
function hit_(hay, q) { return lc_(hay).indexOf(q) > -1; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* ---------- 창 열고 닫기 · 뒤로가기 ----------
   창이 열릴 때 뒤로가기 한 칸을 만들어 둔다.
   그래야 휴대폰에서 뒤로 밀었을 때 앱이 꺼지지 않고 창만 닫힌다. */
var SHEETS_BACK = ['addrSheet', 'visitForm', 'picker', 'form', 'gasSheet', 'mapSheet', 'timeSheet'];
/* ---------- 뒤로가기 지킴이 ----------
   열린 창은 SHEET_STACK 으로 앱이 직접 셈한다. 브라우저 기록에는
   '창이 열려 있다'는 표시로 지킴이 칸을 딱 하나만 올린다.

   예전에는 창 하나에 기록 한 칸씩을 썼는데, 창을 닫자마자 다른 창을 여는
   자리(병원 고르기 → 방문 등록)에서 순서가 뒤집혔다. history.back() 은
   나중에 실행되고 pushState() 는 바로 실행되기 때문이다. 그래서 한 번
   지날 때마다 기록이 한 칸씩 줄었고, 서너 번이면 바닥이 나서 뒤로가기가
   앱 밖으로 나가 버렸다. 저장 중이던 방문이 그때 통째로 날아갔다. */
var SHEET_STACK = [];      /* 열려 있는 창. 나중에 연 것이 뒤 */
var GUARD_ON = false;      /* 기록에 지킴이 칸이 올라가 있는가 */
var SKIP_POP = 0, EXIT_ARMED = false, CLOSE_T = null;

function topSheet_() {
  return SHEET_STACK.length ? SHEET_STACK[SHEET_STACK.length - 1] : null;
}
function pushGuard_() {
  try { history.pushState({ hdb: 1 }, ''); GUARD_ON = true; } catch (e) {}
}
function popGuard_() {
  if (!GUARD_ON) return;
  GUARD_ON = false; SKIP_POP++;
  try { history.back(); } catch (e) { SKIP_POP--; GUARD_ON = true; }
}

function openSheet(id) {
  var el = document.getElementById(id);
  if (!el) return;
  if (el.style.display !== 'block' && SHEETS_BACK.indexOf(id) > -1) {
    if (SHEET_STACK.indexOf(id) < 0) SHEET_STACK.push(id);
    /* 방금 닫은 창 때문에 예약된 뒤로가기가 있으면 취소한다.
       (닫자마자 여는 자리 — 기록을 아예 안 건드리게 된다) */
    if (CLOSE_T) { clearTimeout(CLOSE_T); CLOSE_T = null; }
    if (!GUARD_ON) pushGuard_();
  }
  el.style.display = 'block';
  window.scrollTo(0, 0);
}

function closeSheet(id) {
  if (id === 'form' || id === 'visitForm') OVER_V = null;
  var el = document.getElementById(id);
  if (!el) return;
  var was = (el.style.display === 'block');
  el.style.display = 'none';
  if (!was || SHEETS_BACK.indexOf(id) < 0) return;

  var at = SHEET_STACK.indexOf(id);
  if (at > -1) SHEET_STACK.splice(at, 1);
  if (SHEET_STACK.length) return;        /* 아직 다른 창이 열려 있다 */

  if (CLOSE_T) clearTimeout(CLOSE_T);
  CLOSE_T = setTimeout(function () {
    CLOSE_T = null;
    if (!SHEET_STACK.length) popGuard_();
  }, 0);
}

window.addEventListener('popstate', function () {
  if (SKIP_POP > 0) { SKIP_POP--; return; }
  GUARD_ON = false;                /* 방금 지킴이 칸을 써 버렸다 */

  var top = SHEET_STACK.pop();
  if (top) {                       /* 창이 열려 있으면 맨 위 창만 닫는다 */
    var e = document.getElementById(top);
    if (e) e.style.display = 'none';
    if (SHEET_STACK.length) pushGuard_();   /* 남은 창 몫으로 한 칸 다시 */
    return;
  }
  if (EXIT_ARMED) {                /* 두 번째 뒤로 → 진짜로 나간다 */
    EXIT_ARMED = false;
    try { history.back(); } catch (e) {}
    return;
  }
  EXIT_ARMED = true;               /* 첫 번째 뒤로 → 안내만 */
  toast('한 번 더 누르면 종료됩니다', 2000);
  pushGuard_();
  setTimeout(function () { EXIT_ARMED = false; }, 2000);
});

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
/* 방문 등록은 보통 전날 저녁에 하므로 다음 날을 기본으로 둔다 */
function tomorrowStr() {
  var d = new Date();
  d.setDate(d.getDate() + 1);
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function dayLabel(ds) {
  if (!ds) return '미정';
  ds = esc(String(ds));
  var d = new Date(ds + 'T00:00:00');
  var w = ['일','월','화','수','목','금','토'][d.getDay()];
  var base = ds.slice(5).replace('-', '.') + ' (' + w + ')';
  var t = todayStr();
  if (ds === t) return base + ' 오늘';
  if ((d - new Date(t + 'T00:00:00')) === 86400000) return base + ' 내일';
  return base;
}
function withinWindow(ds) {
  if (!ds) return true;
  var t = new Date(ds + 'T00:00:00').getTime();
  if (isNaN(t)) return true;
  var today = new Date(todayStr() + 'T00:00:00').getTime();
  return t >= today - VISIT_DAYS_BACK * 86400000;
}

/* ---------- 서버 통신 (JSONP) ---------- */
var API_DEFAULT = 'https://script.google.com/macros/s/AKfycbzblnGALj9dZqDHq6tNTlDsU4FWF9SPN2Kwtg5oe3zwGAbYQhQygUPcIoILhScGZisa/exec';
/* 구글에서 '새 배포'를 하면 주소가 바뀐다. 그때 앱 파일을 다시 만들지 않아도 되게
   이 기기에 적어 둔 주소를 먼저 쓴다. (판 번호를 길게 눌러 바꾼다) */
var API = API_DEFAULT;
try { API = localStorage.getItem('hdb_api') || API_DEFAULT; } catch (e) {}

function setApi(u) {
  u = String(u || '').trim();
  if (u && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) {
    toast('주소가 이상합니다.\nhttps://script.google.com/macros/s/…/exec 모양이어야 합니다.', 6000);
    return false;
  }
  API = u || API_DEFAULT;
  try {
    if (u) localStorage.setItem('hdb_api', u);
    else localStorage.removeItem('hdb_api');
  } catch (e) {}
  toast(u ? '서버 주소를 바꿨습니다. 다시 불러옵니다.' : '서버 주소를 처음 값으로 되돌렸습니다.', 4000);
  loadAll();
  return true;
}
var CODE = '', WHO = '', ME = '', _seq = 0;
try {
  CODE = localStorage.getItem('hdb_code') || '';
  WHO  = localStorage.getItem('hdb_who') || '';
} catch (e) { CODE = ''; WHO = ''; }
/* 예전 판에서 코드만 기억하고 있던 기기는 이름을 한 번 더 받아야 한다 */
if (CODE && !WHO) { CODE = ''; }

/* 주소 만들기 — 평소 통신과 진단이 같은 주소를 쓴다 */
function srvUrl_(params, cb) {
  var url = API + '?code=' + encodeURIComponent(CODE) + '&who=' + encodeURIComponent(WHO);
  if (cb) url += '&cb=' + cb;
  for (var k in params) url += '&' + k + '=' + encodeURIComponent(params[k]);
  return url;
}

/* 평소 통신은 <script> 태그로 한다.
   구글 Apps Script 는 다른 사이트에서 fetch 로 부르는 것을 제대로 허용하지 않는다.
   (v58 에서 fetch 로 바꿨다가 멀쩡하던 기기까지 막혔다. 되돌린 자리다)
   fetch 는 아래 '연결 확인' 진단에만 쓴다 — 그건 읽기만 하므로 안전하다. */
/* 서버로 보내 놓고 답을 기다리는 '저장'의 수.
   하나라도 남아 있으면 새로고침이 화면을 덮어쓰면 안 된다. 덮어쓰면
   방금 등록한 것이 사라지고, 사용자는 다시 등록해서 두 줄을 만든다. */
var BUSY = 0, NEED_LOAD = false;
var WRITE_FN = { saveHospital: 1, delHospital: 1, saveVisit: 1,
                 setStatus: 1, delVisit: 1, reorder: 1 };

function busyEnd_() {
  BUSY = Math.max(0, BUSY - 1);
  if (BUSY === 0 && NEED_LOAD) {
    NEED_LOAD = false;
    setTimeout(function () { loadAll(true); }, 400);   /* 미뤄 둔 새로고침 */
  }
}

function jsonp(params, ok, fail, waitMs) {
  if (!WRITE_FN[params.fn]) { scriptCall_(params, ok, fail, waitMs); return; }

  /* 신호가 없다 — 보내지 말고 쌓아 둔다. 화면은 되돌리지 않는다.
     되돌리면 지하 원무과에서 방금 적은 것이 그 자리에서 사라진다. */
  if (offline_()) {
    qAdd_(params);
    toast('신호가 없어 쌓아 뒀습니다 \u00b7 터지면 자동으로 보냅니다', 3600);
    return;
  }

  BUSY++;
  var done = false;
  function end() { if (done) return; done = true; busyEnd_(); }
  scriptCall_(params,
    function (s) { end(); ok(s); },
    function (e) { end(); fail(e); }, waitMs);
}

/* ---------- 서버가 옛 판인가 ----------
   앱은 제 판 번호만 확인했지, Code.gs 가 옛것인지는 안 봤다.
   그래서 재배포를 잊으면 '없는 창구', '병원 수정이 안 됨', '로그인 실패' 처럼
   겉모습이 제각각인 탈로 나타나 원인을 짚기 어려웠다.
   ★ Code.gs 의 SRV_VER 과 아래 NEED_SRV 를 같은 수로 맞춰 둔다. */
var NEED_SRV = 1;
var SRV_SEEN = null;        /* null = 아직 안 물어봤다 */

function takeSrv_(d) {
  if (!d || d.srv === undefined) { SRV_SEEN = 0; }   /* 옛 판이라 번호가 없다 */
  else SRV_SEEN = Number(d.srv) || 0;
  paintSrv_();
}

function srvOld_() { return SRV_SEEN !== null && SRV_SEEN < NEED_SRV; }

function paintSrv_() {
  var el = document.getElementById('srvbar');
  if (!el) return;
  if (!srvOld_()) { el.className = 'qbar srv'; el.textContent = ''; return; }
  el.className = 'qbar srv on';
  el.textContent = '\u26a0 서버(Code.gs)가 옛 판입니다 \u00b7 눌러서 고치는 법 보기';
}

function srvHelp_() {
  askOpen_('서버에 올린 Code.gs 가 앱보다 옛 판입니다.\n' +
           '이 상태에서는 저장·수정·워치가 제대로 안 돕니다.\n\n' +
           '필요한 판 ' + NEED_SRV + ' · 지금 서버 ' + (SRV_SEEN || '번호 없음') + '\n\n' +
           '고치는 법\n' +
           '1. 구글시트 → 확장 프로그램 → Apps Script\n' +
           '2. 받으신 Code.gs 를 전부 붙여넣고 저장\n' +
           '3. [배포] → 배포 관리 → \u270f\ufe0f 연필\n' +
           '4. 버전: 새 버전 → [배포]\n\n' +
           '※ \u2018새 배포\u2019 를 누르면 주소가 바뀌니 \u2018배포 관리\u2019 로 하세요.',
    null, [{ t: '닫기' }]);
}

/* ---------- 못 보낸 저장을 쌓아 둔다 ----------
   신호가 없는 것이 분명할 때만 쌓는다. 신호가 있는데 답이 늦는 경우는
   서버에 이미 들어갔을 수 있어서 쌓지 않는다 (다시 보내면 두 줄이 된다). */
var Q_KEY = 'hdb_q';
var QUEUE = [];
var Q_SENDING = false;
try { QUEUE = JSON.parse(localStorage.getItem(Q_KEY) || '[]') || []; } catch (e) { QUEUE = []; }
if (!(QUEUE instanceof Array)) QUEUE = [];

function qSave_() { try { localStorage.setItem(Q_KEY, JSON.stringify(QUEUE)); } catch (e) {} }

function offline_() {
  try { return navigator.onLine === false; } catch (e) { return false; }
}

function qAdd_(params) {
  QUEUE.push({ p: params, t: Date.now() });
  qSave_();
  paintQ_();
}

/* 쌓인 것을 앞에서부터 하나씩 보낸다. 순서가 바뀌면 안 되므로 하나씩이다. */
function qFlush_() {
  if (Q_SENDING || !QUEUE.length || offline_() || !CODE) return;
  Q_SENDING = true;
  var it = QUEUE[0];
  scriptCall_(it.p,
    function () {
      QUEUE.shift(); qSave_(); Q_SENDING = false; paintQ_();
      if (QUEUE.length) { setTimeout(qFlush_, 250); return; }
      toast('못 보냈던 것을 모두 보냈습니다', 3000);
      LAST_LOAD = 0;
      loadAll(true);               /* 서버가 매긴 번호를 받아 맞춘다 */
    },
    function () {
      Q_SENDING = false; paintQ_();
      /* 아직 신호가 없다면 그대로 둔다. 다음 기회에 다시 보낸다 */
    });
}

function paintQ_() {
  var el = document.getElementById('qbar');
  if (!el) return;
  if (!QUEUE.length) { el.className = 'qbar'; el.textContent = ''; return; }
  el.className = 'qbar on';
  el.textContent = offline_()
    ? ('\u26a0 신호가 없어 ' + QUEUE.length + '건을 못 보냈습니다 \u00b7 눌러서 다시 시도')
    : ('\u21bb 못 보낸 ' + QUEUE.length + '건을 보내는 중\u2026');
}

window.addEventListener('online', function () { paintQ_(); setTimeout(qFlush_, 600); });
window.addEventListener('offline', paintQ_);

/* 통신이 실패했을 때, 서버가 죽은 것인지 저장만 안 된 것인지 가린다.
   ping 은 아무것도 바꾸지 않으므로 실패한 자리에서 한 번 더 물어도 안전하다. */
function whyFail_(base, fail) {
  if (!window.fetch) { fail({ message: base }); return; }
  var t0 = Date.now();
  var done = false;
  function say(extra) {
    if (done) return;
    done = true;
    fail({ message: base + (extra ? '\n' + extra : '') });
  }
  setTimeout(function () { say('서버가 느립니다. 잠시 뒤 다시 해 보세요.'); }, 8000);
  fetch(srvUrl_({ fn: 'ping' }, ''))
    .then(function (r) { return r.text().then(function (t) { return { s: r.status, t: t }; }); })
    .then(function (d) {
      var okp = false;
      try { okp = !!JSON.parse(d.t).ok; } catch (e) {}
      if (okp) {
        /* 서버는 멀쩡한데 답만 못 받았다 = 대개 저장은 됐다.
           여기서 '한 번 더 누르라' 고 하면 같은 것이 두 줄이 된다. */
        say('서버는 살아 있습니다 (' + (Date.now() - t0) + 'ms).\n'
          + '답만 못 받았을 뿐 저장은 됐을 수 있습니다.\n'
          + '다시 누르지 마시고, 목록을 새로고침해서 들어갔는지 먼저 보세요.');
      } else {
        say('서버가 우리 답이 아닌 것을 보냈습니다 (' + d.s + ').\n'
          + String(d.t).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 100));
      }
    })
    .catch(function (e) {
      say('서버에 닿지도 못합니다. 통신 상태를 확인하세요.\n'
        + String((e && e.message) || e).slice(0, 70));
    });
}

function scriptCall_(params, ok, fail, waitMs) {
  var cb = '__cb' + (++_seq) + '_' + Date.now();
  var url = srvUrl_(params, cb);

  var sc = document.createElement('script'), done = false;
  var timer = setTimeout(function () {
    finish(null, { message: '서버 응답을 받지 못했습니다. (시간 초과)', probe: true });
    /* 구글 Apps Script 는 첫 요청에서 수십 초 걸릴 때가 있다.
       25초에 끊으면 서버에는 들어갔는데 '실패' 로 보이는 일이 잦았다. */
  }, waitMs || 40000);

  function finish(res, err) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (sc.parentNode) sc.parentNode.removeChild(sc);
    if (err) {
      if (err.probe) whyFail_(err.message, fail);
      else fail(err);
      return;
    }
    if (res && res.ok) ok(res);
    else if (res && res.err === 'AUTH') authFail();
    else fail({ message: (res && res.err) || '알 수 없는 오류' });
  }

  window[cb] = function (res) { finish(res, null); };
  sc.onerror = function () {
    finish(null, { message: '서버 응답을 받지 못했습니다.', probe: true });
  };
  sc.src = url;
  document.head.appendChild(sc);
}

/* 서버 호출을 한 곳에 모아둔다 */
function srv() {
  var ok = function () {};
  var fail = function (e) { toast('실패: ' + e.message, 5200); };
  var r = {};
  r.then = function (f) { ok = f; return r; };
  r.err  = function (f) { fail = f; return r; };
  /* 갖고 있는 병원DB 지문을 같이 보낸다. 서버 쪽이 그대로면 병원DB를 안 보낸다.
     (133KB 중 거의 전부가 병원DB다. 방문일정은 작아서 늘 받는다) */
  r.all         = function ()       { jsonp({fn:'all', hv: (DB.length ? DB_HV : '')},
                                            function (s) { ok(s); }, fail); return r; };
  r.saveHosp    = function (d)      { jsonp({fn:'saveHospital', data:JSON.stringify(d)}, function (s) { ok(s.res); }, fail); return r; };
  r.delHosp     = function (id)     { jsonp({fn:'delHospital', id:id}, function () { ok(); }, fail); return r; };
  r.saveVisit   = function (d)      { jsonp({fn:'saveVisit', data:JSON.stringify(d)}, function (s) { ok(s.id); }, fail); return r; };
  r.setStatus   = function (id, st) { jsonp({fn:'setStatus', id:id, status:st}, function () { ok(); }, fail); return r; };
  r.delVisit    = function (id)     { jsonp({fn:'delVisit', id:id}, function () { ok(); }, fail); return r; };
  r.reorder     = function (ids)    { jsonp({fn:'reorder', ids:ids.join(',')}, function () { ok(); }, fail); return r; };
  r.geo         = function (q)      { jsonp({fn:'geo', q:q}, function (s) { ok(s); }, fail); return r; };
  r.route       = function (pts)    { jsonp({fn:'route', pts:pts}, function (s) { ok(s.res); }, fail, 40000); return r; };
  r.fuel        = function (pts, k) { jsonp({fn:'fuel', pts:pts, kind:k}, function (s) { ok(s.res); }, fail, 60000); return r; };
  /* 첫 계산은 구간을 수십 개 물어봐야 해서 오래 걸린다. 넉넉히 기다린다. */
  r.times       = function (pts, f, t) { jsonp({fn:'times', pts:pts, from:f||'', to:t||''}, function (s) { ok(s.res); }, fail, 90000); return r; };
  return r;
}

/* ---------- 조사자 확인 ---------- */
function showLogin(msg) {
  var m = document.getElementById('l_msg');
  m.className = ''; m.textContent = msg || '';
  document.getElementById('l_code').value = '';
  document.getElementById('l_who').value = WHO || '';
  var eye = document.getElementById('l_eye');
  document.getElementById('l_code').type = 'password';
  if (eye) eye.textContent = '보기';
  openSheet('login');
}
function authFail() {
  try {
    localStorage.removeItem('hdb_code');
    localStorage.removeItem('hdb_who');
  } catch (e) {}
  CODE = '';
  showLogin('이름 또는 비밀번호가 맞지 않습니다.');
}

/* 서버가 실제로 무슨 답을 하는지 그대로 읽어 온다.
   '실패했다'만 알던 예전과 달리, 응답 번호와 답의 첫 줄을 눈으로 본다. */
function pingServer_() {
  var m = document.getElementById('l_msg');
  m.className = 'busy';
  m.textContent = '서버에 말을 걸어 보는 중…';

  if (!window.fetch) {
    m.className = '';
    m.textContent = '이 브라우저가 오래되어 자세히 볼 수 없습니다.\n[직접 열기] 를 눌러 보세요.';
    return;
  }

  var t0 = Date.now();
  fetch(srvUrl_({ fn: 'ping' }, ''))
    .then(function (r) { return r.text().then(function (t) { return { s: r.status, t: t }; }); })
    .then(function (d) {
      var ms = Date.now() - t0;
      var body = String(d.t).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      var res = null;
      try { res = JSON.parse(d.t); } catch (e) {}
      if (res && res.ok) {
        m.className = 'good';
        m.textContent = '서버까지 잘 닿습니다. (' + ms + 'ms)\n'
                      + '이름과 비밀번호를 다시 확인해 주세요.';
        return;
      }
      m.className = '';
      m.textContent = '서버가 답은 했는데 우리 답이 아닙니다.\n'
                    + '응답 번호: ' + d.s + '\n'
                    + '내용: ' + body.slice(0, 140);
    })
    .catch(function (e) {
      m.className = '';
      m.textContent = '서버에 닿지 못했습니다.\n'
                    + '이유: ' + String((e && e.message) || e).slice(0, 90) + '\n'
                    + '[직접 열기] 도 눌러 보세요.';
    });
}

/* 앱이 막히면 원인이 앱에 있는지 서버에 있는지 가려야 한다.
   같은 주소를 브라우저 창으로 직접 열어 구글이 무슨 말을 하는지 눈으로 본다.
     · x({"ok":true}) 가 보이면  → 서버는 멀쩡하다. 막는 건 이 기기 쪽이다.
     · 구글 로그인 화면이 보이면 → 배포의 공개 범위·실행 대상 설정이다.
     · 오류 쪽지가 보이면       → 그 글이 곧 원인이다. */
function openPing_() {
  var u = API + (API.indexOf('?') > -1 ? '&' : '?') + 'fn=ping&cb=x';
  var m = document.getElementById('l_msg');
  m.className = 'busy';
  m.textContent = '새 창에서 열었습니다. 거기 나온 글을 그대로 알려 주세요.';
  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---------- 앱이 직접 묻는 창 ----------
   브라우저가 주는 confirm / prompt 는 아이폰에서 '홈 화면에 추가' 한 앱일 때
   아예 안 뜨고 곧바로 '취소' 로 처리된다. 그래서 삭제도, 주소 바꾸기도,
   지도 열쇠 넣기도 아무 반응 없이 안 먹었다. 앱 안에서 직접 묻는다. */

function askClose_() { document.getElementById('ask').className = 'askwrap'; }

/* btns: [{ t: 글자, k: 단추 모양, fn: function (적은 값) {} }]
   fn 이 없는 단추는 그냥 닫기다. */
function askOpen_(msg, input, btns) {
  var inp = document.getElementById('askIn');
  document.getElementById('askMsg').textContent = msg;
  if (input == null) { inp.className = 'off'; inp.value = ''; }
  else { inp.className = ''; inp.value = String(input); }

  var wrap = document.getElementById('askBtns');
  wrap.innerHTML = '';
  btns.forEach(function (b) {
    var el = document.createElement('button');
    el.type = 'button';
    el.textContent = b.t;
    if (b.k) el.className = b.k;
    el.onclick = function () {
      var v = inp.value;
      askClose_();
      if (b.fn) b.fn(v);
    };
    wrap.appendChild(el);
  });
  document.getElementById('ask').className = 'askwrap on';
  if (input != null) setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60);
}

/* 예 / 아니오 — 예일 때만 onYes 를 부른다 */
function ask_(msg, onYes, yesWord) {
  askOpen_(msg, null, [
    { t: '취소', k: 'ghost' },
    { t: yesWord || '확인', fn: function () { onYes(); } }
  ]);
}

/* 글자를 받는다 — 취소하면 onOk 를 안 부른다 */
function askText_(msg, value, onOk) {
  askOpen_(msg, value == null ? '' : value, [
    { t: '취소', k: 'ghost' },
    { t: '확인', fn: function (v) { onOk(v); } }
  ]);
}

/* 서버 주소 고치기 (로그인 화면에서도 쓸 수 있게) */
function editApi_() {
  askText_('구글 Apps Script 배포 주소\n(비워 두고 확인하면 처음 값으로 되돌립니다)', API,
    function (u) {
      API = (u.trim() || API_DEFAULT);
      try {
        if (u.trim()) localStorage.setItem('hdb_api', API);
        else localStorage.removeItem('hdb_api');
      } catch (e) {}
      var m = document.getElementById('l_msg');
      if (m) { m.className = 'busy';
               m.textContent = '주소를 바꿨습니다. [서버 연결 확인] 을 눌러 보세요.'; }
    });
}

/* 비밀번호를 눈으로 확인하고 싶을 때 */
function togglePw() {
  var el = document.getElementById('l_code'), b = document.getElementById('l_eye');
  var show = (el.type === 'password');
  el.type = show ? 'text' : 'password';
  b.textContent = show ? '가리기' : '보기';
  try { el.focus(); } catch (e) {}
}
/* 확인과 데이터 받기를 한 번에 처리한다 (왕복 2회 -> 1회) */
function doLogin() {
  var w = document.getElementById('l_who').value.trim();
  var v = document.getElementById('l_code').value.trim();
  var m = document.getElementById('l_msg');
  if (!w) { m.className = ''; m.textContent = '이름을 넣으세요.'; return; }
  if (!v) { m.className = ''; m.textContent = '비밀번호를 넣으세요.'; return; }
  WHO = w; CODE = v;
  m.className = 'busy'; m.textContent = '확인 중…';
  srv().then(function (d) {
      ME = d.name; takeAll_(d); takeSrv_(d);
      cacheWrite();
      try {
        localStorage.setItem('hdb_code', CODE);
        localStorage.setItem('hdb_who', WHO);
      } catch (e) {}
      closeSheet('login');
      toast(ME + '님 확인되었습니다');
      render();
    })
    .err(function (e) { CODE = ''; m.className = ''; m.textContent = e.message; })
    .all();
}

/* ---------- 로드 · 캐시 ---------- */
/* 마지막으로 받은 목록을 기기에 저장해 둔다.
   다음에 열면 그걸 즉시 보여주고, 새 자료는 뒤에서 받아 바꿔 끼운다. */
var DB_HV = '';        /* 지금 갖고 있는 병원DB의 지문 */

/* ---------- 차에서 찍힌 때를 받아 쓴다 ----------
   아이폰 웹앱은 화면에 없으면 위치를 못 본다. 그래서 도착을 스스로 못 안다.
   차 블루투스가 끊기는 때(내린 때)를 단축어 자동화가 서버에 찍어 두고,
   앱이 다음에 켜질 때 그걸 받아 도착으로 쓴다. 출발도 같은 식이다(선택).

   ★ 서버는 '언제' 가 아니라 '얼마나 지났나' 를 보낸다.
      폰 시계와 서버 시계가 달라도 어긋나지 않는다. */
/* 차에서 마지막으로 찍힌 때 (몇 분 전인가). 되고 있는지 보여 주기만 한다 */
var CAR_SEEN = { a: null, d: null, at: 0 };

function takeStamps_(d) {
  var now = Date.now();

  /* 길찾기를 안 눌렀어도 '찍혔다' 는 사실은 적어 둔다.
     안 그러면 단축어가 도는지 안 도는지 확인할 길이 없다. */
  var aAgo = Number(d && d.arriveAgo) || 0;
  var dAgo = Number(d && d.departAgo) || 0;
  if (aAgo || dAgo) {
    CAR_SEEN = { a: aAgo ? Math.round(aAgo / 60000) : null,
                 d: dAgo ? Math.round(dAgo / 60000) : null, at: now };
  }

  if (!TRIP) return;

  /* ① 출발 — [길찾기] 를 누른 뒤에 차에 탔으면 그때부터 잰다.
        누르고 서류 챙기고 주차장까지 걸어간 시간을 빼 준다. */
  var dago = Number(d && d.departAgo) || 0;
  if (dago && !TRIP.t1) {
    var t0 = now - dago;
    if (t0 > TRIP.t0 && (now - t0) / 60000 < TRIP_DROP) {
      TRIP.t0 = t0;
      tripSave_();
    }
  }

  /* ② 도착 — 차에서 내린 때 */
  var ago = Number(d && d.arriveAgo) || 0;
  if (!ago || TRIP.t1) return;
  var t1 = now - ago;
  if (t1 <= TRIP.t0) return;                     /* 출발보다 앞선 기록이다 */
  var mins = (t1 - TRIP.t0) / 60000;
  if (mins < TRIP_MIN || mins > TRIP_DROP) return;
  TRIP.t1 = t1;
  tripSave_();
  toast('차에서 내린 때로 도착을 적었습니다 \u00b7 이동 ' + Math.round(mins) + '분', 3200);
}

/* 받은 것을 DB·VISITS 에 넣는다. '안 바뀜'이면 병원DB는 그대로 둔다. */
function takeAll_(d) {
  if (d.same) {
    /* 서버가 '병원DB 그대로' 라고 답했다. 방문일정만 갈아 끼운다 */
    if (d.hv) DB_HV = d.hv;
  } else {
    DB = d.hospitals || [];
    DB_HV = d.hv || '';
  }
  VISITS = d.visits || [];
}

function cacheRead() {
  try {
    var s = localStorage.getItem('hdb_cache');
    if (!s) return null;
    var c = JSON.parse(s);
    /* 모양이 이상하면 없는 셈 친다 (예전 형식이거나 저장 중 끊긴 경우) */
    if (!c || !(c.hospitals instanceof Array) || !(c.visits instanceof Array)) return null;
    return c;
  }
  catch (e) { return null; }
}
/* 화면에서 뭔가를 직접 바꿨다는 표시.
   뒤늦게 도착한 갱신 응답이 이 변경을 덮어쓰지 못하게 한다. */
var MUT_SEQ = 0, LOAD_SEQ = 0;
function touch_() { MUT_SEQ++; cacheWrite(); render(); }

function cacheWrite() {
  try { localStorage.setItem('hdb_cache',
          JSON.stringify({ hospitals: DB, visits: VISITS, hv: DB_HV })); }
  catch (e) {}
}

/* quiet = true 면 화면을 비우지 않고 조용히 갱신한다 */
var LAST_LOAD = 0;          /* 마지막으로 시트에서 받아온 때 */

function loadAll(quiet) {
  var mutAt = MUT_SEQ, my = ++LOAD_SEQ;
  LAST_LOAD = Date.now();
  if (!quiet) document.getElementById('list').innerHTML = '<div class="empty">불러오는 중…</div>';
  srv().then(function (d) {
        /* 내가 그 사이에 뭔가 바꿨거나, 더 나중에 부른 갱신이 있으면
           이 응답은 낡은 것이다. 그대로 덮어쓰면 방금 지운 게 되살아난다. */
        if (my !== LOAD_SEQ || mutAt !== MUT_SEQ) return;
        /* 아래 BUSY 검사에 걸려 돌아가더라도 이건 먼저 챙긴다 —
           차에서 찍힌 때는 놓치면 다시 받을 길이 없다 */
        takeStamps_(d);
        takeSrv_(d);
        /* 아직 서버로 보내 놓고 답을 못 받은 저장이 있으면, 지금 받은
           자료에는 그게 안 들어 있다. 덮어쓰면 방금 한 일이 사라진다.
           끝난 뒤에 다시 받아온다. */
        if (BUSY > 0) { NEED_LOAD = true; return; }
        ME = d.name || ME;
        takeAll_(d);
        cacheWrite(); render();
      })
       .err(function (e) { if (quiet) toast('갱신 실패: ' + e.message, 4200); else fail(e); })
       .all();
}
function fail(e) {
  document.getElementById('list').innerHTML =
    '<div class="empty">불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
}

/* 방문 건에 붙은 병원 고유번호로 찾는다. 없으면 이름으로 */
function findHospital(v) {
  var hid = (v && v.hid) || '';
  var name = (v && v.name) || v;
  var i;
  if (hid) { for (i = 0; i < DB.length; i++) if (DB[i].id === hid) return DB[i]; }
  for (i = 0; i < DB.length; i++) if (DB[i].name === name) return DB[i];
  return null;
}

/* ---------- 탭 ---------- */
var TAB_TITLE = { visit: '방문일정', hold: '보류 건', db: '병원 실무정보 DB' };

function visitsOf(kind) {
  return VISITS.filter(function (v) {
    return kind === 'hold' ? (v.status === '보류') : (v.status !== '보류');
  });
}

function paintHoldCount() {

  var el = document.getElementById('holdCnt');
  el.textContent = n;
  el.className = n ? 'tabcnt show' : 'tabcnt';

/* ---------- 지도 ---------- */
function openDayMap(ds) {
  var items = visitsOf('visit').filter(function (v) {
    return v.date === ds && v.status !== '완료';
  });
  var pts = [], missing = [];

  items.forEach(function (v) {
    var h = findHospital(v);
    if (h && h.lat && h.lng) pts.push({ name: v.name, lat: h.lat, lng: h.lng });
    else missing.push(v.name);
  });

  if (!pts.length) { toast('남은 방문지 중 좌표가 있는 병원이 없습니다.'); return; }

  document.getElementById('mapTitle').textContent = dayLabel(ds) + ' · ' + pts.length + '곳';

  /* 내 자리도 같이 찍는다. 병원 번호와 섞이지 않게 따로 표시한다. */
  if (MYLOC && MYLOC.lat && MYLOC.lng) {
    pts = pts.concat([{ name: MYLOC.label || '출발지', lat: MYLOC.lat, lng: MYLOC.lng, me: true }]);
  }
  openSheet('mapSheet');

  var warn = document.getElementById('mapWarn');
  if (missing.length) {
    warn.textContent = '좌표 없음: ' + missing.join(', ');
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }

  setTimeout(function () { drawMap(pts); }, 60);
}

function drawMap(pts) {
  NM_LAST = { kind: 'map', pts: pts };
  /* 판단이 끝날 때까지 화면이 아무 말 없이 하얀 것을 막는다 */
  if (NM_KEY && NM_STATE !== 'ok') mapWait_('mapNote');
  ensureNaver_(function (api) {
    mapNote_('mapNote');
    if (!api) { drawMapL_(pts); return; }
    /* 네이버 쪽에서 걸리더라도 흰 화면으로 끝내지 않는다 */
    try { drawMapN_(pts); nmWatch_('map'); }
    catch (e) { nmFail_('지도를 그리다 걸렸습니다: ' + String((e && e.message) || e).slice(0, 60)); }
  });
}

/* 네이버 지도로 그리기 */
var NMAP = null, NMARK = [], NIW = null;
function drawMapN_(pts) {
  var api = naverReady_();
  if (!api) { drawMapL_(pts); return; }
  if (!NMAP) {
    /* 중심점과 배율은 만들 때 같이 줘야 한다. 빼먹으면 그려지지 않는 일이 있다 */
    var c0 = pts && pts.length ? new api.LatLng(pts[0].lat, pts[0].lng)
                               : new api.LatLng(37.5666, 126.9784);
    NMAP = new api.Map('map', { center: c0, zoom: 13, zoomControl: true, mapDataControl: false });
    NIW = new api.InfoWindow({ content: '', borderWidth: 0, disableAnchor: true });
  }

  NMARK.forEach(function (m) { m.setMap(null); });
  NMARK = [];
  if (NIW) NIW.close();

  var first = null, bounds = null, n = 0, no = 0;
  pts.forEach(function (p) {
    var ll = new api.LatLng(p.lat, p.lng);
    /* 내 자리는 번호를 매기지 않는다. 병원 차례와 헷갈리기 때문이다 */
    var html = p.me ? '<div class="pin me">나</div>'
                    : '<div class="pin">' + (++no) + '</div>';
    var mk = new api.Marker({
      position: ll, map: NMAP,
      icon: { content: html, anchor: new api.Point(14, 14) }
    });
    api.Event.addListener(mk, 'click', function () {
      NIW.setContent('<div class="niw">' + esc(p.name) + '</div>');
      NIW.open(NMAP, mk);
    });
    NMARK.push(mk);
    n++;
    if (!first) { first = ll; bounds = new api.LatLngBounds(ll, ll); }
    else bounds.extend(ll);
  });

  api.Event.trigger(NMAP, 'resize');
  if (!n) return;
  if (n === 1) { NMAP.setCenter(first); NMAP.setZoom(15); }
  else NMAP.fitBounds(bounds, { top: 70, right: 40, bottom: 40, left: 40 });
}

/* 예전 지도(기본) — 네이버가 안 될 때만 쓴다 */
function drawMapL_(pts) {
  if (typeof L === 'undefined') { toast('지도를 불러오지 못했습니다 (통신 확인)', 4200); return; }
  if (!MAP) {
    MAP = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(MAP);
  }
  MARKERS.forEach(function (m) { MAP.removeLayer(m); });
  MARKERS = [];

  var bounds = [], no = 0;
  pts.forEach(function (p) {
    var icon = L.divIcon({
      className: '',
      html: p.me ? '<div class="pin me">나</div>'
                 : '<div class="pin">' + (++no) + '</div>',
      iconSize: [28, 28], iconAnchor: [14, 14]
    });
    var m = L.marker([p.lat, p.lng], { icon: icon }).addTo(MAP).bindPopup(p.name);
    MARKERS.push(m);
    bounds.push([p.lat, p.lng]);
  });

  MAP.invalidateSize();
  if (bounds.length === 1) MAP.setView(bounds[0], 14);
  else MAP.fitBounds(bounds, { padding: [40, 40] });
}

function closeMap() { closeSheet('mapSheet'); }

/* ---------- 네이버 지도 ----------
   열쇠(클라이언트 ID)가 있어야 하고, 네이버 클라우드 콘솔에 이 앱 주소가
   등록돼 있어야 한다. 둘 중 하나라도 안 되면 네이버가 인증 실패를 알려 주는데,
   그때는 지금까지 쓰던 지도로 조용히 돌아간다. 지도가 아예 안 나오는 것보다 낫다. */
var NM_KEY = '';
try { NM_KEY = localStorage.getItem('hdb_nmkey') || ''; } catch (e) {}

/* '' 아직 안 해 봄 / 'ok' 됨 / 'nokey' 열쇠 없음 / 'fail' 네이버가 거절 */
var NM_STATE = NM_KEY ? '' : 'nokey';
var NM_LOADING = false, NM_WAIT = [];

/* 그려 놓고 잠시 뒤 '진짜로 그려졌는지' 본다.
   네이버가 지도를 그리면 그릇 안에 내용물이 생긴다. 비어 있으면 실패다.
   여기까지 와야 '흰 화면에 아무 설명도 없는' 상태가 사라진다. */
function nmDrawn_(el) {
  /* 지도 그림이 실제로 붙었는지 본다.
     '자식 요소가 있는가'로는 안 된다. 거절당한 지도에도 자식은 생긴다.
     (실제 네이버로 재어 본 결과다)
     그림을 <img>/<canvas> 로 까는 방식과 배경으로 까는 방식을 모두 본다.
     둘 중 하나라도 있으면 그려진 것으로 친다 — 멀쩡한 지도를 잘못
     죽이는 쪽이 더 나쁘기 때문이다. */
  if (!el) return false;
  if (el.querySelectorAll('img, canvas').length > 0) return true;
  var kids = el.querySelectorAll('div');
  for (var i = 0; i < kids.length && i < 60; i++) {
    var bg = '';
    try { bg = getComputedStyle(kids[i]).backgroundImage; } catch (e) {}
    if (bg && bg !== 'none') return true;
  }
  return false;
}

function nmWatch_(id) {
  var tries = 0;
  (function look() {
    if (NM_STATE !== 'ok') return;                 /* 이미 되돌아갔다 */
    var el = document.getElementById(id);
    if (nmDrawn_(el)) return;                      /* 잘 그려졌다 */
    if (++tries < 9) { setTimeout(look, 600); return; }   /* 약 5초까지 기다린다 */
    nmFail_('열쇠는 통과했는데 지도가 그려지지 않습니다');
  })();
}

/* 지금 지도가 어떤 상태인지 그대로 보여 준다.
   짐작으로 고치는 것을 그만두기 위해 만든 창이다. */
function mapDiag_() {
  var el = document.getElementById('map');
  var n = window.naver;
  var rows = [
    ['판 번호', APP_VER],
    ['네이버 열쇠', NM_KEY || '(없음)'],
    ['상태', NM_STATE || '(판단 중)'],
    ['까닭', NM_WHY || '-'],
    ['네이버 파일', (n && n.maps && n.maps.Map) ? '받아짐' : '없음'],
    ['거절 통보', NM_AUTHFAIL ? '받음 (' + NM_AUTHFAIL + '회)' : '없음'],
    ['네이버 지도 만듦', NMAP ? '예' : '아니오'],
    ['기본 지도 만듦', MAP ? '예' : '아니오'],
    ['기본 지도 준비', (typeof L === 'undefined') ? '안 됨 (통신 확인)' : '됨'],

/* 네이버를 아예 끄고 지금까지 쓰던 지도로 완전히 돌아간다 */
function naverOff_() {

/* 마지막으로 무엇을 그렸는지 적어 둔다. 인증 실패가 늦게 오면
   이걸 보고 그 자리에서 예전 지도로 다시 그린다. */
var NM_LAST = null, NM_WHY = '', NM_AUTHFAIL = 0;

/* 열쇠가 틀리거나 주소가 등록 안 됐을 때 네이버가 이 함수를 불러 준다.
   ★ 이름은 navermap_authFailure 다. 예전에 s 를 하나 더 붙여 놓아서
     네이버가 알려 줘도 못 알아듣고 흰 화면만 남았다. */
function nmFail_(why) {
  NM_STATE = 'fail';
  NM_WHY = why || '';
  nmFallback_();
}
window.navermap_authFailure = function () {
  NM_AUTHFAIL++;
  nmFail_('네이버가 인증을 거절했습니다');
};
window.navermaps_authFailure = window.navermap_authFailure;   /* 옛 이름도 함께 */

/* 네이버로 그려 둔 것을 걷어 내고 예전 지도로 다시 그린다 */
function nmFallback_() {
  try { if (NMAP && NMAP.destroy) NMAP.destroy(); } catch (e) {}
  try { if (NGMAP && NGMAP.destroy) NGMAP.destroy(); } catch (e) {}
  NMAP = null; NMARK = []; NIW = null;
  NGMAP = null; NGOV = []; NGIW = null;
  try { if (MAP && MAP.remove) MAP.remove(); } catch (e) {}
  try { if (GMAP && GMAP.remove) GMAP.remove(); } catch (e) {}
  MAP = null; MARKERS = [];
  GMAP = null; GLAYER = null;
  var a = document.getElementById('map');     if (a) a.innerHTML = '';
  var b = document.getElementById('gasMap');  if (b) b.innerHTML = '';

  if (!NM_LAST) return;
  if (NM_LAST.kind === 'map') { mapNote_('mapNote'); drawMapL_(NM_LAST.pts); }
  else { mapNote_('gasMapNote'); drawGasMapL_(); }
}

function naverReady_() {
  return (NM_STATE !== 'fail' && NM_STATE !== 'nokey' &&
          window.naver && naver.maps && naver.maps.Map) ? naver.maps : null;
}

function ensureNaver_(cb) {
  if (!NM_KEY) { NM_STATE = 'nokey'; cb(null); return; }
  if (NM_STATE === 'fail') { cb(null); return; }
  if (naverReady_()) { cb(naverReady_()); return; }

  NM_WAIT.push(cb);
  if (NM_LOADING) return;
  NM_LOADING = true;

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    NM_LOADING = false;
    var api = naverReady_();
    if (api) NM_STATE = 'ok';
    else if (NM_STATE !== 'fail') {
      NM_STATE = 'fail';
      if (!NM_WHY) NM_WHY = '네이버 지도를 불러오지 못했습니다';
    }
    var ws = NM_WAIT; NM_WAIT = [];
    for (var i = 0; i < ws.length; i++) { try { ws[i](api); } catch (e) {} }
  }

  var sc = document.createElement('script');
  sc.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NM_KEY);
  /* 파일은 받아졌어도 열쇠가 틀리면 조금 뒤에 인증 실패를 알려 온다.
     그 통보를 받고 나서 판단해야 한다. */
  sc.onload = function () { setTimeout(finish, 900); };
  sc.onerror = function () { NM_WHY = '네이버 파일을 받지 못했습니다 (통신 확인)'; finish(); };
  document.head.appendChild(sc);
  setTimeout(finish, 9000);
}

/* 아직 판단 중일 때. 흰 화면에 아무 말도 없는 시간을 없앤다 */

/* 지도 아래(위)에 무슨 지도를 쓰는지, 무엇이 모자란지 알려 준다 */
function mapNote_(id) {
  var el = document.getElementById(id);

  if (NM_STATE === 'nokey') {

  } else {
    var tip = (NM_WHY.indexOf('통과') >= 0)
      ? '네이버 콘솔에서 <b>Web Dynamic Map</b> 이 켜져 있는지 확인하세요.'
      : '네이버 콘솔에 <b>' + esc(location.hostname || '(이 주소)') + '</b> 가 등록돼 있는지 확인하세요.';
    msg = (NM_WHY || '네이버 지도를 불러오지 못했습니다') + ' → 기본 지도로 보여 줍니다.'
        + '<br>열쇠: ' + esc(NM_KEY || '(없음)') + ' · ' + tip;

  el.innerHTML = '<span>' + msg + '</span>' +
    '<button type="button" onclick="setNaverKey_()">열쇠 넣기</button>';
}

      toast(k ? '열쇠를 넣었습니다. 앱을 새로 엽니다…' : '기본 지도로 돌아갑니다…', 2500);
      setTimeout(function () { location.reload(); }, 1200);

/* 당일발급이 되는 것이 보통이므로, 되는 경우에는 아무 표시도 하지 않는다.
   불가능한 곳만 빨갛게 드러낸다. */
/* ---------- 지역 (#15 · #20) ----------
   주소 앞머리를 시/도 + 시·군·구 로 잘라 묶는다.
   표기가 '서울특별시'든 '서울'이든 같은 묶음으로 간다. */
var SIDO_MAP = {
  '서울특별시':'서울','서울시':'서울','서울':'서울',
  '부산광역시':'부산','부산시':'부산','부산':'부산',
  '대구광역시':'대구','대구시':'대구','대구':'대구',
  '인천광역시':'인천','인천시':'인천','인천':'인천',
  '광주광역시':'광주','광주시':'광주',
  '대전광역시':'대전','대전시':'대전','대전':'대전',
  '울산광역시':'울산','울산시':'울산','울산':'울산',
  '세종특별자치시':'세종','세종시':'세종','세종':'세종',
  '경기도':'경기','경기':'경기',
  '강원특별자치도':'강원','강원도':'강원','강원':'강원',
  '충청북도':'충북','충북':'충북','충청남도':'충남','충남':'충남',
  '전북특별자치도':'전북','전라북도':'전북','전북':'전북',
  '전라남도':'전남','전남':'전남',
  '경상북도':'경북','경북':'경북','경상남도':'경남','경남':'경남',
  '제주특별자치도':'제주','제주도':'제주','제주':'제주'
};
/* 구를 떼고 시·도 하나로 묶을 곳. 서울은 일부러 뺐다. */
var MERGE_GU = { '부산': 1, '대구': 1, '인천': 1,
                 '광주': 1, '대전': 1, '울산': 1 };

function regionOf(addr) {
  var t = String(addr || '').trim().split(/\s+/).filter(Boolean);
  if (!t.length) return { key: '\uffff', label: '주소 없음' };
  var sido = SIDO_MAP[t[0]] || t[0];
  var gu = t[1] || '';
  /* 고양시 일산동구·안산시 상록구처럼 시 아래 구가 또 있으면 구는 떼고 시로 묶는다.
     한 시 안에서 구를 나눠 봐야 동선이 달라지지 않는다.
     인천·부산 같은 광역시도 통으로 묶는다. 가는 일이 드물어 구까지 나눌 것이 없다.
     서울만 구별로 둔다 — 서울은 다니는 곳이 많아 구가 갈려야 쓸모가 있다. */
  if (MERGE_GU[sido]) gu = '';
  var label = gu ? (sido + ' ' + gu) : sido;
  return { key: label, label: label };
}

/* 지역(시·도 → 시·군·구)으로 묶고, 그 안에서는 병원 이름 가나다순.
   주소가 없는 병원은 맨 뒤로. 병원DB 목록과 병원 고르기가 같은 순서를 쓴다. */
function sortByRegion_(list) {
  list.forEach(function (h) { if (!h._rg) h._rg = regionOf(h.addr); });
  list.sort(function (a, b) {
    if (a._rg.key !== b._rg.key) return a._rg.key.localeCompare(b._rg.key, 'ko');
    return a.name.localeCompare(b.name, 'ko');
  });
  return list;
}

/* 지역이 바뀔 때만 구분줄을 돌려준다 */
function regionHead_(list) {
  var cnt = {};
  list.forEach(function (h) { cnt[h._rg.key] = (cnt[h._rg.key] || 0) + 1; });
  var last = null;
  return function (h) {
    if (h._rg.key === last) return '';
    last = h._rg.key;
    return '<div class="rhead">' + esc(h._rg.label) +
           '<span class="cnt">' + cnt[h._rg.key] + '곳</span></div>';
  };
}

function recCls(h, extra) {
  var c = 'rec';
  if (h && h.sameday === '불가능') c += ' r-no';
  return extra ? (c + ' ' + extra) : c;
}

function isOld(d) {
  if (!d) return false;
  var t = new Date(d).getTime();
  if (isNaN(t)) return false;
  return (Date.now() - t) > 1000 * 60 * 60 * 24 * 180;
}

/* 사전신청 배지: 되는 곳은 초록, 안 되는 곳은 빨강 */

/* 방문 메모에 '접수완료' 표시가 있는지 */
function isSubmitted(v) {
  return String((v && v.memo) || '').indexOf(DONE_MARK) > -1;
}
/* 화면에 보여줄 메모 (표시는 떼고) */
function plainMemo(v) {
  return String((v && v.memo) || '').split(DONE_MARK).join('').trim();
}

/* 주차 '인근'인 병원의 주차장 좌표가 등록돼 있는지 */
function hasParkPoint(h) { return !!(h && h.pLat && h.pLng); }

/* 당일발급 표시: 가능하면 아무것도 안 띄운다 */
/* 대부분이 '당일발급 가능'이라, 안 되는 곳만 알린다. */
function samedayTag(h) {
  if (h.sameday === '불가능') return '<div class="tag no">당일발급 불가</div>';
  return '';
}


/* 나머지 항목은 한 줄로 이어 붙여 카드를 낮춘다 */
/* #14 발급 소요: 10분대 초록 · 30분대 검정 · 1시간 이상 빨강 */
function waitCls_(v) {
  var t = String(v || '');
  if (!t) return '';
  if (/우편|등기/.test(t)) return '';
  var m = parseWait(t);
  if (m == null) return '';
  if (m <= 15) return ' class="yes"';
  if (m <= 45) return '';
  return ' class="no"';
}

function metaLine(h, opt) {
  opt = opt || {};
  var out = [];
  /* hl 이 참이면 '되는 경우'를 초록으로 강조한다 (사전신청은 되는 곳이 드물어서) */
  function add(k, v, hl) {
    if (!v) return;
    var cls = '';
    if (v === '불가능') cls = ' class="no"';
    else if (hl) cls = ' class="yes"';
    out.push('<span><i>' + k + '</i><b' + cls + '>' + esc(v) + '</b></span>');
  }
  /* 사전신청은 되는 곳이 드물다. 되는 곳만 초록으로 알리고 '불가능'은 적지 않는다. */
  if (h.prereq && h.prereq !== '불가능') add('사전신청', h.prereq, true);
  /* 주차가 '인근'인데 주차장 주소가 없으면 길찾기를 할 수 없으므로 미리 알린다 */
  if (h.parking === '인근' && !hasParkPoint(h)) {
    out.push('<span><i>주차</i><b class="no">인근 · 주소 없음</b></span>');
  } else {
    add('주차', h.parking);
  }
  /* '접수 후 대기'는 화면에 적지 않는다. 병원DB 입력 칸에서만 체크하고,
     동선 계산에서 최단시간에 반영하는 용도로만 쓴다. */
  if (h.wait) out.push('<span><i>발급</i><b' + waitCls_(h.wait) + '>' + esc(h.wait) + '</b></span>');
  add('진료', h.open);
  add('점심', h.lunch);
  if (opt.checked) {
    out.push('<span class="chk' + (isOld(h.checked) ? ' old' : '') + '">' +
             (h.checked ? '확인 ' + esc(h.checked) : '확인일 없음') + '</span>');
  }
  if (!out.length) return '';
  return '<div class="meta">' + out.join('<span class="sep">·</span>') + '</div>';
}

function infoBlock(h) {
  if (!h) return '<div class="missing">병원DB에 없는 병원입니다</div>';
  return (h.addr ? '<div class="addr">' + esc(h.addr) + '</div>' : '') +
         samedayTag(h) + metaLine(h) +
         /* 병원DB에 적어 둔 메모. 창구에서 들은 말이 여기 쌓인다 —
            방문일정에서도 보여야 가기 전에 확인할 수 있다.
            방문 메모(v.memo)와 섞이지 않게 'DB' 라고 적어 둔다. */
         (h.memo ? '<div class="memo hm"><span class="tag">DB</span>' +
                   esc(h.memo) + '</div>' : '');
}

/* 완료된 방문: 카드는 그대로, 회색으로 흐리게 + 날짜 그룹 안 맨 아래로 */
function doneCard(v) {
