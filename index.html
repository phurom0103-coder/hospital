      '<button class="sub' + (MYLOC && MYLOC.kind === 'home' ? ' on' : '') +
        '" onclick="useHomeFrom()">집</button>' +
      '<button class="sub' + (MYLOC && MYLOC.kind === 'gps' ? ' on' : '') +
        '" onclick="useGps()"><span class="ib">' + ico_(D_PIN) + '현재 위치</span></button>' +
      '<button class="sub' + (MYLOC && MYLOC.kind === 'addr' ? ' on' : '') +
        '" onclick="findAddr(\'from\')"><span class="ib">' + ico_(D_SEARCH) + '주소 검색</span></button>' +
    '</div>' +

    '<div class="locline">' +
      '<span class="tag">도착</span>' +
      '<button class="sub' + (endKind === 'home' ? ' on' : '') + '" onclick="useSpot(\'home\')">집</button>' +
      '<button class="sub' + (endKind === 'office' ? ' on' : '') + '" onclick="useSpot(\'office\')">사무실</button>' +
      '<button class="sub' + (endKind === 'custom' ? ' on' : '') + '" onclick="findAddr(\'to\')">직접</button>' +
    '</div>' +

    locLine_(date) +
    '<button class="calcbtn" onclick="calcPlan(\'' + date + '\')">' +
      (mine ? '다시 계산' : '동선 계산') + '</button>' +
  '</div>';
}

/* 출발 · 도착 요약줄.
   화살표는 '거기서 저리로 간다'는 뜻으로만 쓴다. 이름이 가리키는 실제 주소는
   화살표로 잇지 않고 아래 줄에 따로 적는다. 예전에는 둘 다 화살표여서
   '현재 위치 → 집 → 경의로 130' 처럼 세 군데를 들르는 것으로 읽혔다. */
function locLine_(date) {
  var n = stopsOf(date).length;

  var from = MYLOC ? '<b>' + esc(MYLOC.label) + '</b>' +
                     (MYLOC.noNum ? ' <span class="rough">번지 없음</span>' : '')
                   : '<span class="need">출발지</span>';
  var to   = MYEND ? '<b>' + esc(MYEND.label) + '</b>'
                   : '<span class="need">도착지</span>';
  var mid  = n ? '<span class="via">병원 ' + n + '곳</span>' : '';

  var line = '<div class="locnow">' + from +
             '<span class="ar">\u2192</span>' +
             (mid ? mid + '<span class="ar">\u2192</span>' : '') +
             to + '</div>';

  /* 이름이 실제로 어느 주소인지 — 화살표 없이 */
  var det = [];
  if (MYLOC && MYLOC.found && MYLOC.found !== MYLOC.label)
    det.push('<span class="k">' + esc(MYLOC.label) + '</span> ' + esc(MYLOC.found));
  if (MYEND && MYEND.found && MYEND.found !== MYEND.label)
    det.push('<span class="k">' + esc(MYEND.label) + '</span> ' + esc(MYEND.found));
  if (det.length) line += '<div class="locwhere">' + det.join('<br>') + '</div>';

  if (!MYLOC || !MYEND)
    line += '<div class="locwhere">출발지와 도착지를 정하면 계산할 수 있습니다.</div>';

  return line;
}

/* 계산된 순서를 아직 쓸 수 있는지.
   완료된 곳이 빠지는 건 괜찮다. 계산할 때 없던 병원이 늘어난 경우만 다시 계산한다.
   (좌표가 없어 계산에서 빠진 병원도 '본' 것이므로 다시 계산할 이유가 아니다) */
function curPlan() {
  if (!PLAN || PLAN.err || !PLAN.modes) return null;
  return PLAN.modes[PLAN_MODE] || PLAN.modes.time || PLAN.modes.dist || null;
}

function planUsable(date) {
  if (!PLAN || PLAN.err || !curPlan()) return false;
  if (PLAN.date !== date) return false;
  var seen = PLAN.seen || {};
  var todo = stopsOf(date);
  if (!todo.length) return false;
  for (var i = 0; i < todo.length; i++) if (!seen[todo[i].id]) return false;
  return true;
}

/* 오늘 묶음을 계산된 순서로 그린다 */
/* ---------- 네이버에 실제 경로를 물어본다 ----------
   구간을 따로따로 더한 값은 어림이다. 짜 놓은 순서 그대로 한 번 더 물어보면
   네이버 지도에서 보게 될 값과 같아진다. */
var REAL_SEQ = 0;

/* 지금 보고 있는 순서대로 [출발, 병원…, 도착] */
function realPts_() {
  var cur = curPlan();
  if (!cur || !MYLOC || !MYEND) return null;
  var live = {};
  stopsOf(PLAN.date).forEach(function (v) { live[v.id] = 1; });

  var seen = {}, out = [{ lat: MYLOC.lat, lng: MYLOC.lng }];
  cur.steps.forEach(function (st) {
    var sp = PLAN.stops[st.i];
    if (seen[st.i] || !live[sp.id]) return;
    seen[st.i] = 1;
    out.push({ lat: sp.lat, lng: sp.lng });
  });
  if (out.length < 2) return null;
  out.push({ lat: MYEND.lat, lng: MYEND.lng });
  return out;
}

/* 네이버에 물어보는 일이 지금 돌고 있나.
   돌고 있으면 순서 저장을 그 뒤로 미룬다 — 겹치면 [완료] 가 줄 끝에 선다. */
var REAL_BUSY = 0;
var ORDER_WAIT = false;

function orderLater_() {
  if (REAL_BUSY > 0) { ORDER_WAIT = true; return; }
  syncPlanOrder_();
}
function orderFlush_() {
  if (!ORDER_WAIT || REAL_BUSY > 0) return;
  ORDER_WAIT = false;
  setTimeout(syncPlanOrder_, 300);
}

function verifyRoute() {
  var pts = realPts_();
  if (!pts) { orderFlush_(); return; }
  var mode = PLAN_MODE, date = PLAN.date, my = ++REAL_SEQ;
  var key = mode + ':' + pts.length;
  PLAN.real = PLAN.real || {};
  if (PLAN.real[key]) { orderFlush_(); return; }   /* 이미 물어봤다 */
  PLAN.realErr = '';

  REAL_BUSY++;
  srv().then(function (r) {
      REAL_BUSY = Math.max(0, REAL_BUSY - 1);
      orderFlush_();                          /* 미뤄 둔 순서 저장을 이제 보낸다 */
      if (!r || r.min == null) return;        /* 못 받아 왔으면 어림값을 그대로 쓴다 */
      if (my !== REAL_SEQ) return;            /* 그 사이 순서가 바뀌었으면 버린다 */
      if (!PLAN || PLAN.date !== date) return;
      PLAN.real = PLAN.real || {};
      PLAN.real[key] = { min: r.min, km: r.km };
      planSave(); render();
    })
    .err(function (e) {                       /* 못 받으면 어림값을 그대로 쓴다 */
      REAL_BUSY = Math.max(0, REAL_BUSY - 1);
      if (my === REAL_SEQ && PLAN && PLAN.date === date) {
        PLAN.realErr = String((e && e.message) || e);
        render();
      }
      orderFlush_();
    })
    .route(pts.map(function (p) { return p.lat + ',' + p.lng; }).join(';'));
}

/* 두 방식을 견주는 카드 */
function modeCard() {
  var A = PLAN.modes.dist, B = PLAN.modes.time;
  function line(m, key, label) {
    if (!m) return '';
    var cnt = 0, seen = {};
    m.steps.forEach(function (st) { if (!seen[st.i]) { seen[st.i] = 1; cnt++; } });
    var later = (m.out || []).length;
    return '<button class="modebtn' + (PLAN_MODE === key ? ' on' : '') +
      '" onclick="setMode(\'' + key + '\')">' +
      '<span class="nm">' + label + '</span>' +
      '<span class="val">' + (m.km ? m.km + 'km' : '-') +
        ' · ' + dur_(m.end - PLAN.start) +
        (later ? ' · ' + later + '곳 내일' : '') + '</span></button>';
  }
  if (!A && !B) return '';
  return '<div class="modebox">' + line(A, 'dist', '최단거리') + line(B, 'time', '최단시간') + '</div>';
}

function planBody(date) {
  var cur = curPlan();
  if (!cur) return '';
  var live = {};
  stopsOf(date).forEach(function (v) { live[v.id] = v; });

  /* 아직 안 끝난 단계만 남긴다 */
  var steps = cur.steps.filter(function (st) { return !!live[PLAN.stops[st.i].id]; });

  /* 제자리에서 기다렸다 받는 경우는 한 장으로 묶는다 */
  var rows = [];
  for (var k = 0; k < steps.length; k++) {
    var st = steps[k];
    if (k + 1 < steps.length && steps[k + 1].i === st.i) {
      rows.push({ i: st.i, kind: '접수+수령', wait: steps[k + 1].at - st.at, again: false });
      k++;
      continue;
    }
    var seenBefore = false;
    for (var q = 0; q < k; q++) if (steps[q].i === st.i) seenBefore = true;
    /* 대학병원처럼 계산에서 이미 한 번으로 묶인 경우는 대기시간이 단계에 실려 온다 */
    rows.push({ i: st.i, kind: st.kind, wait: st.wait || 0,
                again: seenBefore, next: null });
  }
  /* 접수만 하고 나중에 받는 경우, 몇 번째에 다시 오는지 */
  rows.forEach(function (r, idx) {
    if (r.kind !== '접수') return;
    for (var q = idx + 1; q < rows.length; q++) if (rows[q].i === r.i) { r.next = q - idx; break; }
  });

  var out = modeCard();

  /* 고정해 둔 곳이 있으면 맨 위에 알린다 */
  var pn = pinList_(date);
  if (pn.length) {
    var nm = pn.map(function (id) {
      var vv = live[id];
      if (vv) return vv.name;
      var st0 = null;
      PLAN.stops.forEach(function (x) { if (x.id === id) st0 = x; });
      return st0 ? st0.name : '?';
    });
    out += '<div class="pinbar"><span class="who">' + ico_(D_PUSH, 15) + ' 먼저 가기 · ' +
           esc(nm.join(' → ')) + '</span>' +
           '<button onclick="clearPins()">처음부터 다시</button></div>';
  }

  /* 출발 전에 사전신청해 둘 곳 */
  var pre = [];
  rows.forEach(function (r) {
    var stop = PLAN.stops[r.i], h = findHospital(live[stop.id]);
    if (!stop.submitted && h && h.prereq && h.prereq !== '불가능') {
      pre.push(stop.name + '(' + h.prereq + ')');
    }
  });
  if (pre.length) {
    out += '<div class="prebox"><b>출발 전 사전신청</b><br>' + esc(pre.join(' · ')) + '</div>';
  }

  if (!rows.length && !(cur.out && cur.out.length)) return '';

  var half = {}; (cur.half || []).forEach(function (n) { half[n] = 1; });

  /* 번호는 '몇 번째 병원' 이다. 접수하고 나중에 다시 와 받는 곳은 카드가
     둘이지만 병원은 하나다. 둘에 같은 번호를 준다 — 안 그러면 병원이
     한 곳 더 있는 것처럼 보인다. */
  var noOf = {}, noSeq = 0;
  rows.forEach(function (r) {
    var sid = PLAN.stops[r.i].id;
    if (!noOf[sid]) noOf[sid] = ++noSeq;
  });

  rows.forEach(function (r, idx) {
    var stop = PLAN.stops[r.i], v = live[stop.id], h = findHospital(v);
    var ordNo = noOf[stop.id] || (idx + 1);
    var cls = r.kind === '수령' ? 'get' : (r.kind === '접수' ? 'put' : 'both');

    out += '<div class="' + recCls(h, 'planrec') + '">' +
      '<div class="ordhead">' +
        '<span class="ordnum' + (r.again ? ' again' : '') + '">' + ordNo + '</span>' +
        '<h2>' + (r.again ? '↩ ' : '') + esc(v.name) +
          (pinAt_(date, v.id) > -1 ? '<span class="pinmark">' + ico_(D_PUSH, 14) + '</span>' : '') + '</h2>' +
        '<span class="kd ' + cls + '">' + r.kind + '</span>' +
      '</div>' +
      infoBlock(h);

    var memo = plainMemo(v);
    if (memo) out += '<div class="memo">' + esc(memo) + '</div>';

    /* 왜 이렇게 도는지 한 줄로 설명 */
    if (r.kind === '수령' && stop.submitted) {
      out += '<div class="whyline">지난번 접수해 둠 · 받기만 하면 됩니다</div>';
    } else if (r.kind === '수령' && !r.again && h && h.prereq && h.prereq !== '불가능') {
      out += '<div class="whyline">사전신청(' + esc(h.prereq) + ') 해두고 방문</div>';
    } else if (r.kind === '접수+수령') {
      out += '<div class="whyline stay">여기서 기다렸다 받습니다' +
             (r.wait > 0 ? ' · 약 ' + dur_(r.wait) : '') + '</div>';
    } else if (r.kind === '접수' && r.next) {
      /* 번호가 병원 번호라 '○번에서' 라고 하면 제 번호를 가리키게 된다.
         몇 군데 더 들렀다 오는지로 말한다. */
      out += '<div class="whyline">' +
             (r.next === 1 ? '다음에 바로 다시 와 받습니다'
                           : (r.next - 1) + '곳 들렀다 다시 와 받습니다') + '</div>';
    } else if (r.kind === '접수' && half[v.name]) {
      out += '<div class="whyline warn">오늘은 접수까지만 · 수령은 다음에</div>';
    }

    /* 오늘 받을 수 없는 곳은 '완료' 대신 '접수함' 을 준다.
       누르면 접수한 것으로 표시하고 보류로 넘긴다. 다음에 수령만 잡힌다. */
    /* 길찾기 두 가지 + 먼저 가기 (#1 · #2) */
    var pAt = pinAt_(date, v.id);
    out += '<div class="navrow">' +
      '<button class="route" onclick="routeOne(\'' + v.id + '\')"><span class="ib">' + ico_(D_NAVI) + '길찾기</span></button>' +
      (idx > 0 ? '<button class="route" onclick="routePlan(\'' + v.id + '\')"><span class="ib">' + ico_(D_FLAG) + '여기까지</span></button>' : '') +
      /* 다시 들르는 줄(↩)에는 붙이지 않는다. 고정은 '처음 가는 차례'를 정하는 것이라서. */
      (r.again ? '' :
        '<button class="pinbtn' + (pAt > -1 ? ' on' : '') + '" onclick="pinFirst(\'' + v.id + '\')">' +
          '<span class="ib">' + ico_(D_PUSH, 15) + (pAt > -1 ? '해제' : '먼저') + '</span>' + '</button>') +
    '</div>';

    var halfOnly = (r.kind === '접수' && !r.next);
    out += '<div class="foot">' +
      (r.kind === '접수' && r.next ? ''
        : halfOnly
          ? '<button class="small" onclick="submitAndHold(\'' + v.id + '\')">접수함</button>'
          : '<button class="small" onclick="doneVisit(\'' + v.id + '\')">완료</button>') +
      '<button class="hold small" onclick="holdVisit(\'' + v.id + '\')">보류</button>' +
      '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
    '</div></div>';
  });

  if (rows.length) {
    /* 네이버에 실제로 물어본 주행시간이 있으면 그걸로 보여 준다 */
    var ptsN = realPts_();
    var rk = ptsN ? (PLAN_MODE + ':' + ptsN.length) : '';
    var real = (PLAN.real && rk) ? PLAN.real[rk] : null;
    /* 마지막 병원에서 도착지로 돌아오는 길. 거리(km)에는 이미 들어 있는데
       시간에는 빠져 있어서, 그 몫이 '병원에서' 로 넘어가 있었다. */
    var lastI0 = rows[rows.length - 1].i;
    var backMin = (PLAN.T && PLAN.T.to && PLAN.T.to[lastI0] != null)
                    ? (Number(PLAN.T.to[lastI0]) || 0) : 0;
    var driveMin = drive_(cur) + backMin;
    var stayMin = Math.max(0, (cur.end - PLAN.start) - driveMin);

    out += '<div class="planend">총 ' +
           dur_(real ? (real.min + stayMin) : (cur.end - PLAN.start)) + ' 걸립니다' +
           '<span class="brk">주행 ' +
             (real ? dur_(real.min) + ' · ' + real.km + 'km <b>네이버 기준</b>'
                   : dur_(driveMin) + ' · ' + cur.km + 'km <i>' +
                     (PLAN.realErr ? '구간 합산' : '확인 중…') + '</i>') +
             ' &nbsp;/&nbsp; 병원에서 ' + dur_(stayMin) + '</span></div>';
    out += '<button class="route wide" onclick="routePlan()"><span class="ib">' + ico_(D_NAVI) + '남은 곳 전체 길찾기</span></button>';
  }

  /* 오늘 못 가는 곳 */
  var outNames = {}; (cur.out || []).forEach(function (n) { outNames[n] = 1; });
  var inPlan = {};
  PLAN.stops.forEach(function (st) { inPlan[st.id] = 1; });

  var later = '';
  stopsOf(date).forEach(function (v) {
    var shown = rows.some(function (r) { return PLAN.stops[r.i].id === v.id; });
    if (shown) return;
    var h2 = findHospital(v);
    var why = outNames[v.name] ? '17:30 안에 못 감'
            : (!inPlan[v.id] ? '좌표 없음' : '');
    later += '<div class="' + recCls(h2) + '">' +
      '<div class="ordhead"><h2>' + esc(v.name) + '</h2>' +
        (why ? '<span class="kd warn">' + why + '</span>' : '') + '</div>' +
      infoBlock(h2) +
      (plainMemo(v) ? '<div class="memo">' + esc(plainMemo(v)) + '</div>' : '') +
      '<div class="foot">' +
        '<button class="small" onclick="doneVisit(\'' + v.id + '\')">완료</button>' +
        '<button class="hold small" onclick="holdVisit(\'' + v.id + '\')">보류</button>' +
        '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
      '</div></div>';
  });
  if (later) out += '<div class="planend">오늘 순서에 못 넣은 곳</div>' + later;

  /* 출발·도착 구간이 말이 안 되면 크게 알린다. 총 시간이 통째로 틀어지기 때문이다. */
  if (PLAN.legs && PLAN.legs.length) {
    out += '<div class="planwarn">이동시간이 이상합니다. 총 시간을 믿지 마세요.<br>' +
           PLAN.legs.map(esc).join('<br>') +
           '<br><br>출발지나 도착지 주소가 길 위가 아닌 자리로 잡힌 것 같습니다. ' +
           '주소를 <b>번지까지</b> 넣고 다시 찾아 보세요.</div>';
  }

  var note = [];
  /* 출발·도착 구간이 얼마나 걸리는지 눈에 보이게 둔다 */
  if (PLAN.T && rows.length) {
    var f0 = PLAN.T.from && PLAN.T.from[rows[0].i];
    var lastI = rows[rows.length - 1].i;
    var e0 = PLAN.T.to && PLAN.T.to[lastI];
    var ln = [];
    if (f0 != null) ln.push('출발 → ' + esc(PLAN.stops[rows[0].i].name) + ' ' + dur_(f0));
    if (e0 != null) ln.push(esc(PLAN.stops[lastI].name) + ' → 도착 ' + dur_(e0));
    if (ln.length) note.push(ln.join(' · '));
  }
  if (PLAN.startNote) note.unshift('<b>' + esc(PLAN.startNote) + '</b>');
  if (cur.half && cur.half.length) note.push('오늘은 접수까지만: ' + esc(cur.half.join(', ')));
  if (cur.out && cur.out.length) note.push(hhmm_(DAY_END) + ' 안에 못 가는 곳: ' + esc(cur.out.join(', ')));
  if (cur.rough) note.push('병원이 ' + PLAN_EXACT + '곳을 넘어, 가까운 곳부터 짠 뒤 '
    + '다듬는 방법으로 잡았습니다. 대개 가장 좋은 순서에 가깝지만 꼭 그렇진 않습니다.');
  if (PLAN.skipped.length) note.push('제외: ' + esc(PLAN.skipped.join(', ')));
  if (PLAN.guessed.length) note.push('발급소요 미입력이라 ' + DEFAULT_WAIT + '분으로 잡음: ' + esc(PLAN.guessed.join(', ')));
  if (PLAN.realErr) {
    note.push(/UNKNOWN_FN/.test(PLAN.realErr)
      ? '주행시간을 네이버에 직접 물어보려면 <b>Code.gs 를 새 판으로 올려야</b> 합니다. 지금은 구간을 더한 어림값입니다.'
      : '네이버에 실제 경로를 못 물어봤습니다(' + esc(PLAN.realErr) + '). 구간을 더한 어림값입니다.');
  }
  if (PLAN.miss) note.push('이동시간을 못 구한 구간 ' + PLAN.miss + '개는 빼고 계산했습니다.');
  if (PLAN.saveErr) note.push('이동시간을 저장하지 못했습니다(' + esc(PLAN.saveErr) + ').');
  if (PLAN.at != null) note.push(hhmm_(PLAN.at) + ' 에 짠 순서입니다. 시간이 많이 지났으면 다시 계산하세요.');
  note.push('병원 체류는 ' + STOP_MIN + '분, 서류 발급 마감은 ' + hhmm_(DAY_END) + '로 잡았습니다.');
  /* 실제로 걸린 시간을 얼마나 반영했는지 */
  var fc = driveFactor_();
  var ft = (fc.n >= FACT_MIN)
    ? ('실제로 걸린 시간 <b>' + fc.n + '번</b>을 반영해 이동시간을 <b>' + fc.f + '배</b>로 잡았습니다.')
    : ('실제로 걸린 시간을 ' + fc.n + '번 모았습니다. ' + FACT_MIN + '번이 넘으면 계산에 반영합니다.');
  note.push(ft + '<button class="notebtn" onclick="openTimes()">기록 보기</button>');
  out += '<div class="plannote">· ' + note.join('<br>· ') + '</div>';
  return out;
}

/* 짠 순서에서 '달리는 시간'만 더한다 (병원에 있는 시간을 뺀 나머지) */
function drive_(m) {
  var v = 0;
  (m.steps || []).forEach(function (st) { v += Number(st.move) || 0; });
  return v;
}

/* 분 -> "1시간 20분" */
function dur_(m) {
  m = Math.max(0, Math.round(m));
  var h = Math.floor(m / 60), r = m % 60;
  if (h && r) return h + '시간 ' + r + '분';
  if (h) return h + '시간';
  return r + '분';
}

/* ---------- 짠 순서를 시트에도 적는다 ----------
   워치(단축어)는 시트의 '순서' 칸을 읽는다. 길찾기로 짠 순서가 앱 안에만
   있으면 워치에서는 엉뚱한 차례로 보인다. 계산이 끝나면 맞춰 둔다.
   같은 순서면 아무것도 보내지 않는다. */
function planOrderIds_() {
  var cur = curPlan();
  if (!cur || !PLAN || !PLAN.stops) return null;
  var live = {};
  stopsOf(PLAN.date).forEach(function (v) { live[v.id] = 1; });

  var seen = {}, ids = [];
  for (var i = 0; i < cur.steps.length; i++) {
    var sp = PLAN.stops[cur.steps[i].i];
    if (!sp || seen[sp.id] || !live[sp.id]) continue;   /* 접수+수령은 한 번만 */
    seen[sp.id] = 1;
    ids.push(sp.id);
  }
  /* 계산에서 빠진 곳(좌표 없음 등)은 뒤에 원래 차례대로 붙인다 */
  stopsOf(PLAN.date).forEach(function (v) { if (!seen[v.id]) ids.push(v.id); });
  return ids.length ? ids : null;
}

function syncPlanOrder_() {
  var ids = planOrderIds_();
  if (!ids) return;
  if (ids.join(',').indexOf('tmp_') > -1) return;    /* 아직 저장 중인 게 있다 */

  var now = stopsOf(PLAN.date).map(function (v) { return v.id; });
  if (now.join(',') === ids.join(',')) return;       /* 이미 같은 순서다 */

  /* 화면에도 바로 맞춰 둔다. 서버가 늦어도 보이는 차례는 안 흔들린다 */
  var at = {};
  ids.forEach(function (id, k) { at[id] = k + 1; });
  VISITS.forEach(function (v) { if (at[v.id]) v.order = at[v.id]; });
  cacheWrite();

  srv().err(function () { /* 실패해도 화면은 그대로 둔다. 다음 계산에서 다시 맞춘다 */ })
       .reorder(ids);
}

/* ---------- 출발 위치 ---------- */
/* 무엇을 줄일지 고른다 */
function setMode(m) {
  PLAN_MODE = m;
  try { localStorage.setItem('hdb_mode', m); } catch (e) {}
  render();
  orderLater_();                      /* 최단시간/최단거리를 바꾸면 차례도 바뀐다 */
  verifyRoute();
}

function useGps() {
  if (!navigator.geolocation) { toast('이 기기에서는 현재 위치를 쓸 수 없습니다.', 4200); return; }
  toast('현재 위치 확인 중…');
  navigator.geolocation.getCurrentPosition(function (p) {
    MYLOC = { lat: p.coords.latitude, lng: p.coords.longitude, label: '현재 위치', kind: 'gps' };
    PLAN = null; planSave(); render();
    toast('현재 위치를 잡았습니다. 이제 동선 계산을 누르세요.', 4000);
  }, function (e) {
    toast('위치를 못 잡았습니다 · ' + (e.code === 1 ? '위치 권한을 허용해 주세요' : e.message), 5600);
  }, { enableHighAccuracy: true, timeout: 12000 });
}

/* ---------- 주소 검색 (카카오 우편번호) ----------
   글자로 받아 적으면 번지를 놓치기 쉽고, 그러면 좌표가 길 위가 아닌 자리로 잡혀
   이동시간이 몇 시간짜리로 나온다. 그래서 목록에서 고르게 한다. */
var ADDR_FOR = '';        /* 'from' | 'to' | 'home' | 'office' | 'hosp' */
var ADDR_MADE = false;

/* 카카오 우편번호 스크립트를 받아올 곳. 앞에서부터 차례로 시도한다.
   예전에 쓰던 t1.kakaocdn.net 주소는 카카오가 없앴다(404). 그래서 공식 주소를
   앞에 두고, 옛 주소는 혹시 몰라 뒤에 남겨 둔다. */
var PC_SRCS = [
  'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js',
  'https://t1.kakaocdn.net/postcode/resource/js/postcode.v2.js'
];
var PC_LOADING = false, PC_WAIT = [];

function postcodeApi_() {
  if (window.daum && window.daum.Postcode) return window.daum.Postcode;
  if (window.kakao && window.kakao.Postcode) return window.kakao.Postcode;
  return null;
}

/* 카카오 주소 검색을 확실히 불러온다.
   앱을 켤 때 한 번 놓쳤더라도, 누를 때마다 여기서 다시 받아 온다. */
function ensurePostcode_(cb) {
  var have = postcodeApi_();
  if (have) { cb(have); return; }

  PC_WAIT.push(cb);
  if (PC_LOADING) return;
  PC_LOADING = true;

  var done = false;
  function finish() {
    if (done) return;
    done = true;
    PC_LOADING = false;
    var api = postcodeApi_();
    var ws = PC_WAIT; PC_WAIT = [];
    for (var i = 0; i < ws.length; i++) { try { ws[i](api); } catch (e) {} }
  }

  /* 주소를 하나씩 시도한다. 받아졌으면 거기서 멈춘다. */
  var at = 0;
  function tryNext() {
    if (postcodeApi_()) { finish(); return; }
    if (at >= PC_SRCS.length) { finish(); return; }
    var sc = document.createElement('script');
    sc.src = PC_SRCS[at++];
    sc.onload = function () { postcodeApi_() ? finish() : tryNext(); };
    sc.onerror = tryNext;
    document.head.appendChild(sc);
  }
  tryNext();
  setTimeout(finish, 12000);
}

/* 끝내 못 불러왔을 때만 쓰는 비상구. 손으로 치면 번지를 놓치기 쉬워
   좌표가 엉뚱한 데로 잡히므로, 정말 마지막에만 권한다. */
function addrTypeIn_() {
  askText_('주소를 직접 입력하세요 (번지까지)', '', function (q) {
    if (q && q.trim()) { closeSheet('addrSheet'); gotAddr_(q.trim(), ''); }
  });
}

function findAddr(kind) {
  ADDR_FOR = kind;
  document.getElementById('addrTitle').textContent =
    (kind === 'from') ? '출발지 주소' :
    (kind === 'hosp') ? '병원 주소' :
    (kind === 'park') ? '주차장 주소' :
    (kind === 'fromhome') ? '집 주소 (출발지)' :
    (kind === 'home' || kind === 'office') ? (SPOT_NAME[kind] + ' 주소') : '도착지 주소';

  var box = document.getElementById('addrBox2');
  box.innerHTML = '<div class="pcwait">주소 검색을 불러오는 중…</div>';
  openSheet('addrSheet');

  ensurePostcode_(function (API) {
    if (!API) {
      box.innerHTML =
        '<div class="pcwait">주소 검색을 불러오지 못했습니다.<br>' +
        '통신 상태를 확인하고 다시 눌러 주세요.<br><br>' +
        '<button type="button" class="ghost small" onclick="findAddr(ADDR_FOR)">다시 시도</button> ' +
        '<button type="button" class="ghost small" onclick="addrTypeIn_()">직접 입력</button></div>';
      return;
    }
    box.innerHTML = '';
    new API({
      oncomplete: function (d) {
        closeSheet('addrSheet');
        var road = d.roadAddress || d.address || d.jibunAddress || '';
        gotAddr_(road, d.buildingName || '');
      },
      width: '100%',
      height: '100%'
    }).embed(box, { autoClose: true });
    ADDR_MADE = true;
  });
}

/* 주소와 상세(층·호)를 하나로 붙인다. 시트에는 예전처럼 한 칸으로 들어간다. */
function joinAddr_() {
  var a = document.getElementById('f_addr').value.trim();
  var d = document.getElementById('f_addrx').value.trim();
  if (!a) return d;
  return d ? (a + ' ' + d) : a;
}

/* 주소에 번지가 붙어 있는가.
   '경의로 130' 처럼 띄어쓰기 뒤에 숫자가 오면 번지가 있는 것으로 본다.
   '올림픽로43길 88' 의 43 은 길 이름에 붙어 있어 번지로 세지 않는다.
   구글이 알려 주는 정밀도(location_type)로 판단하지 않는 까닭은,
   우리나라 도로명주소는 정확해도 대개 '대략'으로 돌아오기 때문이다.
   그걸 믿었다가 멀쩡한 주소로도 계산이 막히고 있었다. */
function hasBunji_(addr) {
  return /(?:^|\s)\d+(?:-\d+)?(?:\s|$)/.test(String(addr || '').trim());
}

/* 고른 주소를 자리에 넣는다. 좌표는 서버에서 구한다. */
function gotAddr_(road, bld) {
  if (!road) return;
  var show = road + (bld ? ' (' + bld + ')' : '');

  if (ADDR_FOR === 'hosp' || ADDR_FOR === 'park') {
    /* 도로명 + 건물명까지만 넣는다. 층·호는 아래 '상세' 칸에 따로 적는다.
       주소에 층까지 섞어 넣으면 좌표가 엉뚱한 데로 잡힌다. */
    var el = document.getElementById(ADDR_FOR === 'hosp' ? 'f_addr' : 'f_paddr');
    if (el) el.value = road + (bld ? ' ' + bld : '');
    toast((ADDR_FOR === 'hosp' ? '주소' : '주차장 주소') + '를 넣었습니다 · ' + show, 4000);
    if (ADDR_FOR === 'hosp') {
      var dt = document.getElementById('f_addrx');
      if (dt && !dt.value.trim()) setTimeout(function () { try { dt.focus(); } catch (e) {} }, 250);
    }
    return;
  }

  toast('주소 찾는 중…');
  var kind = ADDR_FOR;
  srv().then(function (r) {
      if (kind === 'from') {
        MYLOC = { lat: r.lat, lng: r.lng, label: road, found: r.addr || '',
                  rough: !r.precise, noNum: !hasBunji_(road), kind: 'addr' };
        try { localStorage.setItem('hdb_lastaddr', road); } catch (e) {}
      } else if (kind === 'fromhome') {
        /* 도착지의 [집] 과 같은 주소를 쓴다. 한 번 넣으면 양쪽에서 같이 쓰인다 */
        spotSet('home', { addr: road, lat: r.lat, lng: r.lng });
        MYLOC = { lat: r.lat, lng: r.lng, label: SPOT_NAME.home, found: road,
                  rough: !r.precise, noNum: !hasBunji_(road), kind: 'home' };
      } else if (kind === 'home' || kind === 'office') {
        spotSet(kind, { addr: road, lat: r.lat, lng: r.lng });
        MYEND = { lat: r.lat, lng: r.lng, label: SPOT_NAME[kind],
                  found: road, rough: !r.precise, noNum: !hasBunji_(road), kind: kind };
      } else {
        MYEND = { lat: r.lat, lng: r.lng, label: road, found: r.addr || '',
                  rough: !r.precise, noNum: !hasBunji_(road), kind: 'custom' };
      }
      PLAN = null; planSave(); render();
      toast((kind === 'from' ? '출발지' : '도착지') + ' · ' + show, 4200);
    })
    .err(function (e) { toast('좌표를 못 구했습니다 · ' + e.message, 5600); })
    .geo(road);
}

/* 집에서 출발한다. 도착지의 [집] 과 같은 주소를 쓴다.
   저장된 게 있으면 그대로 쓰고, 없거나 다시 누르면 주소를 고른다. */
function useHomeFrom() {
  var saved = spotGet('home');
  if (saved && !(MYLOC && MYLOC.kind === 'home')) {
    /* 저장된 자리는 좌표를 이미 갖고 있다. 그 좌표는 주소를 처음 고를 때
       제대로 구한 것이므로, 저장된 글자에서 번지를 못 읽는다고 막지 않는다. */
    MYLOC = { lat: saved.lat, lng: saved.lng, label: SPOT_NAME.home,
              found: saved.addr || '', kind: 'home', rough: false, noNum: false };
    PLAN = null; planSave(); render();
    return;
  }
  if (saved) {
    ask_('집 주소를 바꿀까요?\n지금: ' + saved.addr,
         function () { findAddr('fromhome'); }, '바꾸기');
    return;
  }
  findAddr('fromhome');
}

/* 집·사무실. 저장된 게 있으면 그대로 쓰고, 없거나 다시 누르면 주소를 고른다. */
function useSpot(kind) {
  var saved = spotGet(kind);
  if (saved && !(MYEND && MYEND.kind === kind)) {
    MYEND = { lat: saved.lat, lng: saved.lng, label: SPOT_NAME[kind],
              found: saved.addr || '', kind: kind, rough: false, noNum: false };
    PLAN = null; planSave(); render();
    return;
  }
  if (saved) {
    ask_(SPOT_NAME[kind] + ' 주소를 바꿀까요?\n지금: ' + saved.addr,
         function () { findAddr(kind); }, '바꾸기');
    return;
  }
  findAddr(kind);
}

/* ---------- 출발·도착 구간이 말이 되는지 본다 ----------
   병원끼리 구간은 시트에 쌓여 있어 믿을 만한데, 출발·도착은 매번 새로 구한다.
   주소가 길 위가 아닌 자리로 잡히면 네이버가 몇 시간짜리 값을 돌려준다.
   그걸 그대로 쓰면 '두 곳 도는 데 9시간' 같은 엉뚱한 결과가 나온다. */
var LEG_SLOW = 10;     /* km/h. 이보다 느리면 이상하다고 본다 (도심 정체는 보통 15~25) */

function legCheck_(T, stops) {
  var bad = [], i;
  function look(min, km, label) {
    if (min == null || min < 40) return;          /* 짧은 구간은 따지지 않는다 */
    var sp = km ? (km / (min / 60)) : 0;
    if (sp < LEG_SLOW) {
      bad.push(label + ' ' + dur_(min) + (km ? ' · ' + km + 'km' : '') +
               ' (' + (km ? sp.toFixed(0) : '0') + 'km/h)');
    }
  }
  for (i = 0; i < stops.length; i++) {
    look(T.from && T.from[i], T.fromKm && T.fromKm[i], '출발 → ' + stops[i].name);
    look(T.to && T.to[i], T.toKm && T.toKm[i], stops[i].name + ' → 도착');
  }
  return bad;
}

/* ---------- 계산 ---------- */
function calcPlan(date) {
  date = date || todayStr();
  if (!MYLOC) {
    toast('출발지를 먼저 정하세요.\n[현재 위치] 또는 [주소 검색] 을 누르세요.', 5200);
    return;
  }
  if (!MYEND) { toast('도착지를 정하세요 (집 · 사무실 · 직접)', 4600); return; }
  /* 번지가 아예 없는 주소('경의로' 처럼 길 이름만)는 길 위가 아닐 수 있어
     이동시간이 통째로 틀어진다. 그때만 막는다.
     번지가 붙어 있으면 그냥 계산한다 — 좌표가 이상하면 legCheck_ 가
     '시속 10km도 안 나오는 구간'으로 뒤에서 걸러 준다. */
  if (MYLOC.noNum || MYEND.noNum) {
    toast((MYLOC.noNum ? '출발지' : '도착지') + ' 주소에 번지가 없습니다.\n' +
          '[주소 검색] 으로 번지까지 골라 주세요.', 6000);
    return;
  }

  var list = stopsOf(date);
  if (!list.length) { toast('그 날 갈 병원이 없습니다.', 4000); return; }

  var stops = [], skipped = [], guessed = [], pts = [];

  for (var i = 0; i < list.length; i++) {
    var h = findHospital(list[i]);
    var pt = pointOf(h);
    if (!pt) {
      skipped.push(list[i].name +
        (h && h.parking === '인근' ? ' (주차장 주소 없음)' : ' (좌표 없음)'));
      continue;
    }
    var w = parseWait(h.wait);
    if (w == null && (!h.prereq || h.prereq === '불가능') && h.sameday !== '불가능') {
      guessed.push(list[i].name);
    }
    /* 점심시간은 적어 둔 곳만 반영한다. 비어 있으면 쉬지 않는 것으로 본다. */
    var lu = String(h.lunch || '').trim();
    if (lu === '없음') lu = '';

    pts.push(pt);
    stops.push({
      name: list[i].name, id: list[i].id, lat: pt.lat, lng: pt.lng,
      submitted: isSubmitted(list[i]),
      /* 병원DB에서 '접수 후 기다렸다 수령'으로 표시해 둔 곳 */
      stay: !!h.stay,
      sameday: h.sameday, prereq: h.prereq, waitMin: w,
      openMin: hm_(h.open),
      lunchS: hm_(lu.split('-')[0]),
      lunchE: hm_(lu.split('-')[1])
    });
  }

  if (!stops.length) {
    PLAN = { date: date, err: '순서를 짤 수 있는 병원이 없습니다.\n' + skipped.join('\n') };
    render(); return;
  }
  if (stops.length > PLAN_MAX) {
    PLAN = { date: date, err: '한 번에 ' + PLAN_MAX + '곳까지만 계산할 수 있습니다. (지금 ' + stops.length + '곳)' };
    render(); return;
  }

  toast('실제 이동시간 확인 중… 처음 계산은 조금 걸립니다', 20000);

  var ptStr = pts.map(function (p) { return p.lat + ',' + p.lng; }).join(';');
  srv().then(function (T) {
      /* 이동시간 표를 못 받았으면 여기서 멈춘다.
         예전에는 그냥 넘어갔다가, '갈 수 있는 병원이 하나도 없다'로 잘못 풀린 뒤
         아무 말 없이 앱이 멈춰 버렸다. 까닭을 보여 주고 끝내는 편이 낫다. */
      if (!T || !T.mat) {
        PLAN = { date: date, err: '이동시간을 받지 못했습니다.\n잠시 후 [다시 계산] 을 눌러 주세요.' };
        render(); return;
      }
      /* 그동안 실제로 걸린 시간으로 눈금을 맞춘다.
         네이버가 주는 값은 길이 비었을 때 기준이라, 실제보다 짧게 나오는
         일이 잦다. 몇 번 다녀 보면 그 차이가 드러난다. */
      var fac = driveFactor_();
      if (fac.f !== 1) T = tune_(T, fac.f);
      /* 오늘이면 지금 시각부터, 앞날이면 아침 9시부터로 잡는다.
         다만 지금이 병원 여는 시간 밖이면 (새벽이거나 마감이 지났으면)
         지금 시각부터 재는 것이 뜻이 없다. 문 열 때까지 기다리는 시간이
         통째로 들어가 '9시간 걸립니다' 같은 값이 나오기 때문이다. */
      var startNote = '';
      var start;
      if (date !== todayStr()) {
        start = PLAN_DAWN;
      } else {
        var nowM = nowMin_();
        if (nowM < DAY_OPEN) {
          start = PLAN_DAWN;
          startNote = '지금은 ' + hhmm_(nowM) + ' 이라, 아침 ' + hhmm_(PLAN_DAWN)
                    + ' 에 출발하는 것으로 계산했습니다.';
        } else if (nowM >= DAY_END) {
          start = PLAN_DAWN;
          startNote = '서류 발급 마감(' + hhmm_(DAY_END) + ')이 지났습니다. '
                    + '아침 ' + hhmm_(PLAN_DAWN) + ' 에 출발하는 것으로 계산했습니다.';
        } else {
          start = nowM;
        }
      }
      /* 한 번 받아온 표로 두 가지를 다 계산한다. 서버는 더 부르지 않는다. */
      /* 고정해 둔 곳이 아직 그 날 목록에 있으면 그 순서를 지킨다 (#1) */
      var idx0 = {}, pins = [];
      stops.forEach(function (sp, si) { idx0[sp.id] = si; });
      pinList_(date).forEach(function (id) { if (idx0[id] != null) pins.push(idx0[id]); });

      var rt = planWithCutoff(stops, T, start, PLAN_EXACT, 'time', pins);
      var rd = planWithCutoff(stops, T, start, PLAN_EXACT, 'dist', pins);
      var r = rt.ok ? rt : rd;
      if (!r.ok) {
        PLAN = { date: date, err: (start >= DAY_END)
          ? ('서류 발급 마감(' + hhmm_(DAY_END) + ')이 지났습니다.\n내일 일정으로 옮기세요.')
          : '이동시간을 구하지 못해 순서를 짜지 못했습니다.\n잠시 후 다시 시도해 주세요.' };
      } else {
        var seen = {};
        list.forEach(function (v) { seen[v.id] = 1; });
        PLAN = { date: date, start: start, startNote: startNote, stops: stops, seen: seen,
                 modes: { time: rt.ok ? rt : null, dist: rd.ok ? rd : null },
                 skipped: skipped, guessed: guessed, pins: pins,
                 /* 표를 들고 있으면 순서를 바꿔도 서버를 다시 안 불러도 된다 */
                 T: { from: T.from, fromKm: T.fromKm, mat: T.mat,
                      dist: T.dist, to: T.to, toKm: T.toKm },
                 /* 어떤 배수로 맞춘 표인지 적어 둔다. 다음에 실제 시간을
                    적을 때 맞추기 전 값으로 되돌리는 데 쓴다. */
                 fac: fac.f, facN: fac.n,
                 at: nowMin_(),
                 legs: legCheck_(T, stops),
                 miss: T.miss || 0, saveErr: T.saveErr || '' };
      }
      toast(r.ok ? '동선을 짰습니다' : '계산 실패', 3000);
      planSave(); render();
      if (r.ok) orderLater_();        /* 워치가 같은 차례로 보게 시트에도 적는다 */
      if (r.ok) verifyRoute();      /* 짠 순서대로 네이버에 다시 물어본다 */
    })
    .err(function (e) { toast('이동시간을 받지 못했습니다 · ' + e.message, 6000); })
    .times(ptStr, MYLOC.lat + ',' + MYLOC.lng, MYEND.lat + ',' + MYEND.lng);
}

/* 계산된 순서를 네이버 지도로 넘긴다 (같은 병원 두 번은 한 번만) */
function routePlan(untilId) {
  var cur = curPlan();
  if (!cur) return;

  /* 이미 완료·보류한 병원은 빼고 보낸다 */
  var live = {};
  stopsOf(PLAN.date).forEach(function (v) { live[v.id] = 1; });

  /* 전체 길찾기는 마지막에 도착지(집·사무실)까지 넣는다.
     '여기까지'는 그 병원이 목적지이므로 넣지 않는다. */
  var tail = (!untilId && MYEND) ? { name: MYEND.label, lat: MYEND.lat, lng: MYEND.lng } : null;
  var room = NAV_MAX_STOPS - (tail ? 1 : 0);

  var seen = {}, list = [], dropped = 0;
  for (var i = 0; i < cur.steps.length; i++) {
    var st = cur.steps[i], stop = PLAN.stops[st.i];
    if (seen[st.i] || !live[stop.id]) continue;
    seen[st.i] = 1;
    if (list.length >= room) { dropped++; continue; }
    list.push(stop);
    if (untilId && stop.id === untilId) { dropped = 0; break; }
  }
  if (!list.length) { toast('남은 병원이 없습니다.', 3500); return; }
  if (tail) list.push(tail);

  openNaver_(navUrl_(list));

  if (dropped) {
    toast('네이버 지도는 한 번에 ' + NAV_MAX_STOPS + '곳까지만 받습니다.\n' +
          dropped + '곳은 빠졌습니다.', 5600);
  }
}

/* 목록의 마지막을 목적지로, 나머지를 경유지로 하는 네이버 길찾기 주소 */
function navUrl_(list) {
  var d = list[list.length - 1];
  var u = 'nmap://route/car?dlat=' + d.lat + '&dlng=' + d.lng +
          '&dname=' + encodeURIComponent(d.name);
  for (var k = 0; k < list.length - 1; k++) {
    var n = k + 1;
    u += '&v' + n + 'lat=' + list[k].lat + '&v' + n + 'lng=' + list[k].lng +
         '&v' + n + 'name=' + encodeURIComponent(list[k].name);
  }
  return u + '&appname=phurom0103-coder.github.io';
}

/* ---------- 주유소 · LPG충전소 (오피넷) ---------- */
var FUEL_KINDS = [['lpg', 'LPG'], ['gas', '휘발유'], ['diesel', '경유']];
var FUEL_KIND = 'lpg';
var GAS_MODE = 'route';      /* route = 동선 따라 · near = 내 주변 */
var GAS = null, GAS_PTS = null, GAS_NAMES = [], GAS_AT = null, GAS_BUSY = false;

try { var _fk = localStorage.getItem('hdb_fuel'); if (_fk) FUEL_KIND = _fk; } catch (e) {}

/* 짜 놓은 동선을 [출발지, 병원, 병원, ..., 도착지] 로 편다.
   아직 안 짰으면 그 날 등록한 순서대로라도 쓴다. */
function gasRoutePts() {
  var pts = [], names = [];
  var date = (PLAN && !PLAN.err) ? PLAN.date : todayStr();
  var cur = curPlan();

  if (MYLOC) {
    pts.push({ lat: MYLOC.lat, lng: MYLOC.lng });
    names.push(MYLOC.kind === 'gps' ? '현재 위치' : MYLOC.label);
  }

  var live = {};
  stopsOf(date).forEach(function (v) { live[v.id] = v; });

  if (cur && PLAN && !PLAN.err) {
    var seen = {};
    cur.steps.forEach(function (s2) {
      var sp = PLAN.stops[s2.i];
      if (seen[s2.i] || !live[sp.id]) return;
      seen[s2.i] = 1;
      pts.push({ lat: sp.lat, lng: sp.lng }); names.push(sp.name);
    });
  } else {
    stopsOf(date).forEach(function (v) {
      var pt = pointOf(findHospital(v));
      if (pt) { pts.push(pt); names.push(v.name); }
    });
  }

  if (MYEND) { pts.push({ lat: MYEND.lat, lng: MYEND.lng }); names.push(MYEND.label); }
  return { pts: pts, names: names };
}

function openGas() {
  var r = gasRoutePts();
  /* 갈 곳이 없으면 '내 주변'으로 연다 */
  if (r.pts.length < 2) GAS_MODE = 'near';
  buildGasSeg();
  document.getElementById('gasList').innerHTML = '';
  GAS = null;
  openSheet('gasSheet');
  loadGas();
}

function buildGasSeg() {
  var m = document.getElementById('seg_gasmode');
  m.innerHTML =
    '<button type="button" class="' + (GAS_MODE === 'route' ? 'sel' : '') +
      '" onclick="pickGasMode(\'route\')">동선 따라</button>' +
    '<button type="button" class="' + (GAS_MODE === 'near' ? 'sel' : '') +
      '" onclick="pickGasMode(\'near\')">내 주변</button>';
  document.getElementById('gasTitle').textContent =
    (GAS_MODE === 'route') ? '동선 위의 주유·충전' : '주변 주유·충전';
  var box = document.getElementById('seg_fuel');
  box.innerHTML = FUEL_KINDS.map(function (o) {
    return '<button type="button" class="' + (FUEL_KIND === o[0] ? 'sel' : '') +
           '" onclick="pickFuel(\'' + o[0] + '\')">' + o[1] + '</button>';
  }).join('');
}

function pickGasMode(m) {
  if (GAS_MODE === m) return;
  GAS_MODE = m; GAS = null;
  buildGasSeg();
  document.getElementById('gasList').innerHTML = '';
  loadGas();
}
function pickFuel(k) {
  if (FUEL_KIND === k) return;
  FUEL_KIND = k; GAS = null;
  try { localStorage.setItem('hdb_fuel', k); } catch (e) {}
  buildGasSeg();
  document.getElementById('gasList').innerHTML = '';
  loadGas();
}

function gasNote(t) { document.getElementById('gasNote').innerHTML = t; }

function loadGas(force) {
  if (GAS_BUSY) return;

  if (GAS_MODE === 'route') {
    var r = gasRoutePts();
    if (r.pts.length < 2) {
      gasNote('동선이 없습니다. 방문일정에서 출발지·도착지를 정하고 <b>동선 계산</b>을 누른 뒤 다시 열어 주세요.');
      return;
    }
    GAS_NAMES = r.names;
    fetchGas(r.pts);
    return;
  }

  GAS_NAMES = ['내 자리'];
  if (!force && GAS_AT && (Date.now() - GAS_AT.t) < 120000) { fetchGas([GAS_AT]); return; }
  if (!navigator.geolocation) { gasNote('이 기기에서는 현재 위치를 쓸 수 없습니다.'); return; }
  gasNote('현재 위치를 잡는 중…');
  navigator.geolocation.getCurrentPosition(function (p) {
    GAS_AT = { lat: p.coords.latitude, lng: p.coords.longitude, t: Date.now() };
    fetchGas([GAS_AT]);
  }, function (e) {
    gasNote('위치를 못 잡았습니다 · ' +
      (e.code === 1 ? '위치 권한을 허용해 주세요' : esc(e.message)));
  }, { enableHighAccuracy: true, timeout: 12000 });
}

function fetchGas(pts) {
  GAS_BUSY = true;
  GAS_PTS = pts;
  gasNote('가격을 받아오는 중…' + (pts.length > 1 ? ' 동선이 길면 조금 걸립니다.' : ''));
  var str = pts.map(function (p) { return p.lat + ',' + p.lng; }).join(';');
  srv().then(function (res) {
      GAS_BUSY = false; GAS = res; renderGas();
    })
    .err(function (e) {
      GAS_BUSY = false;
      gasNote('<span style="color:#B3261E">' + esc(e.message) + '</span>');
    })
    .fuel(str, FUEL_KIND);
}

/* 몇 번째 구간 옆인지를 사람 말로 */
function segLabel_(i) {
  var a = GAS_NAMES[i], b = GAS_NAMES[i + 1];
  if (!a) return '';
  if (!b) return a + ' 근처';
  return a + ' → ' + b;
}

/* 어떤 동선을 기준으로 찾았는지 한 줄로 */
function gasWay() {
  var box = document.getElementById('gasWay');
  if (!box) return;
  if (GAS_MODE !== 'route' || GAS_NAMES.length < 2) {
    box.innerHTML = '<b>지금 있는 자리</b> 둘레에서 찾았습니다.';
    return;
  }
  box.innerHTML = GAS_NAMES.map(function (n) { return '<b>' + esc(n) + '</b>'; })
                    .join('<span class="arrow">→</span>') +
                  '<br>이 동선을 따라가며 찾은 ' + esc(GAS ? GAS.label : '') +
                  ' 파는 곳입니다.';
}

function renderGas() {
  var el = document.getElementById('gasList');
  gasWay();
  if (!GAS || !GAS.list || !GAS.list.length) {
    gasNote('둘레에서 찾지 못했습니다.');
    el.innerHTML = '';
    var mp = document.getElementById('gasMap');
    if (mp) mp.className = '';
    return;
  }
  var low = GAS.list[0].price;
  var head = esc(GAS.label) + ' · 싼 순';
  if (GAS_MODE === 'route') {
    head += ' · 동선 ' + GAS_NAMES.length + '곳을 훑음 · 경로에서 4km 안';
    if (!curPlan()) head += '<br>동선 계산 전이라 <b>등록한 순서</b>로 훑었습니다.';
  } else {
    head += ' · 둘레 ' + Math.round(GAS.radius / 1000) + 'km';
  }
  head += ' · ' + esc(GAS.at) + ' 기준';
  if (GAS.fresh === 0) head += ' (담아 둔 값)';
  gasNote(head);

  el.innerHTML = GAS.list.map(function (o, i) {
    var where = (GAS_MODE === 'route')
      ? segLabel_(o.seg) + (o.off > 0.15 ? ' · 옆으로 ' + o.off + 'km' : ' · 길가')
      : (o.off >= 1 ? o.off + 'km' : Math.round(o.off * 1000) + 'm');
    return '<div class="gasitem' + (o.price === low ? ' cheap' : '') +
           '" onclick="markGas(' + i + ')">' +
      '<span class="no">' + (i + 1) + '</span>' +
      '<span class="who"><b>' + esc(o.name) + '</b>' +
        '<small>' + esc(o.brand) + ' · ' + esc(where) + '</small></span>' +
      '<span class="pr"><b>' + (o.price ? o.price.toLocaleString() : '-') + '</b>' +
        '<small>원</small></span>' +
      (o.lat && o.lng ? '<button onclick="gasRoute(' + i + ')">길찾기</button>' : '') +
    '</div>';
  }).join('');

  setTimeout(drawGasMap, 60);
}

/* ---------- 주유·충전 지도 ----------
   동선을 주황 선으로 긋고, 그 옆에 값싼 순으로 가격표를 꽂는다. */
var GMAP = null, GLAYER = null;

function drawGasMap() {
  NM_LAST = { kind: 'gas' };
  ensureNaver_(function (api) {
    mapNote_('gasMapNote');
    if (!api) { drawGasMapL_(); return; }
    try { drawGasMapN_(); nmWatch_('gasMap'); }
    catch (e) { nmFail_('지도를 그리다 걸렸습니다: ' + String((e && e.message) || e).slice(0, 60)); }
  });
}

/* 네이버 지도로 그리기 */
var NGMAP = null, NGOV = [], NGIW = null;
function drawGasMapN_() {
  var api = naverReady_();
  var box = document.getElementById('gasMap');
  if (!box) return;
  if (!api) { drawGasMapL_(); return; }
  box.className = 'on';
  if (!NGMAP) {
    var g0 = (GAS_PTS && GAS_PTS.length) ? new api.LatLng(GAS_PTS[0].lat, GAS_PTS[0].lng)
                                         : new api.LatLng(37.5666, 126.9784);
    NGMAP = new api.Map('gasMap', { center: g0, zoom: 13, zoomControl: true,
                                    mapDataControl: false, scaleControl: false });
    NGIW = new api.InfoWindow({ content: '', borderWidth: 0, disableAnchor: true });
  }

  NGOV.forEach(function (o) { o.setMap(null); });
  NGOV = [];
  if (NGIW) NGIW.close();

  var first = null, bounds = null, n = 0;
  function at(lat, lng) {
    var ll = new api.LatLng(lat, lng);
    if (!first) { first = ll; bounds = new api.LatLngBounds(ll, ll); }
    else bounds.extend(ll);
    n++;
    return ll;
  }
  function pin(lat, lng, html, ax, ay, popup, onClick) {
    var mk = new api.Marker({
      position: at(lat, lng), map: NGMAP,
      icon: { content: html, anchor: new api.Point(ax, ay) }
    });
    api.Event.addListener(mk, 'click', function () {
      if (popup) { NGIW.setContent('<div class="niw">' + popup + '</div>'); NGIW.open(NGMAP, mk); }
      if (onClick) onClick();
    });
    NGOV.push(mk);
  }

  /* 동선 */
  if (GAS_MODE === 'route' && GAS_PTS && GAS_PTS.length > 1) {
    var path = GAS_PTS.map(function (p) { return new api.LatLng(p.lat, p.lng); });
    NGOV.push(new api.Polyline({
      map: NGMAP, path: path,
      strokeColor: '#2D5BD7', strokeWeight: 4, strokeOpacity: 0.75
    }));
    GAS_PTS.forEach(function (p, i) {
      var last = (i === GAS_PTS.length - 1);
      pin(p.lat, p.lng,
          '<div class="gpin' + (last ? ' end' : '') + '">' +
          (i === 0 ? '출' : last ? '도' : i) + '</div>', 12, 12,
          esc(GAS_NAMES[i] || ''));
    });
  } else if (GAS_PTS && GAS_PTS.length) {
    pin(GAS_PTS[0].lat, GAS_PTS[0].lng,
        '<div class="gpin">현</div>', 12, 12, '지금 있는 자리');
  }

  /* 주유소·충전소 */
  var low = GAS.list[0].price;
  GAS.list.forEach(function (o, i) {
    if (!o.lat || !o.lng) return;
    pin(o.lat, o.lng,
        '<div class="gtag' + (o.price === low ? ' best' : '') + '">' +
        (o.price ? o.price.toLocaleString() : '-') + '</div>', 26, 10,
        '<b>' + esc(o.name) + '</b><br>' + esc(o.brand) + ' · ' +
        (o.price ? o.price.toLocaleString() : '-') + '원' +
        '<br><a href="#" onclick="gasRoute(' + i + ');return false;">길찾기 →</a>',
        function () { markGas(i); });
  });

  api.Event.trigger(NGMAP, 'resize');
  if (!n) return;
  if (n === 1) { NGMAP.setCenter(first); NGMAP.setZoom(15); }
  else NGMAP.fitBounds(bounds, { top: 28, right: 28, bottom: 28, left: 28 });
}

/* 예전 지도(기본) — 네이버가 안 될 때만 쓴다 */
function drawGasMapL_() {
  var box = document.getElementById('gasMap');
  if (!box) return;
  if (typeof L === 'undefined') { box.className = ''; return; }
  box.className = 'on';

  if (!GMAP) {
    GMAP = L.map('gasMap', { zoomControl: true, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(GMAP);
  }
  if (GLAYER) GMAP.removeLayer(GLAYER);
  GLAYER = L.layerGroup().addTo(GMAP);

  var bounds = [];

  /* 동선 */
  if (GAS_MODE === 'route' && GAS_PTS && GAS_PTS.length > 1) {
    var line = GAS_PTS.map(function (p) { return [p.lat, p.lng]; });
    L.polyline(line, { color: '#2D5BD7', weight: 4, opacity: .75 }).addTo(GLAYER);
    GAS_PTS.forEach(function (p, i) {
      var last = (i === GAS_PTS.length - 1);
      L.marker([p.lat, p.lng], { icon: L.divIcon({
        className: '',
        html: '<div class="gpin' + (last ? ' end' : '') + '">' +
              (i === 0 ? '출' : last ? '도' : i) + '</div>',
        iconSize: [24, 24], iconAnchor: [12, 12]
      }) }).addTo(GLAYER).bindPopup(esc(GAS_NAMES[i] || ''));
      bounds.push([p.lat, p.lng]);
    });
  } else if (GAS_PTS && GAS_PTS.length) {
    L.marker([GAS_PTS[0].lat, GAS_PTS[0].lng], { icon: L.divIcon({
      className: '', html: '<div class="gpin">현</div>', iconSize: [24, 24], iconAnchor: [12, 12]
    }) }).addTo(GLAYER).bindPopup('지금 있는 자리');
    bounds.push([GAS_PTS[0].lat, GAS_PTS[0].lng]);
  }

  /* 주유소·충전소 */
  var low = GAS.list[0].price;
  GAS.list.forEach(function (o, i) {
    if (!o.lat || !o.lng) return;
    var m = L.marker([o.lat, o.lng], { icon: L.divIcon({
      className: '',
      html: '<div class="gtag' + (o.price === low ? ' best' : '') + '">' +
            (o.price ? o.price.toLocaleString() : '-') + '</div>',
      iconSize: [52, 20], iconAnchor: [26, 10]
    }) }).addTo(GLAYER);
    m.bindPopup('<b>' + esc(o.name) + '</b><br>' + esc(o.brand) + ' · ' +
                (o.price ? o.price.toLocaleString() : '-') + '원' +
                '<br><a href="#" onclick="gasRoute(' + i + ');return false;">길찾기 →</a>');
    m.on('click', function () { markGas(i); });
    bounds.push([o.lat, o.lng]);
  });

  GMAP.invalidateSize();
  if (bounds.length === 1) GMAP.setView(bounds[0], 14);
  else if (bounds.length) GMAP.fitBounds(bounds, { padding: [28, 28] });
}

/* 목록에서 고른 곳을 지도에서 보여 준다 */
function markGas(i) {
  var rows = document.querySelectorAll('.gasitem');
  Array.prototype.forEach.call(rows, function (r, k) {
    r.className = r.className.replace(' pick', '') + (k === i ? ' pick' : '');
  });
  var o = GAS && GAS.list && GAS.list[i];
  if (!o || !o.lat || !o.lng) return;
  var api = naverReady_();
  if (api && NGMAP) { NGMAP.setCenter(new api.LatLng(o.lat, o.lng)); NGMAP.setZoom(15); return; }
  if (GMAP) GMAP.setView([o.lat, o.lng], 15);
}

function gasRoute(i, ev) {
  if (window.event && window.event.stopPropagation) window.event.stopPropagation();
  var o = GAS && GAS.list && GAS.list[i];
  if (!o || !o.lat || !o.lng) return;
  openNaver_('nmap://route/car?dlat=' + o.lat + '&dlng=' + o.lng +
             '&dname=' + encodeURIComponent(o.name) +
             '&appname=phurom0103-coder.github.io');
}

/* ---------- 길찾기 ---------- */

/* 이 병원 한 곳만 안내한다. 중간에 들르는 곳 없이 곧장 간다. (#2) */
function routeOne(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  var h = findHospital(v);
  var pt = pointOf(h);
  if (!pt) {
    toast(h && h.parking === '인근'
      ? '주차장 주소가 없어 길찾기를 할 수 없습니다 · ' + v.name +
        '\n병원DB에서 주차장 주소를 먼저 입력하세요.'
      : '이 병원은 좌표가 없어 길찾기를 할 수 없습니다 · ' + v.name, 6000);

/* 아이폰(아이패드 포함)인가.
   요즘 아이패드는 자기를 맥이라고 말하므로 손가락 입력 수로 가린다. */
function isIOS_() {
  var ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  return /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1;
}

/* 홈 화면 아이콘으로 띄운 앱인가 (사파리 탭이 아니라) */
function isStandalone_() {
  if (window.navigator && window.navigator.standalone === true) return true;
  try { return !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
  catch (e) { return false; }
}

/* 지금 창을 다른 주소로 넘긴다. 한 줄짜리지만 따로 둔 까닭은,
   시험에서 진짜로 넘어가 버리면 확인을 못 하기 때문이다. */
function goto_(u) { location.href = u; }

function openNaver_(u) {
  /* 넘어갔는지 지켜본다. 넘어가면 화면이 가려지므로 그걸로 안다. */
  var went = false;
  function mark() { went = true; }
  document.addEventListener('visibilitychange', mark);
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);

  if (isIOS_()) {
    /* 아이폰에서 홈 화면 앱은 target="_blank" 가 사파리를 새로 여는 쪽으로
       풀린다. 그러면 네이버 지도는 안 뜨고 빈 창만 남는다. 지금 창을 넘긴다. */
    goto_(u);
  } else {
    var a = document.createElement('a');
    a.href = u; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  setTimeout(function () {
    document.removeEventListener('visibilitychange', mark);
    window.removeEventListener('pagehide', mark);
    window.removeEventListener('blur', mark);
    if (went || document.hidden) return;        /* 잘 넘어갔다 */

    /* 아무 일도 안 일어났다 — 네이버 지도 앱이 없을 때 이렇게 된다.
       재고 있던 시간도 취소한다. 가지도 않은 길이 기록으로 남으면 안 된다. */
    if (TRIP && !TRIP.t1) { TRIP = null; tripSave_(); }
    toast('네이버 지도 앱이 열리지 않았습니다.\n' +
          '앱이 깔려 있는지 확인해 주세요. (앱스토어에서 "네이버 지도")', 6000);
  }, 1600);
}

/* 아이폰 사파리 탭으로 쓰면 저장해 둔 것이 며칠 뒤 지워진다.
   홈 화면에 넣어 쓰면 안 지워지므로, 한 번 알려 준다. */
function iosTabTip_() {
  if (!isIOS_() || isStandalone_()) return;
  try { if (localStorage.getItem('hdb_iostip')) return; } catch (e) {}
  setTimeout(function () {
    toast('아이폰 사파리로 열면 저장해 둔 것(로그인·집 주소·지도 열쇠)이\n' +
          '며칠 안 쓰면 지워질 수 있습니다.\n' +
          '아래 공유 단추 → [홈 화면에 추가] 로 넣어서 쓰세요.', 10000);
    try { localStorage.setItem('hdb_iostip', '1'); } catch (e) {}
  }, 2500);
}

/* 1번부터 이 병원까지를 네이버 지도 자동차 길찾기로 넘긴다.
   출발지는 비워 두면 네이버가 현재 위치를 잡는다. */
function routeTo(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var day = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  day.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var stops = [], missing = [], noPark = [];
  for (var i = 0; i < day.length; i++) {
    var h = findHospital(day[i]);
    var nm = day[i].name;

    if (h && h.parking === '인근') {
      /* 주차장이 따로 있는 병원은 병원 건물이 아니라 주차장으로 안내해야 한다.
         주차장 주소가 없으면 엉뚱한 곳으로 보내게 되므로 길찾기를 하지 않는다. */
      if (hasParkPoint(h)) stops.push({ name: nm + ' 주차장', lat: h.pLat, lng: h.pLng });
      else noPark.push(nm);
    } else if (h && h.lat && h.lng) {
      stops.push({ name: nm, lat: h.lat, lng: h.lng });
    } else {
      missing.push(nm);
      /* 지금 누른 병원 자체에 좌표가 없으면, 그 앞 병원이 목적지가 되어
         전혀 다른 곳으로 안내된다. 그럴 바에는 안내하지 않는다. */
      if (day[i].id === id) {
        toast('이 병원은 좌표가 없어 길찾기를 할 수 없습니다 · ' + nm, 5200);
        return;
      }
    }
    if (day[i].id === id) break;
  }

  if (noPark.length) {
    toast('주차장 주소가 없어 길찾기를 할 수 없습니다 · ' + noPark.join(', ') +
          '\n병원DB에서 주차장 주소를 먼저 입력하세요.', 6500);
    return;
  }
  if (!stops.length) { toast('좌표가 있는 병원이 없습니다.', 4200); return; }
  if (stops.length > NAV_MAX_STOPS) {
    toast('한 번에 최대 ' + NAV_MAX_STOPS + '곳까지만 보낼 수 있습니다.', 5200);
    return;
  }
  if (missing.length) toast('좌표 없어 제외: ' + missing.join(', '), 5200);

  var d = stops[stops.length - 1];
  var u = 'nmap://route/car?dlat=' + d.lat + '&dlng=' + d.lng +
          '&dname=' + encodeURIComponent(d.name);
  for (var k = 0; k < stops.length - 1; k++) {
    var n = k + 1;
    u += '&v' + n + 'lat=' + stops[k].lat +
         '&v' + n + 'lng=' + stops[k].lng +
         '&v' + n + 'name=' + encodeURIComponent(stops[k].name);
  }
  u += '&appname=phurom0103-coder.github.io';

  var a = document.createElement('a');
  a.href = u; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ---------- 새 판 확인 ----------
   아이콘으로 띄운 앱은 예전 파일을 계속 붙들고 있어서 고쳐도 안 바뀐다.
   그래서 앱이 켜질 때 원본을 한 번 들여다보고, 판 번호가 다르면 알려준다. */
var NEW_VER = '';
var VER_STATE = '확인 전';
var verBusy = false;

/* 표시는 다시 그리기를 기다리지 않고 그 자리에서 바꾼다.
   (예전에는 render 를 거쳐서, 확인이 끝나지 않으면 아무 변화가 없었다) */
/* 줄 전체를 한곳에서 만든다. 앞의 '새로고침' 글씨가
   판 확인 결과에 덮어써져 사라지던 것을 막는다. */
function verLineHtml_(state) {
  return '<b>\u21bb 병원 목록 새로고침</b>'
       + '<span class="vsub">' + APP_VER + ' · ' + (state || VER_STATE)
       + (SW_ON ? '' : ' · 지킴이 없음') + '</span>';
}
function verPaint_(state) {
  var el = document.getElementById('verLine');
  if (el) el.innerHTML = verLineHtml_(state);
}
function verDone(txt) {
  VER_STATE = txt;
  verBusy = false;
  verPaint_(txt);
}
function verBusyNow() {
  VER_STATE = '확인 중…';
  verBusy = true;
  verPaint_('확인 중…');
}

/* 앱 파일이 놓인 자리 (물음표 뒤에 붙은 것은 떼어낸다) */
function appBase_() { return location.origin + location.pathname; }

function checkVersion(auto) {
  if (!window.fetch) { verDone('확인 불가 (옛 브라우저)'); return; }
  verBusyNow();

  var done = false;
  var timer = setTimeout(function () {
    if (done) return;
    done = true;
    verDone('확인 못 함 · 시간 초과');
  }, 9000);

  function finish(txt) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    verDone(txt);
  }

  /* 물음표를 붙여 매번 새 주소로 만들고, 담아 둔 것을 쓰지 말라고 못을 박는다 */
  var url = appBase_() + '?upd=' + Date.now();
  fetch(url, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('응답 ' + r.status);
      return r.text();
    })
    .then(function (t) {
      var m = t.match(/APP_VER = '(v[0-9]+)'/);
      if (!m) { finish('확인 못 함 · 판 번호 없음'); return; }

      /* 여기까지 왔으면 새 판으로 잘 바뀐 것이다. 시도 기록을 지운다. */
      if (m[1] === APP_VER) {
        try { localStorage.removeItem(UPD_KEY); } catch (e) {}
        finish('최신');
        return;
      }

      var mine = Number(APP_VER.slice(1)), there = Number(m[1].slice(1));
      if (!(there > mine)) { finish('최신'); return; }

      NEW_VER = m[1];
      finish(NEW_VER + ' 나옴');
      if (auto) { autoUpdate_(NEW_VER); return; }
      showUpdBar_();
    })
    .catch(function (e) {
      finish('확인 못 함 · ' + String((e && e.message) || e).slice(0, 24));
    });
}

function showUpdBar_(stuck) {
  var ut = document.getElementById('updTxt');
  if (ut) {
    ut.textContent = stuck
      ? ('새 버전(' + NEW_VER + ')으로 안 바뀝니다. 눌러 주세요.')
      : ('새 버전이 나왔습니다 (' + APP_VER + ' \u2192 ' + NEW_VER + ')');
  }
  var ub = document.getElementById('upd');
  if (ub) ub.className = 'on';
}

/* ---------- 켤 때 스스로 새 판 받기 ----------
   같은 판으로 두 번 시도해도 안 바뀌면 더 하지 않고 단추를 띄운다.
   (돌고 도는 것을 막는다) */
var UPD_KEY = 'hdb_upd';

function autoUpdate_(ver) {
  /* 무언가 입력하는 중이면 건드리지 않는다 */
  if (typeof topSheet_ === 'function' && topSheet_()) { showUpdBar_(); return; }

  var now = Date.now(), st = null;
  try { st = JSON.parse(localStorage.getItem(UPD_KEY) || 'null'); } catch (e) {}
  var same = st && st.ver === ver && (now - st.t) < 180000;
  if (same && st.n >= 2) { showUpdBar_(true); return; }

  try {
    localStorage.setItem(UPD_KEY, JSON.stringify({ ver: ver, t: now, n: same ? st.n + 1 : 1 }));
  } catch (e) {}

  toast('새 버전 ' + ver + ' 을 받는 중…', 2500);
  setTimeout(function () { goVersion_(ver); }, 700);
}

function goVersion_(ver) {
  location.replace(appBase_() + '?v=' + ver + '&t=' + Date.now());
}

/* ---------- 파일 지킴이(서비스워커) 붙이기 ----------
   홈 화면 아이콘으로 연 앱은 시작 파일을 브라우저가 오래 붙들고 있다.
   그래서 깃허브에 새로 올려도 옛 화면이 계속 나온다. sw.js 가 그 자리를
   넘겨받아 '인터넷 먼저'로 바꿔 준다. (자세한 내용은 sw.js 안에)

   sw.js 를 안 올렸거나 https 가 아니면 조용히 넘어간다. 앱은 그대로 돈다. */
var SW_ON = false;
function swStart_() {
  if (!('serviceWorker' in navigator)) return;
  var loc = location.hostname;
  if (location.protocol !== 'https:' && loc !== 'localhost' && loc !== '127.0.0.1') return;
  try {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (reg) {
        SW_ON = true;
        try { reg.update(); } catch (e) {}
      })
      .catch(function () {});
  } catch (e) {}
}

/* 최신화가 끝내 안 될 때의 탈출구. 지킴이를 물리고 담아 둔 것을 모두 버린다. */
function swKill_(done) {
  var fin = function () { try { done(); } catch (e) {} };
  if (!('serviceWorker' in navigator)) { fin(); return; }
  var jobs = [];
  try {
    jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }));
  } catch (e) {}
  try { if (window.caches) jobs.push(caches.keys().then(function (ks) {
    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
  })); } catch (e) {}
  if (!jobs.length) { fin(); return; }
  Promise.all(jobs).then(fin, fin);
  setTimeout(fin, 2500);          /* 늦어도 넘어간다 */
}

/* 판 번호를 누르면: 새 버전이 있으면 바로 받아오고, 아니면 다시 확인한다 */
function verTap() {
  if (NEW_VER) { doUpdate(); return; }

  /* 누르면 구글시트를 곧바로 다시 읽는다. 15초 제한을 건너뛴다.
     앱 새 판 확인은 덤으로 같이 한다. */
  verPaint_('불러오는 중…');
  LAST_LOAD = 0;
  loadAll(true);
  if (!verBusy) checkVersion(false);
}

/* 판 번호를 길게 누르면 무조건 새로 받아온다 (확인이 안 될 때의 탈출구) */
function forceUpdate() {
  askOpen_('무엇을 할까요?\n\n[다시 받기] 는 담아 둔 것을 모두 버리고 앱 파일을\n처음부터 새로 받습니다. 적어 둔 자료는 구글시트에 있으니\n없어지지 않습니다.', null, [
    { t: '닫기', k: 'ghost' },
    { t: '서버 주소', k: 'ghost', fn: function () {
        askText_('구글 Apps Script 배포 주소\n(비워 두고 확인하면 처음 값으로 되돌립니다)',
                 API, function (u) { setApi(u); });
      } },
    { t: '다시 받기', fn: function () {
        try { localStorage.removeItem(UPD_KEY); } catch (e) {}
        swKill_(function () { doUpdate(); });
      } }
  ]);
}

function doUpdate() {
  var ub = document.getElementById('upd');
  if (ub) ub.className = '';
  /* 주소를 살짝 바꿔야 휴대폰이 예전 파일을 버리고 새로 받아온다. */
  goVersion_(NEW_VER || 't');
}

/* ---------- 다시 켤 때 시트에서 새로 받아오기 ----------
   구글 시트에서 고친 내용은 앱이 시트를 다시 읽어야 보인다.
   아이콘으로 띄운 앱은 꺼도 메모리에 남아 있어서 스스로 다시 읽지 않았다.
   다른 앱 갔다가 돌아오면 받아오게 한다. */
var RELOAD_GAP = 15000;     /* 이 시간 안에 받아왔으면 또 받지 않는다 */

function resumeLoad_() {
  if (document.hidden) return;
  if (!CODE) return;
  qFlush_();                  /* 쌓아 둔 것이 있으면 먼저 보낸다 */
  if (Date.now() - LAST_LOAD < RELOAD_GAP) return;
  loadAll(true);
}
document.addEventListener('visibilitychange', resumeLoad_);
window.addEventListener('pageshow', resumeLoad_);
window.addEventListener('focus', resumeLoad_);

/* 네이버 지도에 갔다가 돌아온 그때가 곧 병원에 닿은 때다.
   resumeLoad_ 와 달리 자주 불려도 되게 안에서 막아 둔다. */
document.addEventListener('visibilitychange', tripBack_);
window.addEventListener('pageshow', tripBack_);
window.addEventListener('focus', tripBack_);

/* ---------- 오류를 눈에 보이게 ----------
   앱 안에서 오류가 나면 단추가 안 먹는데, 지금까지는 그게 보이지 않았다.
   '아무것도 안 눌러진다' 로만 나타나 원인을 짚을 수 없었다. */
var ERR_LAST = '';

function showErr_(msg) {
  ERR_LAST = String(msg || '').slice(0, 300);
  try {
    var el = document.getElementById('errbar');
    if (!el) return;
    el.textContent = '\u26a0 오류 · ' + ERR_LAST + '\n(눌러서 닫기 · 이 글귀를 알려 주세요)';
    el.className = 'errbar on';
  } catch (e) {}
}

window.onerror = function (msg, src, line) {
  showErr_(String(msg) + (line ? ' [' + line + '번째 줄]' : ''));
  return false;                      /* 브라우저 기본 처리도 그대로 둔다 */
};
window.addEventListener('unhandledrejection', function (e) {
  showErr_('처리 못 한 실패 · ' + String((e && e.reason && e.reason.message) || e.reason || ''));
});

/* ---------- 시작 ----------
   기기에 남아 있는 목록을 먼저 그려서 기다림 없이 띄우고,
   새 자료는 뒤에서 받아 바꿔 끼운다. */
(function () {
  paintTabs();      /* 새로고침해도 보던 탭 그대로 */
  planRestore();    /* 앱을 껐다 켜도 짜 둔 동선 그대로 (#4) */
  timeRestore_();   /* 재 둔 시간 기록 */
  iosTabTip_();     /* 아이폰 사파리 탭이면 홈 화면에 넣으라고 한 번 */
  pushGuard_();     /* 뒤로가기 한 칸을 미리 만들어 둔다 */
  swStart_();       /* 파일 지킴이 — 옛 화면에 갇히지 않게 한다 */
  /* 켜자마자 새 판이 있는지 보고, 있으면 스스로 받아 온다 */
  setTimeout(function () { checkVersion(true); }, 1200);
  if (!CODE) { showLogin(); return; }
  var c = cacheRead();
  if (c && c.hospitals && c.hospitals.length) {
    DB = c.hospitals; VISITS = c.visits || [];
    DB_HV = c.hv || '';        /* 지문까지 되살려야 '안 바뀜' 이 먹는다 */
    render();
    loadAll(true);
  } else {
    loadAll();
  }
})();
</script>
