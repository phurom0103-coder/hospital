function renderVisits() {
  paintTitle();
  var q = lc_(document.getElementById('search').value.trim());
  var pool = visitsOf('visit');
  var all = pool.filter(function (v) { return withinWindow(v.date); });
  var hidden = pool.length - all.length;
  var list = all.filter(function (v) { return !q || hit_(v.name, q); });
  var el = document.getElementById('list');

  if (!list.length) {
    var msg;
    if (all.length) msg = '검색 결과가 없습니다.';
    else if (hidden) msg = '표시할 일정이 없습니다.<br>' + VISIT_DAYS_BACK +
                           '일 이전 일정 ' + hidden + '건은 숨겨져 있습니다.';
    else msg = '예정된 방문이 없습니다.<br>+ 를 눌러 병원을 고르세요.';
    el.innerHTML = '<div class="empty">' + msg + '</div>';
    /* 검색 때문에 안 보이는 것뿐이면 동선을 건드리지 않는다.
       예전에는 검색창에 글자 하나만 쳐도 90초 걸려 짠 동선이 날아갔고,
       검색어를 지워도 돌아오지 않았다.
       정말 일정이 없을 때만 지우고, 그때는 저장본도 같이 지운다.
       (예전에는 저장본이 남아 앱을 껐다 켜면 지운 동선이 되살아났다) */
    if (!q && PLAN) { PLAN = null; planSave(); }
    return;
  }

  var order = [], seen = {};
  list.forEach(function (v) {
    var k = v.date || '';
    if (!seen[k]) { seen[k] = { date: v.date, todo: [], done: [] }; order.push(seen[k]); }
    (v.status === '완료' ? seen[k].done : seen[k].todo).push(v);
  });

  /* #18 늦은 날짜가 위로 온다. 앞날 → 오늘 → 지난 날 (오래될수록 더 아래).
     날짜 미정은 맨 뒤. */
  order.sort(function (a, b) {
    var x = a.date || '', y = b.date || '';
    if (!x && !y) return 0;
    if (!x) return 1;
    if (!y) return -1;
    if (x === y) return 0;
    return x > y ? -1 : 1;
  });

  var html = '';
  order.forEach(function (g) {
    var isToday = (g.date === todayStr());
    var cnt = g.todo.length + '곳 남음';
    if (g.done.length) cnt += ' · ' + g.done.length + '곳 완료';

    html += '<div class="dayhead' + (isToday ? ' today' : '') + '">' +
            dayLabel(g.date) + ' <span class="cnt">' + cnt + '</span>' +
            '<button class="mapbtn" onclick="openDayMap(\'' + esc(String(g.date || '')).replace(/'/g, '') + '\')">지도</button></div>';

    /* 오늘·앞으로의 날짜에는 출발지·계산 줄을 붙이고,
       계산돼 있으면 그 날짜의 순서로 보여준다 */
    if (planDay_(g.date) && !q && g.todo.length) {
      html += planBar(g.date);
      if (planUsable(g.date)) {
        var body = planBody(g.date);
        if (body) {
          html += body;
          g.done.forEach(function (v) { html += doneCard(v); });
          return;
        }
      } else if (PLAN && PLAN.date === g.date && PLAN.err) {
        html += '<div class="planwarn">' + esc(PLAN.err) + '</div>';
      } else if (PLAN && PLAN.date === g.date) {
        html += '<div class="planwarn">방문 목록이 바뀌었습니다. 다시 계산해 주세요.</div>';
      }
    }

    g.todo.sort(function (a, b) {
      var x = a.order || 9999, y = b.order || 9999;
      if (x !== y) return x - y;
      return a.name.localeCompare(b.name, 'ko');
    });

    g.todo.forEach(function (v, idx) {
      var h = findHospital(v);
      var first = (idx === 0), lastOne = (idx === g.todo.length - 1);
      html += '<div class="' + recCls(h) + '">' +
        '<div class="ordhead">' +
          '<span class="ordnum">' + (idx + 1) + '</span>' +
          '<h2>' + esc(v.name) + '</h2>' +
          '<div class="ordbtns">' +
            '<button onclick="moveVisit(\'' + v.id + '\',-1)"' + (first ? ' disabled' : '') + '>▲</button>' +
            '<button onclick="moveVisit(\'' + v.id + '\',1)"' + (lastOne ? ' disabled' : '') + '>▼</button>' +
          '</div>' +
        '</div>' +
        infoBlock(h) +
        (v.memo ? '<div class="memo">' + esc(v.memo) + '</div>' : '') +
        logLine_(v) +
        '<div class="navrow">' +
          '<button class="route" onclick="routeOne(\'' + v.id + '\')"><span class="ib">' + ico_(D_NAVI) + '길찾기</span></button>' +
          (idx > 0 && idx < NAV_MAX_STOPS
             ? '<button class="route" onclick="routeTo(\'' + v.id + '\')"><span class="ib">' + ico_(D_FLAG) + '여기까지</span></button>' : '') +
        '</div>' +
        '<div class="foot">' +
          '<button class="small" onclick="doneVisit(\'' + v.id + '\')">완료</button>' +
          '<button class="hold small" onclick="holdVisit(\'' + v.id + '\')">보류</button>' +
          '<button class="ghost small" onclick="openVisitForm(\'' + v.id + '\')">수정</button>' +
        '</div></div>';
    });

    g.done.forEach(function (v) { html += doneCard(v); });
  });

  el.innerHTML = html;

}

/* ---------- 병원DB 지역 고르기 ----------
   540곳을 한 줄로 늘어놓으면 찾을 수가 없다. 위에서 지역을 고르면
   그 지역만 남는다. 다시 누르면 전체로 돌아온다. */
var RG_KEY = 'hdb_rg';
var DB_RG = '';
/* 몇 곳 미만이면 시·도로 통째 묶을지 정하는 수.
   0 이면 묶지 않는다 — 시·군·구마다 단추가 따로 선다 (지금 설정).
   단추가 너무 많아지면 20 쯤으로 올리면 '서울 그 밖' 처럼 다시 묶인다. */
var RG_MIN = 0;
var RG_NAME = {}, RG_ROLL = {};   /* 묶음 열쇠 -> 보일 이름 / 묶음인가 */
var RG_SHOWN = null;
/* 단추 줄을 펴 두었는가. 껐다 켜도 그대로 둔다 */
var RG_OPEN = true;
try { RG_OPEN = (localStorage.getItem('hdb_rgopen') !== '0'); } catch (e) {}

/* 단추 줄과 손잡이의 겉모습을 상태에 맞춘다 */
function paintFold_() {
  var bar = document.getElementById('rbar'), t = document.getElementById('rtog');
  if (!bar || !t) return;
  var on = (TAB === 'db');
  bar.className = on ? (RG_OPEN ? 'rbar on' : 'rbar on fold') : 'rbar';
  t.className = on ? 'rtog on' : 'rtog';
  t.textContent = RG_OPEN ? '⌃' : '⌄';
}

function toggleRbar_() {
  RG_OPEN = !RG_OPEN;
  try { localStorage.setItem('hdb_rgopen', RG_OPEN ? '1' : '0'); } catch (e) {}
  paintFold_();
  RG_SHOWN = null;      /* 접었다 펴면 고른 단추를 다시 끌어다 보여 준다 */
  render();
}        /* 단추 줄을 마지막으로 옆으로 민 기준 */
try { DB_RG = localStorage.getItem(RG_KEY) || ''; } catch (e) {}

/* 단추에 적을 짧은 이름.
   경기 의정부시 -> 의정부시   (시·도는 군더더기)
   서울 강남구   -> 서울 강남구 (구만 적으면 어디 구인지 모른다) */
function rgChip_(label) {
  var t = String(label || '').split(' ');
  if (t.length < 2) return label;
  if (t.length === 2 && /구$/.test(t[1])) return label;
  return t.slice(1).join(' ');
}

/* 시·도만 잘라 낸다. '경기 의정부시' -> '경기' */
function sidoOf_(label) {
  var t = String(label || '').split(' ');
  return t[0] || String(label || '');
}

/* 어느 지역을 통으로 묶을지 정한다.
   ★ 검색 결과가 아니라 병원DB 전체를 보고 정해야 한다.
      안 그러면 검색창에 글자를 칠 때마다 단추가 생겼다 사라졌다 한다. */
function regionPlan_() {
  var cnt = {}, lab = {};
  DB.forEach(function (h) {
    if (!h._rg) h._rg = regionOf(h.addr);
    cnt[h._rg.key] = (cnt[h._rg.key] || 0) + 1;
    lab[h._rg.key] = h._rg.label;
  });

  /* 따로 단추가 서는 시·도를 먼저 추려 둔다 ('서울 그 밖' 이름을 짓기 위해) */
  var solo = {};
  Object.keys(cnt).forEach(function (k) {
    if (cnt[k] >= RG_MIN && lab[k] !== '주소 없음') solo[sidoOf_(lab[k])] = 1;
  });

  var map = {};
  RG_NAME = {}; RG_ROLL = {};
  Object.keys(cnt).forEach(function (k) {
    var m;
    if (lab[k] === '주소 없음') {
      m = { key: 'rg:￿', label: '주소 없음', chip: '주소 없음', roll: true };
    } else if (cnt[k] >= RG_MIN) {
      m = { key: k, label: lab[k], chip: rgChip_(lab[k]), roll: false };
    } else {
      var s = sidoOf_(lab[k]);
      var nm = solo[s] ? (s + ' 그 밖') : s;
      m = { key: 'rg:' + s, label: nm, chip: nm, roll: true };
    }
    map[k] = m;
    RG_NAME[m.key] = m.chip;
    RG_ROLL[m.key] = m.roll;
  });
  return map;
}

/* 지역 단추 줄을 그린다. 숫자는 '지금 검색에서 그 지역이 몇 곳' 이다. */
function paintRegionBar_(list, plan) {
  var bar = document.getElementById('rbar');
  if (!bar) return;

  var cnt = {};
  list.forEach(function (h) {
    var m = plan[h._rg.key];
    if (m) cnt[m.key] = (cnt[m.key] || 0) + 1;
  });

  /* 고른 지역이 이번 검색에 하나도 없어도 단추는 남겨 둔다.
     없애 버리면 눌렀던 자리가 사라져 '왜 아무것도 안 나오지' 가 된다 */
  if (DB_RG && cnt[DB_RG] == null && RG_NAME[DB_RG]) cnt[DB_RG] = 0;

  /* 이름순. 다만 통째로 묶은 것('경기 그 밖' 같은 것)은 맨 뒤로 보낸다.
     자주 쓰는 구체적인 지역이 앞에 있어야 한다. */
  var keys = Object.keys(cnt).sort(function (a, b) {
    var ra = RG_ROLL[a] ? 1 : 0, rb = RG_ROLL[b] ? 1 : 0;
    if (ra !== rb) return ra - rb;
    return String(RG_NAME[a]).localeCompare(String(RG_NAME[b]), 'ko');
  });

  var html = '<button type="button" class="' + (DB_RG ? '' : 'on') +
             '" onclick="pickRegion(\'\')">전체' +
             '<span class="n">' + list.length + '</span></button>';
  keys.forEach(function (k) {
    html += '<button type="button" class="' + (DB_RG === k ? 'on' : '') +
            '" onclick="pickRegion(\'' + esc(String(k).replace(/'/g, '')) + '\')">' +
            esc(RG_NAME[k]) + '<span class="n">' + cnt[k] + '</span>' +
            (DB_RG === k ? '<span class="x">\u00d7</span>' : '') + '</button>';
  });
  bar.innerHTML = html;

  /* 고른 지역이 아래쪽 줄에 있으면 화면 밖이라 안 보인다.
     어디가 켜져 있는지 모르게 되므로, 그 줄이 보이도록 세로로 민다.
     고른 것이 바뀐 때만 민다 — 안 그러면 검색어를 칠 때마다 줄이 튄다. */
  if (RG_SHOWN !== DB_RG) {
    RG_SHOWN = DB_RG;
    var on = bar.querySelector('button.on');
    if (on) {
      /* 위에 앞 줄이 살짝 보이게 띄운다. 다만 접어서 한 줄만 보일 때는
         띄울 자리가 없다 — 띄우면 고른 줄이 되레 화면 밖으로 밀려난다. */
      var room = bar.clientHeight - on.offsetHeight;
      var gap  = room > 36 ? 36 : (room > 0 ? room : 0);
      var want = on.offsetTop - gap;
      bar.scrollTop = want > 0 ? want : 0;
    }
  }
}

function pickRegion(k) {
  DB_RG = (DB_RG === k) ? '' : k;        /* 같은 것을 또 누르면 전체로 */
  try {
    if (DB_RG) localStorage.setItem(RG_KEY, DB_RG);
    else localStorage.removeItem(RG_KEY);
  } catch (e) {}
  render();
  window.scrollTo(0, 0);
}

function renderDB() {
  var q = lc_(document.getElementById('search').value.trim());
  var base = DB.filter(function (h) {
    return !q || hit_(h.name, q) || hit_(h.addr, q);
  });

  sortByRegion_(base);

  var plan = regionPlan_();        /* 묶을 곳은 DB 전체를 보고 정한다 */
  /* 묶는 기준이 바뀌어 옛 열쇠가 더 이상 없으면 전체로 되돌린다 */
  if (DB_RG && !RG_NAME[DB_RG]) {
    DB_RG = '';
    try { localStorage.removeItem(RG_KEY); } catch (e) {}
  }
  paintRegionBar_(base, plan);     /* 단추 숫자는 지역을 거르기 전 기준 */

  var list = DB_RG
    ? base.filter(function (h) {
        var m = plan[h._rg.key];
        return m && m.key === DB_RG;
      })
    : base;

  paintTitle(list.length, DB.length);
  var el = document.getElementById('list');

  if (!list.length) {
    var msg;
    if (!DB.length) msg = '등록된 병원이 없습니다.<br>+ 를 눌러 추가하세요.';
    else if (DB_RG) msg = esc(RG_NAME[DB_RG] || DB_RG) + '에는 찾는 병원이 없습니다.'
                        + '<br><button class="ghost small" style="margin-top:10px"'
                        + ' onclick="pickRegion(\'\')">전체 보기</button>';
    else msg = '검색 결과가 없습니다.';
    el.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }

  /* 한 지역만 보고 있으면 지역 구분줄은 군더더기다.
     다만 묶음('경기 그 밖')은 여러 시·군이 섞여 있으므로 구분줄을 둔다. */
  var head_ = (DB_RG && !RG_ROLL[DB_RG]) ? function () { return ''; }
                                         : regionHead_(list);
  el.innerHTML = list.map(function (h) {
    return head_(h) + '<div class="' + recCls(h) + '">' +
      '<div class="dbhead">' +
        '<h2>' + esc(h.name) + '</h2>' +
        '<button class="edit" onclick="openForm(\'' + h.id + '\')">수정</button>' +
      '</div>' +
      (h.addr ? '<div class="addr">' + esc(h.addr) + '</div>' : '') +
      samedayTag(h) + metaLine(h, { checked: true, skipStay: true }) +
      (h.memo ? '<div class="memo">' + esc(h.memo) + '</div>' : '') +
    '</div>';
  }).join('') + '<div class="ver" id="verLine" onclick="verTap()" ' +
    'oncontextmenu="forceUpdate();return false">' + verLineHtml_() + '</div>';
}

/* ---------- seg ---------- */
function buildSeg(key) {
  var box = document.getElementById('seg_' + key);
  box.innerHTML = SEG_OPTS[key].map(function (o) {
    return '<button type="button" onclick="pick(\'' + key + '\',\'' + o + '\')">' + o + '</button>';
  }).join('');
  paintSeg(key);
}
function pick(key, val) {
  seg[key] = (seg[key] === val) ? '' : val;
  paintSeg(key);
  if (key === 'parking') paintParkAddr();
  if (key === 'wait' && seg.wait) rawWait = '';
}

function toggleStay() { stayWait = !stayWait; paintStay(); }
function paintStay() {
  document.getElementById('f_stay').className = stayWait ? 'chkrow on' : 'chkrow';
}

/* 주차장 주소 칸은 주차가 '인근'일 때만 띄운다.
   이미 입력해 둔 값이 있으면 '가능'으로 바꿔도 계속 보여 준다. */
function paintParkAddr() {
  var box = document.getElementById('paddrRow');
  var has = document.getElementById('f_paddr').value.trim();
  box.style.display = (seg.parking === '인근' || has) ? 'block' : 'none';
}
function paintSeg(key) {
  var box = document.getElementById('seg_' + key);
  Array.prototype.forEach.call(box.children, function (b) {
    b.className = (b.textContent === seg[key]) ? 'sel' : '';
  });
}

/* ---------- 점심시간 ----------
   시계 두 칸과 '없음'을 없애고 단추만 남겼다.
   아무것도 안 누르면 '점심에 안 쉬는 곳'으로 본다. (계산도 그렇게 한다) */
var lunchVal = '';

function buildLunchQuick() {
  var box = document.getElementById('lunchQuick');
  if (!box) return;
  box.innerHTML = LUNCH_OPTS.map(function (o) {
    return '<button type="button"' + (o === LUNCH_NONE ? ' class="none"' : '') +
           ' onclick="pickLunch(\'' + o + '\')">' + o + '</button>';
  }).join('');
  paintLunch();
}
function pickLunch(v) {
  lunchVal = (lunchVal === v) ? '' : v;
  if (lunchVal) rawLunch = '';      /* 단추를 고르면 옛 글자는 버린다 */
  paintLunch();
}
function paintLunch() {
  var box = document.getElementById('lunchQuick');
  if (!box) return;
  Array.prototype.forEach.call(box.children, function (b) {
    var base = (b.textContent === LUNCH_NONE) ? 'none' : '';
    b.className = (b.textContent === lunchVal) ? (base + ' sel').trim() : base;
  });
}
function lunchValue() { return lunchVal || rawLunch; }

function setLunch(v) {
  var t = String(v || '').trim();
  lunchVal = (LUNCH_OPTS.indexOf(t) > -1) ? t : '';
  /* 단추에 없는 글자는 지워지지 않게 지켜 둔다 */
  rawLunch = (t && !lunchVal) ? t : '';
  paintLunch();
}

/* ---------- 진료시작 ----------
   병원 문 여는 시각은 늘 오전이다. 실수로 오후를 고르면 오전으로 바로잡는다. */
function onOpenTime() {
  var el = document.getElementById('f_open');
  var m = String(el.value || '').match(/^(\d{2}):(\d{2})$/);
  if (!m) return;
  var h = Number(m[1]);
  if (h > 12) {
    el.value = ('0' + (h - 12)).slice(-2) + ':' + m[2];
    toast('진료시작을 오전으로 맞췄습니다', 3000);
  }
}

/* 'HH:MM' 으로 확실히 읽히는 것만 통과시킨다.
   '09:00~18:00' 같은 글자를 억지로 시각으로 바꾸면 엉뚱한 값이 저장된다. */
function normTime_(v) {
  var m = String(v || '').trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return '';
  var hh = Number(m[1]), mm = Number(m[2]);
  if (hh > 23 || mm > 59) return '';
  return ('0' + hh).slice(-2) + ':' + ('0' + mm).slice(-2);
}

/* ---------- 병원 폼 ---------- */
/* 방문 창 위에서 병원을 고치는 중인가 */
var OVER_V = null;

/* 방문 창에 적힌 것이 저장된 값과 다른가.
   ★ 'DB 수정에 들어갈 때' 와 견주면 안 된다. 들어가기 전에 적어 둔 메모가
      저장되지 않고 사라진다. 시트에 들어 있는 값과 견뎌야 한다. */
function visitDirty_() {
  if (!vEditId) return true;                 /* 새로 등록하던 중이면 저장한다 */
  var rec = VISITS.filter(function (x) { return x.id === vEditId; })[0];
  if (!rec) return true;
  var memo = document.getElementById('v_memo').value.trim();
  if (subDone) memo = (memo ? memo + ' ' : '') + DONE_MARK;
  var date = dateTbd ? '' : document.getElementById('v_date').value;
  return document.getElementById('v_name').value !== rec.name
      || date !== (rec.date || '')
      || memo !== String(rec.memo || '').trim();
}

/* 병원을 저장했으면 방문일정 목록으로 바로 돌려보낸다.
   방문 쪽도 손댔으면 (또는 병원 이름이 바뀌었으면) 그것까지 같이 저장한다.
   저장을 두 번 누르게 만들지 않는다. */
function backToVisits_() {
  var vf = document.getElementById('visitForm');
  if (!vf || vf.style.display !== 'block') return;
  if (visitDirty_()) saveVisit_();      /* 바뀐 것이 있으면 같이 저장 */
  else closeSheet('visitForm');
  window.scrollTo(0, 0);
}

/* 방문 수정 창에서 그 병원의 DB를 고치러 간다.
   방문 창을 닫지 않고 그 위에 올린다 — 적다 만 메모가 날아가면 안 된다. */
function openFormOver_() {
  if (!vHid) { toast('이 방문은 병원DB와 연결돼 있지 않습니다'); return; }
  var h = DB.filter(function (x) { return x.id === vHid; })[0];
  if (!h) { toast('병원DB에서 찾지 못했습니다'); return; }
  openForm(vHid);                       /* openForm 안에서 OVER_V 가 비워진다 */
  OVER_V = 1;
  var el = document.getElementById('form');

     단추에 없는 옛 글자는 지워지지 않게 그대로 지켜 둔다. (#5) */
  var waitTxt = h ? String(h.wait || '') : '';
  var known = SEG_OPTS.wait.indexOf(waitTxt) > -1;
  seg.wait = known ? waitTxt : '';
  rawWait = (waitTxt && !known) ? waitTxt : '';
  /* 시트에 '9시', '09:00~18:00' 처럼 적혀 있으면 시각칸이 못 읽는다.
     그 글자를 기억해 두었다가, 사용자가 손대지 않으면 그대로 지켜준다. */
  var openTxt = h ? String(h.open || '') : '';
  var openOk = normTime_(openTxt);
  rawOpen = (openTxt && !openOk) ? openTxt : '';
  document.getElementById('f_open').value = openOk;
  document.getElementById('f_paddr').value = h ? (h.pAddr || '') : '';
  stayWait = h ? !!h.stay : false;

  var lunchTxt = h ? String(h.lunch || '') : '';

  /* 당일발급은 '불가능'일 때만 눌린 상태로 둔다 (가능·빈칸은 안 눌림) */
  seg.sameday = (h && h.sameday === '불가능') ? '불가능' : '';
  /* 사전신청은 되는 방법만 단추로 남았다. '불가능'은 안 눌린 것과 같다 */
  seg.prereq  = (h && h.prereq && h.prereq !== '불가능') ? h.prereq : '';
  seg.parking = h ? h.parking : '';
  buildSeg('sameday'); buildSeg('prereq'); buildSeg('parking'); buildSeg('wait');
  buildLunchQuick();
  paintParkAddr();
  setLunch(lunchTxt);

  var rn = document.getElementById('rawNote'), warn = [];
  if (rawOpen) warn.push('진료시작 “' + esc(rawOpen) + '”');
  if (rawLunch) warn.push('점심시간 “' + esc(rawLunch) + '”');
  if (rawWait) warn.push('발급소요 “' + esc(rawWait) + '”');
  if (warn.length) {
    rn.innerHTML = warn.join(' · ') + ' 는 화면 칸이 읽지 못한 값입니다.<br>' +
                   '그대로 두면 원래 값이 유지되고, 새로 고르면 바뀝니다.';
    rn.style.display = 'block';
  } else { rn.style.display = 'none'; }

  document.getElementById('delBtn').style.display = h ? 'block' : 'none';
  openSheet('form');
}

   안 그러면 방문 창에는 옛 이름이 남아 있다가 그대로 저장된다. */

/* ---------- 창구에서 들은 말 읽기 ----------
   AI 도 인터넷도 안 쓴다. 글자만 보고 고른다 — 지하 원무과에서도 된다.
   확실하지 않으면 손대지 않는다. 틀리게 채우느니 비워 두는 편이 낫다. */

function quickNorm_(s) {
  return String(s || '').replace(/\s+/g, ' ').trim();
}

/* 들은 말 -> 채울 값. 모르는 칸은 넣지 않는다. */
function quickParse_(txt) {
  var t = quickNorm_(txt);
  if (!t) return null;
  var flat = t.replace(/\s/g, '');
  var out = {};

  /* ① 당일발급 — '안 된다' 는 말이 있을 때만 '불가능' 으로 본다 */
  var noToday = /(당일|오늘|바로|즉시)[^.]{0,6}(안|못|불가|어렵)/.test(flat)
             || /(안|못)[가-힣]{0,3}(돼|되|나와|발급)/.test(flat) && /(당일|오늘)/.test(flat);
  var yesToday = /(당일|오늘|바로|즉시)[^.]{0,6}(돼|되|가능|나와|발급)/.test(flat);
  if (noToday) out.sameday = '불가능';
  else if (yesToday) out.sameday = '가능';

  /* ② 사전신청 — 되는 방법이 적혀 있을 때만 */
  if (/(팩스|fax|FAX)/.test(t)) out.prereq = '팩스';
  else if (/(인터넷|온라인|홈페이지|앱으로|사이트)/.test(t)) out.prereq = '인터넷';
  else if (/(전화|유선|콜)/.test(t)) out.prereq = '유선';

  /* ③ 발급소요 — 단추에 있는 세 가지 가운데 가장 가까운 것 */
  var mm = flat.match(/(\d+)\s*분/);
  var hh = flat.match(/(\d+)\s*시간/);
  if (/(한시간|1시간)/.test(flat)) out.wait = '1시간 내외';
  else if (hh) out.wait = (Number(hh[1]) >= 1) ? '1시간 내외' : '30분 내외';
  else if (mm) {
    var n = Number(mm[1]);
    out.wait = (n <= 15) ? '10분 내외' : (n <= 45 ? '30분 내외' : '1시간 내외');
  } else if (/(바로|즉시|금방)/.test(flat)) out.wait = '10분 내외';

  /* 며칠 걸린다 = 당일에 못 받는다 */
  if (/(이틀|사흘|나흘|며칠|\d+\s*일|다음날|내일|모레|하루)/.test(flat)
      && /(걸리|걸려|걸림|뒤에|후에|나와|나옴|지나|와야|오셔야|오세요)/.test(flat)) {
    out.sameday = '불가능';
    delete out.wait;                  /* 날짜 단위는 발급소요 단추로 못 담는다 */
    out.days = true;
  }

  /* ④ 접수 후 기다리는가 */
  if (/(기다렸다|기다려|대기했다|그자리에서|앉아서)/.test(flat)) out.stay = true;
  else if (/(나중에|다시와|다시오|찾으러|받으러|이따)/.test(flat)) out.stay = false;

  /* ⑤ 주차 */
  if (/(주차).{0,8}(안|못|없|불가)/.test(flat)) out.parking = '인근';
  else if (/(주차).{0,8}(돼|되|가능|있)/.test(flat)) out.parking = '가능';

  for (var k in out) { if (out.hasOwnProperty(k)) return out; }
  return null;
}

/* 읽어서 화면 칸에 넣고, 무엇을 넣었는지 보여 준다 */
function quickRead_() {
  var el = document.getElementById('f_quick');
  var note = document.getElementById('quickNote');
  var txt = el ? el.value : '';
  var r = quickParse_(txt);

  if (!r) {
    note.className = 'qnote on';
    note.innerHTML = quickNorm_(txt)
      ? '<span class="no">무슨 말인지 못 읽었습니다.</span> 아래 단추로 직접 골라 주세요.'
      : '<span class="no">들은 대로 적어 주세요.</span> 예) 당일 안 되고 팩스로 미리 신청, 이틀 걸려요';
    return;
  }

  var said = [];
  if (r.sameday) { seg.sameday = (r.sameday === '불가능') ? '불가능' : '';
                   buildSeg('sameday'); said.push('당일발급 <b>' + r.sameday + '</b>'); }
  if (r.prereq)  { seg.prereq = r.prereq; buildSeg('prereq');
                   said.push('사전신청 <b>' + r.prereq + '</b>'); }
  if (r.wait)    { seg.wait = r.wait; rawWait = ''; buildSeg('wait');
                   said.push('발급소요 <b>' + r.wait + '</b>'); }
  if (r.parking) { seg.parking = r.parking; buildSeg('parking'); paintParkAddr();
                   said.push('주차 <b>' + r.parking + '</b>'); }
  if (r.stay !== undefined) { stayWait = !!r.stay; paintStay();
                   said.push(r.stay ? '<b>기다렸다 받음</b>' : '<b>나중에 다시</b>'); }

  /* 날짜 단위로 걸리는 곳은 메모에 적어 둔다 — 단추로는 담을 수 없다 */
  if (r.days) {
    var m = document.getElementById('f_memo');
    var line = quickNorm_(txt);
    if (m && m.value.indexOf(line) < 0) m.value = (m.value ? m.value + '\n' : '') + line;
    said.push('며칠 걸린다는 말은 <b>메모</b>에 적었습니다');
  }

  note.className = 'qnote on';
  note.innerHTML = '\u2713 ' + said.join(' \u00b7 ')
    + '<br>맞으면 아래 <b>저장</b>을 누르세요. 틀리면 단추로 고치시면 됩니다.';
}

/* 저장은 기다리지 않는다. 창을 바로 닫고 서버에는 뒤에서 보낸다. */
function saveHospital_() {
  var name = document.getElementById('f_name').value.trim();
  if (!name) { toast('병원명을 입력하세요'); return; }

  var payload = {
    id: editId, name: name,
    addr: joinAddr_(),
    /* 안 눌렀으면 '가능'. 대부분이 되는 곳이라 그게 기본값이다 */
    sameday: seg.sameday || '가능',
    prereq: seg.prereq,
    wait: seg.wait || rawWait,
    open: document.getElementById('f_open').value || rawOpen,
    lunch: lunchValue(), parking: seg.parking,
    pAddr: document.getElementById('f_paddr').value.trim(),
    stay: stayWait ? 1 : '',
    memo: document.getElementById('f_memo').value.trim()
  };

  var over = OVER_V; OVER_V = null;   /* 방문 창 위에서 고치던 중이었나 */

  closeSheet('form');
  syncVisitName_(editId, name);   /* 아래 깔린 방문 창에도 새 이름을 넣어 준다 */
  if (over) backToVisits_();

  /* 화면을 먼저 바꾼다. 서버 대답을 기다리지 않으니 바로 반영된 것처럼 보인다.
     실패하면 되돌린다. */
  var was = DB.slice();
  var old = null;
  DB.forEach(function (x) { if (x.id === editId) old = x; });
  var same = old && old.addr === payload.addr;
  var sameP = old && old.pAddr === payload.pAddr;

  var draft = {
    /* 방문일정과 같은 모양이어야 pending_ 이 '저장 중' 으로 알아본다.
       밑줄이 없어서 그냥 지나쳤고, 그 틈에 가짜 병원번호가 시트에 적혔다. */
    id: editId || ('tmp_' + Date.now()),
    name: payload.name, addr: payload.addr,
    sameday: payload.sameday, prereq: payload.prereq, wait: payload.wait,
    open: payload.open, lunch: payload.lunch, parking: payload.parking,
    pAddr: payload.pAddr, stay: !!payload.stay, memo: payload.memo,
    checked: todayStr(),
    /* 주소가 그대로면 좌표도 그대로. 바뀌었으면 서버가 찾아서 알려 준다 */
    lat: same ? old.lat : '', lng: same ? old.lng : '',
    pLat: sameP ? old.pLat : '', pLng: sameP ? old.pLng : ''
  };
  if (old) DB = DB.map(function (x) { return x.id === editId ? draft : x; });
  else DB = DB.concat([draft]);
  touch_();
  toast('저장 중…');

  srv().then(function (res) {
      if (res && res.row) {
        DB = DB.map(function (x) { return x.id === draft.id ? res.row : x; });
        touch_();
      } else {
        loadAll(true);                 /* 옛 서버면 예전처럼 전체를 다시 받는다 */
      }
      toast(res && res.warn ? ('저장됨 · ' + res.warn) : '저장됨', res && res.warn ? 5200 : 2200);
    })
    .err(function (e) {
      DB = was; touch_();
      toast('저장 실패 · ' + e.message + '\n바꾸기 전으로 되돌렸습니다.', 6000);
    })
    .saveHosp(payload);
}

function delHospital_() {
  if (!editId || pending_(editId)) return;
  var id = editId;                 /* 묻는 동안 바뀔 수 있으니 미리 잡아 둔다 */
  ask_('이 병원을 병원DB에서 지울까요?', function () { delHospitalGo_(id); }, '삭제');
}
function delHospitalGo_(id) {
  closeSheet('form');
  /* 지우기 전에 원래 것과 있던 자리를 들고 있는다.
     예전에는 되돌리지 않고 새로고침에 맡겼는데, 삭제가 실패하는 까닭은
     대개 통신이라 그 새로고침도 같이 실패한다. 그러면 시트에는 멀쩡히
     있는 병원이 화면에서만 사라진 채 굳는다. (방문일정은 이미 이렇게 한다) */
  var gone = null, at = -1;
  for (var i = 0; i < DB.length; i++) {
    if (DB[i].id === id) { gone = DB[i]; at = i; break; }
  }
  DB = DB.filter(function (x) { return x.id !== id; });
  touch_();
  toast('삭제됨');
  srv().err(function (e) {
         if (gone) {                       /* 제자리에 도로 넣는다 */
           DB.splice(Math.min(at < 0 ? DB.length : at, DB.length), 0, gone);
           touch_();
         }
         toast('지우지 못했습니다 · ' + e.message + '\n병원을 되돌려 놓았습니다.', 5600);
       })
       .delHosp(id);
}

function openVisitForm(id, presetHid, presetObj) {
  if (id && pending_(id)) return;
  vEditId = id || null;
  var v = id ? VISITS.filter(function (x) { return x.id === id; })[0] : null;
  /* 고유번호로 못 찾으면 넘겨받은 병원을 그대로 쓴다 (번호가 빈 자료 대비) */
  var preset = presetHid
    ? DB.filter(function (x) { return x.id === presetHid; })[0]
    : null;
  if (!preset && presetObj) preset = presetObj;
  vHid = v ? (v.hid || '') : (preset ? preset.id : '');

  document.getElementById('visitTitle').textContent = v ? '방문 수정' : '방문 등록';
  document.getElementById('v_name').value = v ? v.name : (preset ? preset.name : '');
  subDone = v ? isSubmitted(v) : false;
  document.getElementById('v_memo').value = v ? plainMemo(v) : '';
  paintSub();

  /* 새로 등록할 때는 다음 날을 기본으로 넣어 둔다 */
  var d = v ? v.date : tomorrowStr();
  document.getElementById('v_date').value = d;

  paintTbd();

  /* 상태는 화면에서 고르지 않는다. 새로 등록하면 '예정',

  vStatus = v ? v.status : '예정';

  var hasH = !!(vHid && DB.filter(function (x) { return x.id === vHid; })[0]);
  document.getElementById('v_edith').style.display = hasH ? 'block' : 'none';

  document.getElementById('vDelBtn').style.display = v ? 'block' : 'none';
  openSheet('visitForm');
}

/* 같은 날짜 그룹의 맨 뒤 순번 */
function nextOrder(date) {
  var n = 0;
  VISITS.forEach(function (x) {
    if ((x.date || '') === (date || '') && x.status !== '완료' && (x.order || 0) > n) n = x.order;
  });
  return n + 1;
}

/* 아직 서버에 저장되지 않은 카드인지 확인한다.
   저장이 끝나기 전에 완료·보류·순서변경을 누르면 엉뚱한 곳에 저장되므로 막는다. */
function pending_(id) {
  if (String(id).indexOf('tmp_') === 0) {
    toast('저장 중입니다. 잠시 후 다시 눌러 주세요.', 3000);
    return true;
  }
  return false;
}

/* 저장을 기다리지 않는다. 목록에 먼저 반영하고 서버에는 뒤에서 보낸다.
   실패하면 원래대로 되돌린다. */
function toggleSub() { subDone = !subDone; paintSub(); }
function paintSub() {
  document.getElementById('v_sub').className = subDone ? 'chkrow on' : 'chkrow';
}

function saveVisit_() {
  var name = document.getElementById('v_name').value.trim();
  if (!name) { toast('병원을 선택하세요'); return; }

  var date = dateTbd ? '' : document.getElementById('v_date').value;
  var memo = document.getElementById('v_memo').value.trim();
  if (subDone) memo = (memo ? memo + ' ' : '') + DONE_MARK;

  var editing = !!vEditId;
  var rec = null, before = null;

  if (editing) {
    rec = VISITS.filter(function (x) { return x.id === vEditId; })[0];
    if (!rec) { toast('대상을 찾지 못했습니다. 새로고침합니다.'); loadAll(true); return; }
    before = { hid: rec.hid, name: rec.name, date: rec.date, memo: rec.memo, order: rec.order };
    if ((rec.date || '') !== date) rec.order = nextOrder(date);
    rec.hid = vHid; rec.name = name; rec.date = date; rec.memo = memo;
  } else {
    rec = {
      id: 'tmp_' + Date.now(), hid: vHid, name: name,
      date: date, status: vStatus, memo: memo, order: nextOrder(date)
    };
    VISITS.push(rec);
  }

  var payload = {
    id: editing ? vEditId : null, hid: vHid, name: name,
    date: date, status: rec.status, memo: memo,
    /* 날짜를 옮기면 새 날의 맨 뒤 번호를 매겨 두는데, 예전에는 이 번호를
       안 보내서 시트에는 옛 날짜의 번호가 그대로 남았다. 그래서 다음에
       받아오면 엉뚱한 자리로 튀었다. */
    order: rec.order || ''
  };

  closeSheet('visitForm');
  touch_();
  toast(editing ? '수정됨' : '등록됨');

  srv().then(function (newId) {
        if (!editing && newId) { rec.id = newId; touch_(); }
      })
      .err(function (e) {
        if (editing) {
          rec.hid = before.hid; rec.name = before.name;
          rec.date = before.date; rec.memo = before.memo; rec.order = before.order;
        } else {
          VISITS = VISITS.filter(function (x) { return x.id !== rec.id; });
        }
        touch_();
        toast('저장 실패 · 되돌렸습니다: ' + e.message, 5600);
        loadAll(true);
      })
      .saveVisit(payload);
}

/* 상태 변경: 화면을 먼저 바꾸고 서버에는 뒤에서 알린다 */
function setStatusOptimistic(id, next, okMsg) {
  if (pending_(id)) return;
  var v = null;
  for (var i = 0; i < VISITS.length; i++) {
    if (VISITS[i].id === id) { v = VISITS[i]; break; }
  }
  if (!v) return;

  var prev = v.status;
  v.status = next;
  touch_();

  srv().then(function () { toast(okMsg); })
       .err(function (e) {
         v.status = prev; touch_();
         toast('실패 · 되돌렸습니다: ' + e.message, 5200);
         loadAll(true);          /* 서버가 실제로는 바뀌었을 수도 있으니 다시 맞춘다 */
       })
       .setStatus(id, next);
}

/* 같은 날짜 안에서 방문 순서를 한 칸 옮긴다 */
function moveVisit(id, dir) {
  if (pending_(id)) return;
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (!v) return;

  var group = visitsOf('visit').filter(function (x) {
    return (x.date || '') === (v.date || '') && x.status !== '완료';
  });
  group.sort(function (a, b) {
    var p = a.order || 9999, q = b.order || 9999;
    if (p !== q) return p - q;
    return a.name.localeCompare(b.name, 'ko');
  });

  var i = group.indexOf(v), j = i + dir;
  if (i < 0 || j < 0 || j >= group.length) return;

  /* 바꾸기 전 번호를 들고 있는다. 서버에 못 보내거나 실패하면 되돌린다.
     예전에는 '곧 새로고침되면서 되돌아간다' 고 적어 두었는데, 그런
     새로고침이 없어서 화면과 기기에만 새 순서가 남아 굳었다. */
  var wasOrder = {};
  group.forEach(function (x) { wasOrder[x.id] = x.order; });
  function undoOrder_() {
    group.forEach(function (x) { x.order = wasOrder[x.id]; });
    touch_();
  }

  group[i] = group[j];
  group[j] = v;
  group.forEach(function (x, k) { x.order = k + 1; });
  touch_();

  var ids = group.map(function (x) { return x.id; });
  if (ids.join(',').indexOf('tmp_') > -1) {
    undoOrder_();
    toast('저장 중인 일정이 있어 순서를 아직 바꿀 수 없습니다.\n잠시 후 다시 눌러 주세요.', 5200);
    return;
  }
  srv().err(function (e) {
         undoOrder_();
         toast('순서를 저장하지 못했습니다 · ' + e.message + '\n되돌려 놓았습니다.', 5200);
       })
       .reorder(ids);
}

function holdVisit(id) { setStatusOptimistic(id, '보류', '보류로 이동'); }

/* 접수만 하고 온 경우: 메모에 표시를 남기고 보류로 넘긴다.
   다음에 일정으로 되돌리면 수령 한 번만 잡힌다. */
function submitAndHold(id) {
  if (pending_(id)) return;
  var v = null;
  for (var i = 0; i < VISITS.length; i++) if (VISITS[i].id === id) { v = VISITS[i]; break; }
  if (!v) return;

  var before = { memo: v.memo, status: v.status };
  if (!isSubmitted(v)) v.memo = (v.memo ? v.memo + ' ' : '') + DONE_MARK;
  v.status = '보류';
  touch_();
  toast('접수함으로 표시하고 보류로 옮겼습니다', 3600);

  /* 성공하면 다시 받아올 것이 없다 — 화면은 이미 바꿔 놓았다.
     그 한 번이 구글 쪽 줄에 서면 바로 뒤에 누른 [완료] 가 밀린다. */
  srv().err(function (e) {
         v.memo = before.memo; v.status = before.status; touch_();
         toast('실패 · 되돌렸습니다: ' + e.message, 5200);
         loadAll(true);                  /* 실패했을 때만 다시 맞춘다 */
       })
       .saveVisit({ id: id, hid: v.hid, name: v.name, date: v.date,
                    status: '보류', memo: v.memo });
}
function doneVisit(id) {
  tripDone_(id);            /* 실제로 걸린 시간을 매듭짓는다 */
  setStatusOptimistic(id, '완료', '완료 처리됨');
}
function undoVisit(id) { setStatusOptimistic(id, '예정', '예정으로 되돌림'); }

function resumeVisit(id) {
  var v = VISITS.filter(function (x) { return x.id === id; })[0];
  if (v && !v.date) {
    toast('재방문일을 먼저 지정하세요');
    openVisitForm(id);
    return;
  }
  setStatusOptimistic(id, '예정', '방문일정으로 복귀');
}

function delVisit_() {
  if (!vEditId || pending_(vEditId)) return;
  var id = vEditId;                /* 묻는 동안 바뀔 수 있으니 미리 잡아 둔다 */
  ask_('이 방문 일정을 삭제할까요?', function () { delVisitGo_(id); }, '삭제');
}
function delVisitGo_(id) {
  if (pending_(id)) return;
  closeSheet('visitForm');
  /* 지우기 전에 원래 것과 있던 자리를 들고 있는다.
     실패했을 때 되돌리기 위해서다. 예전에는 되돌리지 않고 새로고침에
     맡겼는데, 삭제가 실패한 까닭은 대개 통신이라 그 새로고침도 같이
     실패했다. 그러면 서버에는 남아 있는 일정이 화면에서만 사라진 채 굳는다. */
  var gone = null, at = -1;
  for (var i = 0; i < VISITS.length; i++) {
    if (VISITS[i].id === id) { gone = VISITS[i]; at = i; break; }
  }
  VISITS = VISITS.filter(function (x) { return x.id !== id; });
  touch_();
  toast('삭제됨');
  srv().err(function (e) {
         if (gone) {                       /* 제자리에 도로 넣는다 */
           VISITS.splice(Math.min(at < 0 ? VISITS.length : at, VISITS.length), 0, gone);
           touch_();
         }
         toast('삭제하지 못했습니다 · ' + e.message + '\n일정을 되돌려 놓았습니다.', 5600);
         loadAll(true);
       })
       .delVisit(id);
}


/* ==================================================================
   동선 — 오늘 방문할 병원을 어떤 순서로 도는 게 빠른지 계산한다.

   병원마다 상태가 셋: 미방문 → 접수됨 → 완료
   사전신청이 되는 곳은 미리 신청해 두므로 한 번만 들르면 되고,
   안 되는 곳은 접수하고 서류가 나올 때까지 기다렸다 수령해야 한다.
   그 사이에 다른 병원을 도는 게 이득인지까지 같이 따진다.
   ================================================================== */

var STOP_MIN = 10;          /* 병원 한 번 들르면 쓰는 시간 */
var DEFAULT_WAIT = 30;      /* 발급소요를 안 적어 둔 병원의 가정값 */
/* 서류 발급이 가능한 마지막 시각. 이 시각을 넘기는 일정은 짜지 않는다. */
var DAY_END = 17 * 60 + 30;
var DAY_OPEN = 8 * 60;          /* 이 시각 전은 '아직 이른 새벽'으로 본다 */
var PLAN_DAWN = 9 * 60;         /* 그럴 때 기준으로 삼는 시각 */
/* 방문 메모에 이 말이 있으면 접수는 끝난 것으로 보고 수령만 잡는다 */
var DONE_MARK = '[접수완료]';
var PLAN_MAX = 12;          /* 서버가 한 번에 받아 주는 지점 수와 맞춘다 */
var PLAN_EXACT = 8;         /* 여기까지는 정밀 계산도 해 본다 */
/* '최단거리'라도 시간을 통째로 버리는 건 손해다. 한 시간을 이만큼의
   km 로 쳐서 같이 견준다. 0 이면 0.2km 아끼려고 30분을 기다리는
   순서가 나온다. */
var KM_PER_HOUR = 2;
/* 순서를 다듬는 데 쓸 시간 (ms). 폰에서 화면이 멈춰 보이지 않을
   만큼으로 잡았다. 이 안에서 찾은 것만 쓴다.
   PLAN_MS 는 '한 바퀴', PLAN_MS_ALL 은 '한 번 계산' 전체에 쓸 시간이다.
   한 번만 주면, 마감을 못 맞춰 여러 바퀴 도는 날에 앞바퀴가 시간을
   다 써 버리고 정작 답이 되는 마지막 바퀴가 거칠게 나온다. */
var PLAN_MS = 150;
var PLAN_MS_ALL = 1200;
var PLAN_TILL = 0;          /* 이 바퀴는 언제까지 */
var PLAN_END = 0;           /* 계산 전체는 언제까지 */
var PLAN_TRIES = 30;        /* 살짝 흔들어 다시 다듬어 보는 횟수 */
/* 마감(17:30)을 넘기는 곳 한 군데를 몇 분어치 손해로 칠지.
   너무 크게 잡으면, 어차피 뒤로 밀릴 한 곳을 살리겠다고 20km 를
   더 달리는 순서가 나온다. 너무 작게 잡으면 맞출 수 있는 날에도
   병원을 내일로 미룬다. 여러 값을 재 보고 고른 값이다. */
var LATE_COST = 300;
/* 흔들 때 쓰는 값. 씨앗을 고정해 두므로 같은 판이면 늘 같은 답이 나온다 */
var RS = 0;
function rs_() { RS = (RS * 1103515245 + 12345) & 0x7fffffff; return RS / 0x7fffffff; }

var MYLOC = null;           /* 출발 {lat, lng, label} */
var MYEND = null;           /* 도착 {lat, lng, label, kind} */
var PLAN_MODE = 'time';     /* 'time' 빨리 끝내기 / 'dist' 적게 움직이기 */
/* 집·사무실 주소는 이 기기에만 저장한다 (시트에 올리지 않는다) */
var SPOT_KEY = { home: 'hdb_home', office: 'hdb_office' };
var SPOT_NAME = { home: '집', office: '사무실' };

function spotGet(kind) {
  try { var v = localStorage.getItem(SPOT_KEY[kind]); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function spotSet(kind, obj) {
  try { localStorage.setItem(SPOT_KEY[kind], JSON.stringify(obj)); } catch (e) {}
}
try { PLAN_MODE = localStorage.getItem('hdb_mode') || 'time'; } catch (e) {}
var PLAN = null;            /* 계산 결과 */
var PINS = { date: '', ids: [] };   /* '먼저 가기'로 못 박은 방문 id, 누른 차례대로 */

var PLAN_KEY = 'hdb_plan', PIN_KEY = 'hdb_pins', LOC_KEY = 'hdb_loc', END_KEY = 'hdb_end';

/* 짠 동선을 이 기기에 남겨 둔다. 앱을 껐다 켜도 그대로 보인다. (#4) */
/* ---------- 실제로 걸린 시간 ----------
   이미 누르고 계신 세 번의 손길만으로 잰다. 따로 누를 것도 없고,
   위치를 따라다니지도 않는다 (웹앱은 뒤로 밀리면 재워지므로 못 한다).

     [길찾기] 누름        -> 출발 시각
     네이버 갔다 돌아옴    -> 도착 시각
     [완료] 누름          -> 병원을 떠난 시각                         */
var TRIP_KEY = 'hdb_trip', LOG_KEY = 'hdb_logs', AT_KEY = 'hdb_at';
var TRIP = null;            /* 지금 가는 중 { vid, name, date, est, fac, t0, t1 } */
var TRIP_AT = null;         /* 마지막으로 완료한 자리 { id, date } */
var LOGS = [];
var LOG_MAX = 200;
var TRIP_MIN = 3;           /* 이보다 빨리 돌아오면 잘못 누른 것으로 본다 (분) */
var TRIP_DROP = 6 * 60;     /* 이만큼 지나면 잊는다 (분) */
var FACT_MIN = 5;           /* 기록이 이만큼은 쌓여야 눈금을 맞춘다 */
/* 이보다 오래 걸린 '이동' 은 눈금 맞추기에 안 쓴다.
   앱으로 안 돌아온 채 몇 시간 뒤 완료를 누르면 그 사이가 통째로
   이동시간으로 잡힌다. 그런 기록이 쌓이면 배수가 엉뚱해진다. */
var FACT_FAR = 150;         /* 분 */
/* 예상과 너무 동떨어진 것도 뺀다 (길이 막혔대도 네 배는 아니다) */
var FACT_MAX_R = 4;
var FACT_USE = 20;          /* 최근 이만큼만 본다 */

function timeRestore_() {
  try {
    var a = localStorage.getItem(TRIP_KEY); TRIP = a ? JSON.parse(a) : null;
    var b = localStorage.getItem(LOG_KEY);  LOGS = b ? JSON.parse(b) : [];
    var c = localStorage.getItem(AT_KEY);   TRIP_AT = c ? JSON.parse(c) : null;
  } catch (e) { TRIP = null; LOGS = []; TRIP_AT = null; }
  if (!LOGS || !LOGS.length) LOGS = LOGS || [];
  /* 오래 묵은 길은 버린다 */
  if (TRIP && (Date.now() - TRIP.t0) / 60000 > TRIP_DROP) { TRIP = null; tripSave_(); }
}
function tripSave_() {
  try {
    if (TRIP) localStorage.setItem(TRIP_KEY, JSON.stringify(TRIP));
    else localStorage.removeItem(TRIP_KEY);
  } catch (e) {}
}
function logSave_() { try { localStorage.setItem(LOG_KEY, JSON.stringify(LOGS)); } catch (e) {} }

/* 마지막으로 완료한 병원이 짠 순서에서 몇 번째였나 (0 = 아직 출발지) */
function tripFrom_() {
  if (!PLAN || !PLAN.stops || !TRIP_AT) return 0;
  if (TRIP_AT.date !== PLAN.date) return 0;
  for (var i = 0; i < PLAN.stops.length; i++) {
    if (PLAN.stops[i].id === TRIP_AT.id) return i + 1;
  }
  return 0;
}

/* 지금 있는 자리에서 이 병원까지, 계산이 잡았던 이동시간 (눈금 맞추기 전 값) */
function estTo_(v) {
  if (!PLAN || PLAN.err || !PLAN.T || !PLAN.stops) return null;
  if (PLAN.date !== (v.date || '')) return null;
  var to = -1, i;
  for (i = 0; i < PLAN.stops.length; i++) if (PLAN.stops[i].id === v.id) { to = i; break; }
  if (to < 0) return null;
  var from = tripFrom_();
  var m = (from === 0) ? (PLAN.T.from || [])[to]
                       : ((PLAN.T.mat || [])[from - 1] || [])[to];
  if (m == null) return null;
  /* 이미 눈금을 맞춘 표라면 맞추기 전 값으로 되돌려 적는다.
     안 그러면 실제와 예상이 같아져 배수가 1로 도로 풀린다. */
  var f = (PLAN.fac && PLAN.fac > 0) ? PLAN.fac : 1;
  return Math.round(Number(m) / f);
}

/* [길찾기] 를 눌렀다 */
function tripStart_(v) {
  var now = Date.now();
  if (TRIP && TRIP.vid !== v.id) {
    /* 앞서 가던 길을 완료 없이 두고 다른 데로 간다.
       도착까지는 쟀으니 이동시간만 남기고, 아예 못 쟀으면 버린다. */
    if (TRIP.t1) logAdd_(TRIP, null, now);
    TRIP = null;
  }
  TRIP = { vid: v.id, name: v.name, date: v.date || '',
           est: estTo_(v), fac: (PLAN && PLAN.fac) || 1, t0: now, t1: 0 };
  tripSave_();
}

/* 앱이 다시 보인다 — 돌아온 때가 곧 도착한 때다 */
function tripBack_() {
  if (document.hidden || !TRIP || TRIP.t1) return;
  var mins = (Date.now() - TRIP.t0) / 60000;
  if (mins < TRIP_MIN) return;                  /* 잘못 눌렀거나 금방 돌아왔다 */
  if (mins > TRIP_DROP) { TRIP = null; tripSave_(); return; }
  TRIP.t1 = Date.now();
  tripSave_();
  toast('도착으로 적었습니다 · 이동 ' + Math.round(mins) + '분', 2600);
}

/* [완료] 를 눌렀다 */
function tripDone_(id) {
  var now = Date.now(), i, v0 = null;
  for (i = 0; i < VISITS.length; i++) if (VISITS[i].id === id) { v0 = VISITS[i]; break; }
  if (v0) {
    TRIP_AT = { id: id, date: v0.date || '' };
    try { localStorage.setItem(AT_KEY, JSON.stringify(TRIP_AT)); } catch (e) {}
  }
  if (!TRIP || TRIP.vid !== id) return;
  logAdd_(TRIP, TRIP.t1 ? now : null, now);
  TRIP = null; tripSave_();
}

/* 기록 한 줄.
   doneAt 이 있으면 병원에 있던 시간까지 잰 것이고, 없으면 앱으로 안
   돌아온 채 완료를 누른 것이라 이동시간에 병원 시간이 섞여 있다. */
function logAdd_(tp, doneAt, now) {
  var act, stay = null, mix = false;
  if (tp.t1) {
    act = Math.round((tp.t1 - tp.t0) / 60000);
    if (doneAt) stay = Math.round((doneAt - tp.t1) / 60000);
  } else {
    act = Math.round((now - tp.t0) / 60000);
    mix = true;
  }
  if (!(act > 0) || act > TRIP_DROP) return;
  LOGS.push({ name: tp.name, date: tp.date, est: tp.est, fac: tp.fac || 1,
              act: act, stay: stay, ts: now, mix: mix, off: false });
  if (LOGS.length > LOG_MAX) LOGS = LOGS.slice(LOGS.length - LOG_MAX);
  logSave_();
}

/* 이 방문에 붙는 가장 최근 기록 */
function logFor_(v) {
  for (var i = LOGS.length - 1; i >= 0; i--) {
    if (LOGS[i].name === v.name && LOGS[i].date === (v.date || '')) return LOGS[i];
  }
  return null;
}

/* 카드에 붙는 한 줄 */
function logLine_(v) {
  var L = logFor_(v);
  if (!L) return '';
  var t = '실제 이동 <b>' + L.act + '분</b>';
  if (L.est) t += ' (예상 ' + Math.round(L.est * (L.fac || 1)) + '분)';
  if (L.stay != null) t += ' · 병원에서 <b>' + L.stay + '분</b>';
  if (L.mix) t += '<br>앱으로 돌아오지 않고 완료를 눌러, 이동과 병원 시간이 섞였습니다';
  return '<div class="tlog' + (L.mix ? ' mix' : '') + '">' + t + '</div>';
}

/* 쌓인 기록으로 이동시간을 몇 배로 볼지.
   가운뎃값을 쓰는 까닭은 한 번 크게 막힌 날이 전체를 끌고 가지 않게 하려고. */
/* 눈금 맞추기에 쓰기엔 너무 동떨어진 기록인가 */
function logFar_(L) {
  if (!L) return false;
  if (L.act > FACT_FAR) return true;
  if (L.est >= 5 && L.act / L.est > FACT_MAX_R) return true;
  return false;
}

function driveFactor_() {
  var r = [], i;
  for (i = LOGS.length - 1; i >= 0 && r.length < FACT_USE; i--) {
    var L = LOGS[i];
    if (L.mix || L.off || logFar_(L)) continue;
    if (!(L.est >= 5) || !(L.act >= 1)) continue;
    r.push(L.act / L.est);
  }
  if (r.length < FACT_MIN) return { f: 1, n: r.length };
  r.sort(function (a, b) { return a - b; });
  var m = (r.length % 2) ? r[(r.length - 1) / 2]
                         : (r[r.length / 2 - 1] + r[r.length / 2]) / 2;
  m = Math.max(0.6, Math.min(2, m));
  return { f: Math.round(m * 100) / 100, n: r.length };
}

/* 이동시간 표 전체에 같은 배수를 먹인다. 거리는 건드리지 않는다. */
function tune_(T, f) {
  function m1(a) {
    return (a || []).map(function (x) { return (x == null) ? x : Math.round(x * f); });
  }
  return { from: m1(T.from), fromKm: T.fromKm, to: m1(T.to), toKm: T.toKm,
           dist: T.dist, mat: (T.mat || []).map(m1),
           miss: T.miss, saveErr: T.saveErr };
}

/* ---------- 기록 창 ---------- */
function openTimes() { paintTimes(); openSheet('timeSheet'); }

/* 12 -> '12분 전', 95 -> '1시간 35분 전' */
function agoTxt_(m) {
  m = Math.max(0, Math.round(Number(m) || 0));
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  return Math.floor(m / 60) + '시간 ' + (m % 60) + '분 전';
}

function paintTimes() {
  var fc = driveFactor_();
  var hint;
  if (fc.n >= FACT_MIN) {
    hint = '최근 <b>' + fc.n + '번</b>을 보니 실제 이동시간이 계산보다 '
         + '<b>' + fc.f + '배</b>였습니다. 다음 동선 계산부터 이만큼 반영합니다.';
  } else {
    hint = '쓸 수 있는 기록이 <b>' + fc.n + '번</b>입니다. '
         + '<b>' + FACT_MIN + '번</b>이 넘으면 동선 계산에 반영합니다.';
  }
  hint += '<br>길이 막혔던 날처럼 평소와 다른 기록은 [빼기] 로 계산에서 뺄 수 있습니다.';

  /* 차 블루투스 단축어가 실제로 찍고 있는지 */
  var car;
  if (!CAR_SEEN.at) {
    car = '<b>차 블루투스</b> — 아직 한 번도 안 들어왔습니다.<br>'
        + '단축어 자동화를 안 만드셨거나, 서버에 새 Code.gs 가 안 올라간 것입니다.';
  } else {
    var bits = [];
    if (CAR_SEEN.d != null) bits.push('출발 ' + agoTxt_(CAR_SEEN.d));
    if (CAR_SEEN.a != null) bits.push('도착 ' + agoTxt_(CAR_SEEN.a));
    car = '<b>차 블루투스</b> — ' + (bits.length ? bits.join(' · ') : '기록 없음')
        + '<br>이 줄이 보이면 단축어는 제대로 돌고 있습니다.';
  }
  hint += '<div class="carline">' + car + '</div>';
  document.getElementById('timeHint').innerHTML = hint;

  if (!LOGS.length) {
    document.getElementById('timeList').innerHTML =
      '<div class="empty">아직 기록이 없습니다.<br>[길찾기] 로 출발해서 [완료] 까지 누르면 쌓입니다.</div>';
    return;
  }
  var html = '';
  for (var i = LOGS.length - 1; i >= 0; i--) {
    var L = LOGS[i];
    var v = L.act + '분';
    if (L.est) v += ' / ' + Math.round(L.est * (L.fac || 1)) + '분';
    if (L.stay != null) v += ' · 병원 ' + L.stay + '분';
    var far = logFar_(L);
    var why = L.mix ? ' (섞임)'
            : (L.off ? ' (뺌)'
            : (far ? ' (너무 긺 — 계산에 안 씀)'
            : (L.est >= 5 ? '' : ' (예상 없음)')));
    html += '<div class="trow' + (L.off || L.mix || far ? ' off' : '') + '">' +
      '<span class="tn">' + esc(L.name) + '<br><span class="tv">' +
        esc((L.date || '') + '  ' + v + why) + '</span></span>' +
      '<button class="ghost small" onclick="logOff(' + i + ')">' +
        (L.off ? '되살리기' : '빼기') + '</button>' +
      '<button class="ghost small" onclick="logDel(' + i + ')">지우기</button>' +
    '</div>';
  }
  document.getElementById('timeList').innerHTML = html;
}

function logOff(i) {
  if (!LOGS[i]) return;
  LOGS[i].off = !LOGS[i].off;
  logSave_(); paintTimes(); render();
}
function logDel(i) {
  if (!LOGS[i]) return;
  LOGS.splice(i, 1);
  logSave_(); paintTimes(); render();
}
function logClear() {
  if (!LOGS.length) return;
  ask_('실제로 걸린 시간 기록을 모두 지울까요?\n되돌릴 수 없습니다.', function () {
    LOGS = []; logSave_(); paintTimes(); render();
    toast('기록을 모두 지웠습니다');
  }, '지우기');
}

function planSave() {
  try {
    if (PLAN && !PLAN.err) localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN));
    else localStorage.removeItem(PLAN_KEY);
    localStorage.setItem(PIN_KEY, JSON.stringify(PINS));
    /* 현재 위치(gps)만 빼고 기억한다. 그건 시간이 지나면 틀리기 때문이다 */
    if (MYLOC && MYLOC.kind !== 'gps') localStorage.setItem(LOC_KEY, JSON.stringify(MYLOC));
    else localStorage.removeItem(LOC_KEY);
    if (MYEND) localStorage.setItem(END_KEY, JSON.stringify(MYEND));
    else localStorage.removeItem(END_KEY);
  } catch (e) {}
}

function planRestore() {
  var td = todayStr();
  try {
    var e = localStorage.getItem(END_KEY); if (e) MYEND = JSON.parse(e);
    /* 현재 위치는 시간이 지나면 틀리므로 주소로 넣은 것만 되살린다 */
    var l = localStorage.getItem(LOC_KEY); if (l) MYLOC = JSON.parse(l);
    var pn = localStorage.getItem(PIN_KEY);
    if (pn) { var o = JSON.parse(pn); if (o && o.date && o.date >= td) PINS = o; }
    var p = localStorage.getItem(PLAN_KEY);
    if (!p) return;
    var dd = JSON.parse(p);
    /* 지난 날짜 계획은 버린다. 어제 짠 길이 오늘 뜨면 더 헷갈린다. */
    if (!dd || !dd.date || dd.date < td) { localStorage.removeItem(PLAN_KEY); return; }
    PLAN = dd;
  } catch (e) {}
}

function pinList_(date) { return (PINS.date === date) ? (PINS.ids || []) : []; }
function pinAt_(date, id) { return pinList_(date).indexOf(id); }

/* 카드의 '먼저 가기'. 누르면 앞으로 오고, 다시 누르면 고정이 풀린다. */
function pinFirst(vid) {
  if (!PLAN || PLAN.err) return;
  var ids = pinList_(PLAN.date).slice();
  var at = ids.indexOf(vid);
  if (at > -1) ids.splice(at, 1);
  else ids.push(vid);
  repin_(ids);
}
function clearPins() {
  if (!PLAN || PLAN.err) return;
  repin_([]);
}

/* 고정한 순서에 맞춰 나머지를 다시 잡는다.
   이동시간 표를 그대로 다시 쓰므로 서버를 부르지 않는다. */
function repin_(ids) {
  if (!PLAN || PLAN.err || !PLAN.stops || !PLAN.T) return;
  var idx = {}, i;
  for (i = 0; i < PLAN.stops.length; i++) idx[PLAN.stops[i].id] = i;
  var pins = [];
  ids.forEach(function (id) { if (idx[id] != null) pins.push(idx[id]); });

  var rt = planWithCutoff(PLAN.stops, PLAN.T, PLAN.start, PLAN_EXACT, 'time', pins);
  var rd = planWithCutoff(PLAN.stops, PLAN.T, PLAN.start, PLAN_EXACT, 'dist', pins);
  if (!rt.ok && !rd.ok) {
    toast('그 순서로는 길을 못 찾았습니다.\n고정을 풀거나 다른 곳을 먼저 잡아 보세요.', 5600);
    return;
  }
  PINS = { date: PLAN.date, ids: ids };
  PLAN.modes = { time: rt.ok ? rt : null, dist: rd.ok ? rd : null };
  PLAN.pins = pins;
  PLAN.real = {};                 /* 순서가 바뀌었으니 다시 물어본다 */
  planSave(); render(); verifyRoute();
  toast(ids.length ? '고정한 순서에 맞춰 다시 잡았습니다' : '처음부터 다시 잡았습니다', 3200);
}

/* "10분 내외" -> 10 / "1시간 내외" -> 60 / "1시간 30분" -> 90 */
function parseWait(txt) {
  var t = String(txt || '').replace(/\s/g, '');
  if (!t) return null;
  /* 우편·등기는 접수만 하고 나오면 된다 */
  if (/우편|등기/.test(t)) return 10;
  /* '1시간 초과'는 넉넉히 잡는다 */
  if (/초과|이상/.test(t)) {
    var hx = t.match(/(\d+)\s*시간/);
    return hx ? Number(hx[1]) * 60 + 30 : 90;
  }
  var h = t.match(/(\d+)\s*시간/), m = t.match(/(\d+)\s*분/);
  if (!h && !m) { var only = t.match(/^(\d+)$/); return only ? Number(only[1]) : null; }
  return (h ? Number(h[1]) * 60 : 0) + (m ? Number(m[1]) : 0);
}
function hm_(t) {
  var m = String(t || '').match(/(\d{1,2}):(\d{2})/);
  return m ? Number(m[1]) * 60 + Number(m[2]) : null;
}
function hhmm_(v) {
  v = Math.round(v);
  var nx = (v >= 1440) ? '다음날 ' : '';
  return nx + ('0' + Math.floor(v / 60) % 24).slice(-2) + ':' + ('0' + (v % 60)).slice(-2);
}
function nowMin_() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

/* 진료시작 전이면 기다리고, 점심시간에 걸리면 끝날 때까지 기다린다 */
function usable_(t, s) {
  if (s.openMin != null && t < s.openMin) t = s.openMin;
  if (s.lunchS != null && s.lunchE != null && t >= s.lunchS && t < s.lunchE) t = s.lunchE;
  return t;
}

/* 이른 시각부터 꺼내는 작은 대기줄 */
function Heap_() { this.a = []; }
Heap_.prototype.push = function (x) {
  var a = this.a, i = a.push(x) - 1;
  while (i > 0) { var p = (i - 1) >> 1; if (a[p].k <= a[i].k) break; var v = a[p]; a[p] = a[i]; a[i] = v; i = p; }
};
Heap_.prototype.pop = function () {
  var a = this.a, top = a[0], last = a.pop();
  if (a.length) {
    a[0] = last;
    for (var i = 0; ;) {
      var l = 2 * i + 1, r = l + 1, m = i;
      if (l < a.length && a[l].k < a[m].k) m = l;
      if (r < a.length && a[r].k < a[m].k) m = r;
      if (m === i) break;
      var v = a[m]; a[m] = a[i]; a[i] = v; i = m;
    }
  }
  return top;
};

/**
 * 순서를 짠다.
 *  obj : 'time' 이면 끝나는 시각을, 'dist' 면 총 주행거리를 줄인다.
 * T 는 { from, fromKm, mat, dist, to, toKm } — 도착지가 없으면 to 는 없어도 된다.
 */
function planRoute(stops, T, start, obj, pins) {
  var n = stops.length;
  pins = pins || [];
  if (!n) return { ok: false, why: 'EMPTY' };
  if (!T || !T.mat || T.mat.length < n) return { ok: false, why: 'NO_ROUTE' };
  if (!T.from || T.from.length < n) T.from = new Array(n);
  for (var q0 = 0; q0 < n; q0++) if (!T.mat[q0] || T.mat[q0].length < n) return { ok: false, why: 'NO_ROUTE' };

  var byDist = (obj === 'dist');
  var D = T.dist || [];
  var fromKm = T.fromKm || [];
  var toMin = T.to || null, toKm = T.toKm || [];

  function km_(loc, j) {                      /* loc: 0=출발지, 1..n=병원 */
    if (loc === 0) return Number(fromKm[j]) || 0;
    if (loc - 1 === j) return 0;
    return (D[loc - 1] && Number(D[loc - 1][j])) || 0;
  }

  /* 정밀 계산과 어림 계산이 같은 잣대를 쓰게 한곳에서 만든다 */
  var need = needOf_(stops, obj);

  var P3 = [1];
  for (var k = 1; k <= n; k++) P3[k] = P3[k - 1] * 3;
  var GOAL = P3[n] - 1;

  var best = {}, h = new Heap_(), zero = [], code0 = 0;
  for (var z = 0; z < n; z++) {
    zero.push(0);
    if (stops[z].skip) code0 += 2 * P3[z];
  }
  if (code0 === GOAL) return { ok: true, end: start, km: 0, steps: [] };
  h.push({ k: 0, t: start, d: 0, loc: 0, code: code0, ready: zero, prev: null, step: null });

  var guard = 0;
  while (h.a.length) {
    if (++guard > 400000) return { ok: false, why: 'TOO_BIG' };
    /* 너무 오래 붙들고 있으면 화면이 멈춘 것처럼 보인다. 물러난다.
       (물러나도 '가까운 곳부터 + 다듬기' 가 이미 답을 내놓았다) */
    if ((guard & 1023) === 0 && PLAN_TILL && Date.now() > PLAN_TILL) {
      return { ok: false, why: 'TOO_BIG' };
    }
    var cur = h.pop();
    var key = cur.loc + ':' + cur.code;
    if (best[key] != null && best[key] <= cur.k) continue;
    best[key] = cur.k;

    if (cur.code === GOAL) {
      var steps = [], p = cur;
      while (p && p.step) { steps.unshift(p.step); p = p.prev; }
      return { ok: true, end: cur.t, km: Math.round(cur.d * 10) / 10, steps: steps };
    }

    /* '먼저 가기'로 못 박은 곳은 그 차례가 될 때까지 다른 곳을 못 간다.
       아직 한 번도 안 들른(0) 고정 병원 중 가장 앞선 것이 다음 차례다. */
    var nextPin = -1;
    for (var pi = 0; pi < pins.length; pi++) {
      if (Math.floor(cur.code / P3[pins[pi]]) % 3 === 0) { nextPin = pins[pi]; break; }
    }

    for (var j = 0; j < n; j++) {
      if (nextPin >= 0 && j !== nextPin) continue;
      var st = Math.floor(cur.code / P3[j]) % 3;
      if (st === 2) continue;

      var move = (cur.loc === 0) ? T.from[j] : T.mat[cur.loc - 1][j];
      if (cur.loc - 1 === j) move = 0;
      if (move == null) continue;

      var base = usable_(cur.t + move, stops[j]);

      /* 이 병원에서 할 수 있는 일을 모두 늘어놓는다.
         예전에는 '기다렸다 받기'와 '나중에 다시 오기' 중 하나를
         병원DB 체크만 보고 미리 정해 버렸다. 그래서 30분을 기다릴 수
         있는 곳인데도 굳이 두 번 가는 순서가 나왔다. 이제 둘 다 따져
         보고 나은 쪽을 고른다. 다만 병원DB에 '자리를 뜨지 않음'으로
         적어 둔 곳은 떠날 수 없으므로 기다리는 길만 남긴다. */
      var opts = [];
      if (st === 0) {
        if (need[j].twice) {
          opts.push({ kind: '접수+수령', ns: 2, at: base, ready: cur.ready,
                      wait: need[j].wait,
                      done: usable_(base + need[j].wait, stops[j]) + STOP_MIN });
          if (!need[j].must) {
            var rd = cur.ready.slice();
            rd[j] = base + need[j].wait;
            opts.push({ kind: '접수', ns: 1, at: base, ready: rd, wait: 0,
                        done: base + STOP_MIN });
          }
        } else {
          opts.push({ kind: need[j].once, ns: 2, at: base, ready: cur.ready,
                      wait: 0, done: base + STOP_MIN });
        }
      } else {
        var got2 = usable_(Math.max(base, cur.ready[j]), stops[j]);
        opts.push({ kind: '수령', ns: 2, at: got2, ready: cur.ready,
                    wait: 0, done: got2 + STOP_MIN });
      }

      var nd0 = cur.d + km_(cur.loc, j);
      for (var oi = 0; oi < opts.length; oi++) {
        var o = opts[oi];
        var nd = nd0, nt = o.done;
        var code = cur.code + (o.ns - st) * P3[j];

        /* 마지막 한 곳까지 끝났으면 도착지까지 돌아가는 몫도 넣는다 */
        if (code === GOAL && toMin) {
          var back = toMin[j];
          if (back != null) { nt += back; nd += Number(toKm[j]) || 0; }
        }

        /* 무엇을 줄일지에 따라 견주는 값이 달라진다 */
        var metric = byDist ? (nd + nt / 60 * KM_PER_HOUR) : nt;

        var nk = (j + 1) + ':' + code;
        if (best[nk] != null && best[nk] <= metric) continue;

        h.push({ k: metric, t: nt, d: nd, loc: j + 1, code: code, ready: o.ready, prev: cur,
                 step: { i: j, name: stops[j].name, kind: o.kind, at: o.at,
                         move: move, wait: o.wait } });
      }
    }
  }
  return { ok: false, why: 'NO_ROUTE' };
}

/* ---------- 짜 놓은 순서 다듬기 ----------
   '가까운 곳부터'로 짜면 도착지를 안 보기 때문에 외딴 곳이 맨 끝에 남는다.
   그래서 짜 놓은 순서를 들고 한 곳씩 다른 자리로 옮겨 보며, 총합이 줄면
   바꾼다. 더 줄지 않을 때까지 되풀이한다. */

/* 병원마다 몇 번 가야 하는지 */
/* must = 접수와 수령을 나누지 않는다 (그 자리에서 기다렸다 받는다)
   · 병원DB에서 '기다렸다 받음' 으로 적어 둔 곳
   · 최단거리로 짤 때는 모든 곳 — 적게 움직이자면서 왔던 길을 또 가면 말이 안 된다
     (최단시간은 나눌 수 있게 둔다. 기다리느니 다른 데 다녀오는 게 빠를 때가 있다) */
function needOf_(stops, obj) {
  var noSplit = (obj === 'dist');
  var out = [];
  for (var i = 0; i < stops.length; i++) {
    var sp = stops[i];
    var pre = !!(sp.submitted || (sp.prereq && sp.prereq !== '불가능'));
    var today = (sp.sameday !== '불가능');
    out.push({ twice: (!pre && today), once: pre ? '수령' : '접수',
               wait: (sp.waitMin == null ? DEFAULT_WAIT : sp.waitMin),
               must: !!sp.stay || noSplit });
  }
  return out;
}

/* 무엇을 줄일지.
   먼저 서류 발급 마감을 넘기는 곳이 몇 군데인지 본다. 한 곳이 내일로
   밀리는 손해가 몇 km 보다 훨씬 크기 때문이다. 그게 같을 때에만
   최단시간이면 끝나는 시각을, 최단거리면 거리에 시간을 얹은 값을 견준다. */
function score_(r, obj, start) {
  var over = 0;
  for (var i = 0; i < r.steps.length; i++) {
    if (r.steps[i].at + STOP_MIN > DAY_END) over++;
  }
  /* 분 단위로 환산해 더한다. 최단거리일 때는 다시 km 로 바꿔서 더한다 */
  if (obj === 'dist') {
    return r.km + ((r.end - start) + over * LATE_COST) / 60 * KM_PER_HOUR;
  }
  return r.end + over * LATE_COST;
}

/* 늘어놓은 차례를 처음부터 되짚어 시각과 거리를 낸다.
   p 는 그 병원에서 무엇을 하는지다. 0 = 한 번에 끝, 1 = 접수, 2 = 수령.
   순서가 말이 안 되면(수령이 접수보다 앞서거나, 고정해 둔 곳을 건너뛰면) null. */
function replay_(seq, stops, need, T, start, pins) {
  var n = stops.length, i;
  var st = [], ready = [];
  for (i = 0; i < n; i++) { st.push(stops[i].skip ? 2 : 0); ready.push(0); }

  var t = start, loc = 0, km = 0, steps = [];
  var D = T.dist || [], fromKm = T.fromKm || [];
  var toMin = T.to || null, toKm = T.toKm || [];
  function km_(a, b) {
    if (a === 0) return Number(fromKm[b]) || 0;
    if (a - 1 === b) return 0;
    return (D[a - 1] && Number(D[a - 1][b])) || 0;
  }

  for (var q = 0; q < seq.length; q++) {
    var j = seq[q].i, p = seq[q].p;
    if (j == null || !stops[j] || stops[j].skip) return null;

    /* 먼저 가기로 못 박은 곳은 그 차례가 될 때까지 다른 곳을 못 간다 */
    var nextPin = -1;
    for (var pi = 0; pi < pins.length; pi++) {
      if (st[pins[pi]] === 0) { nextPin = pins[pi]; break; }
    }
    if (nextPin >= 0 && j !== nextPin) return null;

    var move = (loc === 0) ? T.from[j] : (loc - 1 === j ? 0 : (T.mat[loc - 1] || [])[j]);
    if (move == null) return null;

    var at = usable_(t + move, stops[j]), kind, wait = 0, after;

    if (p === 2) {
      if (st[j] !== 1) return null;
      at = usable_(Math.max(at, ready[j]), stops[j]);
      kind = '수령'; st[j] = 2; after = at + STOP_MIN;
    } else if (p === 1) {
      if (st[j] !== 0 || !need[j].twice || need[j].must) return null;
      kind = '접수'; ready[j] = at + need[j].wait; st[j] = 1;
      after = at + STOP_MIN;
    } else {
      if (st[j] !== 0) return null;
      if (need[j].twice) {
        wait = need[j].wait; kind = '접수+수령'; st[j] = 2;
        after = usable_(at + wait, stops[j]) + STOP_MIN;
      } else {
        kind = need[j].once; st[j] = 2; after = at + STOP_MIN;
      }
    }

    km += km_(loc, j);
    steps.push({ i: j, name: stops[j].name, kind: kind, at: at, move: move, wait: wait });
    t = after; loc = j + 1;
  }

  for (i = 0; i < n; i++) if (st[i] !== 2) return null;   /* 빠뜨린 곳이 있다 */
  if (toMin && loc > 0 && toMin[loc - 1] != null) {
    t += toMin[loc - 1]; km += Number(toKm[loc - 1]) || 0;
  }
  return { ok: true, end: t, km: Math.round(km * 10) / 10, steps: steps };
}

/* 한 곳씩 옮겨 보고 줄면 바꾼다. budget 은 되짚어 보는 횟수의 한도다. */
function improve_(seq0, stops, need, T, start, obj, pins, budget) {

    if (++tick > 600 && (tick & 63) === 0 && PLAN_TILL && Date.now() > PLAN_TILL) {

       한 곳씩만 옮기면 '두 곳이 짝으로 붙어 다녀야 하는' 자리를 못 넘는다. */

       한 곳씩 옮겨서는 도중에 반드시 더 나빠지는 자리를 지나야 해서,
       더 나빠지는 쪽으로는 안 가는 다듬기가 거기서 멈춰 버린다. */

      var at0 = -1, at1 = -1, at2 = -1, k;
      for (k = 0; k < bs.length; k++) {

        if (bs[k].p === 0) at0 = k; else if (bs[k].p === 1) at1 = k; else at2 = k;
      }
      if (at0 >= 0) {                        /* 한 번에 -> 둘로 쪼갠다 */
        for (var g = at0 + 1; g <= bs.length && guard > 0; g++) {
          var s4 = bs.slice();
          s4[at0] = { i: j, p: 1 };
          s4.splice(g, 0, { i: j, p: 2 });
          if (tryIt(s4)) { moved = true; break; }
        }
      } else if (at1 >= 0 && at2 >= 0) {     /* 둘로 -> 한 번에 합친다 */
        var s5 = bs.slice();
        s5.splice(at2, 1);
        s5[at1] = { i: j, p: 0 };
        if (tryIt(s5)) moved = true;
      }
    }
  }
  /* 흔들어 다시 해 보려면 결과뿐 아니라 차례도 있어야 한다 */
  return { res: br, seq: bs };
}

/* 짜 놓은 결과를 '어디서 무엇을' 차례로 바꾼다 (다듬기에 넣을 형태) */
function toSeq_(steps, need) {
  var seq = [];
  for (var k = 0; k < steps.length; k++) {
    var j = steps[k].i, kd = steps[k].kind, p;
    if (!need[j] || !need[j].twice) p = 0;
    else if (kd === '접수+수령') p = 0;
    else if (kd === '접수') p = 1;

  }
  return seq;
}

/* 가까운 곳부터 짠 뒤 다듬는다. 씨앗을 더 주면 그것도 다듬어 본다. */
function planLocal_(stops, T, start, obj, pins, seed) {

  function feed(seq) {
    if (!seq) return;
    var r = improve_(seq, stops, need, T, start, obj, pins, 40000);
    if (!r) return;
    var k = score_(r.res, obj, start);
    if (k < bk) { bk = k; best = r; }
  }

  var g = planGreedy(stops, T, start, pins, obj);
  if (!g.ok) return g;

  RS = 20260929;                       /* 씨앗 고정 — 같은 판이면 늘 같은 답 */
  feed(toSeq_(g.steps, need));
  if (seed && seed.ok) feed(toSeq_(seed.steps, need));
  if (!best) return g;

  /* 한 번 내려가면 '어느 쪽으로 가도 더 나빠지는' 자리에 갇힌다.
     살짝 흔들어 놓고 다시 내려가면 다른 골짜기로 간다. 이게 제일 크게 듣는다. */
  for (var t = 1; t < PLAN_TRIES; t++) {

    for (var q = 0; q < kicks; q++) {
      var a = Math.floor(rs_() * bs.length), b = Math.floor(rs_() * bs.length);
      var tok = bs.splice(a, 1)[0];
      bs.splice(b, 0, tok);
    }
    feed(bs);                          /* 말이 안 되는 차례면 그냥 버려진다 */

  return best.res;

/* 정밀 계산과 다듬기를 둘 다 해 보고 나은 쪽을 쓴다.
   병원이 많으면 정밀 계산은 너무 오래 걸려 건너뛴다. */
function planBest_(stops, T, start, obj, exact, pins, alive) {
  /* ① 가까운 곳부터 짠 뒤 다듬는다. 싸고 잘 들어서 늘 먼저 한다. */
  var b = planLocal_(stops, T, start, obj, pins, null);

  /* ② 병원이 적고 시간이 남아 있을 때만 정밀 계산도 해 본다 */
  if (alive > exact) return b;
  if (PLAN_TILL && Date.now() >= PLAN_TILL) return b;
  var a = planRoute(stops, T, start, obj, pins);
  if (!a || !a.ok) return b;
  if (!b || !b.ok) return a;
  return (score_(a, obj, start) < score_(b, obj, start)) ? a : b;
}

/**
 * 17:30 마감을 지키도록 짠다.
 * 넘치는 병원부터 '오늘은 접수만' -> '오늘 못 감' 으로 한 단계씩 미루고 다시 짠다.
 * 반환: { ok, steps, end, half:[이름], out:[이름] }
 */
function planWithCutoff(stops, T, start, exact, obj, pins) {
  pins = pins || [];
  PLAN_END = Date.now() + PLAN_MS_ALL;
  var work = stops.map(function (s) {
    return { name: s.name, id: s.id, lat: s.lat, lng: s.lng,
             sameday: s.sameday, prereq: s.prereq, waitMin: s.waitMin,
             openMin: s.openMin, lunchS: s.lunchS, lunchE: s.lunchE,
             submitted: s.submitted, stay: s.stay, skip: false };

    }
    if (bad < 0) {
      /* 이 판이 답이다. 여기까지 오느라 시간을 다 썼을 수 있으니,
         시간을 새로 주고 한 번 더 다듬는다. 이걸 빠뜨렸더니 12곳짜리
         판에서 21km 를 더 달리는 순서가 나왔다. */

    var j = r.steps[bad].i, w = work[j];

        w.sameday !== '불가능' && !half[w.name]) {

      half[w.name] = 1;
    } else {

      out[w.name] = 1;
      delete half[w.name];

}

/* 정밀 계산이 안 될 때 쓰는 간단한 방법: 가까운 곳부터 차례로.
   최적은 아니지만 순서를 아예 못 내놓는 것보다 낫다. */
function planGreedy(stops, T, start, pins, obj) {
  pins = pins || [];

     여기서 나눠 버리면 그 차례가 씨앗이 되어, 다듬기가 통째로 버려진다. */
  var noSplit = (obj === 'dist');

  var D = T.dist || [], fromKm = T.fromKm || [], toKm = T.toKm || [];
  function km_(a, b) {

    }

      var today = (stops[j].sameday !== '불가능');
      if (st[j] === 1) { at = usable_(Math.max(at, ready[j]), stops[j]); kd = '수령'; }

    var today2 = (s2.sameday !== '불가능');
